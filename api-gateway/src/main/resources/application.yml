spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.${AWS_REGION:eu-central-1}.amazonaws.com/${COGNITO_USER_POOL_ID}

# Application Configuration
app:
  environment: ${APP_ENVIRONMENT:development}  # development, staging, or production

# Microservices Configuration
# In development: localhost with different ports
# In staging/production: internal ALB endpoints (set via environment variables)
services:
  event-management:
    url: ${EVENT_MANAGEMENT_SERVICE_URL:http://localhost:8081}
  speaker-coordination:
    url: ${SPEAKER_COORDINATION_SERVICE_URL:http://localhost:8082}
  partner-coordination:
    url: ${PARTNER_COORDINATION_SERVICE_URL:http://localhost:8083}
  attendee-experience:
    url: ${ATTENDEE_EXPERIENCE_SERVICE_URL:http://localhost:8084}
  company-user-management:
    url: ${COMPANY_USER_MANAGEMENT_SERVICE_URL:http://localhost:8085}

# Request-time is_active gate (Story 12.2 — SSO PR 1 Part A; AccountActiveFilter)
# Ships DARK: enabled=false so the filter is a pure pass-through on first deploy. Flip to true
# (env SECURITY_ACTIVE_GATE_ENABLED=true) after a deliberate test deactivation verifies it in
# prod — instant kill-switch revert, no redeploy. ttl-seconds bounds the deactivation lag and
# keeps CUMS off the hot path (at most one lookup per user per window).
security:
  active-gate:
    enabled: ${SECURITY_ACTIVE_GATE_ENABLED:false}
    ttl-seconds: ${SECURITY_ACTIVE_GATE_TTL_SECONDS:60}

# "Continue with Google" SSO button kill-switch (Story 12.9 — SSO Phase 5). Served to the
# frontend via GET /api/v1/config (features.sso). Ships dark (default false); flip env
# FEATURES_SSO_ENABLED=true to surface the button — the frontend re-reads it at runtime, so
# no rebuild/redeploy. Rollback = set false + restart (instant kill-switch, ADR-010 §D8).
features:
  sso:
    enabled: ${FEATURES_SSO_ENABLED:false}

# AWS Cognito Configuration
aws:
  cognito:
    userPoolId: ${COGNITO_USER_POOL_ID}
    region: ${AWS_REGION:eu-central-1}
    userPoolClientId: ${COGNITO_CLIENT_ID}

turnstile:
  enabled: ${TURNSTILE_ENABLED:false}
  site-key: ${TURNSTILE_SITE_KEY:}
  secret-key: ${TURNSTILE_SECRET_KEY:}
  verify-url: https://challenges.cloudflare.com/turnstile/v0/siteverify
  protected-endpoints:
    - POST:/api/v1/newsletter/subscribe
    - POST:/api/v1/events/*/registrations

logging:
  level:
    ch.batbern: DEBUG
    org.springframework: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"

# Error handling configuration
server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param  # Only in dev/staging via profile
    include-exception: false      # Never expose internal exception classes

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  info:
    env:
      enabled: true
    git:
      mode: full
    build:
      enabled: true

# Application Info (exposed via /actuator/info)
info:
  app:
    name: ${spring.application.name}
    description: API Gateway Service
    version: ${build.version:1.0.0}
  build:
    artifact: ${build.artifact:api-gateway}
    version: ${build.version:1.0.0}
    time: ${build.time:unknown}
  git:
    commit:
      id: ${git.commit.id.abbrev:unknown}
      time: ${git.commit.time:unknown}
    branch: ${git.branch:unknown}
