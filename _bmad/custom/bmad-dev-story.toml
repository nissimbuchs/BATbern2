# Team override (architecture review 2026-11): module map in context + architecture note.
# Arrays append to the base customize.toml.

[workflow]
persistent_facts = [
  "file:{project-root}/docs/architecture/module-map.md",
]
activation_steps_append = [
  "Before the first test, confirm or correct the story's Architecture note (5 lines, see module-map.md) in Dev Notes; write it if missing. A deviation from the map needs a reason there.",
]
