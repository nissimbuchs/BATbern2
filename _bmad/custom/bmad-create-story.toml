# Team override (architecture review 2026-11): module map in context + architecture note.
# Arrays append to the base customize.toml.

[workflow]
persistent_facts = [
  "file:{project-root}/docs/architecture/module-map.md",
]
activation_steps_append = [
  "Draft the story's Architecture note (5 lines, see module-map.md) in Dev Notes. Before listing a new endpoint, grep docs/api for the nearest existing one and say why it cannot be extended.",
]
