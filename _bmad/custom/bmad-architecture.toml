# Team override for bmad-architecture (Winston's architecture workflow). Arrays append to the base customize.toml.
# v7 does not load project-context.md by itself; the module map is the reference for where code goes.

[workflow]
persistent_facts = [
  "file:{project-root}/_bmad-output/project-context.md",
  "file:{project-root}/docs/architecture/module-map.md",
]
