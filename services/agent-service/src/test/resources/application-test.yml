# Test profile of agent-service. Shadows shared-kernel's testFixtures application-test.yml, which
# points Flyway at classpath:db/migration (the other services' folder) and configures a cache.
# The datasource comes from AbstractIntegrationTest (Testcontainers PostgreSQL).
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/agent-migration
    table: flyway_schema_history_agent
    baseline-on-migrate: true
    baseline-version: 0

# Tests never reach the model (C2): a key in the developer's environment must not build a client.
# The scripted model (ScriptedLlm, @Primary) answers every loop test.
agent:
  anthropic:
    api-key: none
  # CUMS is answered at the wire by ContractServer (CumsAtTheWire); this secret exists only here
  cums:
    caller-secret: test-only-agent-caller-secret
