spring:
  application:
    name: company-user-management-service

  # Epic 13 (SB4): keep the HTTP layer on the Jackson 2 (com.fasterxml) converter during the
  # migration. SB4 defaults to Jackson 3 (tools.jackson); the spring-boot-jackson2 compat module
  # provides the Jackson 2 converter, selected here. This keeps API payloads byte-identical and
  # preserves Jackson-2 deserialization semantics (com.fasterxml exception types, @JsonIgnoreProperties
  # strict unknown-field rejection). This IS the "Jackson-2-compat flag" from the migration plan —
  # the final closeout story removes this line to flip the estate to Jackson 3, re-validated via Bruno.
  http:
    converters:
      preferred-json-mapper: jackson2

  # Epic 13 (SB4): config for the active Jackson 2 web mapper lives under spring.jackson2.* (read by
  # the spring-boot-jackson2 compat module), NOT spring.jackson.* — the latter binds to the Jackson 3
  # mapper, whose SerializationFeature no longer has WRITE_DATES_AS_TIMESTAMPS (moved to DateTimeFeature
  # in Jackson 3), which fails context startup. The final Jackson-3 closeout moves this back to
  # spring.jackson with Jackson-3 property names.
  jackson2:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/batbern}
    username: ${DATABASE_USERNAME:batbern}
    password: ${DATABASE_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false
    table: flyway_schema_history_company_user_management

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=15m
    cache-names:
      - companySearch
      - userSearch

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.${AWS_REGION:eu-central-1}.amazonaws.com/${COGNITO_USER_POOL_ID:}}
          jwk-set-uri: ${COGNITO_JWK_SET_URI:https://cognito-idp.${AWS_REGION:eu-central-1}.amazonaws.com/${COGNITO_USER_POOL_ID:}/.well-known/jwks.json}

# VPC Network Configuration (for service-to-service authentication)
vpc:
  cidr: ${VPC_CIDR:10.1.0.0/16}

# AWS Configuration
aws:
  region: ${AWS_REGION:eu-central-1}
  s3:
    bucket-name: ${S3_CONTENT_BUCKET_NAME:batbern-content-staging}
    presigned-url-expiration-minutes: 15
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN:https://cdn.batbern.ch}
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID:}
    client-id: ${COGNITO_CLIENT_ID:}
    region: ${AWS_REGION:eu-central-1}
  eventbridge:
    bus-name: ${EVENT_BUS_NAME:batbern-staging}
    source: ch.batbern.companyuser

# Daily nudge for accounts that signed up but never confirmed their email.
# Cognito's sign-up confirmation code is fixed at 24h (not configurable), so this re-sends a fresh
# code to accounts unconfirmed for >= after-hours, bounded to a window so each account is nudged at
# most a few times across daily runs (Cognito UNCONFIRMED users have no DB row for per-user state).
cognito:
  resend:
    enabled: ${COGNITO_RESEND_ENABLED:true}
    cron: "0 15 8 * * *"                          # daily 08:15 (distinct from 02:00 reconciliation)
    after-hours: ${COGNITO_RESEND_AFTER_HOURS:48} # nudge once unconfirmed >= 2 days
    window-hours: ${COGNITO_RESEND_WINDOW_HOURS:48} # only nudge within [after, after+window) of signup

# Additional-email verification (v2): stateless HMAC-signed verification token.
# Secret is injected from Secrets Manager (WATCH_JWT_SECRET → JWT_SECRET) in
# production; the 'changeme' default triggers a random-key fallback for local/test.
jwt:
  secret: ${JWT_SECRET:changeme}

# Public base URL used to build the {{baseUrl}}/verify-email?token= link in
# additional-email verification emails. Defaults to production www.
app:
  base-url: ${APP_BASE_URL:https://www.batbern.ch}

batbern:
  user:
    additional-emails:
      verification:
        # 48h TTL on the signed verification link.
        token-validity-hours: ${ADDITIONAL_EMAIL_VERIFICATION_TOKEN_VALIDITY_HOURS:48}

# Server Configuration
server:
  port: 8080
  shutdown: graceful
  compression:
    enabled: false
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param

# Management/Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
      cloudwatch2:
        # Disabled by default to save ~$35/month per service in non-production
        # Only enable in production via MANAGEMENT_METRICS_EXPORT_CLOUDWATCH2_ENABLED=true
        enabled: ${CLOUDWATCH_METRICS_ENABLED:false}
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  info:
    env:
      enabled: true
    git:
      mode: full
    build:
      enabled: true

# Application Info (exposed via /actuator/info)
info:
  app:
    name: ${spring.application.name}
    description: Company User Management Service
    version: ${build.version:1.0.0}
  build:
    artifact: ${build.artifact:company-user-management-service}
    version: ${build.version:1.0.0}
    time: ${build.time:unknown}
  git:
    commit:
      id: ${git.commit.id.abbrev:unknown}
      time: ${git.commit.time:unknown}
    branch: ${git.branch:unknown}

# Logging Configuration
logging:
  level:
    root: INFO
    # Default INFO, not DEBUG: relying on LOG_LEVEL being set in every environment is the same
    # implicit coupling that hid #990. Opt IN to DEBUG, never out of it.
    ch.batbern: ${LOG_LEVEL:INFO}
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: true

---
# Test Profile Configuration
# CRITICAL: Uses PostgreSQL via Testcontainers for production parity (coding-standards.md)
# Never use H2 for integration tests - causes database-specific issues
spring:
  config:
    activate:
      on-profile: test

  datasource:
    # Configured dynamically by AbstractIntegrationTest via @DynamicPropertySource
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9999/oauth2/default

  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=10m
    cache-names:
      - companySearch
      - userSearch

logging:
  level:
    root: INFO
    ch.batbern: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN

---
# Staging Profile Configuration
spring:
  config:
    activate:
      on-profile: staging

logging:
  level:
    root: INFO
    # #990: was DEBUG. This estate runs SPRING_PROFILES_ACTIVE=staging IN THE PRODUCTION ACCOUNT
    # (188701360969 serves www.batbern.ch), so this block — not the `production` block below —
    # is what actually applies to production traffic. The production block's INFO was never
    # reached, which is why the intent looked right and the effect was wrong.
    ch.batbern: ${LOG_LEVEL:INFO}

---
# Production Profile Configuration
#
# NOTE: this profile is NOT the one production runs. The estate was consolidated onto a single
# account and every task sets SPRING_PROFILES_ACTIVE=staging, so the `staging` block above is what
# governs production traffic. Kept for the day the profiles are separated again; do not assume a
# setting here takes effect.
spring:
  config:
    activate:
      on-profile: production

logging:
  level:
    root: INFO
    ch.batbern: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

---
# Local Profile Configuration (for native development with MinIO)
spring:
  config:
    activate:
      on-profile: local

aws:
  s3:
    bucket-name: ${AWS_S3_BUCKET_NAME:batbern-development-company-logos}
  cloudfront:
    domain: ${CLOUDFRONT_DOMAIN:http://localhost:8450}

logging:
  level:
    root: INFO
    ch.batbern: DEBUG
