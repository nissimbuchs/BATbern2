spring:
  datasource:
    # PostgreSQL via Testcontainers (configured dynamically in AbstractIntegrationTest)
    # Database connection properties are injected by @DynamicPropertySource
    driver-class-name: org.postgresql.Driver

  jpa:
    # Let Flyway manage schema - validate only
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Enable Flyway migrations for production parity
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=15m,maximumSize=1000

  # 17.0b3: the production security chain and JWT decoder run in every IT. Tests authenticate
  # with MockMvc's jwt()/user() post-processors, never a real token, so the JWK set is never fetched.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://jwks.example.invalid/keys

  cloud:
    aws:
      cloudwatch:
        # Disable CloudWatch metrics in test profile to prevent AWS credential errors during test shutdown
        enabled: false

logging:
  level:
    ch.batbern: DEBUG
    org.springframework.cache: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN
