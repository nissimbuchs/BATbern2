spring:
  datasource:
    # PostgreSQL via Testcontainers (configured dynamically in AbstractIntegrationTest)
    # Database connection properties are injected by @DynamicPropertySource
    driver-class-name: org.postgresql.Driver

  jpa:
    # Let Flyway manage schema - validate only
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Enable Flyway migrations for production parity
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: caffeine
    caffeine:
      spec: expireAfterWrite=15m,maximumSize=1000

  # 17.0b3: the production security chain and JWT decoder run in every IT. Tests authenticate
  # with MockMvc's jwt()/user() post-processors, never a real token, so the JWK set is never fetched.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://jwks.example.invalid/keys

  cloud:
    aws:
      cloudwatch:
        # Disable CloudWatch metrics in test profile to prevent AWS credential errors during test shutdown
        enabled: false

logging:
  level:
    ch.batbern: DEBUG
    org.springframework.cache: DEBUG
    org.testcontainers: INFO
    com.github.dockerjava: WARN

# Epic 17 entry 7: the Mail Center request contract has one implementer in tests. Its calls are
# answered by the ContractServer bound to HttpMailCenterRequestContract (MailCenterContract); this
# host never answers, so a test that files a request without binding it gets the 502.
batbern:
  contracts:
    mail-center-requests:
      implementers: http://mail-center-contract.invalid
    # Epic 17 entry 7b: two holders, answered by the ContractServer bound to
    # HttpUserReferenceContract (UserReferenceHolders), told apart by host.
    user-references:
      implementers: http://holder-a.invalid,http://holder-b.invalid
    # #1251: two holders, answered by the ContractServer bound to HttpCompanyReferenceContract
    # (CompanyReferenceHolders), told apart by host.
    company-references:
      implementers: http://company-holder-a.invalid,http://company-holder-b.invalid

# Agent identity, story 5: the caller secrets InternalAgentGrantIntegrationTest presents, and the one
# scheduler job a SCHEDULER_JOB grant may name. Test values only, never used outside tests.
agent:
  callers:
    ems:
      secret: test-only-ems-caller-secret
    agent-service:
      secret: test-only-agent-service-caller-secret
  grants:
    scheduler-jobs: test-digest
