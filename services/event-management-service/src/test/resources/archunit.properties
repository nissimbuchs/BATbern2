# Frozen ArchUnit rules. The store holds today's accepted violations, one file per rule.
# A new violation fails the test; a fixed one is removed from the store on the next run (commit it).
# Never edit the store or switch these flags to accept a new violation. See docs/architecture/module-map.md.
# Path is relative to the module directory (Gradle's test working directory).
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false
freeze.refreeze=false
