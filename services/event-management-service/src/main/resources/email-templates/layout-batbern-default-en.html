<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BATbern</title>
  <style>
/* ── Reset & base ─────────────────────────────────────────── */
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f4f4f4;
      margin: 0; padding: 0;
      color: #444;
      -webkit-text-size-adjust: 100%;
    }

    /* ── Email shell ──────────────────────────────────────────── */
    .email-container {
      width: 100%;
      background: #fff;
    }

    /* ── Layout header (logo + org name) ─────────────────────── */
    .header {
      background: #1976d2;
      text-align: center;
      padding: 30px 20px 20px;
    }
    .header img { height: 50px; }
    .header h1 {
      color: #fff;
      margin: 8px 0 0;
      font-size: 15px;
      font-weight: 600;
    }

    /* ── Content area ─────────────────────────────────────────── */
    .content { padding: 32px 36px 8px; }

    /* ── Layout footer ────────────────────────────────────────── */
    .footer {
      padding: 20px 36px 24px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #999;
      text-align: center;
    }


    /* ══════════════════════════════════════════════════════════
       TYPOGRAPHY  (3 sizes — 11 / 15 / 24 px)
       ══════════════════════════════════════════════════════════ */

    /* Labels / overlines — 11px uppercase bold */
    .lbl {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #888;
      margin: 0 0 5px;
    }
    .lbl-blue { color: #1976d2; letter-spacing: 2px; }

    /* Email title — 24px, one per email */
    h2 {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      color: #111;
      margin: 0 0 6px;
    }

    /* Hero title — alias of h2 (one per email) */
    .title {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.3;
      color: #111;
      margin: 0 0 6px;
    }

    /* Sub / event number — 11px muted */
    .sub {
      font-size: 11px;
      color: #aaa;
      letter-spacing: 0.5px;
      margin: 0 0 28px;
    }

    /* Body text — 15px, used for everything else */
    p { font-size: 15px; line-height: 1.75; color: #444; margin: 0 0 20px; }
    td { font-size: 15px; color: #444; }
    li { font-size: 15px; line-height: 1.75; color: #444; margin-bottom: 6px; }
    ul, ol { margin: 0 0 20px; padding-left: 20px; }

    .muted { color: #888; margin: 3px 0 0; }
    strong { color: #222; }

    a { color: #1976d2; text-decoration: none; }
    a:hover { text-decoration: underline; }


    /* ══════════════════════════════════════════════════════════
       HERO BLOCK  (newsletter-event)
       ══════════════════════════════════════════════════════════ */
    .hero {
      border-left: 4px solid #1976d2;
      padding: 4px 0 4px 20px;
      margin-bottom: 28px;
    }


    /* ══════════════════════════════════════════════════════════
       LOGISTICS TABLE  (newsletter-event — date / venue)
       ══════════════════════════════════════════════════════════ */
    table.logistics {
      border-collapse: separate;
      border-spacing: 0;
      background: #f5f7fa;
      border-radius: 7px;
      margin-bottom: 26px;
      width: 100%;
    }
    table.logistics td {
      padding: 16px 20px;
      vertical-align: top;
      width: 50%;
    }
    table.logistics td + td { border-left: 1px solid #e8ebf0; }
    table.logistics strong { font-weight: 600; color: #222; }


    /* ══════════════════════════════════════════════════════════
       PROGRAMME SECTION  (newsletter-event speakers list)
       ══════════════════════════════════════════════════════════ */
    .programme {
      border-top: 1px solid #e8e8e8;
      padding-top: 14px;
      margin-bottom: 24px;
    }


    /* ══════════════════════════════════════════════════════════
       CTA BOX  (newsletter — register CTA)
       ══════════════════════════════════════════════════════════ */
    .cta-box {
      background: #eaf2fb;
      border-radius: 7px;
      padding: 20px 24px;
      margin-bottom: 28px;
    }
    .cta-box p { margin: 0 0 4px; }
    .cta-box .muted { margin-bottom: 14px; }


    /* ══════════════════════════════════════════════════════════
       BUTTONS
       All buttons use <a class="btn btn-*"> inside a <table> cell
       for email client compatibility.
       ══════════════════════════════════════════════════════════ */
    .btn {
      display: inline-block;
      padding: 11px 28px;
      border-radius: 5px;
      font-size: 15px;
      font-weight: 700;
      text-decoration: none !important;
      margin: 4px 8px 4px 0;
    }
    /* Primary — generic single CTA */
    .btn-primary { background: #1976d2; color: #fff !important; }
    /* Accept / confirm — green */
    .btn-accept  { background: #2e7d32; color: #fff !important; }
    /* Decline / cancel — red outline */
    .btn-decline {
      background: #fff;
      color: #c62828 !important;
      border: 1.5px solid #c62828;
    }
    /* Danger — solid red (deregistration) */
    .btn-danger  { background: #c62828; color: #fff !important; }


    /* ══════════════════════════════════════════════════════════
       CTA SECTION  (button group — invitation accept/decline)
       ══════════════════════════════════════════════════════════ */
    .cta-section { margin: 4px 0 24px; }


    /* ══════════════════════════════════════════════════════════
       EVENT CARD  (compact event info — registration / speaker)
       ══════════════════════════════════════════════════════════ */
    .event-card {
      background: #f5f7fa;
      border-radius: 7px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    .event-card h3 {
      font-size: 15px;
      font-weight: 700;
      color: #111;
      margin: 0 0 14px;
    }
    /* Detail rows inside event-card */
    table.detail-table { border-collapse: collapse; width: 100%; margin-bottom: 4px; }
    table.detail-table td { padding: 4px 0; vertical-align: top; }
    td.detail-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #888;
      width: 130px;
      padding-right: 16px;
      padding-top: 5px;
    }
    td.detail-value { font-size: 15px; color: #222; }


    /* ══════════════════════════════════════════════════════════
       SESSION CARD  (speaker session / task notes)
       ══════════════════════════════════════════════════════════ */
    .session-card {
      background: #eaf2fb;
      border-radius: 7px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .session-card h3 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #1976d2;
      margin: 0 0 8px;
    }
    .session-card p { margin: 0; }


    /* ══════════════════════════════════════════════════════════
       SUCCESS BADGE  (speaker acceptance confirmed)
       ══════════════════════════════════════════════════════════ */
    .success-badge {
      display: inline-block;
      background: #dcfce7;
      color: #166534;
      padding: 4px 14px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }


    /* ══════════════════════════════════════════════════════════
       PORTAL SECTION  (speaker portal links)
       ══════════════════════════════════════════════════════════ */
    .portal-section {
      border: 1px solid #e0e0e0;
      border-radius: 7px;
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    .portal-section h3 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #1976d2;
      margin: 0 0 10px;
    }
    .portal-section p { margin: 0 0 14px; }
    /* Portal link buttons */
    .portal-link {
      display: block;
      background: #1976d2;
      color: #fff !important;
      text-decoration: none !important;
      padding: 11px 20px;
      border-radius: 5px;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 15px;
    }
    .portal-link.secondary {
      background: #f5f7fa;
      color: #333 !important;
      border: 1px solid #e0e0e0;
      font-weight: 400;
    }


    /* ══════════════════════════════════════════════════════════
       DEADLINE BOX  (normal = amber, urgent = red)
       ══════════════════════════════════════════════════════════ */
    .deadline-box {
      background: #fffbeb;
      border-left: 3px solid #d97706;
      border-radius: 0 7px 7px 0;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .deadline-box h3 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #92400e;
      margin: 0 0 8px;
    }
    .deadline-box p { margin: 0 0 4px; }
    .deadline-box .deadline-date {
      font-size: 15px;
      font-weight: 700;
      color: #111;
    }
    /* Urgent variant */
    .deadline-box.urgent {
      background: #fff1f2;
      border-left-color: #dc2626;
    }
    .deadline-box.urgent h3 { color: #dc2626; }


    /* ══════════════════════════════════════════════════════════
       CONTACT BLOCK  (organizer contact info)
       ══════════════════════════════════════════════════════════ */
    .contact-block { margin-bottom: 24px; }
    .contact-block h3 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #888;
      margin: 0 0 8px;
    }
    .contact-block p { margin: 0; }


    /* ══════════════════════════════════════════════════════════
       NEXT STEPS LIST  (speaker acceptance)
       ══════════════════════════════════════════════════════════ */
    .next-steps { margin-bottom: 24px; }
    .next-steps h3 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #888;
      margin: 0 0 10px;
    }


    /* ══════════════════════════════════════════════════════════
       INFO BOX  (general-purpose note / account creation)
       ══════════════════════════════════════════════════════════ */
    .info-box {
      background: #f5f7fa;
      border-radius: 7px;
      padding: 16px 20px;
      margin-bottom: 20px;
    }
    .info-box h3 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #888;
      margin: 0 0 8px;
    }
    .info-box p { margin: 0 0 10px; }
    .info-box p:last-child { margin: 0; }


    /* ══════════════════════════════════════════════════════════
       LINK FALLBACK  (small gray text under buttons)
       ══════════════════════════════════════════════════════════ */
    .link-fallback {
      font-size: 11px;
      color: #aaa;
      margin-top: 8px;
      word-break: break-all;
    }
    .link-fallback a { color: #aaa; }


    /* ══════════════════════════════════════════════════════════
       REGISTRATION CODE  (waitlist / confirmation)
       ══════════════════════════════════════════════════════════ */
    .reg-code {
      background: #f5f7fa;
      border-radius: 7px;
      padding: 16px 20px;
      text-align: center;
      margin-bottom: 20px;
    }
    .reg-code .reg-code-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #888;
      margin: 0 0 8px;
    }
    .reg-code .reg-code-value {
      font-size: 24px;
      font-weight: 700;
      color: #1976d2;
      font-family: 'Courier New', monospace;
      letter-spacing: 3px;
      margin: 0;
    }


    /* ══════════════════════════════════════════════════════════
       GDPR FOOTER  (inside content templates)
       ══════════════════════════════════════════════════════════ */
    hr.divider {
      border: none;
      border-top: 1px solid #eee;
      margin: 0 0 16px;
    }
    p.gdpr {
      font-size: 11px;
      color: #bbb;
      text-align: center;
      margin: 0 0 28px;
    }
    p.gdpr a { color: #bbb; }


    /* ══════════════════════════════════════════════════════════
       INLINE CODE  (e.g. temporary password)
       ══════════════════════════════════════════════════════════ */
    code {
      font-family: 'Courier New', monospace;
      background: #f5f7fa;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 14px;
      color: #222;
    }


    /* ══════════════════════════════════════════════════════════
       CTA BUTTON  (newsletter register button — alias of .btn-primary)
       ══════════════════════════════════════════════════════════ */
    .cta-btn {
      display: inline-block;
      background: #1976d2;
      color: #fff !important;
      text-decoration: none !important;
      padding: 11px 28px;
      border-radius: 5px;
      font-size: 15px;
      font-weight: 700;
    }
  </style>
</head>
<body>
<table width="100%" cellpadding="0" cellspacing="0" role="presentation"
       style="background-color: #f4f4f4; width: 100%;">
  <tr>
    <td>
      <div class="email-container">
        <div class="header">
          <img src="{{logoUrl}}" alt="BATbern Logo" width="180" style="width:180px; max-width:180px; height:auto; border:0; display:block; margin:0 auto;" onerror="this.style.display='none'">
          <h1>BATbern</h1>
        </div>
        <div class="content">
          {{content}}
        </div>
        <div class="footer">
          &copy; {{currentYear}} BATbern. All rights reserved.
        </div>
      </div>
    </td>
  </tr>
</table>
</body>
</html>
