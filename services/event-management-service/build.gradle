// Story 15.9 — advisory OWASP-LLM security test subset.
// Runs ONLY @Tag("ai-security") tests (BatbernAiSecurityTest, AiAssistControllerSecurityTest).
// The root `test` task has no tag filter, so these also run there and gate normally; this task
// exists so the advisory `ai-security` CI workflow can run the focused subset on its own.
tasks.register('aiSecurityTest', Test) {
    description = 'Runs the @Tag("ai-security") OWASP-LLM test subset (Story 15.9).'
    group = 'verification'
    useJUnitPlatform {
        includeTags 'ai-security'
    }
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    shouldRunAfter tasks.named('test')
}

// Make compileJava depend on all OpenAPI generation tasks
compileJava.dependsOn tasks.openApiGenerate, tasks.openApiGenerateSessions, tasks.openApiGenerateSpeakers, tasks.openApiGenerateRegistrations, tasks.openApiGenerateNewsletter, tasks.openApiGenerateMedia, tasks.openApiGenerateAi, tasks.openApiGenerateAnalytics, tasks.openApiGenerateWatch, tasks.openApiGenerateUsersClient, tasks.openApiGenerateTopics

// Add generated sources to source sets
sourceSets {
    main {
        java {
            srcDir "$buildDir/generated-core/src/main/java"
            srcDir "$buildDir/generated-sessions/src/main/java"
            srcDir "$buildDir/generated-speakers/src/main/java"
            srcDir "$buildDir/generated-registrations/src/main/java"
            srcDir "$buildDir/generated-newsletter/src/main/java"
            srcDir "$buildDir/generated-media/src/main/java"
            srcDir "$buildDir/generated-ai/src/main/java"
            srcDir "$buildDir/generated-analytics/src/main/java"
            srcDir "$buildDir/generated-watch/src/main/java"
            srcDir "$buildDir/generated-users-client/src/main/java"
            srcDir "$buildDir/generated-topics/src/main/java"
        }
    }
}

// Clean generated sources when running clean
clean {
    delete "$buildDir/generated-core"
    delete "$buildDir/generated-sessions"
    delete "$buildDir/generated-speakers"
    delete "$buildDir/generated-registrations"
    delete "$buildDir/generated-newsletter"
    delete "$buildDir/generated-media"
    delete "$buildDir/generated-ai"
    delete "$buildDir/generated-analytics"
    delete "$buildDir/generated-watch"
    delete "$buildDir/generated-users-client"
    delete "$buildDir/generated-topics"
}
