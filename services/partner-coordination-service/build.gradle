// Partner Coordination Service
// Common configuration is in root build.gradle
// This file contains only service-specific dependencies and configuration

plugins {
    // Version-less: resolved from settings.gradle pluginManagement (single source, Epic 13)
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'com.gorylenko.gradle-git-properties' version '2.5.7'
}

// Git properties generation
gitProperties {
    keys = ['git.branch', 'git.commit.id', 'git.commit.id.abbrev', 'git.commit.time']
    dateFormat = "yyyy-MM-dd'T'HH:mm:ssZ"
    dateFormatTimeZone = "UTC"
    failOnNoGitDirectory = false
    extProperty = 'gitProps'
}

dependencies {
    // Service-specific: Caching
    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.3'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Service-specific: Resilience4j for circuit breaker
    // Epic 13 (SB4): -spring-boot3 was renamed to -spring-boot4 (per the 13-1 compat matrix; shared-kernel
    // already moved). Keeping -spring-boot3 here put BOTH the springboot3 and the (transitive, from
    // shared-kernel) springboot4 auto-configs on the classpath → duplicate bulkheadRegistryEventConsumer
    // bean → BeanDefinitionOverrideException → context fails. Align to -spring-boot4:2.4.0.
    implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.4.0'

    // Service-specific: AWS SDK
    implementation platform('software.amazon.awssdk:bom:2.39.0')
    implementation 'software.amazon.awssdk:eventbridge'

    // Service-specific: Monitoring
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.micrometer:micrometer-registry-cloudwatch2'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // Service-specific: Testing libraries
    testImplementation 'io.rest-assured:rest-assured:5.5.6'
    testImplementation 'org.awaitility:awaitility:4.3.0'
    // Epic 13 (SB4): @RestClientTest moved to the spring-boot-restclient-test module.
    testImplementation 'org.springframework.boot:spring-boot-restclient-test'

    // Service-specific: OpenAPI nullable (if needed for this service)
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'

    // Service-specific: Apache POI for Excel export (Story 8.1: AC4)
    implementation 'org.apache.poi:poi-ooxml:5.4.0'

    // Service-specific: DevTools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

// Flyway configuration - service-specific table name
flyway {
    table = 'flyway_schema_history_partner_coordination'
}

// OpenAPI Generator - Generate API interfaces and DTOs from partners-api spec
openApiGenerate {
    generatorName = "spring"
    inputSpec = "$rootDir/docs/api/partners-api.openapi.yml".toString()
    outputDir = "$buildDir/generated".toString()
    apiPackage = "ch.batbern.partners.api.generated"
    modelPackage = "ch.batbern.partners.dto.generated"

    importMappings = [
        'ErrorResponse': 'ch.batbern.shared.dto.ErrorResponse',
        'PaginationMetadata': 'ch.batbern.shared.api.PaginationMetadata',
        'PaginatedResponse': 'ch.batbern.shared.dto.PaginatedResponse'
    ]

    typeMappings = [
        'ErrorResponse': 'ch.batbern.shared.dto.ErrorResponse',
        'PaginationMetadata': 'ch.batbern.shared.api.PaginationMetadata'
    ]

    schemaMappings = [
        'ErrorResponse': 'ch.batbern.shared.dto.ErrorResponse',
        'PaginationMetadata': 'ch.batbern.shared.api.PaginationMetadata'
    ]

    configOptions = [
        interfaceOnly: "true",
        useTags: "true",
        useSpringBoot3: "true",
        useBeanValidation: "true",
        useJakartaEe: "true",
        dateLibrary: "java8",
        generateBuilders: "true",
        skipDefaultInterface: "true",
        containerDefaultToNull: "true"  // unset collections serialize as absent, not `[]` (pre-7.14 contract)
    ]
}

// OpenAPI Generator - Partner Meetings API (Story 8.3 / 10.27) — carved into its own spec.
// Distinct api/model packages so its DTOs don't collide with the partners-api generator.
task openApiGenerateMeetings(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "spring"
    inputSpec = "$rootDir/docs/api/partner-meetings-api.openapi.yml".toString()
    outputDir = "$buildDir/generated-meetings".toString()
    apiPackage = "ch.batbern.partners.meetings.api.generated"
    modelPackage = "ch.batbern.partners.meetings.dto.generated"
    invokerPackage = "ch.batbern.partners.meetings.api.invoker"
    validateSpec = false

    importMappings = [
        'ErrorResponse': 'ch.batbern.shared.dto.ErrorResponse',
        'PaginationMetadata': 'ch.batbern.shared.api.PaginationMetadata',
        'PaginatedResponse': 'ch.batbern.shared.dto.PaginatedResponse'
    ]

    typeMappings = [
        'ErrorResponse': 'ch.batbern.shared.dto.ErrorResponse',
        'PaginationMetadata': 'ch.batbern.shared.api.PaginationMetadata'
    ]

    schemaMappings = [
        'ErrorResponse': 'ch.batbern.shared.dto.ErrorResponse',
        'PaginationMetadata': 'ch.batbern.shared.api.PaginationMetadata'
    ]

    configOptions = [
        interfaceOnly: "true",
        useTags: "true",
        useSpringBoot3: "true",
        useBeanValidation: "true",
        useJakartaEe: "true",
        dateLibrary: "java8",
        generateBuilders: "true",
        skipDefaultInterface: "true",
        // Plain @Nullable fields (not JsonNullable) — mirrors the hand DTOs' semantics:
        // PATCH reads `getX() != null`, and PartnerMeetingDTO's @JsonInclude(NON_NULL) omits nulls.
        openApiNullable: "false",
        containerDefaultToNull: "true"  // unset collections serialize as absent, not `[]` (pre-7.14 contract)
    ]
}

// Generate Company Service Client DTOs
task generateCompanyClientDtos(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    // Models-only cross-service client DTOs. Uses the `spring` generator (not `java`/`native`)
    // to mirror EMS's openApiGenerateUsersClient: the Java client model template injects an
    // unsatisfied `import ...ApiClient;` under models-only generation (openapi-generator 7.x),
    // whereas the spring model template does not.
    generatorName = "spring"
    inputSpec = "$rootDir/docs/api/companies-api.openapi.yml".toString()
    outputDir = "$buildDir/generated-client-company".toString()
    apiPackage = "ch.batbern.partners.client.company.api.generated"
    modelPackage = "ch.batbern.partners.client.company.dto"
    validateSpec = false

    globalProperties = [
        models: "",
        apis: "false",
        supportingFiles: "false"
    ]

    configOptions = [
        dateLibrary: "java8",
        interfaceOnly: "false",
        skipDefaultInterface: "true",
        useTags: "false",
        useSpringBoot3: "true",
        documentationProvider: "none",
        openApiNullable: "false",
        hideGenerationTimestamp: "true",
        useBeanValidation: "true",
        performBeanValidation: "true",
        useOptional: "false",
        useJakartaEe: "true",
        generateBuilders: "true",
        containerDefaultToNull: "true"  // unset collections serialize as absent, not `[]` (pre-7.14 contract)
    ]
}

// Generate User Service Client DTOs
task generateUserClientDtos(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    // Models-only cross-service client DTOs — see generateCompanyClientDtos for why `spring`.
    generatorName = "spring"
    inputSpec = "$rootDir/docs/api/users-api.openapi.yml".toString()
    outputDir = "$buildDir/generated-client-user".toString()
    apiPackage = "ch.batbern.partners.client.user.api.generated"
    modelPackage = "ch.batbern.partners.client.user.dto"
    validateSpec = false

    globalProperties = [
        models: "",
        apis: "false",
        supportingFiles: "false"
    ]

    configOptions = [
        dateLibrary: "java8",
        interfaceOnly: "false",
        skipDefaultInterface: "true",
        useTags: "false",
        useSpringBoot3: "true",
        documentationProvider: "none",
        openApiNullable: "false",
        hideGenerationTimestamp: "true",
        useBeanValidation: "true",
        performBeanValidation: "true",
        useOptional: "false",
        useJakartaEe: "true",
        generateBuilders: "true",
        containerDefaultToNull: "true"  // unset collections serialize as absent, not `[]` (pre-7.14 contract)
    ]
}

// Add generated sources to compile
sourceSets.main.java.srcDirs += "$buildDir/generated/src/main/java"
sourceSets.main.java.srcDirs += "$buildDir/generated-meetings/src/main/java"
sourceSets.main.java.srcDirs += "$buildDir/generated-client-company/src/main/java"
sourceSets.main.java.srcDirs += "$buildDir/generated-client-user/src/main/java"

// Generate before compile
compileJava.dependsOn tasks.openApiGenerate, tasks.openApiGenerateMeetings, generateCompanyClientDtos, generateUserClientDtos

// Override Flyway config for this service (different from default)
flyway {
    url = System.getProperty('flyway.url', 'jdbc:postgresql://localhost:5432/batbern')
    user = System.getProperty('flyway.user', 'batbern_user')
    password = System.getProperty('flyway.password', 'batbern-dev-password')
}

// Clean generated sources when running clean (parity with EMS/CUMS)
clean {
    delete "$buildDir/generated"
    delete "$buildDir/generated-meetings"
    delete "$buildDir/generated-client-company"
    delete "$buildDir/generated-client-user"
}
