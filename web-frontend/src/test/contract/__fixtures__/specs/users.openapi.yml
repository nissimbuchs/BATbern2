openapi: 3.1.0
info:
  title: Fixture users
  version: 1.0.0
servers:
  - url: /api/v1
paths:
  /users/{username}:
    get:
      operationId: getUser
      responses:
        '200':
          description: ok
    delete:
      operationId: deleteUser
      responses:
        '204':
          description: ok
  /users/me/settings:
    get:
      operationId: getMySettings
      responses:
        '200':
          description: ok
  /users/export:
    get:
      operationId: exportUsers
      parameters:
        - $ref: '_shared.openapi.yml#/components/parameters/Format'
      responses:
        '200':
          description: ok
  /users/sorted:
    get:
      operationId: listSortedUsers
      parameters:
        - name: order
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: ok
  /users/search:
    get:
      operationId: searchUsers
      parameters:
        - name: filter
          in: query
          schema:
            type: object
            additionalProperties: true
      responses:
        '200':
          description: ok
