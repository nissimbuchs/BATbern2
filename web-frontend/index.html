<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BATbern Platform</title>
    <meta name="description" content="BATbern - Event Management Platform" />

    <!--
      Warm the connection to the media CDN before JS resolves the hero image
      URL. The LCP element is a hero image served from cdn.batbern.ch; the
      PageSpeed report lists this origin as a preconnect candidate (~340 ms LCP
      saving). No crossorigin: hero/logo <img> requests are not CORS.
    -->
    <link rel="preconnect" href="https://cdn.batbern.ch" />
    <link rel="dns-prefetch" href="https://cdn.batbern.ch" />

    <!--
      No web-font loading: the UI renders in the system font stack
      ('Helvetica Neue'/system-ui — see src/index.css, tailwind.config.js, MUI
      theme in main.tsx). The previous Google Fonts <link> (Inter + Noto Sans JP)
      was render-blocking (~120 KiB / ~3 s on Slow 4G) yet no rule referenced
      those families, so it was removed. Re-add a self-hosted @font-face here if a
      custom UI font is ever adopted.
    -->

    <!-- Security headers (X-Frame-Options sent via HTTP header only, not meta tag) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-XSS-Protection" content="1; mode=block" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- PWA Meta Tags (Task 14b) -->
    <meta name="theme-color" content="#2C5F7C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BATbern" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
