// Root build.gradle for BATbern Platform
// Configures all services with shared dependencies and configuration

buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Spring Boot + dependency-management are NOT pinned here. They are resolved
        // once from settings.gradle pluginManagement and applied per-module via the
        // version-less plugins {} DSL (Epic 13 — single version source, no per-module
        // pins, so a chore/Dependabot bump of the one coordinate moves the whole estate).

        // Flyway
        classpath 'org.flywaydb:flyway-gradle-plugin:13.4.0'
        classpath 'org.postgresql:postgresql:42.7.7'
        classpath 'org.flywaydb:flyway-database-postgresql:13.4.0'

        // OpenAPI Generator
        classpath 'org.openapitools:openapi-generator-gradle-plugin:7.14.0'
    }
}

// Common configuration for all projects
allprojects {
    group = 'ch.batbern'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }

    // Epic 13 (Spring Boot 4 migration) — Story 13-1 zero-deprecation baseline.
    // SB4 removes ~88% of 2.x/3.x deprecations; surface every Java deprecation
    // warning across ALL modules (shared-kernel, api-gateway, services) so we can
    // drive the count to zero BEFORE switching the framework version. Pass
    // -PfailOnDeprecation to enforce zero (the final 13-1 gate); without it the
    // warnings are visible but non-fatal so the baseline can be measured.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Xlint:deprecation'
        if (project.hasProperty('failOnDeprecation')) {
            options.compilerArgs << '-Werror'
        }
    }
}

// Checkstyle — single source of truth for EVERY module that applies the plugin
// (the :services:* modules below, plus shared-kernel and api-gateway, which each
// apply 'checkstyle' in their own build.gradle). withId fires whenever the plugin
// is applied, so the config can't drift per-module. Violations fail the build.
subprojects {
    plugins.withId('checkstyle') {
        checkstyle {
            toolVersion = '10.12.5'
            configFile = file("${rootProject.projectDir}/config/checkstyle/checkstyle.xml")
            ignoreFailures = false
            maxWarnings = 0
        }
    }

    // Epic 13 (SB4): Testcontainers 2.0. SB4's spring-boot-dependencies imports testcontainers-bom
    // with <scope>import</scope>, but io.spring.dependency-management (1.1.7) does not recurse into
    // that nested import, so version-less org.testcontainers:* modules resolve to empty. Import the
    // testcontainers-bom directly via the plugin's own idiom (Gradle's platform() is overridden by
    // io.spring.dependency-management and has no effect here). Single source for the TC version.
    pluginManager.withPlugin('io.spring.dependency-management') {
        dependencyManagement {
            imports {
                mavenBom 'org.testcontainers:testcontainers-bom:2.0.5'
            }
        }
    }
}

// Configuration for all service subprojects ONLY
configure(subprojects.findAll { it.path.startsWith(':services:') }) {
        apply plugin: 'java'
        // org.springframework.boot + io.spring.dependency-management are applied per-module
        // via the version-less plugins {} DSL (resolved from settings.gradle pluginManagement),
        // not here — single version source, no per-module pins (Epic 13).
        apply plugin: 'jacoco'
        apply plugin: 'checkstyle'
        apply plugin: 'org.flywaydb.flyway'
        apply plugin: 'org.openapi.generator'
        // Note: git-properties plugin applied in service build.gradle using plugins {} DSL
        
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
        }
        
        dependencies {
            // Shared Kernel - Common types and utilities
            implementation project(':shared-kernel')
            testImplementation testFixtures(project(':shared-kernel'))
            
            // Spring Boot Core
            implementation 'org.springframework.boot:spring-boot-starter-web'
            // Epic 13 (SB4): RestTemplate/RestTemplateBuilder support is its own module now
            // (org.springframework.boot.restclient) — no longer transitive from starter-web.
            implementation 'org.springframework.boot:spring-boot-starter-restclient'
            implementation 'org.springframework.boot:spring-boot-starter-actuator'
            implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
            implementation 'org.springframework.boot:spring-boot-starter-validation'
            implementation 'org.springframework.boot:spring-boot-starter-security'
            implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

            // Epic 13 (SB4): keep Jackson 2 (com.fasterxml) defaults during the migration so
            // API payloads stay byte-identical; the Bruno suite is the payload-diff gate. The
            // final story flips to native Jackson 3 (tools.jackson). BOM-managed version.
            implementation 'org.springframework.boot:spring-boot-jackson2'

            // Database - PostgreSQL + Flyway
            runtimeOnly 'org.postgresql:postgresql:42.7.7'
            implementation 'org.flywaydb:flyway-core'
            implementation 'org.flywaydb:flyway-database-postgresql'
            // Epic 13 (SB4): Flyway auto-configuration moved OUT of spring-boot-autoconfigure
            // into its own module (org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration).
            // Without it, migrations never run at boot → Hibernate ddl-auto=validate hits an empty
            // schema → "Schema validation: missing table [...]" and every @SpringBootTest fails to
            // load its context. Required by the DB services (CUMS/EMS/partner); attendee has no
            // datasource and excludes it explicitly in its @SpringBootApplication. BOM-managed version.
            implementation 'org.springframework.boot:spring-boot-flyway'
            
            // OpenAPI/Swagger
            implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
            implementation 'io.swagger.core.v3:swagger-annotations:2.2.20'
            implementation 'jakarta.validation:jakarta.validation-api'
            implementation 'jakarta.annotation:jakarta.annotation-api'
            
            // Lombok - reduce boilerplate. Version BOM-managed (Epic 13): the SB4 BOM pins a
            // Lombok that supports the current JDK/Gradle annotation processing. The old hard
            // pin 1.18.36 silently failed to run under SB4 → @Slf4j/@Builder/@Data members
            // vanished and cascaded into ~200 "cannot find symbol" errors.
            compileOnly 'org.projectlombok:lombok'
            annotationProcessor 'org.projectlombok:lombok'
            testCompileOnly 'org.projectlombok:lombok'
            testAnnotationProcessor 'org.projectlombok:lombok'
            
            // Testing
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
            testImplementation 'org.springframework.security:spring-security-test'
            // Epic 13 (SB4): MockMvc test slice moved out of spring-boot-test-autoconfigure
            // into its own module.
            testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
            // Epic 13 (SB4): Testcontainers 2.0 versions come from the testcontainers-bom
            // imported in the root subprojects dependencyManagement block (io.spring.dependency-
            // management doesn't recurse into SB4's nested testcontainers-bom import).
            testImplementation 'org.testcontainers:testcontainers'
            testImplementation 'org.testcontainers:testcontainers-postgresql'
            testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
        }
        
        // Test configuration
        test {
            useJUnitPlatform()
            testLogging {
                events "passed", "skipped", "failed"
                exceptionFormat = 'full'
            }
            // Opt-in fast mode for the local pre-push hook: skip the heavy Testcontainers
            // *IntegrationTest classes (they reliably blow the 20-min cap below on dev machines).
            // CI/CD invokes `test` WITHOUT this flag, so the full integration suite still gates
            // every PR. Run with: ./gradlew :services:<svc>:test -PskipIntegration
            if (project.hasProperty('skipIntegration')) {
                exclude '**/*IntegrationTest*'
            }
            timeout = java.time.Duration.ofMinutes(20)
            systemProperty 'junit.jupiter.execution.timeout.default', '5m'
            systemProperty 'junit.jupiter.execution.timeout.testable.method.default', '5m'
            jvmArgs '-XX:+EnableDynamicAgentLoading'
            // Heavy services (event-management) cache many @SpringBootTest contexts alongside
            // Testcontainers; the JVM default heap (~512m) leaves the suite one extra context away
            // from OutOfMemoryError (CI run 27146950337: OOM during WatchSpeakerArrivalWebSocketTest
            // context load, surfacing as a JaCoCo agent "can't create name string" assertion). Give
            // the forked test JVM real headroom — GitHub runners have ~16 GB and each service builds
            // in its own job.
            maxHeapSize = '2g'
        }
        
        // Jacoco configuration
        jacoco {
            toolVersion = "0.8.10"
        }
        
        jacocoTestReport {
            dependsOn test, classes
            reports {
                xml.required = true
                html.required = true
                csv.required = false
            }
            afterEvaluate {
                classDirectories.setFrom(files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: [
                        '**/generated/**',
                        '**/dto/generated/**',
                        '**/api/generated/**',
                        '**/client/**/dto/**',
                        '**/*Application.class',
                        '**/*Config.class',
                        '**/*Configuration.class',
                        // Email system — excluded from coverage
                        '**/Newsletter*.class',
                        '**/DevEmailController.class',
                        '**/DuplicateSubscriberException.class'
                    ])
                }))
            }
        }
        
        test.finalizedBy jacocoTestReport
        
        jacocoTestCoverageVerification {
            dependsOn jacocoTestReport
            violationRules {
                rule {
                    limit {
                        minimum = 0.60
                    }
                }
            }
            afterEvaluate {
                classDirectories.setFrom(files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: [
                        '**/generated/**',
                        '**/dto/generated/**',
                        '**/api/generated/**',
                        '**/client/**/dto/**',
                        '**/*Application.class',
                        '**/*Config.class',
                        '**/*Configuration.class',
                        // Email system — excluded from coverage
                        '**/Newsletter*.class',
                        '**/DevEmailController.class',
                        '**/DuplicateSubscriberException.class'
                    ])
                }))
            }
        }
        
        // Checkstyle is configured centrally for all modules (see the
        // subprojects { plugins.withId('checkstyle') } block near the top).

        // Apply Trivy security scanning
        apply from: "${rootProject.projectDir}/gradle/trivy-security.gradle"
        
        // Spring Boot Actuator build info. The SB plugin is now applied per-module via
        // the version-less plugins {} DSL (resolved from settings.gradle), which runs after
        // this configure block — so defer the springBoot {} config until the plugin lands.
        pluginManager.withPlugin('org.springframework.boot') {
            springBoot {
                buildInfo()
            }
        }

        // Note: Git properties plugin configured in individual service build.gradle files

        // Flyway configuration for database migrations
        flyway {
            url = System.getProperty('flyway.url', 'jdbc:postgresql://localhost:5432/batbern_development')
            user = System.getProperty('flyway.user', 'postgres')
            password = System.getProperty('flyway.password', 'devpass123')
            locations = ['classpath:db/migration']
            baselineOnMigrate = true
            baselineVersion = '0'
        }
}
