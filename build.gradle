// Root build.gradle for BATbern Platform
// Configures all services with shared dependencies and configuration

buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Spring Boot Gradle Plugin
        classpath 'org.springframework.boot:spring-boot-gradle-plugin:3.5.7'
        classpath 'io.spring.gradle:dependency-management-plugin:1.1.7'

        // Flyway
        classpath 'org.flywaydb:flyway-gradle-plugin:11.18.0'
        classpath 'org.postgresql:postgresql:42.7.7'
        classpath 'org.flywaydb:flyway-database-postgresql:11.18.0'

        // OpenAPI Generator
        classpath 'org.openapitools:openapi-generator-gradle-plugin:7.2.0'
    }
}

// Common configuration for all projects
allprojects {
    group = 'ch.batbern'
    version = '1.0.0'

    repositories {
        mavenCentral()
    }

    // Epic 13 (Spring Boot 4 migration) — Story 13-1 zero-deprecation baseline.
    // SB4 removes ~88% of 2.x/3.x deprecations; surface every Java deprecation
    // warning across ALL modules (shared-kernel, api-gateway, services) so we can
    // drive the count to zero BEFORE switching the framework version. Pass
    // -PfailOnDeprecation to enforce zero (the final 13-1 gate); without it the
    // warnings are visible but non-fatal so the baseline can be measured.
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << '-Xlint:deprecation'
        if (project.hasProperty('failOnDeprecation')) {
            options.compilerArgs << '-Werror'
        }
    }
}

// Checkstyle — single source of truth for EVERY module that applies the plugin
// (the :services:* modules below, plus shared-kernel and api-gateway, which each
// apply 'checkstyle' in their own build.gradle). withId fires whenever the plugin
// is applied, so the config can't drift per-module. Violations fail the build.
subprojects {
    plugins.withId('checkstyle') {
        checkstyle {
            toolVersion = '10.12.5'
            configFile = file("${rootProject.projectDir}/config/checkstyle/checkstyle.xml")
            ignoreFailures = false
            maxWarnings = 0
        }
    }
}

// Configuration for all service subprojects ONLY
configure(subprojects.findAll { it.path.startsWith(':services:') }) {
        apply plugin: 'java'
        apply plugin: 'org.springframework.boot'
        apply plugin: 'io.spring.dependency-management'
        apply plugin: 'jacoco'
        apply plugin: 'checkstyle'
        apply plugin: 'org.flywaydb.flyway'
        apply plugin: 'org.openapi.generator'
        // Note: git-properties plugin applied in service build.gradle using plugins {} DSL
        
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(21)
            }
            sourceCompatibility = JavaVersion.VERSION_21
            targetCompatibility = JavaVersion.VERSION_21
        }
        
        dependencies {
            // Shared Kernel - Common types and utilities
            implementation project(':shared-kernel')
            testImplementation testFixtures(project(':shared-kernel'))
            
            // Spring Boot Core
            implementation 'org.springframework.boot:spring-boot-starter-web'
            implementation 'org.springframework.boot:spring-boot-starter-actuator'
            implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
            implementation 'org.springframework.boot:spring-boot-starter-validation'
            implementation 'org.springframework.boot:spring-boot-starter-security'
            implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
            
            // Database - PostgreSQL + Flyway
            runtimeOnly 'org.postgresql:postgresql:42.7.7'
            implementation 'org.flywaydb:flyway-core'
            implementation 'org.flywaydb:flyway-database-postgresql'
            
            // OpenAPI/Swagger
            implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.14'
            implementation 'io.swagger.core.v3:swagger-annotations:2.2.20'
            implementation 'jakarta.validation:jakarta.validation-api'
            implementation 'jakarta.annotation:jakarta.annotation-api'
            
            // Lombok - reduce boilerplate
            compileOnly 'org.projectlombok:lombok:1.18.36'
            annotationProcessor 'org.projectlombok:lombok:1.18.36'
            testCompileOnly 'org.projectlombok:lombok:1.18.36'
            testAnnotationProcessor 'org.projectlombok:lombok:1.18.36'
            
            // Testing
            testImplementation 'org.springframework.boot:spring-boot-starter-test'
            testImplementation 'org.springframework.security:spring-security-test'
            testImplementation 'org.testcontainers:testcontainers:1.21.3'
            testImplementation 'org.testcontainers:postgresql:1.21.3'
            testImplementation 'org.testcontainers:junit-jupiter:1.21.3'
        }
        
        // Test configuration
        test {
            useJUnitPlatform()
            testLogging {
                events "passed", "skipped", "failed"
                exceptionFormat = 'full'
            }
            // Opt-in fast mode for the local pre-push hook: skip the heavy Testcontainers
            // *IntegrationTest classes (they reliably blow the 20-min cap below on dev machines).
            // CI/CD invokes `test` WITHOUT this flag, so the full integration suite still gates
            // every PR. Run with: ./gradlew :services:<svc>:test -PskipIntegration
            if (project.hasProperty('skipIntegration')) {
                exclude '**/*IntegrationTest*'
            }
            timeout = java.time.Duration.ofMinutes(20)
            systemProperty 'junit.jupiter.execution.timeout.default', '5m'
            systemProperty 'junit.jupiter.execution.timeout.testable.method.default', '5m'
            jvmArgs '-XX:+EnableDynamicAgentLoading'
            // Heavy services (event-management) cache many @SpringBootTest contexts alongside
            // Testcontainers; the JVM default heap (~512m) leaves the suite one extra context away
            // from OutOfMemoryError (CI run 27146950337: OOM during WatchSpeakerArrivalWebSocketTest
            // context load, surfacing as a JaCoCo agent "can't create name string" assertion). Give
            // the forked test JVM real headroom — GitHub runners have ~16 GB and each service builds
            // in its own job.
            maxHeapSize = '2g'
        }
        
        // Jacoco configuration
        jacoco {
            toolVersion = "0.8.10"
        }
        
        jacocoTestReport {
            dependsOn test, classes
            reports {
                xml.required = true
                html.required = true
                csv.required = false
            }
            afterEvaluate {
                classDirectories.setFrom(files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: [
                        '**/generated/**',
                        '**/dto/generated/**',
                        '**/api/generated/**',
                        '**/client/**/dto/**',
                        '**/*Application.class',
                        '**/*Config.class',
                        '**/*Configuration.class',
                        // Email system — excluded from coverage
                        '**/Newsletter*.class',
                        '**/DevEmailController.class',
                        '**/DuplicateSubscriberException.class'
                    ])
                }))
            }
        }
        
        test.finalizedBy jacocoTestReport
        
        jacocoTestCoverageVerification {
            dependsOn jacocoTestReport
            violationRules {
                rule {
                    limit {
                        minimum = 0.60
                    }
                }
            }
            afterEvaluate {
                classDirectories.setFrom(files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: [
                        '**/generated/**',
                        '**/dto/generated/**',
                        '**/api/generated/**',
                        '**/client/**/dto/**',
                        '**/*Application.class',
                        '**/*Config.class',
                        '**/*Configuration.class',
                        // Email system — excluded from coverage
                        '**/Newsletter*.class',
                        '**/DevEmailController.class',
                        '**/DuplicateSubscriberException.class'
                    ])
                }))
            }
        }
        
        // Checkstyle is configured centrally for all modules (see the
        // subprojects { plugins.withId('checkstyle') } block near the top).

        // Apply Trivy security scanning
        apply from: "${rootProject.projectDir}/gradle/trivy-security.gradle"
        
        // Spring Boot Actuator build info
        springBoot {
            buildInfo()
        }

        // Note: Git properties plugin configured in individual service build.gradle files

        // Flyway configuration for database migrations
        flyway {
            url = System.getProperty('flyway.url', 'jdbc:postgresql://localhost:5432/batbern_development')
            user = System.getProperty('flyway.user', 'postgres')
            password = System.getProperty('flyway.password', 'devpass123')
            locations = ['classpath:db/migration']
            baselineOnMigrate = true
            baselineVersion = '0'
        }
}
