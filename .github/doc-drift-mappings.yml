# ── Commit type prefixes that are ALWAYS skipped ────────────────────────────
skip_commit_types:
  - "chore"
  - "test"
  - "docs"
  - "style"
  - "refactor"
  - "build"
  - "ci"

# Every other type is audited, including perf and non-conventional subjects ("unknown").

# ── Commit scopes that are ALWAYS skipped ────────────────────────────────────
# A subject with several scopes is skipped only when every scope is listed.
# auth and security are audited (#1214): their paths map to 08-operations-security.md.
# Scopes that are never business-rule changes — infra wiring, test fixes,
# build tooling, UI polish, code-review cleanup, etc.
skip_commit_scopes:
  - "infra"
  - "test"
  - "tests"
  - "build"
  - "bruno"
  - "review"
  - "presentation"
  - "ci"
  - "blob-selector"  # UI animation/interaction — not a business rule
  - "watch"          # WebSocket resilience — technical fix
