# Doc Drift Mappings
# Maps source path patterns to the documentation that should be reviewed when those paths change.
# Used by the weekly auditor (doc-drift-auditor.yml) and the PR check (claude-code-review.yml),
# both through .github/scripts/doc_drift.py; tests: .github/scripts/test-doc-drift.sh.
#
# Rules (#1214):
# - A commit or PR is exempt only when at least one doc mapped to its changed source paths
#   changed. docs/user-guide/appendix/changelog.md and docs/versions.json never count.
# - docs/api/ is source (OpenAPI specs), except its Markdown files. CLAUDE.md and any README.md
#   are docs and may be targets.
# - source_pattern: a plain value is a path prefix; a value with * ? or [ is an fnmatch pattern
#   over the whole path, where * also crosses "/".
# - docs: a value ending in "/" covers every file under it, anything else is one file.
#   Every target must exist (the test checks it).

mappings:

  # ── Event Management Service ────────────────────────────────────────────────
  - source_pattern: "services/event-management-service/"
    docs:
      - "docs/architecture/06a-workflow-state-machines.md"
      - "docs/architecture/06-backend-architecture.md"
      - "docs/prd/epic-5-enhanced-organizer-workflows.md"
      - "docs/user-guide/workflow/"
      - "docs/user-guide/entity-management/events.md"

  # Alias forwarding and the Mail Center (#1214): operated through the runbooks, described in 06d.
  - source_pattern: "services/event-management-service/src/main/java/ch/batbern/events/forwarding/"
    docs:
      - "docs/operations/runbooks.md"
      - "docs/architecture/06d-notification-system.md"
  - source_pattern: "services/event-management-service/src/main/java/ch/batbern/events/mailcenter/"
    docs:
      - "docs/operations/runbooks.md"
      - "docs/architecture/06d-notification-system.md"

  # Speaker workflow (#1214): it lives in EMS since ADR-014, spread over the layered packages,
  # so it is matched by file name.
  - source_pattern: "services/event-management-service/src/main/java/*Speaker*"
    docs:
      - "docs/architecture/06d-notification-system.md"
      - "docs/user-guide/speaker-portal/"
      - "docs/prd/epic-6-speaker-portal-support.md"

  # ── AI / LLM surface (Story 15.9) ───────────────────────────────────────────
