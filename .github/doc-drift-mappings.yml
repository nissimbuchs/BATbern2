# Doc Drift Mappings
# Maps source path patterns to documentation files that should be reviewed
# when those paths are modified in a feat: or fix: commit.
# Used by both the weekly auditor (doc-drift-auditor.yml) and PR check (claude-code-review.yml).
# Extend this file as new services or docs are added.

mappings:

  # ── Event Management Service ────────────────────────────────────────────────
  - source_pattern: "services/event-management-service/"
    docs:
      - "docs/architecture/06a-workflow-state-machines.md"
      - "docs/architecture/06-backend-architecture.md"
      - "docs/prd/epic-5-enhanced-organizer-workflows.md"
      - "docs/user-guide/workflow/"
      - "docs/user-guide/entity-management/events.md"
      - "docs/user-guide/appendix/changelog.md"

  # ── AI / LLM surface (Story 15.9) ───────────────────────────────────────────
  # AI prompt-construction & content-generation services map to the OWASP-LLM checklist.
  - source_pattern: "services/event-management-service/src/main/java/ch/batbern/events/service/BatbernAiService.java"
    docs:
      - "docs/security/owasp-llm-agentic-checklist.md"
      - "docs/architecture/08-operations-security.md"

  # ── Settings stores (Story 4.9) ─────────────────────────────────────────────
  - source_pattern: "services/event-management-service/src/main/java/ch/batbern/events/service/AdminSettingsService.java"
    docs:
      - "docs/architecture/06-backend-architecture.md"
      - "docs/architecture/03-data-architecture.md"
  - source_pattern: "services/event-management-service/src/main/java/ch/batbern/events/service/PresentationSettings.java"
    docs:
      - "docs/architecture/06-backend-architecture.md"
      - "docs/architecture/03-data-architecture.md"
  - source_pattern: "services/company-user-management-service/src/main/java/ch/batbern/companyuser/service/UserSettingsService.java"
    docs:
      - "docs/architecture/04-api-user-management.md"
      - "docs/architecture/06-backend-architecture.md"
  - source_pattern: "services/event-management-service/src/main/java/ch/batbern/events/service/EventTaskService.java"
    docs:
      - "docs/architecture/06a-workflow-state-machines.md"

  # ── Company / User Management Service ──────────────────────────────────────
  - source_pattern: "services/company-user-management-service/"
    docs:
      - "docs/architecture/06b-user-lifecycle-sync.md"
      - "docs/architecture/06-backend-architecture.md"
      - "docs/user-guide/entity-management/companies.md"
      - "docs/user-guide/entity-management/users.md"
      - "docs/user-guide/appendix/changelog.md"

  # ── Partner Coordination Service ────────────────────────────────────────────
  - source_pattern: "services/partner-coordination-service/"
    docs:
      - "docs/prd/epic-8-partner-coordination.md"
      - "docs/architecture/06-backend-architecture.md"
      - "docs/user-guide/partner-portal/"
      - "docs/user-guide/features/analytics.md"
      - "docs/user-guide/appendix/changelog.md"

  # ── API Gateway ─────────────────────────────────────────────────────────────
  - source_pattern: "api-gateway/"
    docs:
      - "docs/architecture/06-backend-architecture.md"
      - "docs/api/"
      # Story 12.2: the gateway now hosts the canonical is_active gate (AccountActiveFilter),
      # whose lifecycle/enforcement semantics live in 06b — flag gateway auth changes against it.
      - "docs/architecture/06b-user-lifecycle-sync.md"

  # ── Infrastructure (CDK) ────────────────────────────────────────────────────
  - source_pattern: "infrastructure/"
    docs:
      - "docs/architecture/08-operations-security.md"
      - "docs/architecture/06-backend-architecture.md"

  # ── Shared Kernel ────────────────────────────────────────────────────────────
  - source_pattern: "shared-kernel/"
    docs:
      - "docs/architecture/06-backend-architecture.md"
      - "docs/architecture/06a-workflow-state-machines.md"

  # ── Search (Story 17.17) ─────────────────────────────────────────────────────
  # The fold, the term parser and every search specification: the field sets and semantics
  # are documented in one place.
  - source_pattern: "shared-kernel/src/main/java/ch/batbern/shared/search/"
    docs:
      - "docs/architecture/06-backend-architecture.md"
  - source_pattern: "shared-kernel/src/main/resources/db/search/"
    docs:
      - "docs/architecture/06-backend-architecture.md"
  - source_pattern: "services/company-user-management-service/src/main/java/ch/batbern/companyuser/specification/"
    docs:
      - "docs/architecture/06-backend-architecture.md"
  - source_pattern: "services/event-management-service/src/main/java/ch/batbern/events/specification/"
    docs:
      - "docs/architecture/06-backend-architecture.md"

  # ── Service-to-service calls (ADR-016, Epic 17 entries 6 and 6b) ─────────────
  # A client's URL, transport or headers and the internal specs are the S2S contract: the
  # direction and token rules, the guard baseline and the harness text live in these docs.
  - source_pattern: "services/partner-coordination-service/src/main/java/ch/batbern/partners/client/"
    docs:
      - "docs/architecture/module-map.md"
      - "docs/architecture/ADR-016-service-directions-and-service-to-service-calls.md"
  - source_pattern: "services/event-management-service/src/main/java/ch/batbern/events/client/"
    docs:
      - "docs/architecture/module-map.md"
      - "docs/architecture/ADR-016-service-directions-and-service-to-service-calls.md"
  - source_pattern: "services/company-user-management-service/src/main/java/ch/batbern/companyuser/client/"
    docs:
      - "docs/architecture/module-map.md"
      - "docs/architecture/ADR-016-service-directions-and-service-to-service-calls.md"
  - source_pattern: "services/partner-coordination-service/src/main/java/ch/batbern/partners/mail/HttpOutboundMailRecorder.java"
    docs:
      - "docs/architecture/module-map.md"
      - "docs/architecture/ADR-016-service-directions-and-service-to-service-calls.md"
  - source_pattern: "api-gateway/src/main/java/ch/batbern/gateway/client/GatewayUserStatusClient.java"
    docs:
      - "docs/architecture/module-map.md"
      - "docs/architecture/ADR-016-service-directions-and-service-to-service-calls.md"
  # Epic 17 entry 7: contracts a service owns (ADR-016 decision 4) are called through one shared caller.
  - source_pattern: "shared-kernel/src/main/java/ch/batbern/shared/contract/"
    docs:
      - "docs/architecture/module-map.md"
      - "docs/architecture/ADR-016-service-directions-and-service-to-service-calls.md"
  # Epic 17 entry 7: EMS implements the CUMS-owned Mail Center request contract in the mail center module.
  - source_pattern: "services/event-management-service/src/main/java/ch/batbern/events/mailcenter/InternalRequestConversationController"
    docs:
      - "docs/architecture/module-map.md"
      - "docs/architecture/ADR-016-service-directions-and-service-to-service-calls.md"
  # Epic 17 entry 7b: the holders of the CUMS-owned user-reference contract (profile merge, primary address).
  - source_pattern: "services/event-management-service/src/main/java/ch/batbern/events/usermerge/"
    docs:
      - "docs/architecture/06-backend-architecture.md"
      - "docs/architecture/06b-user-lifecycle-sync.md"
  - source_pattern: "services/partner-coordination-service/src/main/java/ch/batbern/partners/usermerge/"
    docs:
      - "docs/architecture/06-backend-architecture.md"
      - "docs/architecture/06b-user-lifecycle-sync.md"
      - "docs/architecture/module-map.md"
  - source_pattern: "services/company-user-management-service/src/main/java/ch/batbern/companyuser/service/UserMergeService.java"
    docs:
      - "docs/architecture/06-backend-architecture.md"
      - "docs/architecture/06b-user-lifecycle-sync.md"
  # The topic canvas composes partner-coordination and EMS data in the browser (entry 8) instead of
  # EMS calling partner-coordination; moving it back would reopen the EMS→PCS edge.
  - source_pattern: "web-frontend/src/services/blobTopicService.ts"
    docs:
      - "docs/architecture/ADR-016-service-directions-and-service-to-service-calls.md"
      - "docs/api/topics-api.openapi.yml"
  - source_pattern: "docs/api/internal/"
    docs:
      - "docs/architecture/module-map.md"
      - "docs/architecture/coding-standards.md"

  # ── Frontend ─────────────────────────────────────────────────────────────────
  - source_pattern: "web-frontend/src/components/speaker"
    docs:
      - "docs/user-guide/speaker-portal/"
      - "docs/prd/epic-6-speaker-portal-support.md"

  - source_pattern: "web-frontend/src/components/partner"
    docs:
      - "docs/user-guide/partner-portal/"
      - "docs/prd/epic-8-partner-coordination.md"

  - source_pattern: "web-frontend/src/components/event"
    docs:
      - "docs/user-guide/workflow/"
      - "docs/user-guide/entity-management/events.md"
      - "docs/prd/epic-4-public-website-content-discovery.md"

  - source_pattern: "web-frontend/src/components/admin"
    docs:
      - "docs/user-guide/administration/"

  - source_pattern: "web-frontend/src/"
    docs:
      - "docs/user-guide/features/"

  # ── OpenAPI Specs ─────────────────────────────────────────────────────────
  # Changes to API specs are themselves doc changes — flag PRD and user-guide
  - source_pattern: "docs/api/"
    docs:
      - "docs/prd-enhanced.md"

# ── Commit type prefixes that are ALWAYS skipped ────────────────────────────
skip_commit_types:
  - "chore"
  - "test"
  - "docs"
  - "style"
  - "refactor"
  - "build"
  - "ci"

# Only these types are audited
audit_commit_types:
  - "feat"
  - "fix"

# ── Commit scopes that are ALWAYS skipped ────────────────────────────────────
# Scopes that are never business-rule changes — infra wiring, test fixes,
# build tooling, UI polish, code-review cleanup, etc.
skip_commit_scopes:
  - "infra"
  - "test"
  - "tests"
  - "build"
  - "bruno"
  - "review"
  - "presentation"
  - "ci"
  - "security"   # OWASP/ZAP remediations — technical, not user-facing behaviour
  - "auth"       # auth wiring fixes — rarely need PRD/user-guide updates
  - "blob-selector"  # UI animation/interaction — not a business rule
  - "watch"          # WebSocket resilience — technical fix
