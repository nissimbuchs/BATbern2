# Dependabot Configuration for Automated Dependency Updates and Security Scanning
#
# Implements AC11: Dependency Scanning from Story 1.11
#
# This configuration enables GitHub Dependabot to:
# - Automatically check for vulnerable dependencies
# - Create pull requests for security updates
# - Keep dependencies up to date with monthly batched updates
#
# Schedule: Monthly on first Monday at 3:00-4:30 AM
# Automated merge: dependabot-batch-merge.yml workflow runs at 10:00 AM same day
#
# More info: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # Gradle dependencies for API Gateway
  - package-ecosystem: "gradle"
    directory: "/api-gateway"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 3
    groups:
      aws-sdk:
        patterns:
          - "software.amazon.awssdk:*"
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
      testing:
        patterns:
          - "org.junit.*:*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "org.testcontainers:*"
    reviewers:
      - "nissimbuchs"
    labels:
      - "dependencies"
      - "security"
      - "api-gateway"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Gradle dependencies for Shared Kernel
  - package-ecosystem: "gradle"
    directory: "/shared-kernel"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 3
    groups:
      aws-sdk:
        patterns:
          - "software.amazon.awssdk:*"
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
      flyway:
        patterns:
          - "org.flywaydb:*"
          - "org.flywaydb.flyway:*"
      testing:
        patterns:
          - "org.junit.*:*"
          - "org.testcontainers:*"
    reviewers:
      - "nissimbuchs"
    labels:
      - "dependencies"
      - "security"
      - "shared-kernel"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # npm dependencies for Infrastructure (CDK)
  - package-ecosystem: "npm"
    directory: "/infrastructure"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:30"
    open-pull-requests-limit: 3
    groups:
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      aws-cdk:
        patterns:
          - "aws-cdk-lib"
          - "aws-cdk"
          - "constructs"
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "@aws-sdk/*"
    reviewers:
      - "nissimbuchs"
    labels:
      - "dependencies"
      - "security"
      - "infrastructure"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase

  # npm dependencies for Frontend
  - package-ecosystem: "npm"
    directory: "/web-frontend"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 3
    groups:
      vitest-ecosystem:
        patterns:
          - "vitest"
          - "@vitest/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "react-hook-form"
          - "@hookform/*"
      ui-libraries:
        patterns:
          - "@mui/*"
          - "lucide-react"
      build-tools:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "vite"
          - "vite-*"
    reviewers:
      - "nissimbuchs"
    labels:
      - "dependencies"
      - "security"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase
    # Ignore major version updates for React and Material-UI (manual review needed)
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:30"
    open-pull-requests-limit: 3
    reviewers:
      - "nissimbuchs"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # ── Root Gradle build (added 2026-08-10) ────────────────────────────────────
  # build.gradle declares the Spring Boot BOM/plugins AND a `subprojects {
  # dependencies { ... } }` block that supplies the starters every service uses.
  # Without this entry those versions were never proposed for update.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 3
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
      testing:
        patterns:
          - "org.junit.*:*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "org.testcontainers:*"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ── Domain services (added 2026-08-10) ──────────────────────────────────────
  # Four of the five services declare their own dependencies (53 in total) and
  # none were watched: only /api-gateway and /shared-kernel had entries, so the
  # bulk of the backend received no updates at all, security ones included.
  # attendee-experience-service is intentionally absent — its build.gradle
  # declares no dependencies of its own (everything comes from the root
  # subprojects block above). Add an entry here if that ever changes.
  - package-ecosystem: "gradle"
    directory: "/services/event-management-service"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 2
    groups:
      aws-sdk:
        patterns:
          - "software.amazon.awssdk:*"
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
      testing:
        patterns:
          - "org.junit.*:*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "org.testcontainers:*"
    labels:
      - "dependencies"
      - "security"
      - "event-management"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "gradle"
    directory: "/services/company-user-management-service"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 2
    groups:
      aws-sdk:
        patterns:
          - "software.amazon.awssdk:*"
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
      testing:
        patterns:
          - "org.junit.*:*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "org.testcontainers:*"
    labels:
      - "dependencies"
      - "security"
      - "company-user-management"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "gradle"
    directory: "/services/partner-coordination-service"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 2
    groups:
      aws-sdk:
        patterns:
          - "software.amazon.awssdk:*"
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
      testing:
        patterns:
          - "org.junit.*:*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "org.testcontainers:*"
    labels:
      - "dependencies"
      - "security"
      - "partner-coordination"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "gradle"
    directory: "/services/speaker-coordination-service"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 2
    groups:
      testing:
        patterns:
          - "org.junit.*:*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "org.testcontainers:*"
    labels:
      - "dependencies"
      - "security"
      - "speaker-coordination"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # ── Lambda manifests (added 2026-08-10) ─────────────────────────────────────
  # These ship to production and were the most out-of-date manifests in the repo.
  # image-resize is the one that matters most: the CDK Docker bundler runs
  # `npm ci` in THIS directory, so this file — not infrastructure/package.json —
  # decides which sharp binary reaches the image-resize Lambda. Dependabot was
  # bumping the outer test-only copy while the deployed one sat unmanaged.
  - package-ecosystem: "npm"
    directory: "/infrastructure/lib/lambda/image-resize"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:30"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "security"
      - "infrastructure"
      - "lambda"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase
    # sharp majors change the deployed native binary AND its TypeScript shape
    # (0.34 was CJS and callable; 0.35 exposes a namespace with a `default`,
    # which breaks lib/lambda/image-resize/index.ts with TS2349). Those need the
    # handler tests and a deliberate deploy — see issue #883.
    ignore:
      - dependency-name: "sharp"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/infrastructure/lambda/github-issues-integration"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:30"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "security"
      - "infrastructure"
      - "lambda"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase
