# Dependabot Configuration for Automated Dependency Updates and Security Scanning
#
# Implements AC11: Dependency Scanning from Story 1.11
#
# This configuration enables GitHub Dependabot to:
# - Automatically check for vulnerable dependencies
# - Create pull requests for security updates
# - Keep dependencies up to date with monthly batched updates
#
# Schedule: Monthly on first Monday at 3:00-4:30 AM
# Automated merge: dependabot-batch-merge.yml workflow runs at 10:36 AM the same day
#
# ── Why `directories:` (plural) and not one entry per manifest (issue #930) ──
# `groups:` only groups dependencies WITHIN a single update entry. With one entry
# per directory, the same bump in N manifests produces N pull requests no matter
# how the groups are written. On 2026-08-10 that turned 3 logical changes into 9
# PRs: `software.amazon.awssdk:bom -> 2.51.2` became #906/#908/#917/#924,
# `gradle-wrapper -> 9.7.0` became #909/#912/#927, and
# `org.flywaydb:flyway-database-postgresql -> 13.2.0` became #907/#921.
# Security updates already behaved correctly because security grouping spans
# directories — hence #898's "across 3 directories" title.
#
# The single gradle entry below therefore covers every Gradle manifest via
# `directories:`, so one bump is one PR across the whole backend. npm entries stay
# separate on purpose: web-frontend, the CDK app, and the two Lambda packages are
# genuinely different dependency sets with different ignore rules, so collapsing
# them would group unrelated things rather than deduplicate related ones.
#
# More info: https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  # ── All Gradle manifests, one entry (was 7 separate entries; see #930) ───────
  # Covers the root build (Spring Boot BOM/plugins + the `subprojects {
  # dependencies { ... } }` block that supplies every service's starters),
  # api-gateway, shared-kernel, and all domain services.
  #
  # `/services/*` intentionally globs all five services including
  # attendee-experience-service. Its build.gradle currently declares no
  # dependencies of its own, so it contributes nothing today — but the glob means
  # it is covered automatically the moment that changes, which removes the
  # "remember to add an entry" maintenance note this file used to carry.
  - package-ecosystem: "gradle"
    directories:
      - "/"
      - "/api-gateway"
      - "/shared-kernel"
      - "/services/*"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:00"
    # One entry, one limit. Previously 7 entries x 2-3 each allowed up to 20 PRs
    # while every individual entry looked conservative.
    open-pull-requests-limit: 5
    groups:
      # applies-to defaults to version-updates, so WITHOUT this block security
      # updates arrive ungrouped — one PR per advisory, exempt from
      # open-pull-requests-limit. That is how 13 landed at once on 2026-08-10.
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      gradle-wrapper:
        patterns:
          - "gradle-wrapper"
      aws-sdk:
        patterns:
          - "software.amazon.awssdk:*"
          - "com.amazonaws:*"
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework.cloud:*"
      flyway:
        patterns:
          - "org.flywaydb:*"
      logging:
        patterns:
          - "net.logstash.logback:*"
          - "ch.qos.logback:*"
          - "org.slf4j:*"
      caffeine:
        patterns:
          - "com.github.ben-manes.caffeine:*"
      testing:
        patterns:
          - "org.junit.*:*"
          - "org.mockito:*"
          - "org.assertj:*"
          - "org.testcontainers:*"
          - "org.awaitility:*"
          # rest-assured is a test-only library and lives in 3 directories. Ungrouped it
          # produced one PR per directory — see the block below.
          - "io.rest-assured:*"
      # ── Groups added 2026-09-12 to stop ungrouped multi-directory duplicates ──────────
      #
      # `directories` lists "/" alongside "/api-gateway", "/shared-kernel" and "/services/*",
      # and the ROOT settings.gradle is a multi-project build that already includes all of
      # them. So every service build.gradle is in scope twice.
      #
      # For a GROUPED dependency that is harmless: dependabot collapses it into a single
      # "across N directories" PR. For an UNGROUPED one it opens a separate PR per directory
      # context. shedlock produced three PRs for one bump on 2026-09-12 — #1050 spanning both
      # services (the "/" scan), plus #1052 and #1054 for the same two services individually.
      #
      # Removing "/" is NOT the fix: the gradle-wrapper lives at the root and needs it.
      # Grouping is. A sweep of all 8 build.gradle files found 13 ungrouped coordinates
      # present in more than one directory, i.e. 13 future instances of the same defect;
      # the groups below cover all of them.
      shedlock:
        patterns:
          - "net.javacrumbs.shedlock:*"
      resilience4j:
        patterns:
          - "io.github.resilience4j:*"
      jwt:
        patterns:
          - "io.jsonwebtoken:*"
          - "com.auth0:*"
      mail:
        patterns:
          - "jakarta.mail:*"
          - "org.eclipse.angus:*"
      poi:
        patterns:
          - "org.apache.poi:*"
      database-driver:
        patterns:
          - "org.postgresql:*"
      springdoc:
        patterns:
          - "org.springdoc:*"
    reviewers:
      - "nissimbuchs"
    labels:
      - "dependencies"
      - "security"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # npm dependencies for Infrastructure (CDK)
  - package-ecosystem: "npm"
    directory: "/infrastructure"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:30"
    open-pull-requests-limit: 3
    groups:
      # applies-to defaults to version-updates, so WITHOUT this block security
      # updates arrive ungrouped — one PR per advisory, exempt from
      # open-pull-requests-limit. That is how 13 landed at once on 2026-08-10.
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      aws-cdk:
        patterns:
          - "aws-cdk-lib"
          - "aws-cdk"
          - "constructs"
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "@aws-sdk/*"
    ignore:
      # TypeScript 7 is the native (Go) compiler. It deliberately no longer exposes the
      # JavaScript compiler API that ts-jest compiles through, so ts-jest cannot run at all
      # under it — every suite dies with "The TypeScript compiler \"typescript\" (version
      # 7.x) does not expose the JavaScript compiler API required by ts-jest".
      #
      # This is NOT a peer-range quibble that a ts-jest release fixes: 29.4.12 IS the latest
      # ts-jest, its typescript peer is ">=4.3 <7", and the only other dist-tag is
      # 29.0.0-next.1, an older prerelease. ts-jest's own guidance is to install TS7 as
      # `@typescript/native` and alias `@typescript/typescript6` as `typescript`, but
      # `@typescript/native` is NOT PUBLISHED — only `@typescript/native-preview`, as a dated
      # dev build. Measured 2026-09-12: forcing typescript@7.0.2 with --legacy-peer-deps lets
      # `tsc --noEmit` pass but fails 33/33 jest suites, 0 tests run.
      #
      # Dependabot reopened this bump as #1024 and then #1042; both failed CI identically.
      # Revisit when @typescript/native reaches a real release — at which point it is a
      # deliberate repo-wide TypeScript 7 migration, not a dependency bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    reviewers:
      - "nissimbuchs"
    labels:
      - "dependencies"
      - "security"
      - "infrastructure"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase

  # npm dependencies for Frontend
  - package-ecosystem: "npm"
    directory: "/web-frontend"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 3
    groups:
      # applies-to defaults to version-updates, so WITHOUT this block security
      # updates arrive ungrouped — one PR per advisory, exempt from
      # open-pull-requests-limit. That is how 13 landed at once on 2026-08-10.
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      vitest-ecosystem:
        patterns:
          - "vitest"
          - "@vitest/*"
      react-ecosystem:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
          - "react-hook-form"
          - "@hookform/*"
      ui-libraries:
        patterns:
          - "@mui/*"
          - "lucide-react"
      build-tools:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "vite"
          - "vite-*"
    reviewers:
      - "nissimbuchs"
    labels:
      - "dependencies"
      - "security"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase
    # Ignore major version updates for React and Material-UI (manual review needed)
    ignore:
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@mui/*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:30"
    open-pull-requests-limit: 3
    groups:
      # applies-to defaults to version-updates, so WITHOUT this block security
      # updates arrive ungrouped — one PR per advisory, exempt from
      # open-pull-requests-limit. That is how 13 landed at once on 2026-08-10.
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    reviewers:
      - "nissimbuchs"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # ── Lambda manifests (added 2026-08-10) ─────────────────────────────────────
  # These ship to production and were the most out-of-date manifests in the repo.
  # image-resize is the one that matters most: the CDK Docker bundler runs
  # `npm ci` in THIS directory, so this file — not infrastructure/package.json —
  # decides which sharp binary reaches the image-resize Lambda. Dependabot was
  # bumping the outer test-only copy while the deployed one sat unmanaged.
  - package-ecosystem: "npm"
    directory: "/infrastructure/lib/lambda/image-resize"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "03:30"
    open-pull-requests-limit: 2
    groups:
      # applies-to defaults to version-updates, so WITHOUT this block security
      # updates arrive ungrouped — one PR per advisory, exempt from
      # open-pull-requests-limit. That is how 13 landed at once on 2026-08-10.
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"
      - "infrastructure"
      - "lambda"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    versioning-strategy: increase
    # NOTE: the previous `ignore` on sharp majors was removed in #929's follow-up.
    # Its stated reason — that 0.35 breaks index.ts with TS2349 — was real but is
    # fixed: the handler now annotates the one call signature it uses as
    # `SharpFactory` instead of `typeof import('sharp')`, which is stable across
    # sharp's CJS (`export = sharp`, callable) and ESM (namespace + `default`)
    # declaration shapes. Keeping the ignore would have suppressed sharp majors
    # silently — including a major that carries a libvips CVE fix, which is
    # exactly how GHSA-f88m-g3jw-g9cj sat unfixed. A sharp major still changes the
    # deployed @img/* native set and MUST re-bundle through Docker (never hotswap);
    # test/unit/lambda/image-resize.test.ts is what catches a regression.

  # NOTE (#928, resolved): there is deliberately NO entry for
  # /infrastructure/lambda/github-issues-integration. That directory's
  # package.json was deleted rather than updated, because it never governed what
  # the deployed Lambda bundles — NodejsFunction resolves `index.ts` from the
  # hoisted infrastructure/node_modules, where all four of its declared
  # dependencies already live at newer versions. It had no lockfile, so
  # `npm audit` could not read it either, and Dependabot was proposing updates to
  # a file with no effect (#938, #941 — both closed as moot). The Lambda's
  # dependencies are declared in infrastructure/package.json and watched by the
  # /infrastructure entry above. Do not re-add an entry here unless that
  # directory regains a real, bundling-relevant manifest AND a lockfile.
