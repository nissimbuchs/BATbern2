name: Verify Documentation Versions

# Verifies that docs/versions.json still matches the actual dependency files.
#
# It used to DO the sync: it ran the generator and committed the result — pushing to the
# contributor's branch on a pull_request, or opening a PR on a push to develop/main. That shape
# was wrong for what this file guards, and it cost more than it saved (#991).
#
# Why a check and not a commit:
#
#   * Nothing consumes docs/versions.json programmatically. No code reads it. Three documents
#     cite it ("see versions.json for exact versions" — docs/architecture/index.md:93-99,
#     tech-stack.md:5), so its single requirement is being CORRECT. Correctness of a checked-in
#     generated file is enforced by a check that fails, not by a bot that rewrites branches.
#
#   * The bot push was actively harmful. It landed as github-actions[bot] on a human's PR
#     branch, which re-triggered every pull_request workflow, and those re-runs land at
#     `action_required` under this repo's approval policy. The required checks then attach to a
#     sha whose runs never start, so the PR sits MERGEABLE + BLOCKED with `gh pr checks` showing
#     almost nothing. That is the same mechanism that has always stalled Dependabot PRs here;
#     it was never Dependabot-specific.
#
#   * The commits it pushed were usually empty of meaning. The generator stamps lastUpdated with
#     today's date and the old comparison treated that as drift, so any run on a later day than
#     the file's own date produced a commit whose entire diff was the date. Fixed in
#     scripts/update-versions.js (NON_VERSION_KEYS) and pinned by
#     scripts/update-versions.test.mjs.
#
#   * The trigger never matched its own comment. It said "Trigger on Dependabot PRs" but carried
#     no actor condition, so it fired on every PR touching a dependency manifest.
#
# The fix for a failure here is one command, which the script prints:
#   node scripts/update-versions.js && git add docs/versions.json
#
# `--check` has existed in that script since it was written and had never been wired up,
# because the lastUpdated bug would have made it fail every day regardless of real drift.

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'web-frontend/package.json'
      - 'api-gateway/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'infrastructure/package.json'
      - 'docs/versions.json'
      - 'scripts/update-versions.js'

  push:
    branches:
      - develop
      - main
    paths:
      - 'web-frontend/package.json'
      - 'api-gateway/build.gradle'
      - 'build.gradle'
      - 'settings.gradle'
      - 'infrastructure/package.json'
      - 'docs/versions.json'
      - 'scripts/update-versions.js'

  workflow_dispatch:

# Read-only. This workflow no longer writes anything, anywhere — that is the point of the
# change, and the permissions are the half of it that does not depend on the steps staying
# well-behaved.
permissions:
  contents: read

jobs:
  verify-versions:
    name: Verify versions.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The generator's own logic is now load-bearing for the check, so it gets tested. Uses
      # node:test, no dependencies, no install step.
      - name: Test the version extractor
        run: node --test scripts/update-versions.test.mjs

      - name: Verify versions.json matches the dependency files
        run: |
          if node scripts/update-versions.js --check; then
            echo "✅ docs/versions.json matches the dependency files"
          else
            {
              echo "### ❌ docs/versions.json has drifted"
              echo ""
              echo "A dependency version changed but the generated file was not regenerated."
              echo ""
              echo '```bash'
              echo "node scripts/update-versions.js && git add docs/versions.json"
              echo '```'
              echo ""
              echo "Commit that alongside the dependency change. This workflow deliberately"
              echo "does not commit it for you — see the comment at the top of"
              echo ".github/workflows/sync-versions.yml (#991)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
