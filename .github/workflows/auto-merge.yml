name: Auto-Merge PR

# Automatically merge PRs to develop when all checks pass
# PRs to main require manual approval for production safety

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  check_suite:
    types:
      - completed
  pull_request_review:
    types:
      - submitted

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only run on PRs to develop (main requires manual approval), and NEVER for
    # Dependabot.
    #
    # Why the actor guard: merging to `develop` IS a production release, and
    # build.yml already refuses to deploy Dependabot's PRs for exactly that
    # reason (`github.actor != 'dependabot[bot]'` on deploy-to-staging). This
    # workflow had no such guard — its only condition was the base branch — so
    # Dependabot PRs could not deploy as a PR but COULD merge themselves, and a
    # merge to develop is what actually ships. That asymmetry is how #932, #933
    # and #935 landed on the production branch unreviewed on 2026-08-10, and why
    # #929's 13 advisories had to be parked as drafts by hand to stop 13
    # unattended releases (draft is the only thing `gh pr merge --auto` refuses).
    #
    # Dependabot PRs still open, still build, still run every check. A human
    # merges them — ideally as one batch per month, since N merges are N
    # releases. See #900, #930.
    if: >-
      github.event.pull_request.base.ref == 'develop' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
      - name: Auto-merge all feature branches
        id: should-automerge
        run: |
          echo "should_merge=true" >> $GITHUB_OUTPUT
          echo "reason=All feature branches auto-merge when tests pass" >> $GITHUB_OUTPUT
          echo "PR #${{ github.event.pull_request.number }} will auto-merge when all checks pass"

      - name: Wait for required checks
        if: steps.should-automerge.outputs.should_merge == 'true'
        uses: lewagon/wait-on-check-action@369769072fe522a3a8a85c03c96af1e5242a1994 # v1.9.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          # Wait for these required checks to complete
          running-workflow-name: 'auto-merge'
          allowed-conclusions: success,skipped
          # Ignore non-blocking checks:
          # - CodeQL App (we use custom CodeQL workflow instead)
          # - SonarCloud Code Analysis (advisory only, not blocking)
          check-regexp: '^(?!CodeQL$|SonarCloud Code Analysis$).*'

      - name: Enable auto-merge
        if: steps.should-automerge.outputs.should_merge == 'true'
        run: |
          echo "Enabling auto-merge for PR #${{ github.event.pull_request.number }}"
          echo "Reason: ${{ steps.should-automerge.outputs.reason }}"

          # Determine if we should delete the branch
          # Never delete long-lived branches (develop, main)
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          DELETE_BRANCH_FLAG=""

          if [[ "$SOURCE_BRANCH" != "develop" && "$SOURCE_BRANCH" != "main" ]]; then
            DELETE_BRANCH_FLAG="--delete-branch"
            echo "Will delete branch '$SOURCE_BRANCH' after merge (feature branch)"
          else
            echo "Will preserve branch '$SOURCE_BRANCH' after merge (long-lived branch)"
          fi

          gh pr merge ${{ github.event.pull_request.number }} \
            --auto \
            --squash \
            $DELETE_BRANCH_FLAG \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── #976: surface the silent BEHIND stall ────────────────────────────────
      #
      # The failure this exists for: with two PRs to `develop` open at once, the SECOND one
      # passes everything and then stops, with nothing reporting it. Observed with #972/#974
      # on 2026-08-18 — 20/20 checks green, auto-merge armed at 12:28, and it simply never
      # fired.
      #
      # Mechanism: `concurrency: deploy-staging` serialises deploys, so B's deploy cannot
      # start until A's finishes; by the time B's deploy passes, A has merged and moved
      # `develop` forward. B is now exactly one commit behind, and develop's protection has
      # `strict: true` (verified: 8 required contexts, strict true, 0 required reviews), which
      # refuses a stale merge. GitHub's auto-merge does NOT update the branch on its own, so
      # it sits armed indefinitely. Both mechanisms are individually correct and jointly
      # self-defeating. Of N queued PRs, N-1 end up here after each merge.
      #
      # WHY THIS ONLY REPORTS, AND DOES NOT RUN `gh pr update-branch`:
      #
      # Updating the branch here would strand the PR worse than leaving it. The update-branch
      # API commits as the GITHUB_TOKEN identity, and GitHub suppresses workflow runs for
      # events generated by GITHUB_TOKEN — so the new head SHA would carry NO results for the
      # 8 required contexts. `mergeStateStatus` would go BEHIND -> BLOCKED, auto-merge would
      # stay armed just as silently, and the branch would have an extra merge commit on top.
      # Re-triggering the checks needs a PAT (the same recursion guard blocks
      # `gh workflow run` with GITHUB_TOKEN), and this repo has no PAT secret — verified:
      # the only tokens in any workflow are GITHUB_TOKEN and CLAUDE_CODE_OAUTH_TOKEN.
      #
      # So the honest fix with the primitives actually available is to destroy the SILENCE,
      # which #976 names as the worst property ("No failed check, no notification.
      # `gh pr checks` is all green. The only signal is mergeStateStatus=BEHIND, which nothing
      # surfaces."). A human then runs one command. Full automation needs either a PAT or a
      # merge queue (#976 option 2); both are decisions, not config lines, and are left open
      # on the issue.
      - name: Detect BEHIND stall and make it loud
        if: steps.should-automerge.outputs.should_merge == 'true'
        id: behind-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail

          # GitHub computes mergeability asynchronously and reports UNKNOWN until it settles.
          # Poll rather than read once — a single read right after arming auto-merge usually
          # returns UNKNOWN, which would make this check useless exactly when it matters.
          STATE="UNKNOWN"
          for attempt in $(seq 1 12); do
            STATE=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" \
                      --json mergeStateStatus --jq .mergeStateStatus 2>/dev/null || echo "UNKNOWN")
            if [ "$STATE" != "UNKNOWN" ]; then
              break
            fi
            echo "mergeStateStatus=UNKNOWN (attempt $attempt/12), waiting 5s..."
            sleep 5
          done

          echo "mergeStateStatus=$STATE"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"

          if [ "$STATE" = "BEHIND" ]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
            echo "::warning title=PR is BEHIND develop — auto-merge is armed but will NEVER fire::All checks pass, but develop has moved on and branch protection is strict. Recover with: gh pr update-branch $PR_NUMBER"
            {
              echo "## :rotating_light: This PR is stalled (#976)"
              echo ""
              echo "\`mergeStateStatus = BEHIND\`. Every check passes and auto-merge is armed,"
              echo "but \`develop\` moved forward while this PR's deploy was queued behind another"
              echo "PR's, and \`strict: true\` refuses a stale merge. **Nothing will happen until"
              echo "someone updates the branch.**"
              echo ""
              echo '```bash'
              echo "gh pr update-branch $PR_NUMBER"
              echo '```'
              echo ""
              echo "That costs a full rebuild and another production deploy of already-deployed"
              echo "content. See #976 for why this is not automated here."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "behind=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment the stall onto the PR
        if: steps.behind-check.outputs.behind == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            // Marker keeps this idempotent. auto-merge.yml runs on every check_suite
            // completion, so without it a stalled PR would collect one identical comment per
            // completed suite — turning a fix for silence into a fix for quiet.
            const MARKER = '<!-- behind-stall-976 -->';
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            if (comments.some((c) => c.body && c.body.includes(MARKER))) {
              core.info('Stall comment already present — not repeating it.');
              return;
            }
            const n = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                MARKER,
                '🚨 **This PR is stalled and will not merge on its own.**',
                '',
                '`mergeStateStatus = BEHIND`: all checks pass and auto-merge is armed, but',
                '`develop` advanced while this PR\'s deploy sat behind another PR\'s in the',
                '`deploy-staging` concurrency group. Branch protection is `strict: true`, so a',
                'stale branch cannot merge, and GitHub\'s auto-merge does not update it.',
                '',
                'Recover with:',
                '',
                '```bash',
                `gh pr update-branch ${n}`,
                '```',
                '',
                'Then wait for the rebuild — note that this re-deploys to production content',
                'that is already deployed.',
                '',
                'Why this is reported rather than fixed automatically: `update-branch` commits',
                'as `GITHUB_TOKEN`, and GitHub suppresses workflow runs for GITHUB_TOKEN-',
                'generated events, so the required checks would never run on the new head and',
                'the PR would stall again with less to show for it. Automating this needs a PAT',
                'or a merge queue — see #976.',
              ].join('\n'),
            });

      - name: Comment on PR
        if: steps.should-automerge.outputs.should_merge == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const sourceBranch = context.payload.pull_request.head.ref;
            const isLongLivedBranch = sourceBranch === 'develop' || sourceBranch === 'main';
            const branchDeletionNote = isLongLivedBranch
              ? `🔒 Branch \`${sourceBranch}\` will be preserved (long-lived branch)`
              : `🗑️ Branch \`${sourceBranch}\` will be deleted after merge`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Auto-merge enabled**\n\nThis PR will be automatically merged when all required checks pass.\n\n✅ All tests must pass\n✅ All required workflows must complete successfully\n${branchDeletionNote}`
            })
