name: Auto-Merge PR

# Automatically merge PRs to develop when all checks pass
# PRs to main require manual approval for production safety

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  check_suite:
    types:
      - completed
  pull_request_review:
    types:
      - submitted

concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only run on PRs to develop (main requires manual approval), and NEVER for
    # Dependabot.
    #
    # Why the actor guard: merging to `develop` IS a production release, and
    # build.yml already refuses to deploy Dependabot's PRs for exactly that
    # reason (`github.actor != 'dependabot[bot]'` on deploy-to-staging). This
    # workflow had no such guard — its only condition was the base branch — so
    # Dependabot PRs could not deploy as a PR but COULD merge themselves, and a
    # merge to develop is what actually ships. That asymmetry is how #932, #933
    # and #935 landed on the production branch unreviewed on 2026-08-10, and why
    # #929's 13 advisories had to be parked as drafts by hand to stop 13
    # unattended releases (draft is the only thing `gh pr merge --auto` refuses).
    #
    # Dependabot PRs still open, still build, still run every check. A human
    # merges them — ideally as one batch per month, since N merges are N
    # releases. See #900, #930.
    if: >-
      github.event.pull_request.base.ref == 'develop' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'

    steps:
      - name: Auto-merge all feature branches
        id: should-automerge
        run: |
          echo "should_merge=true" >> $GITHUB_OUTPUT
          echo "reason=All feature branches auto-merge when tests pass" >> $GITHUB_OUTPUT
          echo "PR #${{ github.event.pull_request.number }} will auto-merge when all checks pass"

      - name: Wait for required checks
        if: steps.should-automerge.outputs.should_merge == 'true'
        uses: lewagon/wait-on-check-action@9312864dfbc9fd208e9c0417843430751c042800 # v1.7.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          # Wait for these required checks to complete
          running-workflow-name: 'auto-merge'
          allowed-conclusions: success,skipped
          # Ignore non-blocking checks:
          # - CodeQL App (we use custom CodeQL workflow instead)
          # - SonarCloud Code Analysis (advisory only, not blocking)
          check-regexp: '^(?!CodeQL$|SonarCloud Code Analysis$).*'

      - name: Enable auto-merge
        if: steps.should-automerge.outputs.should_merge == 'true'
        run: |
          echo "Enabling auto-merge for PR #${{ github.event.pull_request.number }}"
          echo "Reason: ${{ steps.should-automerge.outputs.reason }}"

          # Determine if we should delete the branch
          # Never delete long-lived branches (develop, main)
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          DELETE_BRANCH_FLAG=""

          if [[ "$SOURCE_BRANCH" != "develop" && "$SOURCE_BRANCH" != "main" ]]; then
            DELETE_BRANCH_FLAG="--delete-branch"
            echo "Will delete branch '$SOURCE_BRANCH' after merge (feature branch)"
          else
            echo "Will preserve branch '$SOURCE_BRANCH' after merge (long-lived branch)"
          fi

          gh pr merge ${{ github.event.pull_request.number }} \
            --auto \
            --squash \
            $DELETE_BRANCH_FLAG \
            --repo ${{ github.repository }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        if: steps.should-automerge.outputs.should_merge == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const sourceBranch = context.payload.pull_request.head.ref;
            const isLongLivedBranch = sourceBranch === 'develop' || sourceBranch === 'main';
            const branchDeletionNote = isLongLivedBranch
              ? `🔒 Branch \`${sourceBranch}\` will be preserved (long-lived branch)`
              : `🗑️ Branch \`${sourceBranch}\` will be deleted after merge`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Auto-merge enabled**\n\nThis PR will be automatically merged when all required checks pass.\n\n✅ All tests must pass\n✅ All required workflows must complete successfully\n${branchDeletionNote}`
            })
