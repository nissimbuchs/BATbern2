# Re-enabled 2026-08-23 (#986). Disabled on 2026-05-25 by 9f21453f alongside build-reports
# and SonarCloud. It is back because the CloudWatch alarm -> GitHub issue pipeline now hands
# off to it: batbern-{env}-github-issues appends an '@claude' triage block to every alarm
# issue it opens, and the `issues: opened` trigger below is what picks that up.
#
# READ THE PERMISSIONS BLOCK BEFORE WIDENING IT. `contents` is deliberately `read`. In this
# repository a pull request against `develop` invokes deploy-staging.yml and ships that branch
# to www.batbern.ch - unmerged, unreviewed, drafts included. Granting `contents: write` here
# would let an agent responding to a CloudWatch metric push a branch and open a PR, i.e.
# perform an unreviewed production deploy in response to a monitoring signal. The triage
# prompt also says not to; this is the half that does not depend on the model complying.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # WHO may invoke Claude, and only then WHAT invokes it.
    #
    # #1002: this repository is PUBLIC and the trigger below is `issue_comment`, so before this
    # gate existed *any* GitHub account on earth could start a run by writing '@claude' in a
    # comment — spending the CLAUDE_CODE_OAUTH_TOKEN quota and, more importantly, standing in
    # the way of ever granting this workflow an AWS role. There was no actor check at all.
    #
    # Two independent ways to pass:
    #   1. an explicit login in the CLAUDE_ALLOWED_ACTORS repo variable (comma-separated, no
    #      spaces, CASE-SENSITIVE — GitHub expressions have no lowercase function, so these must
    #      be the canonical logins), or
    #   2. OWNER / COLLABORATOR on this repo, which self-maintains as people are added.
    #
    # `format(',{0},', …)` wraps both sides in sentinel commas so 'Dani' cannot match
    # 'Danikbek', and so an unset or malformed variable degrades to "nobody is allowed" rather
    # than throwing a parse error the way fromJSON would. NOTE THE CONSEQUENCE: deleting
    # CLAUDE_ALLOWED_ACTORS does not open the gate, it narrows it to OWNER/COLLABORATOR. That is
    # deliberate — this fails closed.
    #
    # MEMBER is absent on purpose: BATbern2 is owned by a User, not an organisation, so the
    # MEMBER association can never occur here. OWNER and COLLABORATOR are the only real values.
    #
    # The `||` chain is ordered comment -> review -> issue deliberately. On an `issue_comment`
    # event BOTH github.event.comment.author_association and github.event.issue.author_association
    # exist, and the one that matters is the COMMENTER's, not the issue author's.
    #
    # The alarm -> issue -> triage handoff is unaffected: batbern-{env}-github-issues posts with
    # a PAT and therefore authors its issues as `nissimbuchs` (verified on #993/#994,
    # author_association=OWNER), so it passes on both branches. It is not a bot account and needs
    # no entry of its own.
    if: >-
      (
        contains(format(',{0},', vars.CLAUDE_ALLOWED_ACTORS), format(',{0},', github.actor)) ||
        contains(fromJSON('["OWNER","COLLABORATOR"]'),
                 github.event.comment.author_association ||
                 github.event.review.author_association ||
                 github.event.issue.author_association)
      ) && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      # read, NOT write - see the note at the top of this file. This is the control that
      # makes "do not open a pull request" an invariant rather than an instruction: without
      # contents: write there is no branch to open one from.
      contents: read
      # write, so Claude can reply on the issue or PR it was called into. Harmless without
      # contents: write - a PR still needs a pushed branch.
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          
          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # #996: on the first real alarm triage (#993, #994) every Bash command came back
          # "This command requires approval" — there is no human in a schedule/webhook run to
          # grant it — so the agent could not query anything and its conclusions were inference
          # from repo code alone. This grants a READ-ONLY GitHub allowlist so it can at least
          # correlate an alarm against CI history.
          #
          # Verbs are enumerated, never `Bash(gh:*)`: that would include `gh pr merge`,
          # `gh release create`, `gh secret set`, and `gh workflow run`. An agent reacting to a
          # CloudWatch metric must not be able to merge, release, or start a workflow.
          #
          # DELIBERATELY ABSENT: AWS. The triage prompt asks the agent to read CloudWatch metrics
          # and ECS log groups, and it still cannot — that needs both an allowlist and an OIDC
          # role, and the log groups contain request paths and user identifiers. Granting an
          # autonomous agent read access to production logs is a data-access decision with GDPR
          # exposure, not a workflow tweak, so it is left for an explicit sign-off. Until then a
          # triage run is enriched instead by the metric table the github-issues Lambda now
          # embeds in the issue body (#996), which needs no agent credentials at all.
          claude_args: >-
            --allowed-tools
            Bash(gh run list:*),Bash(gh run view:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh issue list:*)

