name: Security Scan (OWASP ZAP)

# OWASP ZAP dynamic security scanning (DAST) against the staging environment.
#
# Coverage:
#   - API scan: active scan of 5 core REST APIs using their OpenAPI specs
#   - Frontend scan: baseline (passive) scan of the React SPA
#
# Triggers:
#   - Manual:  GitHub Actions UI → "Run workflow"
#   - Weekly:  Mondays at 03:00 UTC (off-peak, staging environment)
#
# Reports:
#   - HTML artifact (retained 30 days) — downloadable from the Actions run page
#   - GitHub Issue created automatically if HIGH/MEDIUM findings are detected
#
# Tightening over time:
#   - After the first clean run, add explicit FAIL rules to .zap/rules.tsv
#     for any finding categories that should block CI.
#   - Consider adding SARIF upload (github/codeql-action/upload-sarif) once
#     GitHub Advanced Security is enabled for the repo.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
  schedule:
    # Every Monday at 02:42 UTC — off the top of the hour (':00' crons get delayed by GitHub),
    # and de-collided from the nightly-e2e schedule.
    - cron: '42 2 * * 1'

env:
  API_BASE_URL: https://api.batbern.ch
  FRONTEND_URL: https://www.batbern.ch

jobs:
  # ═══════════════════════════════════════════════════════════════
  # API SCANS — one job per core API spec (active scan)
  # ═══════════════════════════════════════════════════════════════
  zap-api-scan:
    name: ZAP API — ${{ matrix.api }}
    runs-on: ubuntu-latest
    continue-on-error: true   # findings reported, never block the pipeline
    strategy:
      fail-fast: false         # run all APIs even if one fails
      matrix:
        include:
          - api: events-core
            spec: docs/api/events-core-api.openapi.yml
          - api: event-sessions
            spec: docs/api/event-sessions-api.openapi.yml
          - api: event-speakers
            spec: docs/api/event-speakers-api.openapi.yml
          - api: event-registrations
            spec: docs/api/event-registrations-api.openapi.yml
          - api: event-newsletter
            spec: docs/api/event-newsletter-api.openapi.yml
          - api: event-media
            spec: docs/api/event-media-api.openapi.yml
          - api: event-ai
            spec: docs/api/event-ai-api.openapi.yml
          - api: event-analytics
            spec: docs/api/event-analytics-api.openapi.yml
          - api: event-watch
            spec: docs/api/event-watch-api.openapi.yml
          - api: companies
            spec: docs/api/companies-api.openapi.yml
          - api: speakers
            spec: docs/api/speakers-api.openapi.yml
          - api: partners
            spec: docs/api/partners-api.openapi.yml
          - api: attendees
            spec: docs/api/attendees-api.openapi.yml

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: ZAP API Scan — ${{ matrix.api }}
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          # Pass the OpenAPI spec as a file path inside the Docker workspace mount.
          # The action mounts GITHUB_WORKSPACE at /zap/wrk/, so the spec is accessible
          # at /zap/wrk/<spec-path>. ZAP reads the spec, then actively scans the server
          # URL declared inside the spec (https://api.batbern.ch).
          target: /zap/wrk/${{ matrix.spec }}
          format: openapi
          rules_file_name: '.zap/rules.tsv'
          # -a  include alpha passive scan rules
          # -I  do not return failure on warnings (we use rules.tsv for that)
          cmd_options: '-a -I'
          issue_title: 'ZAP Security Findings — ${{ matrix.api }} API'
          # Unique artifact name per matrix job — prevents naming collision between
          # the 5 parallel jobs (default is 'zap_scan' for all jobs)
          artifact_name: zap-api-${{ matrix.api }}

      # ── Collapse duplicate ZAP issues (#905) ─────────────────────────────────
      #
      # zaproxy/action-*@v0.10.0 is SUPPOSED to update an existing open issue whose title
      # matches `issue_title`. Its dedup is broken upstream and cannot be fixed by anything
      # we configure. It builds the lookup as:
      #
      #   q: encodeURI(`is:issue state:open repo:${owner}/${repo} ${issueTitle}`)
      #        .replace(/%20/g, "+")
      #
      # then hands that already-encoded string to octokit, which encodes it AGAIN. Verified
      # against GitHub search on 2026-08-12 — only the un-encoded form matches:
      #
      #   "is:issue state:open repo:… <title>"        → 1 result   ✅
      #   "is:issue+state:open+repo:…+<title>"        → 0 results  ❌  (what the action sends)
      #   spaces + "%E2%80%94" for the em dash       → 0 results  ❌
      #
      # The `+` separators alone are fatal, independent of the em dash in our titles, so the
      # search returns nothing every run, `items.length === 0`, and a brand-new issue is
      # filed each Monday. Six accumulated for events-core between 2026-07-06 and 08-10.
      #
      # Until upstream is fixed we let it file, then collapse: keep the newest open issue per
      # title and close the older ones pointing at it. So there is always exactly ONE live
      # issue per API — a record that stays readable instead of six nobody reads.
      #
      # Deliberately uses the REST issues list + an exact title match rather than the search
      # API: search is the thing that is unreliable here (it is also eventually consistent,
      # so a just-created issue may not be indexed yet). REST is immediate and exact.
      - name: Collapse duplicate ZAP issues — ${{ matrix.api }}
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: 'ZAP Security Findings — ${{ matrix.api }} API'
        run: |
          set -euo pipefail

          # Newest first. Exact title match, and only issues the bot itself filed.
          numbers=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.title == env.ISSUE_TITLE)
                      | select(.user.login == "github-actions[bot]")
                      | .number' | sort -rn)

          count=$(printf '%s' "$numbers" | grep -c . || true)
          echo "Open issues titled \"$ISSUE_TITLE\": $count"
          if [ "$count" -le 1 ]; then
            echo "Nothing to collapse."
            exit 0
          fi

          keep=$(printf '%s\n' "$numbers" | head -1)
          echo "Keeping #$keep as the live issue."

          printf '%s\n' "$numbers" | tail -n +2 | while read -r n; do
            [ -n "$n" ] || continue
            echo "Closing duplicate #$n"
            gh issue close "$n" \
              --comment "Superseded by #${keep} — the current ZAP findings for this API. Closed automatically so exactly one issue stays live per API; the scan action re-files instead of updating because its dedup lookup is broken upstream (see #905)." \
              || echo "::warning::Could not close #$n"
          done

      - name: Stage JSON + log reports for projectdoc — ${{ matrix.api }}
        if: always()
        run: |
          mkdir -p zap-json-stage zap-json-stage/zap-logs
          cp report_json.json "zap-json-stage/zap-${{ matrix.api }}.json" 2>/dev/null || true
          # The ZAP action writes the console log to zap.out
          cp zap.out "zap-json-stage/zap-logs/zap-${{ matrix.api }}.log" 2>/dev/null || true

      - name: Upload HTML report — ${{ matrix.api }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-api-report-${{ matrix.api }}
          path: report_html.html
          retention-days: 30

      - name: Upload JSON report — ${{ matrix.api }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-json-${{ matrix.api }}
          path: zap-json-stage/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # FRONTEND SCAN — passive baseline scan of the React SPA
  # ═══════════════════════════════════════════════════════════════
  zap-frontend-scan:
    name: ZAP Frontend Baseline
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: ZAP Baseline Scan — Frontend
        uses: zaproxy/action-baseline@v0.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          target: ${{ env.FRONTEND_URL }}
          rules_file_name: '.zap/rules.tsv'
          # -a   include alpha passive scan rules
          # -I   do not return failure on warnings
          # --autooff  disable automation framework (avoids report path issues)
          cmd_options: '-a -I --autooff'
          issue_title: 'ZAP Security Findings — Frontend'
          artifact_name: zap-frontend-baseline

      # ── Collapse duplicate ZAP issues (#905) ─────────────────────────────────
      #
      # zaproxy/action-*@v0.10.0 is SUPPOSED to update an existing open issue whose title
      # matches `issue_title`. Its dedup is broken upstream and cannot be fixed by anything
      # we configure. It builds the lookup as:
      #
      #   q: encodeURI(`is:issue state:open repo:${owner}/${repo} ${issueTitle}`)
      #        .replace(/%20/g, "+")
      #
      # then hands that already-encoded string to octokit, which encodes it AGAIN. Verified
      # against GitHub search on 2026-08-12 — only the un-encoded form matches:
      #
      #   "is:issue state:open repo:… <title>"        → 1 result   ✅
      #   "is:issue+state:open+repo:…+<title>"        → 0 results  ❌  (what the action sends)
      #   spaces + "%E2%80%94" for the em dash       → 0 results  ❌
      #
      # The `+` separators alone are fatal, independent of the em dash in our titles, so the
      # search returns nothing every run, `items.length === 0`, and a brand-new issue is
      # filed each Monday. Six accumulated for events-core between 2026-07-06 and 08-10.
      #
      # Until upstream is fixed we let it file, then collapse: keep the newest open issue per
      # title and close the older ones pointing at it. So there is always exactly ONE live
      # issue per API — a record that stays readable instead of six nobody reads.
      #
      # Deliberately uses the REST issues list + an exact title match rather than the search
      # API: search is the thing that is unreliable here (it is also eventually consistent,
      # so a just-created issue may not be indexed yet). REST is immediate and exact.
      - name: Collapse duplicate ZAP issues — Frontend
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: 'ZAP Security Findings — Frontend'
        run: |
          set -euo pipefail

          # Newest first. Exact title match, and only issues the bot itself filed.
          numbers=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            --jq '.[] | select(.title == env.ISSUE_TITLE)
                      | select(.user.login == "github-actions[bot]")
                      | .number' | sort -rn)

          count=$(printf '%s' "$numbers" | grep -c . || true)
          echo "Open issues titled \"$ISSUE_TITLE\": $count"
          if [ "$count" -le 1 ]; then
            echo "Nothing to collapse."
            exit 0
          fi

          keep=$(printf '%s\n' "$numbers" | head -1)
          echo "Keeping #$keep as the live issue."

          printf '%s\n' "$numbers" | tail -n +2 | while read -r n; do
            [ -n "$n" ] || continue
            echo "Closing duplicate #$n"
            gh issue close "$n" \
              --comment "Superseded by #${keep} — the current ZAP findings for this API. Closed automatically so exactly one issue stays live per API; the scan action re-files instead of updating because its dedup lookup is broken upstream (see #905)." \
              || echo "::warning::Could not close #$n"
          done

      - name: Stage JSON + log reports for projectdoc — frontend
        if: always()
        run: |
          mkdir -p zap-json-stage zap-json-stage/zap-logs
          cp report_json.json "zap-json-stage/zap-frontend.json" 2>/dev/null || true
          cp zap.out "zap-json-stage/zap-logs/zap-frontend.log" 2>/dev/null || true

      - name: Upload HTML report — frontend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-frontend-report
          path: report_html.html
          retention-days: 30

      - name: Upload JSON report — frontend
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-json-frontend
          path: zap-json-stage/
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # SUMMARY — aggregate status + publish combined JSON artifact
  # ═══════════════════════════════════════════════════════════════
  security-scan-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [zap-api-scan, zap-frontend-scan]
    if: always()

    steps:
      - name: Download all ZAP JSON reports
        uses: actions/download-artifact@v8
        with:
          pattern: zap-json-*
          merge-multiple: true
          path: security-reports/
        continue-on-error: true

      - name: Upload combined ZAP JSON reports (for projectdoc)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-reports
          path: security-reports/
          retention-days: 30

      - name: Print summary
        run: |
          echo "## OWASP ZAP Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Scans (events, companies, speakers, partners, attendees) | ${{ needs.zap-api-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Baseline | ${{ needs.zap-frontend-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reports**: Download HTML artifacts from this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "**Projectdoc**: Combined JSON artifact \`zap-reports\` ready for dashboard." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**False positive tuning**: Edit \`.zap/rules.tsv\` to suppress known FPs." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Target: ${{ env.API_BASE_URL }} / ${{ env.FRONTEND_URL }}" >> $GITHUB_STEP_SUMMARY
