pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }

    plugins {
        // Changing this file (or root build.gradle / the wrapper) redeploys ALL services:
        // deploy-staging.yml treats root Gradle files as all-services (fix after #1230).
        id 'org.springframework.boot' version '4.0.9'
        id 'io.spring.dependency-management' version '1.1.7'
        id 'org.flywaydb.flyway' version '11.18.0'
        id 'org.openapi.generator' version '7.14.0'
    }
}

rootProject.name = 'BATbern-Platform'

// Foundation
include 'shared-kernel'

// API Gateway
include 'api-gateway'

// Domain Services
include 'services:event-management-service'
include 'services:partner-coordination-service'
include 'services:company-user-management-service'
