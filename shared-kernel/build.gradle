buildscript {
    dependencies {
        // Flyway PostgreSQL database plugin required for Flyway 11.x
        classpath 'org.flywaydb:flyway-database-postgresql:12.5.0'
    }
}

plugins {
    id 'java-library'
    id 'java-test-fixtures'
    id 'org.springframework.boot' // Version from root buildscript (needs bootJar task)
    id 'io.spring.dependency-management' // Version from root buildscript
    id 'maven-publish'
    id 'jacoco'
    id 'checkstyle'
    id 'org.flywaydb.flyway' // Version from root buildscript
}

group = 'ch.batbern'
version = '1.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot dependencies
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    // Epic 13 (SB4): spring-boot-starter-aop was removed in SB4. Spring AOP proxy infra comes
    // transitively via spring-boot-starter (spring-context); AuditLoggingAspect's @Aspect/@Around
    // annotations need aspectjweaver directly (BOM-managed version).
    implementation 'org.aspectj:aspectjweaver'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Epic 13 (SB4): keep Jackson 2 (com.fasterxml) for shared-kernel's ObjectMapper/JsonNode
    // usage so its compiled bytecode stays binary-compatible during the migration. BOM-managed.
    implementation 'org.springframework.boot:spring-boot-jackson2'

    // AWS SDK for EventBridge, CloudWatch, Cognito, and SES
    implementation platform('software.amazon.awssdk:bom:2.43.2')
    implementation 'software.amazon.awssdk:eventbridge'
    implementation 'software.amazon.awssdk:cloudwatch'
    implementation 'software.amazon.awssdk:cognitoidentityprovider'
    implementation 'software.amazon.awssdk:ses' // Email service (Story 2.2a Task B12)
    implementation 'software.amazon.awssdk:sts' // STS for role assumption in local dev

    // Resilience4j for circuit breaker, bulkhead, and retry patterns
    // Epic 13 (SB4): the Spring Boot integration module is renamed -spring-boot3 -> -spring-boot4.
    implementation 'io.github.resilience4j:resilience4j-spring-boot4:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-bulkhead:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-retry:2.4.0'
    implementation 'io.github.resilience4j:resilience4j-reactor:2.4.0'

    // ThreadFactoryBuilder for bounded thread pools
    implementation 'com.google.guava:guava:33.6.0-jre'

    // Jakarta Mail for email MIME message creation (Story 2.2a Task B12)
    implementation 'org.eclipse.angus:angus-mail:2.0.3'
    implementation 'jakarta.mail:jakarta.mail-api:2.1.3'

    // Lombok for boilerplate reduction
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Jackson for JSON serialization
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Logging
    implementation 'org.slf4j:slf4j-api'
    implementation 'ch.qos.logback:logback-classic'

    // Database
    implementation 'org.postgresql:postgresql:42.7.11'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Testing dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    // Epic 13 (SB4): testcontainers versions from the testcontainers-bom imported in the root
    // subprojects dependencyManagement block.
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-localstack'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'

    // Test Fixtures dependencies (exposed to consuming projects)
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Epic 13 (SB4): AbstractIntegrationTest uses @AutoConfigureMockMvc + @AutoConfigureTestDatabase,
    // which moved out of spring-boot-test-autoconfigure into per-technology test modules.
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-jdbc-test'
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-web'
    // Epic 13 (SB4): SB4 dropped the auto-wiring of springSecurity() into the auto-configured
    // MockMvc (the old MockMvcSecurityConfiguration is gone from spring-boot-webmvc-test). The
    // shared MockMvcSecuritySetup re-applies it via a MockMvcBuilderCustomizer, which needs
    // SecurityMockMvcConfigurers from spring-security-test on the testFixtures classpath.
    testFixturesImplementation 'org.springframework.security:spring-security-test'
    testFixturesImplementation 'org.testcontainers:testcontainers'
    testFixturesImplementation 'org.testcontainers:testcontainers-postgresql'
    testFixturesImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}

// Apply Trivy security scanning
apply from: "../gradle/trivy-security.gradle"

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}

jacoco {
    toolVersion = "0.8.10"
}

jacocoTestReport {
    dependsOn test, classes
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    // Exclude generated code from coverage
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/generated/**',           // OpenAPI generated code
                '**/*Application.class',     // Spring Boot main class
                '**/*Config.class',          // Configuration classes
                '**/*Configuration.class',   // Configuration classes
                // Email system — excluded from coverage
                '**/EmailService.class',
                '**/LocalEmailCapture.class',
                '**/CapturedEmail.class',
                '**/CapturedEmail$*.class'
            ])
        }))
    }
}

test.finalizedBy jacocoTestReport

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    violationRules {
        rule {
            limit {
                // Use 60% threshold for incremental development
                // TODO: Restore to 0.90 once coverage is improved
                minimum = 0.60
            }
        }
    }

    // Exclude generated code from coverage verification (same as jacocoTestReport)
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/generated/**',           // OpenAPI generated code
                '**/*Application.class',     // Spring Boot main class
                '**/*Config.class',          // Configuration classes
                '**/*Configuration.class',   // Configuration classes
                // Email system — excluded from coverage
                '**/EmailService.class',
                '**/LocalEmailCapture.class',
                '**/CapturedEmail.class',
                '**/CapturedEmail$*.class'
            ])
        }))
    }
}

// Coverage verification runs only during explicit test tasks, not during build
// check.dependsOn jacocoTestCoverageVerification

// Checkstyle is configured centrally in the root build.gradle
// (subprojects { plugins.withId('checkstyle') }) so settings can't drift.

// Disable Spring Boot executable jar creation for library module
bootJar {
    enabled = false
}

jar {
    enabled = true
}

// Maven publishing configuration
publishing {
    publications {
        maven(MavenPublication) {
            from components.java

            pom {
                name = 'BATbern Shared Kernel'
                description = 'Shared domain types and events for BATbern platform microservices'
                url = 'https://github.com/batbern/shared-kernel'

                licenses {
                    license {
                        name = 'Proprietary'
                        url = 'https://batbern.ch/license'
                    }
                }
            }
        }
    }

    repositories {
        maven {
            name = 'internal'
            url = uri("${project.buildDir}/repo")
        }
    }
}

// Task to generate version info
task generateVersionInfo {
    def projectVersion = project.version
    doLast {
        def versionFile = file("$buildDir/generated/version.properties")
        versionFile.parentFile.mkdirs()
        versionFile.text = """
version=${projectVersion}
buildTime=${new Date().format("yyyy-MM-dd'T'HH:mm:ss'Z'", TimeZone.getTimeZone("UTC"))}
"""
    }
}

processResources.dependsOn generateVersionInfo
processResources {
    from("$buildDir/generated") {
        include "version.properties"
    }
}

// Flyway configuration for database migrations
// Configuration is provided via system properties or environment variables in CI/CD
flyway {
    // Default local development configuration (override with -Dflyway.* parameters)
    url = System.getProperty('flyway.url', 'jdbc:postgresql://localhost:5432/batbern')
    user = System.getProperty('flyway.user', 'postgres')
    password = System.getProperty('flyway.password', 'postgres')
    locations = ['classpath:db/migration']
    baselineOnMigrate = true
    baselineVersion = '0'
}