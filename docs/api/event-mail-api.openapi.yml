openapi: 3.0.3
info:
  title: BATbern Event Mail API
  version: 1.0.0
  description: 'What went out for an event (Mail Center, Epic 16, Story 16.3), and the one composer
    that sends it (Story 16.8). Reads the outbound mail record written since Story 16.1a
    (`mail_message`, `mail_recipient`, delivery status from Story 16.1b) and, for newsletters sent
    before the record existed, `newsletter_sends`.


    Mail bodies and addresses are personal data: every operation is ORGANIZER-only and the responses
    are never cached publicly.'
  contact:
    name: BATbern Platform Team
    email: platform@batbern.ch
  license:
    name: Proprietary
servers:
- url: https://api.batbern.ch/api/v1
  description: Production
- url: http://localhost:8080/api/v1
  description: Development
security:
- BearerAuth: []
tags:
- name: EventMail
  description: Outbound mail of an event, newest first (Story 16.3), preview and send (Story 16.8)
- name: MailConversation
  description: |
    Mail people wrote to the platform, threaded per counterpart, with a status and an organizer who
    answers it (Story 16.2a: speakers). Keys are global (`conv-{n}`): a conversation can move to
    another event (Story 16.7), so the per-conversation operations are not nested under an event.
paths:
  /events/{eventCode}/mails:
    get:
      tags:
      - EventMail
      operationId: listEventMails
      summary: List what went out for an event, newest first (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        One entry per recorded send group, plus one per newsletter send made before the mail record
        existed (read-time union with `newsletter_sends`, no data migration). Automatic mails (no
        sender, from a template) are collapsed per template and day unless `grouped=false`:
        such an entry has `messageCount` > 1 and stands for all of them.

        Counts: `deliveredCount` and `failedCount` come from the delivery status of each recipient
        (Story 16.1b). For newsletters, `failedCount` is sends SES refused plus bounces, and
        `deliveredCount` is the rest: the newsletter configuration set reports no deliveries.
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      - name: audience
        in: query
        required: false
        description: Only entries for this audience.
        schema:
          $ref: '#/components/schemas/MailAudience'
      - name: templateKey
        in: query
        required: false
        description: Only entries of this template (used to expand a collapsed entry).
        schema:
          type: string
      - name: reference
        in: query
        required: false
        description: |
          Only mails about this subject, e.g. `partner-meeting:{meetingId}` for the invites and
          cancellations of one partner meeting (Story 16.9).
        schema:
          type: string
          maxLength: 100
      - name: date
        in: query
        required: false
        description: Only entries sent on this day, Europe/Zurich (used to expand a collapsed entry).
        schema:
          type: string
          format: date
      - name: grouped
        in: query
        required: false
        description: Collapse automatic mails per template and day (default true).
        schema:
          type: boolean
          default: true
      - name: includeTests
        in: query
        required: false
        description: Include organizer test sends (Story 16.8, hidden by default).
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/MailDirection'
      - $ref: '#/components/parameters/MailSpam'
      - name: page
        in: query
        description: Page number (1-based)
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        description: Items per page (max 100)
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Paginated entries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessagePage'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: Event not found
    post:
      tags:
      - EventMail
      operationId: sendEventMail
      summary: Send a mail to the audience, or a test to the organizers (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Story 16.8. `target=RECIPIENTS` sends to the audience through the existing send code
        (newsletter job, registrant one-shot guard, speaker reminders, venue To and Cc).
        `target=ORGANIZERS` sends the mail as rendered for recipient `recipientIndex` to every
        organizer, subject prefixed `[TEST] `, with dummy credential links; no real recipient gets
        anything. The response carries the keys of the recorded mail(s) at once; progress of a
        newsletter or registrant notice comes from the detail operation.
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailSendRequest'
            example:
              audience: NEWSLETTER
              contentSource: TEMPLATE
              templateKey: newsletter-event
              locale: de
              target: ORGANIZERS
      responses:
        '202':
          description: Accepted; the mail is recorded and on its way
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailSendResponse'
              example:
                mailKeys:
                - BATbern60-41
                target: RECIPIENTS
                recipientCount: 1052
                skipped: []
        '400':
          description: Invalid request (as for preview). Own text with a placeholder the audience does
            not have answers `details.code = UNKNOWN_PLACEHOLDER` with `details.placeholders`.
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: Event not found
        '409':
          description: A newsletter send is running, or this registrant notice was already sent. Own
            text to registrants with a subject already sent answers `details.code = ALREADY_SENT`
            with `details.sentAt` unless `confirmResend` is true.
  /events/{eventCode}/mails/counts:
    get:
      tags:
      - EventMail
      operationId: getEventMailCounts
      summary: Counts for "Handled automatically" (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Failed deliveries (SES errors, bounces, complaints, rejects) of this event's mail, newsletter
        included. Since Story 16.2a also the automatic inbound mail of the event, counted without
        storing it: out-of-office replies, bounces, calendar accepts and declines, keyword replies
        that acted (accept, cancel) and unsubscribes. An inbound mail is attributed to an event by the
        mail it answers (In-Reply-To), the registration's calendar UID or the event code in the subject.
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      - name: includeTests
        in: query
        required: false
        description: Include organizer test sends (Story 16.8, hidden by default).
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailCounts'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: Event not found
  /events/{eventCode}/mails/preview:
    post:
      tags:
      - EventMail
      operationId: previewEventMail
      summary: Render a mail for one real recipient, without sending (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Story 16.8. Renders the mail exactly as recipient `recipientIndex` of the audience gets it,
        through the same code path the send uses, so preview and sent mail are byte-equal.
        Credentials (unsubscribe and deregistration links, the registration code) are shown as
        `[redacted]`, as in the record. Registrants and speakers get the mail in their own language;
        for them `locale` in the request is ignored and the response says which one was used.
        `unknownPlaceholders` lists `{{...}}` left after rendering (a warning for templates).
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailComposeRequest'
            example:
              audience: SPEAKERS
              contentSource: TEMPLATE
              speakerReminderType: CONTENT
              locale: de
              recipientIndex: 2
      responses:
        '200':
          description: The rendered mail for one recipient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailPreviewResponse'
              example:
                subject: 'Erinnerung: Materialien - BATbern60'
                html: '<html>...</html>'
                recipientIndex: 2
                recipientCount: 8
                recipient:
                  displayName: Anna Example
                  address: anna@example.com
                  cc: []
                sampleRecipients:
                - displayName: Anna Example
                personalized: true
                templateKey: speaker-reminder-content-tier2
                locale: de
                replyTo: batbern60-moderator@batbern.ch
                organizerCount: 6
                skipped: []
                unknownPlaceholders: []
        '400':
          description: Invalid request (template not allowed for the audience, recipient index out of
            range, missing audience field, own text without subject or body or with a line break in
            the subject). An unknown placeholder in own text does NOT fail the preview; it is listed
            in `unknownPlaceholders` and marked in `highlightedHtml`.
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: Event not found
  /events/{eventCode}/mails/{mailKey}:
    get:
      tags:
      - EventMail
      operationId: getEventMail
      summary: One mail as sent, with its recipients (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        `mailKey` is the record's key (`BATbern60-12`) or, for a newsletter sent before the record
        existed, `newsletter-{sendId}`; such an entry has no `bodyHtml`. Recipients: every address
        for a recorded mail; for a newsletter only the failed ones (`failedCount` gives the total).
        Credentials in the body were replaced by `[redacted]` when it was recorded.
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      - name: mailKey
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The mail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageDetail'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: Event or mail not found
  /events/{eventCode}/conversations:
    get:
      tags:
      - MailConversation
      operationId: listEventConversations
      summary: The event's conversations, open first (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Story 16.2a "Needs an answer". `OPEN` and `WAITING` first, then `DONE`; within each, newest
        activity first.
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Only conversations in this status.
        schema:
          $ref: '#/components/schemas/MailConversationStatus'
      - name: page
        in: query
        description: Page number (1-based)
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        description: Items per page (max 100)
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailConversationPage'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: Event not found
  /mails:
    get:
      tags:
      - EventMail
      operationId: listMails
      summary: Mail of all events and without event, newest first (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Story 16.7: the same entries, schema and filters as `GET /events/{eventCode}/mails`, with the
        event as an optional filter instead of the path. `noEvent=true` lists mail that belongs to no
        event (e.g. to info@). Story 16.10: `participantUsername` or `participantCompany` lists the mail
        to and from one person or the PARTNER contacts of one company, matched on every address they
        have (primary and additional, case-insensitive, resolved at read time). That view never lists
        newsletters, test sends or spam, and lists the answers in conversations too; use it with
        `direction=ANY` and `grouped=false`.
      parameters:
      - name: eventCode
        in: query
        required: false
        description: Only mail of this event.
        schema:
          type: string
      - name: noEvent
        in: query
        required: false
        description: Only mail without an event. Not together with `eventCode`.
        schema:
          type: boolean
          default: false
      - name: participantUsername
        in: query
        required: false
        description: Story 16.10. Mail to or from this user. Not together with `participantCompany`.
        schema:
          type: string
          maxLength: 100
      - name: participantCompany
        in: query
        required: false
        description: Story 16.10. Mail to or from the PARTNER contacts of this company.
        schema:
          type: string
          maxLength: 100
      - name: audience
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/MailAudience'
      - name: templateKey
        in: query
        required: false
        schema:
          type: string
      - name: reference
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: date
        in: query
        required: false
        description: Only entries sent on this day, Europe/Zurich.
        schema:
          type: string
          format: date
      - name: grouped
        in: query
        required: false
        schema:
          type: boolean
          default: true
      - name: includeTests
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/MailDirection'
      - $ref: '#/components/parameters/MailSpam'
      - name: page
        in: query
        description: Page number (1-based)
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        description: Items per page (max 100)
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Paginated entries, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessagePage'
        '400':
          description: '`eventCode` with `noEvent`, or both participant filters'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: Event, user or company not found
  /mails/{mailKey}:
    get:
      tags:
      - EventMail
      operationId: getMail
      summary: One mail, of any event or none (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Story 16.7: as `GET /events/{eventCode}/mails/{mailKey}` for any key (keys are global), inbound
        and spam included.
      parameters:
      - name: mailKey
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The mail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageDetail'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: Mail not found
    patch:
      tags:
      - EventMail
      operationId: patchMail
      summary: Mark an inbound mail as not spam (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Story 16.7 AC3. Only `{ "spam": false }` is accepted: the flag is cleared and the mail is
        threaded like a new arrival (16.2a/16.2b rules), so it lands in an event's conversations or in
        "No event". Sends nothing.
      parameters:
      - name: mailKey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailMessagePatch'
      responses:
        '200':
          description: The mail after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageDetail'
        '400':
          description: Anything else than `spam=false`, or the mail is not spam
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: Mail not found
  /conversations:
    get:
      tags:
      - MailConversation
      operationId: listConversations
      summary: Conversations of all events and without event, open first (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Story 16.7 (global Mail page). Same order as the event's list. `noEvent=true`: only
        conversations without an event; `noEvent=false`: only those with one; absent: both.
      parameters:
      - name: status
        in: query
        required: false
        description: Only conversations in one of these statuses (repeat the parameter).
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/MailConversationStatus'
      - name: eventCode
        in: query
        required: false
        schema:
          type: string
      - name: noEvent
        in: query
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        description: Page number (1-based)
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        description: Items per page (max 100)
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailConversationPage'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
  /conversations/counts:
    get:
      tags:
      - MailConversation
      operationId: getConversationCounts
      summary: Counts for the Mail badge and the sections of the Mail page (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Story 16.7 AC2. `open` (the badge) and `waiting` across all events and without event;
        `noEvent`: conversations without an event that are not done; `spam`: inbound mail flagged spam.
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailConversationCounts'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
  /conversations/{conversationKey}:
    get:
      tags:
      - MailConversation
      operationId: getConversation
      summary: One conversation with every message, oldest first (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Inbound bodies were sanitized when they arrived (no images, styles or scripts).
      parameters:
      - name: conversationKey
        in: path
        required: true
        schema:
          type: string
          example: conv-12
      responses:
        '200':
          description: The conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailConversationDetail'
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: Conversation not found
    patch:
      tags:
      - MailConversation
      operationId: patchConversation
      summary: Set status and assignee (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Only the fields present change. `assigneeUsername: null` with `clearAssignee: true` leaves the
        conversation unassigned. Story 16.6: when the assignee changes to another organizer than the
        caller, that organizer gets one notification mail (template `mailcenter-assigned`). Assigning
        yourself, clearing the assignee or saving the same assignee sends nothing.

        Story 16.7 AC1: `eventCode` puts the conversation and all its messages on that event;
        `clearEvent: true` takes them off any event ("No event"). Keys do not change.
      parameters:
      - name: conversationKey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailConversationPatch'
      responses:
        '200':
          description: The conversation after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailConversationSummary'
        '400':
          description: The assignee is not an organizer, or `eventCode` with `clearEvent`
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: Conversation or event not found
  /conversations/{conversationKey}/replies:
    post:
      tags:
      - MailConversation
      operationId: replyToConversation
      summary: Answer the conversation by mail (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Story 16.6. Sends one mail to the counterpart (the last inbound mail's Reply-To, else its From),
        from `"{organizer name} via BATbern" <noreply@…>` with Reply-To `replies+{token}@…`, so the next
        reply lands in this conversation. The answer is recorded in the conversation, not as a separate
        entry in "What went out". The conversation becomes `WAITING`, or `DONE` with `markDone`.
        **Sends a real mail**: never call this from an automated test against production.
      parameters:
      - name: conversationKey
        in: path
        required: true
        schema:
          type: string
          example: conv-12
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailConversationReply'
      responses:
        '201':
          description: The answer as recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailMessageDetail'
        '400':
          description: Empty or too long text
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: Conversation not found
        '409':
          description: The conversation has no counterpart address that can be mailed
  /conversations/{conversationKey}/messages/{mailKey}/attachments/{index}/download:
    get:
      tags:
      - MailConversation
      operationId: getConversationAttachmentDownloadUrl
      summary: Get a presigned download URL for a kept attachment (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Story 16.6. Inbound attachments up to 25 MB per file are kept with their conversation (deleted
        with it, 12 months after the last activity); larger ones keep only their name. Returns a
        presigned link valid for 5 minutes that downloads the file under its original name, like the
        session materials' `getMaterialDownloadUrl`.
      parameters:
      - name: conversationKey
        in: path
        required: true
        schema:
          type: string
      - name: mailKey
        in: path
        required: true
        schema:
          type: string
      - name: index
        in: path
        required: true
        description: Position of the attachment in the message's `attachments`, from 0.
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: The link
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/DownloadUrlResponse
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: No such message in the conversation, or the file was not kept
  /events/{eventCode}/mails/{mailKey}/retry:
    post:
      tags:
      - EventMail
      operationId: retryEventMail
      summary: Retry the failed recipients of a newsletter (ORGANIZER)
      description: |
        **Security**: ORGANIZER role required; any other role gets 403.

        Story 16.8. Re-sends a PARTIAL or FAILED newsletter to the recipients that failed or were
        never reached. Replaces `POST /events/{eventCode}/newsletter/sends/{sendId}/retry`.
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      - name: mailKey
        in: path
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Retry started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailSendResponse'
        '400':
          description: The mail is not a newsletter
        '401':
          description: Not authenticated
        '403':
          description: Forbidden (ORGANIZER role required)
        '404':
          description: Event or mail not found
        '409':
          description: Nothing to retry (completed) or a send is running
components:
  schemas:
    MailMessagePage:
      type: object
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MailMessageSummary'
        pagination:
          $ref: ./_shared.openapi.yml#/components/schemas/PaginationMetadata
    MailAudience:
      type: string
      enum:
      - NEWSLETTER
      - REGISTRANTS
      - SPEAKERS
      - VENUE
      - PARTNERS
      - ORGANIZERS
      - SYSTEM
      - PUBLIC
      description: |
        Who a mail went to. `PUBLIC` (Story 16.2b) only on inbound mail and conversations: someone who is
        not addressed as a group, e.g. a mail to info@. No outbound mail has it.
    MailMessageSummary:
      type: object
      required:
      - mailKey
      - sentAt
      - audience
      - contentSource
      - recipientCount
      - deliveredCount
      - failedCount
      - messageCount
      - test
      properties:
        mailKey:
          type: string
          description: Key of the entry's newest mail; opens it with the detail operation.
          example: BATbern60-12
        sentAt:
          type: string
          format: date-time
          description: When the newest mail of the entry went out.
        senderUsername:
          type: string
          nullable: true
          description: Organizer who sent it; absent for automatic mail.
        audience:
          $ref: '#/components/schemas/MailAudience'
        templateKey:
          type: string
          nullable: true
        contentSource:
          type: string
          enum:
          - TEMPLATE
          - OWN_TEXT
        subject:
          type: string
          nullable: true
          description: Absent for a newsletter sent before the record existed.
        recipientCount:
          type: integer
        deliveredCount:
          type: integer
        failedCount:
          type: integer
        messageCount:
          type: integer
          description: Number of mails this entry stands for (> 1 for a collapsed automatic entry).
        newsletterSendId:
          type: string
          format: uuid
          nullable: true
        newsletterStatus:
          type: string
          nullable: true
          description: Send-job status of a newsletter (PENDING, IN_PROGRESS, COMPLETED, PARTIAL, FAILED).
        test:
          type: boolean
          description: Test send to the organizers.
        reference:
          type: string
          nullable: true
          description: |
            What the mail is about beyond its event, e.g. `partner-meeting:{meetingId}` for a partner
            meeting invite or cancellation (Story 16.9). The meeting id is the partner meeting's public id.
          example: partner-meeting:3f2a9c1e-7b4d-4e2a-9c1e-7b4d4e2a9c1e
        direction:
          type: string
          enum:
          - OUT
          - IN
          description: Story 16.2a. `IN` for mail a person wrote to the platform; absent means `OUT`.
        fromAddress:
          type: string
          nullable: true
          description: Story 16.2a. Sender of an inbound mail.
        fromName:
          type: string
          nullable: true
        eventCode:
          type: string
          nullable: true
        conversationKey:
          type: string
          nullable: true
          description: Story 16.2a. The conversation an inbound mail belongs to.
        spam:
          type: boolean
          description: Story 16.7. Inbound mail flagged spam by SES; shown only in the Spam list.
        participantStatus:
          type: string
          nullable: true
          enum:
          - SENT
          - DELIVERED
          - FAILED
          description: |
            Story 16.10. In the participant view: the delivery status of the participant's own address
            (the worst when several). Absent for received mail.
        attachments:
          type: array
          description: |
            Story 16.2a. Attachments of an inbound mail. Story 16.6: files up to 25 MB are kept (`kept`),
            larger ones by name only.
          items:
            $ref: '#/components/schemas/MailAttachment'
    MailAttachment:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        contentType:
          type: string
        size:
          type: integer
          format: int64
        kept:
          type: boolean
          description: Story 16.6. The file is kept and can be downloaded (getConversationAttachmentDownloadUrl).
    MailMessagePatch:
      type: object
      required:
      - spam
      properties:
        spam:
          type: boolean
          description: Only `false` is accepted.
    MailConversationCounts:
      type: object
      required:
      - open
      - waiting
      - noEvent
      - spam
      properties:
        open:
          type: integer
        waiting:
          type: integer
        noEvent:
          type: integer
        spam:
          type: integer
    MailConversationStatus:
      type: string
      enum:
      - OPEN
      - WAITING
      - DONE
      description: Open needs an answer; waiting is answered, waiting for the counterpart; done needs nothing.
    MailConversationSummary:
      type: object
      required:
      - conversationKey
      - audience
      - subject
      - counterpartAddress
      - status
      - via
      - lastMessageAt
      - messageCount
      properties:
        conversationKey:
          type: string
          example: conv-12
        eventCode:
          type: string
          nullable: true
        audience:
          $ref: '#/components/schemas/MailAudience'
        subject:
          type: string
        counterpartAddress:
          type: string
        counterpartName:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/MailConversationStatus'
        assigneeUsername:
          type: string
          nullable: true
        via:
          type: string
          description: Where the first mail arrived, e.g. `batbern60-moderator@batbern.ch`, or `reply` for a reply to a mail.
        lastMessageAt:
          type: string
          format: date-time
        messageCount:
          type: integer
    MailConversationPage:
      type: object
      required:
      - data
      - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/MailConversationSummary'
        pagination:
          $ref: ./_shared.openapi.yml#/components/schemas/PaginationMetadata
    MailConversationDetail:
      type: object
      required:
      - conversation
      - messages
      properties:
        conversation:
          $ref: '#/components/schemas/MailConversationSummary'
        messages:
          type: array
          description: Every message, oldest first.
          items:
            $ref: '#/components/schemas/MailMessageDetail'
    MailConversationPatch:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/MailConversationStatus'
        assigneeUsername:
          type: string
          nullable: true
          description: An organizer's username.
        clearAssignee:
          type: boolean
          description: Leave the conversation unassigned.
        eventCode:
          type: string
          nullable: true
          description: Story 16.7. Put the conversation on this (existing) event.
        clearEvent:
          type: boolean
          description: Story 16.7. Take the conversation off its event ("No event").
    MailConversationReply:
      type: object
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 20000
          description: The answer as plain text. The last inbound mail is quoted below it.
        markDone:
          type: boolean
          description: Set the conversation to DONE instead of WAITING.
    MailMessageDetail:
      type: object
      required:
      - message
      - recipients
      properties:
        message:
          $ref: '#/components/schemas/MailMessageSummary'
        bodyHtml:
          type: string
          nullable: true
          description: The mail as sent, credentials redacted; absent for a newsletter sent before the record existed.
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/MailRecipientEntry'
        progress:
          $ref: '#/components/schemas/MailProgress'
    MailProgress:
      type: object
      nullable: true
      description: Send progress of a newsletter or registrant notice (Story 16.8); absent for other mail.
      required:
      - status
      - total
      - sent
      - failed
      - retryable
      properties:
        status:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - COMPLETED
          - PARTIAL
          - FAILED
        total:
          type: integer
        sent:
          type: integer
        failed:
          type: integer
        retryable:
          type: boolean
          description: A newsletter that ended PARTIAL or FAILED, with no other send running.
    MailComposeRequest:
      type: object
      description: |
        One composer request (Story 16.8). Flat optional fields; each says which audience uses it.
      required:
      - audience
      properties:
        audience:
          type: string
          description: |
            PARTNERS (Story 16.9): one mail with every PARTNER-role user on the To: line, sorted by
            company then name; PARTNER templates only, no per-person placeholders.
          enum:
          - NEWSLETTER
          - REGISTRANTS
          - SPEAKERS
          - VENUE
          - PARTNERS
        contentSource:
          type: string
          enum:
          - TEMPLATE
          - OWN_TEXT
          default: TEMPLATE
          description: |
            OWN_TEXT (Story 16.5): `ownSubject` and `ownBodyHtml` instead of a template, rendered with
            the same variables. Every `{{name}}` must be a variable of the audience (400
            UNKNOWN_PLACEHOLDER otherwise).
        templateKey:
          type: string
          nullable: true
          description: The template. For SPEAKERS null means automatic (each speaker's tier); for
            NEWSLETTER null means the default newsletter template.
        locale:
          type: string
          enum:
          - de
          - en
          default: de
          description: Language for NEWSLETTER and VENUE. Registrants and speakers get their own.
        recipientIndex:
          type: integer
          minimum: 0
          default: 0
          description: Preview, and the rendering a test send uses.
        newsletterReminder:
          type: boolean
          default: false
          description: NEWSLETTER only. Prefix "Reminder:".
        speakerReminderType:
          type: string
          enum:
          - RESPONSE
          - CONTENT
          nullable: true
          description: SPEAKERS only, required in automatic mode. RESPONSE targets INVITED speakers,
            CONTENT targets ACCEPTED speakers without content.
        venueRecipients:
          type: array
          items:
            type: string
            enum:
            - VENUE
            - CATERING
          description: VENUE only, at least one. The first role is To, the rest Cc.
        venueNotes:
          type: string
          maxLength: 4000
          nullable: true
          description: VENUE only.
        ownSubject:
          type: string
          maxLength: 500
          nullable: true
          description: OWN_TEXT only, required. One line (no CR/LF).
        ownBodyHtml:
          type: string
          maxLength: 204800
          nullable: true
          description: OWN_TEXT only, required. HTML; the BATbern layout is added.
        speakerStatuses:
          type: array
          items:
            type: string
            enum:
            - INVITED
            - ACCEPTED
            - CONTENT_SUBMITTED
            - QUALITY_REVIEWED
          description: SPEAKERS with OWN_TEXT only, at least one. Which speakers get the mail.
        confirmResend:
          type: boolean
          default: false
          description: REGISTRANTS with OWN_TEXT only. Send although a mail with the same subject
            already went to this event's registrants (409 ALREADY_SENT otherwise).
    MailAlreadySent:
      type: object
      required:
      - sentAt
      properties:
        sentAt:
          type: string
          format: date-time
        mailKey:
          type: string
          nullable: true
    MailSendRequest:
      allOf:
      - $ref: '#/components/schemas/MailComposeRequest'
      - type: object
        required:
        - target
        properties:
          target:
            type: string
            enum:
            - RECIPIENTS
            - ORGANIZERS
    MailComposeRecipient:
      type: object
      required:
      - displayName
      - address
      properties:
        displayName:
          type: string
        address:
          type: string
        cc:
          type: array
          items:
            type: string
    MailSampleRecipient:
      type: object
      required:
      - displayName
      properties:
        displayName:
          type: string
    MailSkippedRecipient:
      type: object
      required:
      - displayName
      - reason
      properties:
        displayName:
          type: string
        reason:
          type: string
          enum:
          - OPTED_OUT
          - REMINDERS_DISABLED
          - NO_EMAIL
          - DUPLICATE
    MailPreviewResponse:
      type: object
      required:
      - subject
      - html
      - recipientIndex
      - recipientCount
      - sampleRecipients
      - personalized
      - locale
      - organizerCount
      - skipped
      - unknownPlaceholders
      properties:
        subject:
          type: string
        html:
          type: string
          description: The mail as recipient `recipientIndex` gets it, credentials redacted.
        recipientIndex:
          type: integer
        recipientCount:
          type: integer
        recipient:
          $ref: '#/components/schemas/MailComposeRecipient'
        sampleRecipients:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/MailSampleRecipient'
        personalized:
          type: boolean
          description: False when everyone gets the same text (newsletter, venue); no stepping then.
        templateKey:
          type: string
          nullable: true
          description: The template recipient `recipientIndex` gets (speakers in automatic mode).
        locale:
          type: string
        replyTo:
          type: string
          nullable: true
        organizerCount:
          type: integer
          description: How many organizers a test send reaches.
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/MailSkippedRecipient'
        unknownPlaceholders:
          type: array
          items:
            type: string
        highlightedSubject:
          type: string
          nullable: true
          description: OWN_TEXT only. The subject with every filled value marked (display only).
        highlightedHtml:
          type: string
          nullable: true
          description: OWN_TEXT only. `html` with every filled value in `<mark data-var>` and every
            unknown placeholder in `<mark class="unknown">` (display only; never sent).
        offeredVariables:
          type: array
          items:
            type: string
          description: The variables offered as chips for this audience (Story 16.5).
        allowedVariables:
          type: array
          items:
            type: string
          description: Every variable own text for this audience may use.
        alreadySent:
          allOf:
          - $ref: '#/components/schemas/MailAlreadySent'
          nullable: true
          description: REGISTRANTS with OWN_TEXT only. A mail with this subject already went to
            this event's registrants; the send needs `confirmResend`.
    MailSendResponse:
      type: object
      required:
      - mailKeys
      - target
      - recipientCount
      - skipped
      properties:
        mailKeys:
          type: array
          items:
            type: string
          description: Keys of the recorded mail(s); speakers in automatic mode can give one per template.
        target:
          type: string
          enum:
          - RECIPIENTS
          - ORGANIZERS
        recipientCount:
          type: integer
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/MailSkippedRecipient'
    MailRecipientEntry:
      type: object
      required:
      - address
      - kind
      - status
      properties:
        address:
          type: string
        kind:
          type: string
          enum:
          - TO
          - CC
        status:
          type: string
          enum:
          - SENT
          - DELIVERED
          - FAILED
        failureReason:
          type: string
          nullable: true
          description: Bounce type/subtype, `complaint`, SES reject reason or SES error code.
    MailCounts:
      type: object
      required:
      - failedDeliveries
      - outOfOffice
      - bounces
      - calendarAccepts
      - calendarDeclines
      - keywordAccepts
      - keywordCancels
      - unsubscribes
      properties:
        failedDeliveries:
          type: integer
        outOfOffice:
          type: integer
          description: Story 16.2a. Out-of-office replies to the event's mail.
        bounces:
          type: integer
          description: Story 16.2a. Bounce messages that arrived as mail (not SES bounce events).
        calendarAccepts:
          type: integer
        calendarDeclines:
          type: integer
        keywordAccepts:
          type: integer
          description: Replies "accept" that confirmed a registration.
        keywordCancels:
          type: integer
          description: Replies "cancel" that sent the deregistration link.
        unsubscribes:
          type: integer
  parameters:
    MailDirection:
      name: direction
      in: query
      required: false
      description: |
        Story 16.7. `OUT` (default): what went out, without the answers in conversations; `IN`: mail
        people wrote; `ANY`: both.
      schema:
        type: string
        enum:
        - OUT
        - IN
        - ANY
        default: OUT
    MailSpam:
      name: spam
      in: query
      required: false
      description: 'Story 16.7. `true` lists only inbound mail flagged spam. Default `false`: spam is never listed otherwise.'
      schema:
        type: boolean
        default: false
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AWS Cognito JWT token
