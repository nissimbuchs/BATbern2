openapi: 3.1.0
info:
  title: BATbern Uploads API
  version: 1.0.0
  description: |
    One upload contract for every file a user hands to BATbern (ADR-002, decision 2026-11-07,
    Story 17.11). Three operations, the same in every service:

    1. `POST /uploads/{purpose}` reserves an upload and returns a presigned S3 URL (15 minutes).
    2. The client PUTs the file to that URL, with the headers in `requiredHeaders`.
    3. `POST /uploads/{purpose}/{uploadId}/confirm` checks that the file is in S3. With a `target`
       (an existing entity) it attaches the file right away (ASSOCIATED) and returns its `fileUrl`.
       Without one (the entity does not exist yet, e.g. the company in the create form) the upload is
       CONFIRMED and the entity create takes its `uploadId` (`logoUploadId`, `themeImageUploadId`).

    `POST /uploads/{purpose}/import` fetches an image from an HTTPS URL on the server
    (ADR-002 Scope Clarification 2) and returns a CONFIRMED upload.

    **Purposes and the service that owns them.** The gateway routes by purpose, with one explicit
    entry per purpose (the table below). A purpose another service owns, or an unknown one, answers
    404. `uploadId` is a transient handle (ADR-003 case table), only
    valid under its purpose.

    | purpose | owner | types | max size | target | import |
    |---|---|---|---|---|---|
    | `company-logo` | CUMS | png, jpeg, svg | 5 MB | `companyName` (ORGANIZER) | yes (ORGANIZER) |
    | `event-theme-image` | EMS | png, jpeg, svg | 5 MB | `eventCode` (ORGANIZER) | no |
    | `profile-picture` | CUMS | png, jpeg, svg | 5 MB | `username`, required (ORGANIZER or the user themself) | yes (ORGANIZER) |
    | `event-photo` | EMS | jpeg, png, webp | 10 MB | `eventCode`, required (ORGANIZER) | no |
    | `teaser-image` | EMS | jpeg, png, webp, svg | 10 MB | `eventCode`, required, `_global` for the global set (ORGANIZER) | no |
    | `session-material` | EMS | ORGANIZER: pptx, ppt, key, odp, pdf, doc, docx, txt, mp4, mov, avi, mkv, webm, zip, gz, tar; SPEAKER: pptx, ppt, key, pdf | ORGANIZER 100 MB, SPEAKER 50 MB | `eventCode` + `sessionSlug` (ORGANIZER any session, SPEAKER own session) | no |

    A purpose whose target is required answers 400 on create and confirm without one.
    `profile-picture` has no create-form case: the user always exists, so the upload is attached on
    confirm. The batch import of speaker portraits imports, then confirms with the target.
    `event-photo` (Story 17.11b): the confirm with the target creates the photo in the event's
    gallery (`GET /events/{eventCode}/photos`).
    `session-material` (Story 17.11d): the target has two keys, `eventCode` and `sessionSlug`, both
    or none (one alone is 400). The rules depend on the caller's role (an organizer's rules when the
    caller is an organizer). A speaker may only name a session they are on (403). The confirm with
    the target creates the session material (`GET /events/{eventCode}/sessions/{sessionSlug}/materials`),
    its type derived from the content type (always PRESENTATION for a speaker). Without a target
    (the organizer's session editor, which attaches the files only when the session is saved, so a
    cancel attaches nothing) the upload is CONFIRMED and
    `POST /events/{eventCode}/sessions/{sessionSlug}/materials` takes its `uploadId`. The upload
    keeps the original file name: the material is listed under it, and its download
    (`…/materials/{materialId}/download`) is saved under it (`Content-Disposition`).
    `teaser-image` (Story 17.11c): the confirm with the target creates the teaser image
    (`GET /events/{eventCode}/teaser-images`); `eventCode` `_global` names the global set shown on
    every event. At most 10 per event and 10 global: the 11th is refused with 409 on create and on
    confirm.

    **Target binding** (Story 17.11b). A target given on create is recorded with the reserved
    upload; a confirm that names another target answers 404 and changes nothing. An upload reserved
    without a target may still name one on confirm.

    **Final keys** carry no year (Story 17.11a, the upload year caused a rollover bug):
    `logos/companies/{companyName}/logo-{uploadId}.{ext}`,
    `logos/events/{eventCode}/theme-{uploadId}.{ext}`,
    `profile-pictures/{username}/profile-{uploadId}.{ext}`,
    `events/{eventCode}/photos/{uploadId}.{ext}`, `events/{eventCode}/teaser/{uploadId}.{ext}`,
    `global/teaser/{uploadId}.{ext}` and
    `materials/events/{eventCode}/sessions/{sessionSlug}/file-{uploadId}.{ext}`. Files attached earlier keep their key and URL.

    **Lifecycle.** PENDING (reserved) → CONFIRMED (file in S3) → ASSOCIATED (attached to its entity).
    A PENDING upload older than 24 hours and a CONFIRMED one older than 7 days are deleted with their
    S3 object by the nightly expiry job.
  contact:
    name: BATbern Platform Team
    email: platform@batbern.ch
  license:
    name: Proprietary
    identifier: Proprietary

servers:
  - url: https://api.batbern.ch/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Development

tags:
  - name: Uploads
    description: Presign, confirm and import of a file for one purpose (ADR-002)

paths:
  /uploads/{purpose}:
    post:
      tags:
        - Uploads
      summary: Reserve an upload and get a presigned S3 URL
      description: |
        Checks type and size for the purpose (400) and, with a `target`, that the caller may attach
        to it (403) and that it exists (404). Returns the presigned PUT URL, valid 15 minutes. Any
        signed-in user may upload without a target; the file does nothing until an entity that the
        caller may change takes it (`session-material`: organizers and speakers only, 403 otherwise).
        A purpose that requires a target (`profile-picture`,
        `event-photo`, `teaser-image`) answers 400 without one. The target given here is recorded
        with the upload; the confirm must name the same one. `teaser-image` answers 409 when its
        event (or the global set) already has 10 teaser images.
      operationId: createFileUpload
      parameters:
        - $ref: '#/components/parameters/Purpose'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: Upload reserved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSlot'
              examples:
                default:
                  summary: a reserved company logo upload
                  value:
                    uploadId: 3f2b8c1e-5d4a-4e6b-9a7c-1b2d3e4f5a6b
                    uploadUrl: https://www.batbern.ch/
                    expiresAt: '2026-11-12T10:15:00Z'
                    requiredHeaders:
                      Content-Type: image/png
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /uploads/{purpose}/{uploadId}/confirm:
    post:
      tags:
        - Uploads
      summary: Confirm an upload, and attach it when a target is given
      description: |
        Checks that the file is in S3 (409 when it is not). Without a `target`: PENDING → CONFIRMED.
        With a `target`: the file moves to its final key and is attached to the entity (ASSOCIATED),
        e.g. it becomes the company logo. Confirming an upload that is already ASSOCIATED is 409; an
        unknown, expired or other-purpose `uploadId` is 404, and so is a `target` other than the one
        given on create (Story 17.11b), e.g. another session for `session-material`. A purpose that requires a target (`profile-picture`,
        `event-photo`, `teaser-image`) answers 400 without one. `teaser-image` answers 409 when its
        event (or the global set) already has 10 teaser images.
      operationId: confirmFileUpload
      parameters:
        - $ref: '#/components/parameters/Purpose'
        - name: uploadId
          in: path
          required: true
          description: The upload handle from `createFileUpload` or `importFileUpload`
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUploadRequest'
      responses:
        '200':
          description: Upload confirmed (or attached)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              examples:
                default:
                  summary: a company logo attached to its company
                  value:
                    uploadId: 3f2b8c1e-5d4a-4e6b-9a7c-1b2d3e4f5a6b
                    purpose: company-logo
                    status: ASSOCIATED
                    fileUrl: https://cdn.batbern.ch/logos/companies/acme/logo-3f2b8c1e-5d4a-4e6b-9a7c-1b2d3e4f5a6b.png
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /uploads/{purpose}/import:
    post:
      tags:
        - Uploads
      summary: Import an image from an HTTPS URL (server-side)
      description: |
        The server fetches the image (ADR-002 Scope Clarification 2: there are no bytes on the
        client to presign) and stores it as a CONFIRMED upload, ready for the entity create. Only
        purposes that allow an import (404 otherwise). A URL that is not HTTPS, not an image or too
        large is 400; an upstream that cannot be reached or answers with an error is 502.
      operationId: importFileUpload
      parameters:
        - $ref: '#/components/parameters/Purpose'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportUploadRequest'
      responses:
        '201':
          description: Image imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
              examples:
                default:
                  summary: an imported company logo, ready for the create
                  value:
                    uploadId: 3f2b8c1e-5d4a-4e6b-9a7c-1b2d3e4f5a6b
                    purpose: company-logo
                    status: CONFIRMED
                    fileUrl: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          description: The image URL could not be fetched
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    Purpose:
      name: purpose
      in: path
      required: true
      description: |
        What the file is for. Decides the owning service, the rules and the target. The values
        are those of `UploadPurpose`; a service answers 404 for a purpose it does not own.
      schema:
        type: string
        enum:
          - company-logo
          - event-theme-image
          - profile-picture
          - event-photo
          - teaser-image
          - session-material

  schemas:
    UploadPurpose:
      type: string
      enum:
        - company-logo
        - event-theme-image
        - profile-picture
        - event-photo
        - teaser-image
        - session-material

    UploadTarget:
      type: object
      description: |
        The existing entity the file is for, by its meaningful ID (ADR-003). Set the keys of the
        purpose: `companyName` for `company-logo`, `eventCode` for `event-theme-image`,
        `event-photo` and `teaser-image`, `username` for `profile-picture`, `eventCode` and
        `sessionSlug` together for `session-material`. Any other key, or only part of a two-key
        target, is 400.
      additionalProperties: false
      properties:
        companyName:
          type: string
          maxLength: 255
        eventCode:
          type: string
          maxLength: 50
          description: |
            The event's code, e.g. `BATbern58`. For `teaser-image`, `_global` names the global
            teaser images shown on every event.
        username:
          type: string
          maxLength: 100
        sessionSlug:
          type: string
          maxLength: 200
          description: The session's slug, with `eventCode`, for `session-material`

    CreateUploadRequest:
      type: object
      additionalProperties: false
      required:
        - fileName
        - contentType
        - size
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: Original file name with extension, e.g. `logo.png`
        contentType:
          type: string
          minLength: 1
          maxLength: 100
          description: MIME type, signed into the upload URL
        size:
          type: integer
          format: int64
          minimum: 1
          description: Size in bytes, signed into the upload URL
        target:
          $ref: '#/components/schemas/UploadTarget'

    UploadSlot:
      type: object
      required:
        - uploadId
        - uploadUrl
        - expiresAt
        - requiredHeaders
      properties:
        uploadId:
          type: string
        uploadUrl:
          type: string
          description: Presigned S3 PUT URL. A credential until it expires; never log it.
        expiresAt:
          type: string
          format: date-time
          description: When the upload URL stops working
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
          description: Headers the PUT must send (the signed Content-Type)

    ConfirmUploadRequest:
      type: object
      additionalProperties: false
      properties:
        target:
          $ref: '#/components/schemas/UploadTarget'

    ImportUploadRequest:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          minLength: 1
          maxLength: 2000
          description: HTTPS URL of the image
        fileName:
          type: string
          maxLength: 255
          description: Base file name; the extension comes from the content type

    Upload:
      type: object
      required:
        - uploadId
        - purpose
        - status
        - fileUrl
      properties:
        uploadId:
          type: string
        purpose:
          $ref: '#/components/schemas/UploadPurpose'
        status:
          type: string
          enum:
            - PENDING
            - CONFIRMED
            - ASSOCIATED
        fileUrl:
          type: string
          nullable: true
          description: CDN URL of the attached file; null until ASSOCIATED

    ErrorResponse:
      $ref: './_shared.openapi.yml#/components/schemas/ErrorResponse'

  responses:
    BadRequest:
      description: Type, size or request not valid for the purpose
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The caller may not attach to this target, or not import
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Unknown purpose for this service, unknown target, or unknown or expired upload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: |
        The upload is not in a state for this step (already attached, file missing), or the target
        is full (`teaser-image`: 10 per event or global)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AWS Cognito JWT token

security:
  - BearerAuth: []
