openapi: 3.0.3
info:
  title: BATbern Events Core API
  version: 1.0.0
  description: 'Event lifecycle CRUD, event types, bulk operations, workflow transitions, thanks, teaser images, and the attendee-portal dashboard read.


    Carved from the consolidated events-api spec (API consolidation Phase 6). Paths preserved verbatim.'
  contact:
    name: BATbern Platform Team
    email: platform@batbern.ch
  license:
    name: Proprietary
servers:
- url: https://api.batbern.ch/api/v1
  description: Production
- url: https://api.batbern.ch/api/v1
  description: Staging
- url: http://localhost:8080/api/v1
  description: Development
security:
- BearerAuth: []
tags:
- name: Events
  description: Event CRUD and listing operations
- name: Bulk Operations
  description: Batch operations on multiple events
- name: Event Actions
  description: Event publishing and workflow operations
- name: Event Workflow
  description: Event workflow state transitions and status (EventWorkflowController)
- name: Event Types
  description: Event type configuration management (Story 5.1)
- name: Organizer Thanks
  description: Attendee thank-the-organizers notes + public featured marquee (Story 7.7, OrganizerThanksController)
- name: Teaser Images
  description: Event-specific and global teaser image management (EventTeaserImageController).
    eventCode "_global" maps to images shown on all event presentations.
paths:
  /events:
    get:
      tags:
      - Events
      summary: List and search events
      description: 'Retrieve a paginated list of events with optional filtering and sorting.


        **Acceptance Criteria**: AC1


        **Filter Syntax Examples**:

        - Single filter: `{"workflowState":"PUBLISHED"}`

        - Year filter: `{"year":2025}`

        - Text search: `{"title":{"$contains":"Cloud"}}`

        - Date range: `{"date":{"$gte":"2025-01-01T00:00:00Z","$lt":"2026-01-01T00:00:00Z"}}`

        - Multiple filters: `{"workflowState":"PUBLISHED","year":2025}`

        - Search with filter: `{"workflowState":"PUBLISHED","title":{"$contains":"Cloud"}}`

        - Logical operators: `{"$or":[{"workflowState":"PUBLISHED"},{"workflowState":"ARCHIVED"}]}`

        - In operator: `{"workflowState":{"$in":["PUBLISHED","ARCHIVED"]}}`


        **Supported Filter Fields**:

        - `year`: Integer (convenience filter, matches events from Jan 1 - Dec 31 of given year)

        - `date`: ISO 8601 timestamp (supports $gte, $lte, $gt, $lt operators for date ranges)

        - `workflowState`: String (single workflow state) or use `$in` operator for multiple states

        - `eventNumber`: Integer (event number)

        - `title`: String (supports $contains, $startsWith, $endsWith operators for text search)


        **Sort Syntax**:

        - Ascending: `date`

        - Descending: `-date`


        **Performance**: <100ms (P95)

        '
      operationId: listEvents
      parameters:
      - name: filter
        in: query
        description: JSON filter criteria
        required: false
        schema:
          type: string
          example: '{"workflowState":"PUBLISHED","year":2025}'
      - name: sort
        in: query
        description: Sort field (prefix with - for descending)
        required: false
        schema:
          type: string
          example: -date
      - name: page
        in: query
        description: 'Page number (1-indexed). Default 1. The deployed PaginationUtils.parseParams
          rejects page <= 0 with 400, so the default must be 1.'
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        description: 'Items per page. The deployed PaginationUtils clamps values above 100 down
          to 100 (it does NOT reject them), so no maximum is enforced at the contract layer.'
        required: false
        schema:
          type: integer
          minimum: 1
          default: 20
      - name: includeArchived
        in: query
        description: 'Include archived events in the result set (default false). The public
          archive index sets this true to list past events.'
        required: false
        schema:
          type: boolean
          default: false
      - name: include
        in: query
        description: Comma-separated list of resources to include
        required: false
        schema:
          type: string
          example: venue,sessions
      responses:
        '200':
          description: Successful response with paginated events
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
                  pagination:
                    $ref: ./_shared.openapi.yml#/components/schemas/PaginationMetadata
              examples:
                basicList:
                  summary: Basic event list
                  value:
                    data:
                    - eventCode: BATbern142
                      title: Spring Conference 2025
                      eventNumber: 142
                      date: 2025-05-15 09:00:00+00:00
                      registrationDeadline: 2025-05-01 23:59:59+00:00
                      venueName: Kursaal Bern
                      venueAddress: Kornhausstrasse 3, 3013 Bern
                      venueCapacity: 200
                      workflowState: PUBLISHED
                      organizerUsername: john.doe
                      currentAttendeeCount: 187
                      description: Cloud Native Architecture
                    pagination:
                      page: 0
                      limit: 20
                      totalItems: 1
                      totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Events
      summary: Create a new event
      description: 'Create a new event with complete event data.


        **Acceptance Criteria**: AC3


        **Performance**: <200ms (P95)

        '
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            examples:
              basicEvent:
                summary: Basic event creation
                value:
                  title: Summer Workshop 2025
                  eventNumber: 143
                  date: 2025-07-20 09:00:00+00:00
                  registrationDeadline: 2025-07-10 23:59:59+00:00
                  venueName: Kursaal Bern
                  venueAddress: Kornhausstrasse 3, 3013 Bern
                  venueCapacity: 150
                  workflowState: CREATED
                  organizerUsername: john.doe
                  currentAttendeeCount: 0
                  description: AI/ML in Production
      responses:
        '201':
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Bulk Operations
      summary: Batch update multiple events
      description: 'Update multiple events in a single request.


        **Acceptance Criteria**: AC14


        **Performance**: <1000ms for 50 events (P95)

        '
      operationId: batchUpdateEvents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateRequest'
      responses:
        '200':
          description: Batch update completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUpdateResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /events/current:
    get:
      tags:
      - Events
      summary: Get current event for the public homepage
      description: "Retrieve the event the public homepage should feature. No authentication required.\n\n**Story**: 4.1.3 - Public event landing page hero section\n**Public Access**: No authentication required\n\nTwo-phase selection (afterglow takes precedence):\n1. **Afterglow**: the most recently completed event still inside its 14-day post-event\n   window (EVENT_COMPLETED, date within the last 14 days). It keeps featuring on the\n   homepage so attendees get the post-event experience, even if the next event has\n   already published its topic/speakers/agenda. The scheduler auto-archives after 14 days.\n2. **Upcoming**: otherwise, the earliest upcoming published event by date\n   (currentPublishedPhase != null).\n\nIf neither exists, returns 404.\n\n**Performance**: <150ms (P95)\n"
      operationId: getCurrentEvent
      parameters:
      - name: include
        in: query
        description: Comma-separated list of resources to expand (topics,venue,sessions)
        required: false
        schema:
          type: string
          example: topics,venue,sessions
      responses:
        '200':
          description: Current event retrieved successfully
          headers:
            X-Cache-Status:
              description: Cache hit/miss indicator
              schema:
                type: string
                enum:
                - HIT
                - MISS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
              example:
                eventCode: BATbern57
                title: Cloud-Native Architecture in Practice
                eventNumber: 57
                workflowState: PUBLISHED
                description: Join us for an evening exploring modern cloud-native architecture patterns and best practices.
                date: '2025-03-15T18:00:00Z'
                registrationDeadline: '2025-03-10T23:59:59Z'
                venueName: Bern TechHub
                venueAddress: Waisenhausplatz 30, 3014 Bern
                venueCapacity: 120
                organizerUsername: john.doe
                currentAttendeeCount: 87
                publishedAt: '2025-02-01T10:00:00Z'
                venue:
                  id: venue-001
                  name: Bern TechHub
                  capacity: 120
                  address: Waisenhausplatz 30, 3014 Bern
                topics:
                - id: topic-1
                  name: Microservices
                  color: blue
                - id: topic-2
                  name: Kubernetes
                  color: cyan
        '404':
          description: No current published event found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                  timestamp:
                    type: string
                    format: date-time
              example:
                error: Not Found
                message: No current published event available
                timestamp: '2025-03-15T12:00:00Z'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /events/{eventCode}:
    get:
      tags:
      - Events
      summary: Get event details
      description: 'Retrieve detailed information about a specific event with optional resource expansion.


        **Acceptance Criteria**: AC2

        **Story**: 1.16.2 - Uses eventCode (meaningful ID) instead of UUID


        **Include Options**:

        - `venue`: Venue details with address and capacity

        - `sessions`: Event sessions with schedule (speakers included in sessions)

        - `topics`: Event topics and categories

        - `workflow`: Workflow state and history

        - `registrations`: Registration counts and status

        - `catering`: Catering arrangements

        - `team`: Team assignments

        - `publishing`: Publishing details

        - `notifications`: Notification settings

        - `analytics`: Event analytics and metrics


        **Performance**:

        - Basic (no includes): <150ms (P95)

        - All includes: <500ms (P95)

        - Cached: <50ms (P95)


        **Caching**: 15-minute TTL with automatic invalidation on updates

        '
      operationId: getEvent
      parameters:
      - name: eventCode
        in: path
        description: Event code in format BATbern{number}
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern142
      - name: include
        in: query
        description: Comma-separated list of resources to include
        required: false
        schema:
          type: string
          example: venue,sessions,workflow
      responses:
        '200':
          description: Event details retrieved successfully
          headers:
            X-Cache-Status:
              description: Cache hit status (HIT or MISS)
              schema:
                type: string
                enum:
                - HIT
                - MISS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
              examples:
                basicEvent:
                  summary: Basic event (no includes)
                  value:
                    eventCode: BATbern142
                    title: Spring Conference 2025
                    eventNumber: 142
                    date: 2025-05-15 09:00:00+00:00
                    registrationDeadline: 2025-05-01 23:59:59+00:00
                    venueName: Kursaal Bern
                    venueAddress: Kornhausstrasse 3, 3013 Bern
                    venueCapacity: 500
                    workflowState: PUBLISHED
                    organizerUsername: john.doe
                    currentAttendeeCount: 187
                    description: Cloud Native Architecture
                expandedEvent:
                  summary: Event with venue
                  value:
                    eventCode: BATbern142
                    title: Spring Conference 2025
                    eventNumber: 142
                    date: 2025-05-15 09:00:00+00:00
                    registrationDeadline: 2025-05-01 23:59:59+00:00
                    venueName: Kursaal Bern
                    venueAddress: Kornhausstrasse 3, 3013 Bern
                    venueCapacity: 500
                    workflowState: PUBLISHED
                    organizerUsername: john.doe
                    currentAttendeeCount: 187
                    description: Cloud Native Architecture
                    venue:
                      id: ven-001
                      name: Kursaal Bern
                      address: Kornhausstrasse 3, 3013 Bern
                      capacity: 500
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
      - Events
      summary: Update event (full replacement)
      description: 'Replace all event data with new data.


        **Acceptance Criteria**: AC4

        **Story**: 1.16.2 - Uses eventCode (meaningful ID) instead of UUID


        **Cache Invalidation**: All event caches cleared on update

        '
      operationId: updateEvent
      parameters:
      - name: eventCode
        in: path
        description: Event code in format BATbern{number}
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern142
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Event updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
      - Events
      summary: Partially update event
      description: 'Update specific fields of an event without replacing all data.


        **Acceptance Criteria**: AC5

        **Story**: 1.16.2 - Uses eventCode (meaningful ID) instead of UUID


        **Cache Invalidation**: All event caches cleared on update

        '
      operationId: patchEvent
      parameters:
      - name: eventCode
        in: path
        description: Event code in format BATbern{number}
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern142
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchEventRequest'
            examples:
              updateTitle:
                summary: Update only title
                value:
                  title: Spring Conference 2025 - Updated
      responses:
        '200':
          description: Event patched successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Events
      summary: Delete event
      description: 'Delete an event and all associated data.


        **Acceptance Criteria**: AC6

        **Story**: 1.16.2 - Uses eventCode (meaningful ID) instead of UUID


        **Cascade Deletion**: Deletes all sessions, registrations, and related data

        **Cache Invalidation**: All event caches cleared on deletion

        '
      operationId: deleteEvent
      parameters:
      - name: eventCode
        in: path
        description: Event code in format BATbern{number}
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern142
      responses:
        '204':
          description: Event deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /events/{eventCode}/publish:
    post:
      tags:
      - Event Actions
      summary: Publish event
      description: 'Publish an event after validation checks.


        **Acceptance Criteria**: AC7

        **Story**: 1.16.2 - Uses eventCode (meaningful ID) instead of UUID


        **Validation Rules**:

        - Event must have a date

        - Event must have a title

        - Event must be in draft status


        **Cache Invalidation**: All event caches cleared on publish

        '
      operationId: publishEvent
      parameters:
      - name: eventCode
        in: path
        description: Event code in format BATbern{number}
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern142
      responses:
        '200':
          description: Event published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /events/{eventCode}/workflow/transition:
    post:
      tags:
      - Event Workflow
      summary: Transition event to target workflow state
      description: 'Transition an event to a specific target workflow state.


        **Story**: 5.1a - Workflow State Machine Foundation

        **Acceptance Criteria**: AC12

        **Authorization**: Requires ORGANIZER role

        **Rate Limiting**: 10 transitions per minute per user (API Gateway)

        **Performance**: <200ms (P95)


        **16-Step Workflow**:

        1. CREATED - Initial state

        2. TOPIC_SELECTION - Topics being selected

        3. SPEAKER_BRAINSTORMING - Identifying potential speakers

        4. SPEAKER_OUTREACH - Contacting speakers

        5. SPEAKER_CONFIRMATION - Confirming speaker participation

        6. CONTENT_COLLECTION - Collecting presentations and materials

        7. QUALITY_REVIEW - Reviewing content quality

        8. THRESHOLD_CHECK - Checking minimum speaker threshold

        9. OVERFLOW_MANAGEMENT - Managing speaker overflow

        10. SLOT_ASSIGNMENT - Assigning speakers to time slots

        11. AGENDA_PUBLISHED - Publishing agenda

        12. (removed - AGENDA_FINALIZED consolidated into AGENDA_PUBLISHED flow, V82)

        13. NEWSLETTER_SENT - Newsletter sent to attendees

        14. EVENT_READY - Event ready to start

        15. PARTNER_MEETING_COMPLETE - Partner meetings completed

        16. ARCHIVED - Event archived


        **Validation**:

        - Some transitions require business rule validation (e.g., minimum speakers for SPEAKER_OUTREACH)

        - Invalid transitions return 400 Bad Request

        - Validation failures return 422 Unprocessable Entity


        **Cache Invalidation**: All event caches cleared on state transition

        '
      operationId: transitionEventWorkflowState
      parameters:
      - name: eventCode
        in: path
        description: Event code in format BATbern{number}
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern142
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionStateRequest'
            examples:
              validTransition:
                summary: Valid transition from CREATED to TOPIC_SELECTION
                value:
                  targetState: TOPIC_SELECTION
      responses:
        '200':
          description: Workflow transition successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowTransitionResponse'
        '400':
          description: Invalid state transition
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
              examples:
                invalidTransition:
                  summary: Invalid transition (e.g., CREATED → ARCHIVED)
                  value:
                    timestamp: '2025-12-11T10:00:00Z'
                    path: /api/v1/events/BATbern142/workflow/transition
                    status: 400
                    error: Bad Request
                    message: Invalid transition from CREATED to ARCHIVED
                    correlationId: abc-123-def
                    severity: MEDIUM
                    details:
                      fromState: CREATED
                      toState: ARCHIVED
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation failure (business rules not met)
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
              examples:
                insufficientSpeakers:
                  summary: Insufficient speakers for transition
                  value:
                    timestamp: '2025-12-11T10:00:00Z'
                    path: /api/v1/events/BATbern142/workflow/transition
                    status: 422
                    error: Unprocessable Entity
                    message: Insufficient speakers identified
                    correlationId: abc-123-def
                    severity: HIGH
                    details:
                      required: 6
                      identified: 3
                      placeholder: true
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - BearerAuth: []
  /events/{eventCode}/workflow/status:
    get:
      tags:
      - Event Workflow
      summary: Get current workflow status
      description: 'Retrieve the current workflow status including current state, next available states,

        and validation messages.


        **Story**: 5.1a - Workflow State Machine Foundation

        **Acceptance Criteria**: AC13

        **Authorization**: Requires authentication (any authenticated user)

        **Rate Limiting**: Applied at API Gateway level


        **Response includes**:

        - Current workflow state

        - Next available states (states that can be transitioned to)

        - Blocked transitions (states that cannot be transitioned to due to business rules)

        - Validation messages (reasons why certain transitions are blocked)


        **Performance**: <100ms (P95)

        '
      operationId: getWorkflowStatus
      parameters:
      - name: eventCode
        in: path
        description: Event code in format BATbern{number}
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern142
      responses:
        '200':
          description: Workflow status retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStatusDto'
              examples:
                createdState:
                  summary: Event in CREATED state
                  value:
                    currentState: CREATED
                    nextAvailableStates:
                    - TOPIC_SELECTION
                    blockedTransitions: []
                    validationMessages: []
                speakerBrainstormingState:
                  summary: Event in SPEAKER_BRAINSTORMING state with validation blocker
                  value:
                    currentState: SPEAKER_BRAINSTORMING
                    nextAvailableStates:
                    - SPEAKER_OUTREACH
                    blockedTransitions:
                    - SPEAKER_OUTREACH
                    validationMessages:
                    - 'Cannot transition to SPEAKER_OUTREACH: Insufficient speakers identified'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - BearerAuth: []
  /events/{eventCode}/thanks:
    post:
      tags:
      - Organizer Thanks
      summary: Thank the organizers ("Thank the Organizers")
      description: "Send a one-click thank-you to the volunteer organizers after an event is live/completed.\n\n**Story**: 7.4 - \"Thank the Organizers\"\n**Authorization**: PUBLIC — anonymous allowed. Authentication is OPTIONAL.\n**Abuse guard (anonymous only)**: a valid Cloudflare Turnstile token\n(`X-Turnstile-Token` header) is required at the gateway, and submissions are\nrate-limited per (event, client-IP) at the service.\n\n**Business Rules**:\n- The event must be `EVENT_LIVE` or `EVENT_COMPLETED` — else 409 (`THANKS_NOT_ALLOWED`).\n- Logged-in attendees are deduped to one thank-you per event (a repeat updates the\n  optional note, it never double-counts).\n- Anonymous thank-yous are clap-style and not user-deduped; exceeding the per-(event,IP)\n  rate limit returns 429 (`THANKS_RATE_LIMITED`) without incrementing the counter.\n- The response carries the new aggregate `count`. Submitted notes are NEVER returned here.\n"
      operationId: submitThanks
      parameters:
      - name: eventCode
        in: path
        description: Event code in format BATbern{number}
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern57
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitThanksRequest'
      responses:
        '200':
          description: Thank-you recorded; returns the new aggregate count (notes never included).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThanksCountResponse'
        '400':
          description: Validation error (note too long, or an unknown body field)
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '403':
          description: Turnstile verification failed (anonymous submission, invalid/blocked token)
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '409':
          description: '`THANKS_NOT_ALLOWED` — the event is not yet live or completed.

            '
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
              example:
                message: Thank-yous open only after the event is live or completed.
                status: 409
                error: Conflict
                details:
                  code: THANKS_NOT_ALLOWED
        '429':
          description: '`THANKS_RATE_LIMITED` — too many anonymous thank-yous for this event from your IP.

            '
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
              example:
                message: Too many thank-yous for this event from your network — please try later.
                status: 429
                error: Too Many Requests
                details:
                  code: THANKS_RATE_LIMITED
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
    get:
      tags:
      - Organizer Thanks
      summary: Get the thank-the-organizers aggregate (and notes for organizers)
      description: 'Returns the public clap-style aggregate `count` for an event. Organizer-authenticated

        callers additionally receive the submitted `notes` (AC6); the public response is

        count-only — there is no public note wall.


        **Story**: 7.4 - "Thank the Organizers"

        **Authorization**: PUBLIC for the count. Notes returned ONLY to ORGANIZER callers.

        '
      operationId: getThanks
      parameters:
      - name: eventCode
        in: path
        description: Event code in format BATbern{number}
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern57
      responses:
        '200':
          description: Aggregate count (notes present only for organizer callers).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThanksCountResponse'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
  /events/{eventCode}/thanks/{id}:
    patch:
      tags:
      - Organizer Thanks
      summary: Feature/un-feature a thank-you note (curated marquee)
      description: 'Organizer-only. Marks a logged-in thank-you note as featured (or un-features it) for the

        PUBLIC curated marquee. Featuring an anonymous note is rejected (409 `THANKS_NOT_FEATURABLE`)

        — anonymous claps have no name and can never reach the public surface.


        **Story**: 7.7 - "Curated Thank-You Notes in the Partner Marquee"

        **Authorization**: ORGANIZER only.

        '
      operationId: setThanksFeatured
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern57
      - name: id
        in: path
        description: The thank-you note id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ThanksFeaturePatchRequest'
      responses:
        '200':
          description: The updated organizer note view.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThanksNoteResponse'
        '400':
          description: Validation error (missing featured flag)
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '404':
          description: '`THANKS_NOT_FOUND` — no such thank-you for this event.

            '
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '409':
          description: '`THANKS_NOT_FEATURABLE` — the note is anonymous and cannot be featured.

            '
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
              example:
                message: Anonymous thank-yous cannot be featured on the public marquee.
                status: 409
                error: Conflict
                details:
                  code: THANKS_NOT_FEATURABLE
        '500':
          $ref: '#/components/responses/InternalServerError'
  /thanks/featured:
    get:
      tags:
      - Organizer Thanks
      summary: Get curated featured thank-you notes for the public marquee
      description: 'Returns up to `limit` (capped at 9) RANDOM organizer-featured, logged-in thank-you notes

        across ALL events, enriched with the author''s first name + company logo. Anonymous notes

        are structurally excluded; the raw username is never returned. PUBLIC.


        **Story**: 7.7 - "Curated Thank-You Notes in the Partner Marquee"

        **Authorization**: PUBLIC.

        '
      operationId: getFeaturedThanks
      parameters:
      - name: limit
        in: query
        required: false
        description: 'Max notes to return (default 9). The server soft-clamps to [1, 9] —
          out-of-range values are accepted (not rejected) and clamped, not a 400.'
        schema:
          type: integer
          default: 9
      responses:
        '200':
          description: Up to `limit` random featured thank-you notes (may be empty).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeaturedThanksResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
