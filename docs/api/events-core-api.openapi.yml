  /events/types:
    get:
      tags:
      - Event Types
      summary: List all event type configurations
      description: 'Retrieve all event type configurations (FULL_DAY, AFTERNOON, EVENING).


        **Story**: 5.1 - Event Type Definition

        **Acceptance Criteria**: AC1


        Event types define slot requirements and templates for different event formats.

        This endpoint returns cached configurations (Caffeine cache, 1 hour TTL).


        **Performance**: <50ms (P95) - cached response

        '
      operationId: listEventTypes
      responses:
        '200':
          description: Event types retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventSlotConfigurationResponse'
              example:
              - type: FULL_DAY
                minSlots: 6
                maxSlots: 8
                slotDuration: 45
                theoreticalSlotsAM: true
                breakSlots: 2
                lunchSlots: 1
                defaultCapacity: 300
                typicalStartTime: 09:00
                typicalEndTime: '16:00'
              - type: AFTERNOON
                minSlots: 6
                maxSlots: 8
                slotDuration: 45
                theoreticalSlotsAM: false
                breakSlots: 1
                lunchSlots: 0
                defaultCapacity: 200
                typicalStartTime: '13:00'
                typicalEndTime: '19:00'
              - type: EVENING
                minSlots: 3
                maxSlots: 4
                slotDuration: 45
                theoreticalSlotsAM: false
                breakSlots: 1
                lunchSlots: 0
                defaultCapacity: 200
                typicalStartTime: '16:00'
                typicalEndTime: '19:00'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - BearerAuth: []
  /events/types/{type}:
    get:
      tags:
      - Event Types
      summary: Get specific event type configuration
      description: 'Retrieve configuration for a specific event type.


        **Story**: 5.1 - Event Type Definition

        **Acceptance Criteria**: AC2


        Returns slot configuration details for the specified event type.

        Cached response (Caffeine cache, 1 hour TTL).


        **Performance**: <50ms (P95) - cached response

        '
      operationId: getEventType
      parameters:
      - name: type
        in: path
        required: true
        description: Event type identifier
        schema:
          $ref: '#/components/schemas/EventType'
        example: FULL_DAY
      responses:
        '200':
          description: Event type configuration retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSlotConfigurationResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - BearerAuth: []
    put:
      tags:
      - Event Types
      summary: Update event type configuration (ORGANIZER only)
      description: 'Update configuration for a specific event type.


        **Story**: 5.1 - Event Type Definition

        **Acceptance Criteria**: AC3, AC8


        **Authorization**: Requires ORGANIZER role


        Updates slot configuration for the event type template.

        Cache is automatically invalidated after successful update.


        **Validation**:

        - minSlots must be > 0

        - maxSlots must be >= minSlots

        - slotDuration must be >= 15 minutes

        - defaultCapacity must be > 0

        '
      operationId: updateEventType
      parameters:
      - name: type
        in: path
        required: true
        description: Event type identifier
        schema:
          $ref: '#/components/schemas/EventType'
        example: FULL_DAY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventSlotConfigurationRequest'
            example:
              minSlots: 6
              maxSlots: 8
              slotDuration: 45
              theoreticalSlotsAM: true
              breakSlots: 2
              lunchSlots: 1
              defaultCapacity: 200
              typicalStartTime: 09:00
              typicalEndTime: '17:00'
      responses:
        '200':
          description: Event type configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSlotConfigurationResponse'
        '400':
          description: Validation error (e.g., minSlots > maxSlots)
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '403':
          description: Forbidden - requires ORGANIZER role
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - BearerAuth: []
