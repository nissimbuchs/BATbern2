          type: integer
          minimum: 1
          description: Duration of each break session, in minutes
          example: 20
          nullable: true
        lunchDuration:
          type: integer
          minimum: 1
          description: Duration of the lunch session, in minutes
          example: 60
          nullable: true
        aperitifSlots:
          type: integer
          minimum: 0
          description: Apéro on/off count (0 = off, ≥1 = on) — Story 15.2
          example: 1
          nullable: true
        aperitifDuration:
          type: integer
          minimum: 1
          description: Apéro duration in minutes
          example: 90
          nullable: true
        aperitifPosition:
          type: string
          enum:
          - start
          - end
          description: Apéro placement relative to the moderation segments
          example: end
          nullable: true
    EventWorkflowState:
      type: string
      description: 'Event workflow state for 8-step consolidated workflow (V82: AGENDA_FINALIZED removed).

        Defines the current state of an event in the organizer workflow.

        The scheduler transitions AGENDA_PUBLISHED directly to EVENT_LIVE on event day.

        '
      enum:
      - CREATED
      - TOPIC_SELECTION
      - SPEAKER_IDENTIFICATION
      - SLOT_ASSIGNMENT
      - AGENDA_PUBLISHED
      - EVENT_LIVE
      - EVENT_COMPLETED
      - ARCHIVED
      example: SPEAKER_IDENTIFICATION
    WorkflowTransitionResponse:
      type: object
      description: Result of a successful workflow state transition.
      required:
      - eventCode
      - workflowState
      properties:
        eventCode:
          type: string
          example: BATbern142
        workflowState:
          type: string
          description: The event's workflow state name after the transition.
          example: TOPIC_SELECTION
        updatedAt:
          type: string
          format: date-time
    TransitionStateRequest:
      type: object
      description: 'Request to transition event to target workflow state (Story 5.1a - AC12).

        The target state must be a valid transition from the current state.

        '
      required:
      - targetState
      properties:
        targetState:
          type: string
          description: |
            Target workflow state name (an EventWorkflowState constant, e.g.
            SPEAKER_OUTREACH). Typed as a string — the domain enum carries ~20 states
            and is validated server-side by the workflow state machine; the spec-level
            EventWorkflowState enum is intentionally not used here to avoid an
            incomplete-enum contract.
        overrideValidation:
          type: boolean
          nullable: true
          description: 'Override workflow validation flag.

            When true, allows any state transition bypassing validation rules.

            Defaults to false if not provided.

            '
          default: false
        overrideReason:
          type: string
          maxLength: 500
          description: 'Optional reason for overriding workflow validation.

            Used for audit trail when overrideValidation is true.

            '
    WorkflowStatusDto:
      type: object
      description: 'Current workflow status including available and blocked transitions (Story 5.1a - AC13).

        Provides organizers with visibility into what transitions are possible and why.

        '
      required:
      - currentState
      - nextAvailableStates
      - blockedTransitions
      - validationMessages
      properties:
        currentState:
          type: string
          description: Current workflow state name (an EventWorkflowState constant).
          example: SPEAKER_BRAINSTORMING
        nextAvailableStates:
          type: array
          description: List of states that can be transitioned to from current state
          items:
            type: string
          example:
          - SPEAKER_OUTREACH
        blockedTransitions:
          type: array
          description: List of states that are blocked due to validation failures
          items:
            type: string
          example:
          - SPEAKER_OUTREACH
        validationMessages:
          type: array
          description: Validation messages explaining why certain transitions are blocked
          items:
            type: string
          example:
          - 'Cannot transition to SPEAKER_OUTREACH: Insufficient speakers identified (need 6, have 3)'
    SubmitThanksRequest:
      type: object
      description: 'Story 7.4 "Thank the Organizers": the optional body of a thank-you. Identity (logged-in

        username) is taken from the JWT server-side, never from the body, so the only field is an

        optional short `note`. A one-click thank-you may send an empty body / no body at all.

        `additionalProperties: false`: an unexpected field is rejected with HTTP 400.

        '
      additionalProperties: false
      properties:
        note:
          type: string
          maxLength: 500
          nullable: true
          description: Optional short note for the organizers (organizer-visible only).
          example: Thank you for 20 years of BATbern!
    ThanksNoteResponse:
      type: object
      description: 'Story 7.4: a single organizer-visible thank-you note. Returned ONLY in the

        organizer-authenticated GET response — never to anonymous/public callers. Story 7.7 adds

        the row `id` + `featured` flag (for the ★ feature toggle) and the resolved author display

        name so the Appreciation panel can show a friendly name rather than the raw username.

        '
      properties:
        id:
          type: string
          format: uuid
          description: The thank-you note id (for the organizer feature toggle).
        note:
          type: string
          nullable: true
          description: The submitted note (may be null if the thank-you carried no note).
        thankedByUsername:
          type: string
          nullable: true
          description: The logged-in attendee's username, or null for an anonymous clap.
        thankedByFirstName:
          type: string
          nullable: true
          description: Resolved author first name (null for anonymous).
        thankedByLastName:
          type: string
          nullable: true
          description: Resolved author last name (null for anonymous).
        thankedByCompanyName:
          type: string
          nullable: true
          description: Resolved company display name (null when anonymous or opted out).
        featured:
          type: boolean
          description: Whether this note is currently featured on the public marquee (Story 7.7).
        createdAt:
          type: string
          format: date-time
          description: When the thank-you was submitted.
    ThanksFeaturePatchRequest:
      type: object
      description: 'Story 7.7: organizer request to feature/un-feature a thank-you note on the public marquee.

        '
      additionalProperties: false
      required:
      - featured
      properties:
        featured:
          type: boolean
          description: true to feature the note publicly; false to remove it.
    FeaturedThanksResponse:
      type: object
      description: 'Story 7.7: one featured thank-you note for the PUBLIC marquee — organizer-curated,

        logged-in-only, enriched with the author''s name + company logo. The raw username is never

        exposed; company name/logo are null when the author opted out of showing their company.

        '
      properties:
        note:
          type: string
          nullable: true
          description: The submitted note text.
        eventCode:
          type: string
          description: The event the thank-you was for.
        thankedByFirstName:
          type: string
          nullable: true
          description: Author first name (shown on the card).
        thankedByLastName:
          type: string
          nullable: true
          description: Author last name.
        thankedByCompanyName:
          type: string
          nullable: true
          description: Company display name (null when the author opted out).
        thankedByCompanyLogoUrl:
          type: string
          nullable: true
          description: Company logo CloudFront URL (null when opted out or no logo).
    ThanksCountResponse:
      type: object
      description: 'Story 7.4: response for both the POST submit and the GET aggregate. `count` (the public

        clap-style aggregate) is always present. `notes` is populated ONLY for organizer GET

        callers; it is null for the public GET and for POST responses (no public note wall).

        '
      required:
      - count
      properties:
        count:
          type: integer
          format: int64
          description: The aggregate number of thank-yous for the event.
          example: 42
        notes:
          type: array
          nullable: true
          description: Organizer-only list of submitted notes (newest first); null for the public.
          items:
            $ref: '#/components/schemas/ThanksNoteResponse'
    AttendeeEventCardResponse:
      type: object
      description: 'Story 7.6: one event on the attendee dashboard. The client links the card to

        `/events/{eventCode}` (upcoming) or `/archive/{eventCode}` (past).

        '
      required:
      - eventCode
      - eventTitle
      properties:
        eventCode:
          type: string
          example: BATbern57
        eventTitle:
          type: string
        eventDate:
          type: string
          format: date-time
        eventLocation:
          type: string
          nullable: true
          description: The event venue name.
        workflowState:
          type: string
          nullable: true
          description: The event's UPPER_CASE workflow state (e.g. EVENT_COMPLETED, ARCHIVED).
        registrationStatus:
          type: string
          nullable: true
          description: The attendee's registration status (registered|confirmed|waitlist|attended).
    AttendeeDashboardResponse:
      type: object
      description: 'Story 7.6: the attendee''s event history — every participated (non-cancelled) event, split

        into upcoming (soonest-first) and past (most-recent-first).

        '
      required:
      - upcomingEvents
      - pastEvents
      properties:
        attendeeName:
          type: string
          nullable: true
          description: Display name (denormalized from a registration) or the username.
        upcomingEvents:
          type: array
          items:
            $ref: '#/components/schemas/AttendeeEventCardResponse'
        pastEvents:
          type: array
          items:
            $ref: '#/components/schemas/AttendeeEventCardResponse'
  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            validationError:
              value:
                error: VALIDATION_ERROR
                errorCode: BAD_REQUEST
                message: Invalid filter syntax
                timestamp: 2025-01-15 10:30:00+00:00
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            eventNotFound:
              value:
                error: RESOURCE_NOT_FOUND
                errorCode: NOT_FOUND
                message: Event not found with id evt-999
                timestamp: 2025-01-15 10:30:00+00:00
    UnprocessableEntity:
      description: Request cannot be processed due to business logic
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            workflowError:
              value:
                error: WORKFLOW_ERROR
                errorCode: UNPROCESSABLE_ENTITY
                message: Cannot advance workflow for archived event
                timestamp: 2025-01-15 10:30:00+00:00
            validationError:
              value:
                error: VALIDATION_ERROR
                errorCode: UNPROCESSABLE_ENTITY
                message: Event must have a date before publishing
                timestamp: 2025-01-15 10:30:00+00:00
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            serverError:
              value:
                error: INTERNAL_SERVER_ERROR
                errorCode: INTERNAL_ERROR
                message: An unexpected error occurred
                timestamp: 2025-01-15 10:30:00+00:00
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            forbiddenError:
              value:
                error: FORBIDDEN
                errorCode: FORBIDDEN
                message: Insufficient permissions to perform this action
                timestamp: '2025-01-15T10:30:00Z'
    Unauthorized:
      description: Unauthorized - missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            missingToken:
              value:
                error: UNAUTHORIZED
                errorCode: UNAUTHORIZED
                message: Authentication token is missing or invalid
                timestamp: '2025-01-15T10:30:00Z'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AWS Cognito JWT token
