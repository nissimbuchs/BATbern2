        message:
          type: string
        updatedCount:
          type: integer
    AdminSettingResponse:
      type: object
      properties:
        key:
          type: string
        value:
          type: string
          nullable: true
    SetAdminSettingRequest:
      type: object
      properties:
        value:
          type: string
    QnaWindowPatchRequest:
      type: object
      x-class-extra-annotation: '@com.fasterxml.jackson.annotation.JsonIgnoreProperties(ignoreUnknown = false)'
      properties:
        closesAt:
          type: string
          format: date-time
        close:
          type: boolean
        open:
          type: boolean
    QnaWindowAdjustResponse:
      type: object
      properties:
        eventCode:
          type: string
        windowsAdjusted:
          type: integer
        status:
          type: string
    PublishPhaseResponse:
      type: object
      properties:
        phase:
          type: string
        published:
          type: boolean
        publishedAt:
          type: string
          format: date-time
        cdnInvalidated:
          type: boolean
    UnpublishPhaseResponse:
      type: object
      properties:
        phase:
          type: string
        published:
          type: boolean
        unpublishedAt:
          type: string
          format: date-time
        cdnInvalidated:
          type: boolean
    ValidationStatus:
      type: object
      properties:
        isValid:
          type: boolean
        errors:
          type: array
          items:
            type: string
    UnassignedSession:
      type: object
      properties:
        sessionSlug:
          type: string
        title:
          type: string
    SessionValidationStatus:
      type: object
      properties:
        isValid:
          type: boolean
        errors:
          type: array
          items:
            type: string
        assignedCount:
          type: integer
        totalCount:
          type: integer
        unassignedSessions:
          type: array
          items:
            $ref: '#/components/schemas/UnassignedSession'
    PublishingStatusResponse:
      type: object
      properties:
        currentPhase:
