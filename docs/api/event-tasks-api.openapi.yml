openapi: 3.1.0
info:
  title: BATbern Event Tasks API
  version: 1.0.0
  description: |
    Task system API for the BATbern Event Management Platform.

    **Story 5.5**: Configurable Task System. Covers reusable task templates
    (default + organizer-authored custom) that drive event-planning task generation.
  contact:
    name: BATbern Platform Team
    email: platform@batbern.ch
  license:
    name: Proprietary
    identifier: Proprietary

servers:
  - url: https://api.batbern.ch/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Development

tags:
  - name: Task Templates
    description: Reusable task template management (Story 5.5)
  - name: Event Tasks
    description: Event-planning task instances — creation, assignment, status, completion (Story 5.5)

paths:
  /tasks/templates:
    get:
      tags:
        - Task Templates
      summary: List all task templates
      description: |
        List all task templates (default + custom).

        **Acceptance Criteria**: AC26 (Story 5.5). ORGANIZER role required.
      operationId: listAllTemplates
      responses:
        '200':
          description: All task templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskTemplateResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    - id: b6ce1ea6-8486-4227-86cf-49f14f8966b7
                      name: Venue Booking
                      triggerState: topic_selection
                      dueDateType: relative_to_event
                      dueDateOffsetDays: -90
                      activationLeadDays: 14
                      isDefault: true
                      createdAt: "2025-12-23T21:46:44.141702Z"
                      updatedAt: "2025-12-23T21:46:44.141702Z"
                      createdByUsername: null
                    - id: aeeccba0-d8bb-4d2f-b39f-4f941a188224
                      name: Partner Meeting Coordination
                      triggerState: topic_selection
                      dueDateType: relative_to_event
                      dueDateOffsetDays: 0
                      activationLeadDays: 14
                      isDefault: true
                      createdAt: "2025-12-23T21:46:44.141702Z"
                      updatedAt: "2025-12-23T21:46:44.141702Z"
                      createdByUsername: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Task Templates
      summary: Create a custom task template
      description: |
        Create a new custom task template.

        **Acceptance Criteria**: AC22 (Story 5.5). ORGANIZER role required.
      operationId: createTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskTemplateRequest'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTemplateResponse'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    id: b6ce1ea6-8486-4227-86cf-49f14f8966b7
                    name: Venue Booking
                    triggerState: topic_selection
                    dueDateType: relative_to_event
                    dueDateOffsetDays: -90
                    activationLeadDays: 14
                    isDefault: true
                    createdAt: "2025-12-23T21:46:44.141702Z"
                    updatedAt: "2025-12-23T21:46:44.141702Z"
                    createdByUsername: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks/templates/{templateId}:
    put:
      tags:
        - Task Templates
      summary: Update a custom task template
      description: |
        Update an existing custom task template. Default templates cannot be modified (403).

        **Acceptance Criteria**: AC26 (Story 5.5). ORGANIZER role required.
      operationId: updateTemplate
      parameters:
        - name: templateId
          in: path
          required: true
          description: Task template ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskTemplateRequest'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskTemplateResponse'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    id: b6ce1ea6-8486-4227-86cf-49f14f8966b7
                    name: Venue Booking
                    triggerState: topic_selection
                    dueDateType: relative_to_event
                    dueDateOffsetDays: -90
                    activationLeadDays: 14
                    isDefault: true
                    createdAt: "2025-12-23T21:46:44.141702Z"
                    updatedAt: "2025-12-23T21:46:44.141702Z"
                    createdByUsername: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Task Templates
      summary: Delete a custom task template
      description: |
        Delete a custom task template. Default templates cannot be deleted (403).

        **Acceptance Criteria**: AC26 (Story 5.5). ORGANIZER role required.
      operationId: deleteTemplate
      parameters:
        - name: templateId
          in: path
          required: true
          description: Task template ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Template deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventCode}/tasks:
    get:
      tags:
        - Event Tasks
      summary: List all tasks for an event
      description: 'Story 5.5 AC24. ORGANIZER role required.'
      operationId: listEventTasks
      parameters:
        - $ref: '#/components/parameters/EventCode'
      responses:
        '200':
          description: Event tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventTaskResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
        - Event Tasks
      summary: Create an ad-hoc task for an event
      description: 'Story 5.5 AC22. ORGANIZER role required.'
      operationId: createAdHocTask
      parameters:
        - $ref: '#/components/parameters/EventCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventTaskRequest'
      responses:
        '201':
          description: Task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTaskResponse'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    id: 3cf5db30-92c0-44d2-bb74-4b0f2b4aa574
                    eventId: 8dd9c9a4-35c1-4adb-b1aa-ef81e7b65fe3
                    eventCode: BATbern60
                    templateId: 47540622-0710-4396-a8d4-e0a7d952f86a
                    taskName: Wein
                    triggerState: agenda_published
                    dueDate: "2026-11-06T00:00:00Z"
                    status: todo
                    createdAt: "2026-10-25T09:46:11.349885Z"
                    updatedAt: "2026-10-25T09:46:11.350173Z"
                    assignedOrganizerUsername: null
                    completedByUsername: null
                    completedDate: null
                    notes: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventCode}/tasks/from-templates:
    post:
      tags:
        - Event Tasks
      summary: Create event tasks from templates
      description: 'Story 5.5 AC21. ORGANIZER role required.'
      operationId: createTasksFromTemplates
      parameters:
        - $ref: '#/components/parameters/EventCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTasksFromTemplatesRequest'
      responses:
        '201':
          description: Tasks created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventTaskResponse'
              examples:
                default:
                  summary: captured from the local anonymized database (same schema as a GET)
                  value:
                    []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /tasks/my-tasks:
    get:
      tags:
        - Event Tasks
      summary: List tasks assigned to the current organizer
      description: 'Story 5.5 AC24. ORGANIZER role required.'
      operationId: getMyTasks
      responses:
        '200':
          description: Tasks for the current organizer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventTaskResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks/all-tasks:
    get:
      tags:
        - Event Tasks
      summary: List all tasks across all organizers
      description: 'Story 5.5. ORGANIZER role required.'
      operationId: getAllTasks
      responses:
        '200':
          description: All tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventTaskResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    - id: 3cf5db30-92c0-44d2-bb74-4b0f2b4aa574
                      eventId: 8dd9c9a4-35c1-4adb-b1aa-ef81e7b65fe3
                      eventCode: BATbern60
                      templateId: 47540622-0710-4396-a8d4-e0a7d952f86a
                      taskName: Wein
                      triggerState: agenda_published
                      dueDate: "2026-11-06T00:00:00Z"
                      status: todo
                      createdAt: "2026-10-25T09:46:11.349885Z"
                      updatedAt: "2026-10-25T09:46:11.350173Z"
                      assignedOrganizerUsername: null
                      completedByUsername: null
                      completedDate: null
                      notes: null
                    - id: eb3be7fc-0448-45d8-89a7-a7d9e53d5ef0
                      eventId: 0a5736a5-254c-4ec1-b084-f99be1eb884a
                      eventCode: BATbern58
                      templateId: 51136668-ae83-4506-b7fd-bdad2d64ba22
                      taskName: Catering Coordination
                      triggerState: agenda_published
                      dueDate: "2026-02-04T00:00:00Z"
                      assignedOrganizerUsername: carla.muster
                      status: completed
                      completedDate: "2026-02-25T06:47:16.167211Z"
                      createdAt: "2026-01-09T15:49:11.666082Z"
                      updatedAt: "2026-03-09T10:02:16.054886Z"
                      completedByUsername: null
                      notes: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /tasks/{taskId}:
    patch:
      tags:
        - Event Tasks
      summary: Update a task (status, notes, due date, assignee)
      description: >-
        Patch semantics: only provided fields are updated. Completing, reopening, moving on the
        board and reassigning all use this operation. ORGANIZER role required.
      operationId: updateTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventTaskRequest'
            examples:
              complete:
                summary: Complete a task with a note
                value:
                  status: completed
                  notes: Wine ordered, delivery on the event day
              reopen:
                summary: Reopen a completed task
                value:
                  status: todo
              reassign:
                summary: Reassign a task (an empty string unassigns)
                value:
                  assignedOrganizerUsername: carla.muster
      responses:
        '200':
          description: Task updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTaskResponse'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    id: 3cf5db30-92c0-44d2-bb74-4b0f2b4aa574
                    eventId: 8dd9c9a4-35c1-4adb-b1aa-ef81e7b65fe3
                    eventCode: BATbern60
                    templateId: 47540622-0710-4396-a8d4-e0a7d952f86a
                    taskName: Wein
                    triggerState: agenda_published
                    dueDate: "2026-11-06T00:00:00Z"
                    status: todo
                    createdAt: "2026-10-25T09:46:11.349885Z"
                    updatedAt: "2026-10-25T09:46:11.350173Z"
                    assignedOrganizerUsername: null
                    completedByUsername: null
                    completedDate: null
                    notes: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Event Tasks
      summary: Delete a task
      description: 'Story 5.5. ORGANIZER role required.'
      operationId: deleteTask
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: Task deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  parameters:
    EventCode:
      name: eventCode
      in: path
      required: true
      description: Event code (e.g. BATbern58)
      schema:
        type: string
        example: 'BATbern58'
    TaskId:
      name: taskId
      in: path
      required: true
      description: Task ID
      schema:
        type: string
        format: uuid
  schemas:
    TaskTemplateResponse:
      type: object
      description: A task template (default or custom)
      required:
        - id
        - name
        - triggerState
        - dueDateType
        - isDefault
        - createdAt
        - updatedAt
        - dueDateOffsetDays
        - activationLeadDays
        - createdByUsername
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        triggerState:
          type: string
          description: >-
            What activates this task: an event workflow state in lowercase_snake_case
            (e.g. topic_selection, agenda_published), or speakers_published (the speakers
            phase was published).
        dueDateType:
          type: string
          description: 'Due date type: immediate, relative_to_event, or absolute'
        dueDateOffsetDays:
          nullable: true
          type: integer
          description: Offset days for relative due dates (negative = before event, positive = after)
        activationLeadDays:
          type: integer
          minimum: 0
          nullable: true
          description: >-
            A pending task activates at whichever comes first: its trigger, or this many days
            before its due date. Null = trigger only (post-event templates).
          example: 14
        isDefault:
          type: boolean
          description: Whether this is a default (non-editable) template
        createdByUsername:
          nullable: true
          type: string
          description: Canonical username of the organizer who created the template (null for defaults)
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateTaskTemplateRequest:
      type: object
      description: Request to create a custom task template (Story 5.5 AC22)
      required:
        - name
        - triggerState
        - dueDateType
      properties:
        name:
          type: string
          minLength: 1
          description: Template name
        triggerState:
          type: string
          minLength: 1
          description: Event workflow state that triggers this task
        dueDateType:
          type: string
          minLength: 1
          description: 'Due date type: immediate, relative_to_event, or absolute'
        dueDateOffsetDays:
          type: integer
          description: Offset days for relative due dates (required when dueDateType is relative_to_event)
        activationLeadDays:
          type: integer
          minimum: 0
          description: >-
            Days before the due date at which a pending task activates even if its trigger was
            not reached. Omitted = 14 for triggers before the event, none for event_live,
            event_completed and archived.
          example: 14
        saveAsTemplate:
          type: boolean
          description: '"Save as template" flag (AC22)'
    UpdateTaskTemplateRequest:
      type: object
      description: Request to update a custom task template (Story 5.5 AC26)
      required:
        - name
        - triggerState
        - dueDateType
      properties:
        name:
          type: string
          minLength: 1
          description: Template name
        triggerState:
          type: string
          minLength: 1
          description: Event workflow state that triggers this task
        dueDateType:
          type: string
          minLength: 1
          description: 'Due date type: immediate, relative_to_event, or absolute'
        dueDateOffsetDays:
          type: integer
          description: Offset days for relative due dates
        activationLeadDays:
          type: integer
          minimum: 0
          description: >-
            Days before the due date at which a pending task activates even if its trigger was
            not reached. Omitted = 14 for triggers before the event, none for event_live,
            event_completed and archived.
          example: 14
    EventTaskResponse:
      type: object
      description: An event-planning task instance (Story 5.5)
      required:
        - id
        - taskName
        - triggerState
        - status
        - createdAt
        - updatedAt
        - eventId
        - eventCode
        - templateId
        - dueDate
        - assignedOrganizerUsername
        - notes
        - completedDate
        - completedByUsername
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        eventCode:
          type: string
          description: Event code (null for tasks without an event)
        templateId:
          nullable: true
          type: string
          format: uuid
          description: Source template ID (null for ad-hoc tasks)
        taskName:
          type: string
        triggerState:
          type: string
        dueDate:
          nullable: true
          type: string
          format: date-time
        assignedOrganizerUsername:
          nullable: true
          type: string
        status:
          type: string
          description: >-
            Task status: pending (trigger not reached yet), todo, in_progress, completed, or
            cancelled (event archived, or the newsletter was superseded by a later one)
        notes:
          nullable: true
          type: string
        completedDate:
          nullable: true
          type: string
          format: date-time
        completedByUsername:
          nullable: true
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateEventTaskRequest:
      type: object
      description: Request to create an ad-hoc event task (Story 5.5 AC22)
      required:
        - taskName
        - triggerState
      properties:
        taskName:
          type: string
          minLength: 1
        triggerState:
          type: string
          minLength: 1
          description: The workflow state associated with this task
        dueDate:
          type: string
          format: date-time
        assignedOrganizerUsername:
          type: string
        notes:
          type: string
    CreateTasksFromTemplatesRequest:
      type: object
      description: Request to instantiate event tasks from templates (Story 5.5 AC21)
      required:
        - templates
      properties:
        templates:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TemplateConfig'
    TemplateConfig:
      type: object
      description: Template instantiation entry (template ID + optional assignee)
      required:
        - templateId
      properties:
        templateId:
          type: string
          format: uuid
        assignedOrganizerUsername:
          type: string
          description: Optional organizer username to assign the created task to
    UpdateEventTaskRequest:
      type: object
      description: >-
        Patch request for a task: only provided fields are updated. Status changes go through
        this body too (there are no verb endpoints). Setting status `completed` on a task that
        is not completed records the completion date and the caller as completedByUsername;
        any other status on a completed task clears both.
      properties:
        status:
          type: string
          enum: [pending, todo, in_progress, completed]
          description: 'New task status: pending, todo, in_progress, or completed'
        notes:
          type: string
        dueDate:
          type: string
          format: date-time
        assignedOrganizerUsername:
          type: string
          description: New assignee (empty string = unassign)
    ErrorResponse:
      $ref: './_shared.openapi.yml#/components/schemas/ErrorResponse'

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized - missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from AWS Cognito

security:
  - bearerAuth: []
