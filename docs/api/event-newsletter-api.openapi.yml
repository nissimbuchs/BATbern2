openapi: 3.0.3
info:
  title: BATbern Event Newsletter API
  version: 1.0.0
  description: 'Newsletter subscription and subscriber lifecycle, and email templates. Newsletters and registrant notices are sent through the Mail Center composer (event-mail-api).


    Carved from the consolidated events-api spec (API consolidation Phase 6). Paths preserved verbatim.'
  contact:
    name: BATbern Platform Team
    email: platform@batbern.ch
  license:
    name: Proprietary
servers:
- url: https://api.batbern.ch/api/v1
  description: Production
- url: https://api.batbern.ch/api/v1
  description: Staging
- url: http://localhost:8080/api/v1
  description: Development
security:
- BearerAuth: []
tags:
- name: Email Templates
  description: Email template management for organizers (Story 10.2)
- name: Newsletter
  description: Newsletter subscription, unsubscribe and subscriber management (NewsletterController, Story 10.7); sending is the Mail Center composer
paths:
  /email-templates:
    get:
      tags:
      - Email Templates
      summary: List email templates
      description: 'Returns all email templates with optional filtering by category and layout flag.


        **Story**: 10.2 - Email Template Management

        **Authorization**: ORGANIZER role required.

        '
      operationId: listEmailTemplates
      parameters:
      - name: category
        in: query
        required: false
        description: Filter by category (SPEAKER, REGISTRATION, TASK_REMINDER, LAYOUT, NEWSLETTER, VENUE_COORDINATION, REGISTRANT_NOTICE, PARTNER, MAIL_CENTER)
        schema:
          type: string
          enum:
          - SPEAKER
          - REGISTRATION
          - TASK_REMINDER
          - LAYOUT
          - NEWSLETTER
          - VENUE_COORDINATION
          - REGISTRANT_NOTICE
          - PARTNER
          - MAIL_CENTER
      - name: isLayout
        in: query
        required: false
        description: Filter to layout templates only (true) or content templates only (false)
        schema:
          type: boolean
      responses:
        '200':
          description: List of email templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EmailTemplateResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    - templateKey: registration-confirmed
                      locale: de
                      category: REGISTRATION
                      subject: Anmeldung bestätigt - {{eventCode}} - {{eventTitle}}
                      htmlBody: <p>Sample text for the API example.</p>
                      variables: null
                      isLayout: false
                      layoutKey: batbern-default
                      isSystemTemplate: true
                      updatedAt: "2026-10-18T16:40:06.364789Z"
                    - templateKey: registration-confirmed
                      locale: en
                      category: REGISTRATION
                      subject: Registration confirmed - {{eventCode}} - {{eventTitle}}
                      htmlBody: <p>Sample text for the API example.</p>
                      variables: null
                      isLayout: false
                      layoutKey: batbern-default
                      isSystemTemplate: true
                      updatedAt: "2026-10-18T16:40:06.762901Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - BearerAuth: []
    post:
      tags:
      - Email Templates
      summary: Create a custom email template
      description: 'Creates a new custom (non-system) email template.


        **Story**: 10.2 - Email Template Management

        **Authorization**: ORGANIZER role required.

        '
      operationId: createEmailTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmailTemplateRequest'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplateResponse'
              examples:
                default:
                  summary: captured from the local anonymized database (same schema as a GET)
                  value:
                    templateKey: registration-confirmed
                    locale: de
                    category: REGISTRATION
                    subject: Anmeldung bestätigt - {{eventCode}} - {{eventTitle}}
                    htmlBody: <p>Sample text for the API example.</p>
                    variables: null
                    isLayout: false
                    layoutKey: batbern-default
                    isSystemTemplate: true
                    updatedAt: "2026-10-18T16:40:06.364789Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Template with this key and locale already exists
      security:
      - BearerAuth: []
  /email-templates/{templateKey}/{locale}:
    get:
      tags:
      - Email Templates
      summary: Get a single email template
      description: 'Returns a single email template by key and locale.


        **Story**: 10.2 - Email Template Management

        **Authorization**: ORGANIZER role required.

        '
      operationId: getEmailTemplate
      parameters:
      - name: templateKey
        in: path
        required: true
        description: Template key (e.g. speaker-invitation, batbern-default)
        schema:
          type: string
      - name: locale
        in: path
        required: true
        description: Locale (de or en)
        schema:
          type: string
      responses:
        '200':
          description: Email template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplateResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    templateKey: registration-confirmed
                    locale: de
                    category: REGISTRATION
                    subject: Anmeldung bestätigt - {{eventCode}} - {{eventTitle}}
                    htmlBody: <p>Sample text for the API example.</p>
                    variables: null
                    isLayout: false
                    layoutKey: batbern-default
                    isSystemTemplate: true
                    updatedAt: "2026-10-18T16:40:06.364789Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - BearerAuth: []
    put:
      tags:
      - Email Templates
      summary: Update an email template
      description: 'Updates subject, htmlBody and/or layoutKey of an existing template.


        **Story**: 10.2 - Email Template Management

        **Authorization**: ORGANIZER role required.

        '
      operationId: updateEmailTemplate
      parameters:
      - name: templateKey
        in: path
        required: true
        description: Template key
        schema:
          type: string
      - name: locale
        in: path
        required: true
        description: Locale (de or en)
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmailTemplateRequest'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTemplateResponse'
              examples:
                default:
                  summary: captured from the local anonymized database (same schema as a GET)
                  value:
                    templateKey: registration-confirmed
                    locale: de
                    category: REGISTRATION
                    subject: Anmeldung bestätigt - {{eventCode}} - {{eventTitle}}
                    htmlBody: <p>Sample text for the API example.</p>
                    variables: null
                    isLayout: false
                    layoutKey: batbern-default
                    isSystemTemplate: true
                    updatedAt: "2026-10-18T16:40:06.364789Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - BearerAuth: []
    delete:
      tags:
      - Email Templates
      summary: Delete a custom email template
      description: 'Deletes a custom (non-system) email template. Returns 400 for system or layout templates.


        **Story**: 10.2 - Email Template Management

        **Authorization**: ORGANIZER role required.

        '
      operationId: deleteEmailTemplate
      parameters:
      - name: templateKey
        in: path
        required: true
        description: Template key
        schema:
          type: string
      - name: locale
        in: path
        required: true
        description: Locale (de or en)
        schema:
          type: string
      responses:
        '204':
          description: Template deleted
        '400':
          description: Cannot delete system or layout templates
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - BearerAuth: []
  /newsletter/subscribe:
    post:
      tags:
      - Newsletter
      summary: Subscribe to BATbern newsletter (public)
      operationId: subscribeNewsletter
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsletterSubscribeRequest'
      responses:
        '200':
          description: Successfully subscribed
        '409':
          description: Email already actively subscribed
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '400':
          description: Invalid email address
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
  /newsletter/unsubscribe/verify:
    get:
      tags:
      - Newsletter
      summary: Verify unsubscribe token (public)
      operationId: verifyUnsubscribeToken
      security: []
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Token valid — returns subscriber email
          content:
            application/json:
              schema:
                type: object
                required:
                  - email
                properties:
                  email:
                    type: string
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    email: ines.probe@example.com
        '404':
          description: Token not found or already unsubscribed
  /newsletter/unsubscribe:
    post:
      tags:
      - Newsletter
      summary: Unsubscribe via token (public)
      operationId: unsubscribeNewsletter
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewsletterUnsubscribeRequest'
      responses:
        '200':
          description: Successfully unsubscribed
        '404':
          description: Token not found
  /newsletter/my-subscription:
    get:
      tags:
      - Newsletter
      summary: Get authenticated user's subscription status
      operationId: getMyNewsletterSubscription
      responses:
        '200':
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsletterSubscriptionStatusResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    subscribed: true
                    email: hugo.muster@example.com
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Newsletter
      summary: Update authenticated user's subscription
      operationId: patchMyNewsletterSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchNewsletterSubscriptionRequest'
      responses:
        '200':
          description: Subscription updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsletterSubscriptionStatusResponse'
              examples:
                default:
                  summary: captured from the local anonymized database (same schema as a GET)
                  value:
                    subscribed: true
                    email: hugo.muster@example.com
        '401':
          $ref: '#/components/responses/Unauthorized'
  /newsletter/my-subscriptions:
    get:
      tags:
      - Newsletter
      summary: The authenticated user's newsletter state per address (#1244)
      description: |
        One entry per address of the caller: the primary address first, then every confirmed
        additional address. Unconfirmed addresses are not listed.
      operationId: getMyNewsletterSubscriptions
      responses:
        '200':
          description: Subscription state per address
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyNewsletterSubscriptionsResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    addresses:
                      - email: hugo.muster@example.com
                        primary: true
                        subscribed: true
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - Newsletter
      summary: Subscribe or unsubscribe one of the authenticated user's addresses (#1244)
      description: |
        Changes only the given address; the others stay as they are. The address must be the
        caller's primary or a confirmed additional address (403 otherwise).
      operationId: putMyNewsletterSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutMyNewsletterSubscriptionRequest'
      responses:
        '200':
          description: Subscription state per address after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyNewsletterSubscriptionsResponse'
              examples:
                default:
                  summary: captured from the local anonymized database (same schema as a GET)
                  value:
                    addresses:
                      - email: hugo.muster@example.com
                        primary: true
                        subscribed: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /newsletter/subscribers:
    get:
      tags:
      - Newsletter
      summary: List subscribers with pagination, search, and sort (ORGANIZER)
      operationId: listNewsletterSubscribers
      parameters:
      - name: page
        in: query
        description: Page number (1-based)
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        description: Items per page (max 100)
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
      - name: search
        in: query
        description: Case-insensitive partial match against email or first name
        schema:
          type: string
      - name: status
        in: query
        description: Filter by subscription status
        schema:
          type: string
          enum:
          - all
          - active
          - unsubscribed
          default: all
      - name: sort
        in: query
        description: 'Sort spec (single field; prefix with - for descending). Whitelisted server-side to: email, firstName, subscribedAt, unsubscribedAt, source, language.'
        schema:
          type: string
          default: -subscribedAt
          example: -subscribedAt
      responses:
        '200':
          description: Paginated subscriber list
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriberResponse'
                  pagination:
                    $ref: ./_shared.openapi.yml#/components/schemas/PaginationMetadata
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    data:
                      - id: de815d05-4537-4b40-97dd-072aa9ae79e8
                        email: ines.muster@example.com
                        firstName: Ines
                        language: de
                        source: explicit
                        subscribedAt: "2026-11-03T15:50:15.533757Z"
                        unsubscribedAt: null
                        bounceType: null
                        bounceCount: 0
                        lastBouncedAt: null
                        suppressedAt: null
                        username: null
                      - id: f619e766-ed75-477d-a0a9-4d222ed20ce8
                        email: jonas.muster@example.com
                        firstName: Jonas
                        language: de
                        source: explicit
                        subscribedAt: "2026-11-03T15:17:20.799099Z"
                        unsubscribedAt: null
                        bounceType: null
                        bounceCount: 0
                        lastBouncedAt: null
                        suppressedAt: null
                        username: null
                    pagination:
                      page: 1
                      limit: 2
                      totalItems: 2114
                      totalPages: 1057
                      hasNext: true
                      hasPrev: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /newsletter/subscribers/{id}/unsubscribe:
    post:
      tags:
      - Newsletter
      summary: Unsubscribe a subscriber by ID (ORGANIZER)
      operationId: unsubscribeSubscriberById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Subscriber unsubscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberResponse'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    id: de815d05-4537-4b40-97dd-072aa9ae79e8
                    email: jonas.probe@example.com
                    firstName: Jonas
                    language: de
                    source: explicit
                    subscribedAt: "2026-11-03T15:50:15.533757Z"
                    unsubscribedAt: null
                    bounceType: null
                    bounceCount: 0
                    lastBouncedAt: null
                    suppressedAt: null
                    username: null
        '404':
          description: Subscriber not found
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '409':
          description: Subscriber already unsubscribed
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /newsletter/subscribers/{id}/resubscribe:
    post:
      tags:
      - Newsletter
      summary: Re-subscribe a subscriber by ID (ORGANIZER)
      operationId: resubscribeSubscriberById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Subscriber re-subscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberResponse'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    id: de815d05-4537-4b40-97dd-072aa9ae79e8
                    email: jonas.probe@example.com
                    firstName: Jonas
                    language: de
                    source: explicit
                    subscribedAt: "2026-11-03T15:50:15.533757Z"
                    unsubscribedAt: null
                    bounceType: null
                    bounceCount: 0
                    lastBouncedAt: null
                    suppressedAt: null
                    username: null
        '404':
          description: Subscriber not found
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '409':
          description: Subscriber already active
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /newsletter/subscribers/{id}/unsuppress:
    post:
      tags:
      - Newsletter
      summary: Unsuppress a subscriber by ID (ORGANIZER) — Story 10.29
      operationId: unsuppressSubscriberById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Subscriber unsuppressed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriberResponse'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    id: de815d05-4537-4b40-97dd-072aa9ae79e8
                    email: jonas.probe@example.com
                    firstName: Jonas
                    language: de
                    source: explicit
                    subscribedAt: "2026-11-03T15:50:15.533757Z"
                    unsubscribedAt: null
                    bounceType: null
                    bounceCount: 0
                    lastBouncedAt: null
                    suppressedAt: null
                    username: null
        '404':
          description: Subscriber not found
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '409':
          description: Subscriber is not suppressed
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /newsletter/subscribers/{id}:
    delete:
      tags:
      - Newsletter
      summary: Delete a subscriber by ID (ORGANIZER)
      operationId: deleteSubscriberById
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Subscriber deleted
        '404':
          description: Subscriber not found
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  schemas:
    NewsletterSubscribeRequest:
      type: object
      required:
      - email
      properties:
        email:
          type: string
          format: idn-email
          # One email rule everywhere (#1102): ASCII local part (SES has no SMTPUTF8), any domain.
          # Source of truth: shared-kernel EmailAddresses.OPENAPI_PATTERN.
          pattern: '^[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+(\.[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+)*@[^\s@.]+(\.[^\s@.]+)+$'
          maxLength: 254
        firstName:
          type: string
          maxLength: 100
        language:
          type: string
          enum:
          - de
          - en
          default: de
    NewsletterUnsubscribeRequest:
      type: object
      required:
      - token
      properties:
        token:
          type: string
    NewsletterSubscriptionStatusResponse:
      type: object
      required:
      - subscribed
      - email
      properties:
        subscribed:
          type: boolean
        email:
          nullable: true
          type: string
    SubscriberResponse:
      type: object
      required:
      - id
      - email
      - subscribedAt
      - firstName
      - language
      - source
      - username
      - unsubscribedAt
      - bounceType
      - bounceCount
      - lastBouncedAt
      - suppressedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          nullable: true
          type: string
        language:
          type: string
        source:
          type: string
        username:
          nullable: true
          type: string
        subscribedAt:
          type: string
          format: date-time
        unsubscribedAt:
          type: string
          format: date-time
          nullable: true
        bounceType:
          type: string
          nullable: true
          description: 'Bounce type: ''hard'', ''soft'', ''complaint'', or null'
        bounceCount:
          type: integer
          nullable: true
          description: Number of bounces recorded
        lastBouncedAt:
          type: string
          format: date-time
          nullable: true
        suppressedAt:
          type: string
          format: date-time
          nullable: true
          description: Non-null means subscriber is excluded from sends
    EmailTemplateResponse:
      type: object
      description: Email template with full content and metadata
      required:
      - templateKey
      - locale
      - category
      - htmlBody
      - isLayout
      - isSystemTemplate
      - updatedAt
      - subject
      - variables
      - layoutKey
      properties:
        templateKey:
          type: string
          description: Template identifier key (e.g. speaker-invitation, batbern-default)
        locale:
          type: string
          description: Locale code (de or en)
        category:
          type: string
          description: Template category
          enum:
          - SPEAKER
          - REGISTRATION
          - TASK_REMINDER
          - LAYOUT
          - NEWSLETTER
          - VENUE_COORDINATION
          - REGISTRANT_NOTICE
          - PARTNER
          - MAIL_CENTER
        subject:
          type: string
          nullable: true
          description: Email subject line (null for layout templates)
          maxLength: 500
        htmlBody:
          type: string
          description: HTML body content
        variables:
          type: object
          nullable: true
          description: Available template variables (JSONB)
          additionalProperties: true
        isLayout:
          type: boolean
          description: True if this is a layout (shell) template
        layoutKey:
          type: string
          nullable: true
          description: Key of the layout template to use (null for standalone or layout templates)
        isSystemTemplate:
          type: boolean
          description: True if this is a built-in system template (cannot be deleted)
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
    CreateEmailTemplateRequest:
      type: object
      description: Request to create a custom email template
      required:
      - templateKey
      - locale
      - category
      - htmlBody
      properties:
        templateKey:
          type: string
          description: Unique template key (kebab-case, no spaces)
          maxLength: 100
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        locale:
          type: string
          description: Locale code (de or en)
          maxLength: 5
        category:
          type: string
          description: Template category
          enum:
          - SPEAKER
          - REGISTRATION
          - TASK_REMINDER
          - LAYOUT
          - NEWSLETTER
          - VENUE_COORDINATION
          - REGISTRANT_NOTICE
          - PARTNER
          - MAIL_CENTER
        subject:
          type: string
          nullable: true
          description: Email subject (required for content templates, null for layout)
          maxLength: 500
        htmlBody:
          type: string
          description: HTML body content
        variables:
          type: object
          nullable: true
          description: Available template variables
          additionalProperties: true
        isLayout:
          type: boolean
          description: Whether this is a layout template
          default: false
        layoutKey:
          type: string
          nullable: true
          description: Layout template key to use (e.g. batbern-default)
          maxLength: 100
    UpdateEmailTemplateRequest:
      type: object
      description: Request to update an existing email template
      properties:
        subject:
          type: string
          nullable: true
          description: Updated subject line (null for layout templates)
          maxLength: 500
        htmlBody:
          type: string
          description: Updated HTML body
        layoutKey:
          type: string
          nullable: true
          description: Updated layout key (null = standalone)
          maxLength: 100
    MyNewsletterSubscriptionsResponse:
      type: object
      required:
      - addresses
      properties:
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/NewsletterAddressSubscription'
    NewsletterAddressSubscription:
      type: object
      required:
      - email
      - primary
      - subscribed
      properties:
        email:
          type: string
          description: Lower-cased address.
        primary:
          type: boolean
          description: The account's primary address.
        subscribed:
          type: boolean
    PutMyNewsletterSubscriptionRequest:
      type: object
      required:
      - email
      - subscribed
      properties:
        email:
          type: string
          format: idn-email
          # One email rule everywhere (#1102): ASCII local part (SES has no SMTPUTF8), any domain.
          # Source of truth: shared-kernel EmailAddresses.OPENAPI_PATTERN.
          pattern: '^[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+(\.[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+)*@[^\s@.]+(\.[^\s@.]+)+$'
          maxLength: 254
        subscribed:
          type: boolean
        language:
          type: string
          nullable: true
          default: de
          description: Preferred newsletter language when subscribing; defaults to 'de'.
    PatchNewsletterSubscriptionRequest:
      type: object
      required:
      - subscribed
      properties:
        subscribed:
          type: boolean
        language:
          type: string
          nullable: true
          default: de
          description: Preferred newsletter language; defaults to 'de' when omitted.
  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            validationError:
              value:
                error: VALIDATION_ERROR
                errorCode: BAD_REQUEST
                message: Invalid filter syntax
                timestamp: 2025-01-15 10:30:00+00:00
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            eventNotFound:
              value:
                error: RESOURCE_NOT_FOUND
                errorCode: NOT_FOUND
                message: Event not found with id evt-999
                timestamp: 2025-01-15 10:30:00+00:00
    UnprocessableEntity:
      description: Request cannot be processed due to business logic
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            workflowError:
              value:
                error: WORKFLOW_ERROR
                errorCode: UNPROCESSABLE_ENTITY
                message: Cannot advance workflow for archived event
                timestamp: 2025-01-15 10:30:00+00:00
            validationError:
              value:
                error: VALIDATION_ERROR
                errorCode: UNPROCESSABLE_ENTITY
                message: Event must have a date before publishing
                timestamp: 2025-01-15 10:30:00+00:00
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            serverError:
              value:
                error: INTERNAL_SERVER_ERROR
                errorCode: INTERNAL_ERROR
                message: An unexpected error occurred
                timestamp: 2025-01-15 10:30:00+00:00
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            forbiddenError:
              value:
                error: FORBIDDEN
                errorCode: FORBIDDEN
                message: Insufficient permissions to perform this action
                timestamp: '2025-01-15T10:30:00Z'
    Unauthorized:
      description: Unauthorized - missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            missingToken:
              value:
                error: UNAUTHORIZED
                errorCode: UNAUTHORIZED
                message: Authentication token is missing or invalid
                timestamp: '2025-01-15T10:30:00Z'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AWS Cognito JWT token
