openapi: 3.0.3
info:
  title: BATbern Event Sessions API
  version: 1.0.0
  description: 'Session CRUD, agenda configuration, timetable, slot assignment, session-speaker assignment/confirm/decline, batch import, and per-session Q&A.


    Carved from the consolidated events-api spec (API consolidation Phase 6). Paths preserved verbatim.'
  contact:
    name: BATbern Platform Team
    email: platform@batbern.ch
  license:
    name: Proprietary
servers:
- url: https://api.batbern.ch/api/v1
  description: Production
- url: https://api.batbern.ch/api/v1
  description: Staging
- url: http://localhost:8080/api/v1
  description: Development
security:
- BearerAuth: []
tags:
- name: Event Actions
  description: Event publishing and workflow operations
- name: Sessions
  description: Event session CRUD, structural generation and batch import (SessionController)
- name: Slot Assignment
  description: Place a speaker session onto a stable timetable slot key — assign/insert/swap
    (SlotAssignmentController, Story 15.3)
- name: Session Speakers
  description: Session-user speaker assignments — assign/list/remove/confirm/decline (SessionSpeakerController,
    Story 1.15a.1b)
- name: Session Materials
  description: Per-session uploaded materials (slide decks / documents) — associate/list/download/delete
    + batch-import-from-URL (SessionMaterialsController, Story 5.9)
- name: Agenda Config
  description: Per-event agenda/slot configuration with copy-on-edit override (Story 15.2,
    AgendaConfigController)
- name: Session QnA
  description: Per-session Q&A thread — public read, authenticated post, organizer takedown (SessionQnaController)
- name: Timetable
  description: Authoritative per-event timetable / slot grid (TimetableController)
- name: Bulk Operations
  description: Batch operations on multiple events
- name: Company Sessions
  description: Cross-event session search by company — sessions with at least one speaker
    from the given company, enriched with event + full speaker context (GlobalSessionController,
    organizer Company-detail Sessions tab)
paths:
  /sessions:
    get:
      tags:
      - Company Sessions
      summary: Search sessions across all events by company
      description: 'Returns sessions where at least one speaker belongs to the given company,
        enriched with event metadata and the full speaker list per session (so the frontend can
        highlight the company''s speakers). ORGANIZER role required. A blank/absent `companyName`
        yields an empty page.'
      operationId: searchSessionsByCompany
      parameters:
      - name: companyName
        in: query
        description: Company name (ADR-003 meaningful ID). Blank/absent → empty result.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: 1-indexed page number
        schema:
          type: integer
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 50
      responses:
        '200':
          description: Paginated company sessions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CompanySessionResponse'
                  pagination:
                    $ref: ./_shared.openapi.yml#/components/schemas/PaginationMetadata
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - bearerAuth: []
  /events/{eventCode}/sessions/{sessionSlug}/qna:
    get:
      tags:
      - Session QnA
      summary: Get a session's Q&A thread ("The Apéro Continues")
      description: 'Returns the open or frozen Q&A thread for a session. PUBLIC — anonymous may read the

        frozen archive thread (AC3). Posts are returned oldest-first; the client nests answers

        under their `parentPostId`. Removed posts are tombstones (`removed: true`, body/author null).


        **Story**: 7.5 - "The Apéro Continues"

        '
      operationId: getSessionQna
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern57
      - name: sessionSlug
        in: path
        required: true
        schema:
          type: string
        example: cloud-native-foundations
      responses:
        '200':
          description: The Q&A thread (open or frozen).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QnaWindowResponse'
        '404':
          description: No Q&A window for this session (event not completed, or unknown session).
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []
    patch:
      tags:
      - Event Actions
      summary: Extend or close a session's Q&A window (organizer)
      description: 'Organizer-only (AC4). Extend by sending a new `closesAt` (reopens to that time) or close

        early with `close: true` (freezes immediately). Changes take effect immediately.


        **Story**: 7.5 - "The Apéro Continues"

        '
      operationId: patchSessionQnaWindow
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern57
      - name: sessionSlug
        in: path
        required: true
        schema:
          type: string
        example: cloud-native-foundations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QnaWindowPatchRequest'
      responses:
        '200':
          description: Updated window.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QnaWindowResponse'
        '400':
          description: Neither closesAt nor close provided.
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No Q&A window for this session.
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - BearerAuth: []
  /events/{eventCode}/sessions/{sessionSlug}/qna/posts:
    post:
      tags:
      - Session QnA
      summary: Post a Q&A question or answer (logged-in)
      description: 'Any logged-in user may post within an open window (AC2). `parentPostId` set = an answer to

        that question; omitted = a top-level question. Anonymous → 401 (rejected at the gateway).

        Posting to a frozen window → 409 `QNA_WINDOW_FROZEN` (AC5).


        **Story**: 7.5 - "The Apéro Continues"

        '
      operationId: postSessionQna
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern57
      - name: sessionSlug
        in: path
        required: true
        schema:
          type: string
        example: cloud-native-foundations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QnaPostRequest'
      responses:
        '201':
          description: Post created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QnaPostResponse'
        '400':
          description: Validation error (empty/too-long body or unknown field).
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '401':
          description: Not authenticated (anonymous caller — rejected at the API gateway).
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '404':
          description: No Q&A window for this session.
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '409':
          description: '`QNA_WINDOW_FROZEN` — the Q&A for this session has closed.

            '
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
              example:
                message: The Q&A for this session has closed — no further posts are accepted.
                status: 409
                error: Conflict
                details:
                  code: QNA_WINDOW_FROZEN
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - BearerAuth: []
  /events/{eventCode}/sessions/{sessionSlug}/qna/posts/{postId}:
    delete:
      tags:
      - Session QnA
      summary: Take down a Q&A post (organizer)
      description: 'Organizer-only soft-delete (AC4): the post becomes a "removed by organizer" tombstone

        (never hard-deleted), preserving thread coherence in the frozen archive.


        **Story**: 7.5 - "The Apéro Continues"

        '
      operationId: removeSessionQnaPost
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern57
      - name: sessionSlug
        in: path
        required: true
        schema:
          type: string
        example: cloud-native-foundations
      - name: postId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Post removed (tombstoned).
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Post or Q&A window not found.
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - BearerAuth: []
  /events/{eventCode}/sessions:
    get:
      tags:
      - Sessions
      summary: List event sessions
      description: 'Retrieve all sessions for a specific event with optional filtering.


        **Acceptance Criteria**: AC9

        **Story**: 1.16.2 - Uses eventCode (meaningful ID) instead of UUID


        **Filter Examples**:

        - By type: `{"type":"keynote"}`

        - By time range: `{"startTime":{"$gte":"2025-05-15T09:00:00Z"}}`

        '
      operationId: listSessions
      parameters:
      - name: eventCode
        in: path
        description: Event code in format BATbern{number}
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern142
      - name: filter
        in: query
        description: JSON filter criteria
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: 1-indexed page number
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          maximum: 100
      responses:
        '200':
          description: Sessions retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionResponse'
                  pagination:
                    $ref: ./_shared.openapi.yml#/components/schemas/PaginationMetadata
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Sessions
      summary: Create session
      description: 'Create a new session for the event.


        **Acceptance Criteria**: AC10

        **Story**: 1.16.2 - Uses eventCode (meaningful ID) instead of UUID

        '
      operationId: createSession
      parameters:
      - name: eventCode
        in: path
        description: Event code in format BATbern{number}
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern142
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /events/{eventCode}/timetable:
    get:
      tags:
      - Timetable
      summary: Get the authoritative timetable for an event
      description: 'Returns the complete chronological slot grid for the event, including both

        structural slots (MODERATION, BREAK, LUNCH) and droppable speaker slots

        (SPEAKER_SLOT).  Structural slots are enriched with DB session slugs when

        structural sessions have been generated.  Speaker slots show which speaker

        session (if any) has been assigned to each position.


        This endpoint is the single source of truth for the slot-assignment UI —

        both the grid display and the auto-assign algorithm use these positions.


        **Access**: ORGANIZER role required.

        '
      operationId: getEventTimetable
      security:
      - BearerAuth: []
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
        example: BATbern142
      responses:
        '200':
          description: Timetable successfully retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /events/{eventCode}/sessions/{sessionSlug}/slot:
    post:
      tags:
      - Slot Assignment
      summary: Assign / insert / swap a speaker session by stable slot key (Story 15.3)
      description: "Places a speaker session onto a `SPEAKER_SLOT` addressed by its deterministic\n`slotKey` (see `TimetableSlot.slotKey`). One path covers three modes:\n\n- `ASSIGN` — target slot is empty: the session takes that slot's computed times.\n- `INSERT` — target slot is occupied: the session takes the target ordinal and\n  every already-assigned session at that ordinal or later shifts one slot later;\n  all affected sessions' times are recomputed and saved in a single transaction.\n  Rejected with **409** if the shift would exceed the last computed speaker slot\n  (agenda full).\n- `SWAP` — target slot is occupied: the dragged (already-assigned) session and the\n  occupant exchange slots (and times).\n\nSession time persistence is unchanged — `startTime`/`endTime` remain the stored\nauthority; this endpoint only recomputes and saves them for the affected sessions.\n\n**Access**: ORGANIZER role required.\n"
      operationId: assignSessionToSlot
      security:
      - BearerAuth: []
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
        example: BATbern142
      - name: sessionSlug
        in: path
        required: true
        schema:
          type: string
        example: speaker-xyz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotAssignmentRequest'
      responses:
        '200':
          description: Assignment applied; returns the updated timetable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimetableResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Agenda is full (no free slot to insert into) or a timing conflict was detected
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse

  /events/{eventCode}/sessions/unassigned:
    get:
      tags:
      - Slot Assignment
      summary: List unassigned (placeholder) sessions for an event (Story 5.7)
      description: 'Placeholder sessions without timing, enriched with speaker data. ORGANIZER role.'
      operationId: getUnassignedSessions
      security:
      - BearerAuth: []
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Unassigned sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventCode}/sessions/{sessionSlug}/timing:
    patch:
      tags:
      - Slot Assignment
      summary: Assign timing to a session (drag-and-drop) (Story 5.7)
      description: 'Detects room/speaker conflicts before assigning. ORGANIZER role.'
      operationId: assignTiming
      security:
      - BearerAuth: []
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      - name: sessionSlug
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionTimingRequest'
      responses:
        '200':
          description: Timing assigned; returns the updated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Timing conflict (room overlap or speaker double-booking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimingConflictError'
    delete:
      tags:
      - Slot Assignment
      summary: Unassign a single session's timing (Story 15.3)
      description: 'Clears startTime/endTime/room (back to the unassigned pool). ORGANIZER role.'
      operationId: unassignTiming
      security:
      - BearerAuth: []
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      - name: sessionSlug
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Timing cleared; returns the updated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventCode}/sessions/bulk-timing:
    post:
      tags:
      - Slot Assignment
      summary: Bulk-assign timing to multiple sessions (Story 5.7 AC13)
      description: 'All-or-nothing: any cross-assignment conflict applies no changes. ORGANIZER role.'
      operationId: bulkAssignTiming
      security:
      - BearerAuth: []
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkTimingRequest'
      responses:
        '200':
          description: Bulk assignment applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTimingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Bulk timing conflicts detected — no changes applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkTimingConflictError'

  /events/{eventCode}/sessions/conflicts:
    get:
      tags:
      - Slot Assignment
      summary: Comprehensive scheduling-conflict analysis (Story 5.7 AC9)
      description: 'Detects all room/speaker conflicts across the event. ORGANIZER role.'
      operationId: analyzeConflicts
      security:
      - BearerAuth: []
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Conflict analysis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictAnalysisResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventCode}/sessions/timing:
    delete:
      tags:
      - Slot Assignment
      summary: Clear all session timings for an event (Clear All)
      description: 'Resets every session to unassigned. ORGANIZER role.'
      operationId: clearAllTimings
      security:
      - BearerAuth: []
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: All timings cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearTimingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventCode}/sessions/auto-assign:
    post:
      tags:
      - Slot Assignment
      summary: Auto-assign all unassigned sessions to available slots (Auto Assign)
      description: 'Assigns sessions sequentially to available time slots. ORGANIZER role.'
      operationId: autoAssignTimings
      security:
      - BearerAuth: []
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Sessions auto-assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoAssignResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /events/{eventCode}/agenda-config:
    get:
      tags:
      - Agenda Config
      summary: Get the resolved agenda config for an event (Story 15.2)
      description: 'Returns the effective agenda/slot configuration for the event: the per-event

        copy-on-edit override (`event_agenda_config`) if one exists, otherwise the shared

        event-type template (`event_types`). The `source` field indicates which was returned.


        **Access**: ORGANIZER role required.

        '
      operationId: getEventAgendaConfig
      security:
      - BearerAuth: []
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
        example: BATbern142
      responses:
        '200':
          description: Resolved agenda config
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAgendaConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Agenda Config
      summary: Upsert the per-event agenda config override (Story 15.2)
      description: 'Copy-on-edit: creates or updates the per-event `event_agenda_config` row from the

        provided knobs. The shared event-type template is never modified. Returns the saved

        per-event config (with `source = EVENT_OVERRIDE`).


        **Access**: ORGANIZER role required.

        '
      operationId: updateEventAgendaConfig
      security:
      - BearerAuth: []
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
        example: BATbern142
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventAgendaConfigRequest'
      responses:
        '200':
          description: Per-event agenda config saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAgendaConfigResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /events/{eventCode}/sessions/structural:
    post:
      tags:
      - Sessions
      - Organizer
      summary: Generate structural sessions for an event
      description: 'Generates structural sessions (moderation start, breaks, lunch, moderation end)

        with computed start/end times based on the event type configuration.


        The organizer is automatically assigned as MODERATOR on both moderation sessions.


        **Requires ORGANIZER role.**


        If `overwrite=false` (default) and structural sessions already exist, returns 409.

        If `overwrite=true`, deletes existing structural sessions and recreates them.

        '
      operationId: generateStructuralSessions
      security:
      - BearerAuth: []
      parameters:
      - name: eventCode
        in: path
        description: Event code in format BATbern{number}
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern142
      - name: overwrite
        in: query
        description: When true, delete existing structural sessions before regenerating
          (otherwise 409 if they already exist).
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '201':
          description: Structural sessions created
          content:
            application/json:
