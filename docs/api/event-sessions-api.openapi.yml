  /events/{eventCode}/sessions/batch-import:
    post:
      tags:
      - Sessions
      - Bulk Operations
      summary: Batch import sessions from legacy JSON
      description: 'Import multiple sessions from sessions.json with speaker assignments.


        **Features**:

        - Duplicate detection by (event_id, title)

        - Automatic speaker assignment via speakerId → username matching

        - Sequential 45-minute time slot calculation

        - Graceful error handling for missing speakers


        **Note**: This endpoint is designed for historical data migration from

        the legacy BATspa application. For normal session creation, use the

        POST /events/{eventCode}/sessions endpoint.

        '
      operationId: batchImportSessions
      parameters:
      - name: eventCode
        in: path
        description: Event code in format BATbern{number}
        required: true
        schema:
          type: string
          pattern: ^BATbern[0-9]+$
          example: BATbern142
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/BatchImportSessionRequest'
            example:
            - bat: 142
              title: User Interface Design
              abstract: Discussion on modern UI patterns
              pdf: BAT142_UI_Design.pdf
              referenten:
              - name: Thomas Goetz, Die Mobiliar
                bio: Expert in UI design
                company: mobiliar
                portrait: thomas.goetz.jpg
                speakerId: thomas.goetz
      responses:
        '200':
          description: Import completed (may include skipped/failed sessions)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchImportSessionResult'
              example:
                totalProcessed: 3
                successfullyCreated: 2
                skipped: 1
                failed: 0
                details:
                - title: User Interface Design
                  status: success
                  message: Session created successfully
                  sessionSlug: user-interface-design-abc123
                - title: Backend Architecture
                  status: skipped
                  message: Session already exists with title 'Backend Architecture'
                - title: Database Design
                  status: success
                  message: Session created successfully
                  sessionSlug: database-design-def456
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Event not found
          content:
            application/json:
              schema:
                $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
      - BearerAuth: []
  /events/{eventCode}/sessions/{sessionSlug}:
    get:
      tags:
      - Sessions
      summary: Get session details
      description: 'Retrieve detailed information about a specific session including speakers.


        **Story**: 1.15a.1b - Session-User Many-to-Many Relationship

        **Story**: 4.1.3 - Public event discovery endpoints


        Returns session information including:

        - Session details (title, description, time, room)

        - Speaker list with enriched User data

        - Confirmation status for each speaker


        **Public Endpoint**: No authentication required for GET requests

        '
      operationId: getSession
      parameters:
      - name: eventCode
        in: path
