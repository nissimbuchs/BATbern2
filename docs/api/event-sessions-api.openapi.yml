components:
  schemas:
    CompanySessionResponse:
      type: object
      description: 'A session that has at least one speaker from the queried company, combined
        with event + full-speaker context (GlobalSessionController / Company-detail Sessions tab).'
      x-class-extra-annotation: '@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)'
      properties:
        sessionSlug:
          type: string
          description: Session slug (event-scoped identifier)
        eventCode:
          type: string
          example: BATbern57
        eventTitle:
          type: string
          description: Title of the event this session belongs to
        eventDate:
          type: string
          description: Event date (ISO-8601)
        title:
          type: string
          description: Session title
        sessionType:
          type: string
          description: Session type (e.g. talk, aperitif)
        startTime:
          type: string
          description: Session start time (ISO-8601)
        endTime:
          type: string
          description: Session end time (ISO-8601)
        room:
          type: string
          description: Room / location
        speakers:
          type: array
          description: All speakers of this session (includes speakers from other companies)
          items:
            $ref: '#/components/schemas/SessionSpeaker'
    SessionTimingRequest:
      type: object
      description: Assign timing (start/end/room) to a session — Story 5.7 drag-and-drop
      required:
      - startTime
      - endTime
      properties:
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        room:
          type: string
        sessionType:
          type: string
        changeReason:
          type: string
        notes:
          type: string
    BulkTimingAssignment:
      type: object
      required:
      - sessionSlug
      - startTime
      - endTime
      properties:
        sessionSlug:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        room:
          type: string
    BulkTimingRequest:
      type: object
      required:
      - assignments
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/BulkTimingAssignment'
        changeReason:
          type: string
    BulkTimingResponse:
      type: object
      properties:
        assignedCount:
          type: integer
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionResponse'
    ConflictType:
      type: string
      description: Scheduling-conflict type (lowercase wire values)
      enum:
      - room_overlap
      - speaker_double_booked
      - speaker_unavailable
      - preference_mismatch
    ConflictSeverity:
      type: string
      enum:
      - error
      - warning
    ConflictTimeRange:
      type: object
      properties:
        start:
          type: string
        end:
          type: string
    ConflictDetail:
      type: object
      properties:
        sessionSlug:
          type: string
        conflictType:
          $ref: '#/components/schemas/ConflictType'
        severity:
          $ref: '#/components/schemas/ConflictSeverity'
        affectedSessions:
          type: array
          items:
            type: string
        timeRange:
          $ref: '#/components/schemas/ConflictTimeRange'
        resolution:
          type: string
    ConflictAnalysisResponse:
      type: object
      description: Comprehensive scheduling-conflict analysis (Story 5.7 AC9)
      properties:
        hasConflicts:
          type: boolean
        conflictCount:
          type: integer
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConflictDetail'
    TimingConflictItem:
      type: object
      properties:
        type:
          type: string
        conflictingSessionSlug:
          type: string
    TimingConflictError:
      type: object
      description: 409 body when a single-session timing assignment conflicts
      properties:
        error:
          type: string
        message:
          type: string
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/TimingConflictItem'
    BulkTimingConflictError:
      type: object
      description: 409 body when a bulk timing assignment has cross-conflicts (no changes applied)
      properties:
        error:
          type: string
        message:
          type: string
        conflictCount:
          type: integer
    ClearTimingsResponse:
      type: object
      properties:
        message:
          type: string
        clearedCount:
          type: integer
    AutoAssignResponse:
      type: object
      properties:
        message:
          type: string
        assignedCount:
          type: integer
    SlotAssignmentRequest:
      type: object
      description: 'Request to place a speaker session onto a slot addressed by its stable `slotKey`

        (Story 15.3). `mode` selects assign / insert-and-reflow / swap behaviour.

        '
      required:
      - targetSlotKey
      - mode
      properties:
        targetSlotKey:
          type: string
          description: The `slotKey` of the target SPEAKER_SLOT (e.g. "SPEAKER_SLOT-3").
          example: SPEAKER_SLOT-3
        mode:
          type: string
          enum:
          - ASSIGN
          - INSERT
          - SWAP
          description: 'ASSIGN onto an empty slot, INSERT before an occupied slot (shifts later sessions + reflows times), or SWAP with the occupant of an occupied slot.

            '
          example: INSERT
    TimetableSlot:
      type: object
      description: 'A single slot in the event timetable. SPEAKER_SLOT entries represent droppable

        speaker positions (the implicit gaps between structural sessions). All other types

        map to persisted structural sessions (moderation, break, lunch).

        '
      required:
      - type
      - startTime
      - endTime
      properties:
        type:
          type: string
          enum:
          - MODERATION
          - BREAK
          - LUNCH
          - APERITIF
          - SPEAKER_SLOT
          description: Slot type — determines rendering and whether the slot is droppable
          example: SPEAKER_SLOT
        slotKey:
          type: string
          description: 'Deterministic, computed slot identity: segment type + 1-based ordinal among that type, in computed order (e.g. "MODERATION-1", "APERITIF-1", "SPEAKER_SLOT-3", "BREAK-2"). Stable across timing/config edits — the UI and the slot-assign endpoint address slots by this key rather than by wall-clock time. Computed/transient (Story 15.3); never persisted on a session.

            '
          example: SPEAKER_SLOT-3
        startTime:
          type: string
          format: date-time
          description: Slot start time (UTC ISO-8601)
          example: '2025-06-15T07:05:00Z'
        endTime:
          type: string
          format: date-time
          description: Slot end time (UTC ISO-8601)
          example: '2025-06-15T07:50:00Z'
        title:
          type: string
          nullable: true
          description: Human-readable label for structural slots; null for SPEAKER_SLOT
          example: Kaffee-Pause
        slotIndex:
          type: integer
          nullable: true
          description: '1-based global index for SPEAKER_SLOT entries across the full event day (never reset when switching AM → PM block). Null for structural slots.

            '
          example: 1
        sessionSlug:
          type: string
          nullable: true
          description: 'Session slug of the structural DB session occupying this slot. Null when no structural sessions have been generated yet, or for SPEAKER_SLOT.

            '
          example: moderation-start-abc
        assignedSessionSlug:
          type: string
          nullable: true
          description: 'Session slug of the speaker session assigned to this SPEAKER_SLOT. Null if the slot is free, or for structural slots.

            '
          example: speaker-xyz
    TimetableResponse:
      type: object
      description: Full timetable for an event including slot grid and unassigned sessions.
      required:
      - slots
      - unassignedSessions
      properties:
        slots:
          type: array
          description: All slots in chronological order (structural and speaker slots interleaved)
          items:
            $ref: '#/components/schemas/TimetableSlot'
        unassignedSessions:
          type: array
          description: Speaker sessions (non-structural) with no startTime assigned yet
          items:
            $ref: '#/components/schemas/SessionResponse'
    Session:
      type: object
      description: 'Story 1.16.2: Uses sessionSlug and eventCode as meaningful IDs


        **Placeholder Session Pattern (V21):**

        Sessions can be created as placeholders when speakers accept invitations.

        Placeholder sessions have title but null sessionType/startTime/endTime.

        Timing is assigned later during slot assignment workflow (Story 5.7).

        '
      required:
      - sessionSlug
      - eventCode
      - title
      properties:
        sessionSlug:
          type: string
          description: URL-friendly slug generated from session title
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          example: keynote-opening-session
          maxLength: 200
        eventCode:
          type: string
          description: Event code this session belongs to
          pattern: ^BATbern[0-9]+$
          example: BATbern142
        title:
          type: string
          maxLength: 255
        description:
          type: string
        sessionType:
          type: string
          nullable: true
          description: 'Session type — null for placeholder sessions, assigned during agenda
            planning. Free-form string (NOT a closed enum): the deployed contract returns
            additional values such as `aperitif`, so callers must tolerate unknown types.
            Known values: keynote, presentation, workshop, panel_discussion, networking,
            break, lunch, moderation, aperitif.'
          example: keynote
        startTime:
          type: string
          format: date-time
          nullable: true
          description: Session start time - null for placeholder sessions, assigned during slot assignment
        endTime:
          type: string
          format: date-time
          nullable: true
          description: Session end time - null for placeholder sessions, assigned during slot assignment
        room:
          type: string
          maxLength: 100
          example: Main Hall
        capacity:
          type: integer
          example: 200
        language:
          type: string
          maxLength: 10
          example: de
          default: de
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        speakers:
          type: array
          description: 'Story 1.15a.1b: Session speakers with enriched User data

            List of speakers assigned to this session with their roles

            '
          items:
            $ref: '#/components/schemas/SessionSpeaker'
        materialsStatus:
          type: string
          description: 'Material submission workflow status. Free-form string (NOT a closed
            enum): the deployed contract computes values such as `NONE`, `PARTIAL`, and
            `COMPLETE` (see SessionService.calculateMaterialsStatus) in addition to the
            review-workflow values below, so callers must tolerate unknown values.
            Known values: NONE, PARTIAL, COMPLETE, pending, in_review, approved,
            requires_changes, rejected, revision_submitted.'
          example: COMPLETE
    SessionSpeaker:
      type: object
      description: 'Story 1.15a.1b: Session speaker with enriched User data

        Combines SessionUser entity (role, confirmation) with User entity (name, company, photo)

        '
      required:
      - username
      - firstName
      - lastName
      - speakerRole
      - isConfirmed
      properties:
        username:
          type: string
          description: User's username (public identifier from User entity)
          pattern: ^[a-z]+\.[a-z]+(\.[0-9]+)?$
          example: john.doe
          maxLength: 100
        firstName:
          type: string
          description: Speaker's first name (from User entity)
          example: John
          maxLength: 100
        lastName:
          type: string
          description: Speaker's last name (from User entity)
          example: Doe
          maxLength: 100
        company:
          type: string
          description: Speaker's company identifier/slug (from User.companyId). Stable key used for logo lookup — NOT for display.
          example: GoogleZH
          maxLength: 12
        companyDisplayName:
          type: string
          description: 'Human-readable company name (companies.display_name, falling back to

            companies.name, then the company slug). Prefer this over `company` for

            display. Null when the speaker has no associated company.

            '
          example: Google Zürich
          maxLength: 255
        profilePictureUrl:
          type: string
          format: uri
          description: Speaker's profile picture URL (from User entity)
          example: https://cdn.batbern.ch/logos/2025/users/john.doe/profile.jpg
        companyLogoUrl:
          type: string
          format: uri
          description: 'Company logo CloudFront URL (cross-service DB join: logos table).

            Populated on archive list responses to avoid a separate useCompany API call.

            '
          example: https://cdn.batbern.ch/logos/2025/companies/sbb/logo.jpeg
        bio:
          type: string
          description: Speaker's biography (from User entity)
          maxLength: 5000
          example: Software engineer passionate about cloud architecture and security
        speakerRole:
          type: string
          enum:
          - PRIMARY_SPEAKER
          - CO_SPEAKER
          - MODERATOR
          - PANELIST
          description: 'Speaker''s role in the session:

            - PRIMARY_SPEAKER: Main presenter

            - CO_SPEAKER: Co-presenter

            - MODERATOR: Panel moderator

            - PANELIST: Panel participant

            '
          example: PRIMARY_SPEAKER
        presentationTitle:
          type: string
          description: Optional speaker-specific presentation title (if different from session title)
          maxLength: 255
          example: Security Auditing Tools Deep Dive
        isConfirmed:
          type: boolean
          description: Whether speaker has confirmed participation
          example: true
    SessionResponse:
      description: 'Story 1.15a.1b: Session response with embedded speakers + materials.

        Session schema plus the service-enriched materials list/count (Story 5.9).

        '
      allOf:
      - $ref: '#/components/schemas/Session'
      - type: object
        properties:
          materials:
            type: array
            description: 'Story 5.9: Uploaded session materials (populated by the service layer)'
            items:
              $ref: '#/components/schemas/SessionMaterialResponse'
          materialsCount:
            type: integer
            description: 'Story 5.9: Number of uploaded materials (for overview displays)'
            example: 3
    SessionMaterialResponse:
      type: object
      description: 'Story 5.9: Session material (uploaded slide deck / document).

        Returned by GET /sessions/{sessionSlug}/materials and embedded in Session
        responses. Maps the SessionMaterial entity; createdAt/updatedAt are UTC.

        '
      required:
      - id
      - uploadId
      - s3Key
      - fileName
      - fileExtension
      - fileSize
      - mimeType
      - materialType
      - uploadedBy
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Material identifier (same-service UUID)
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        uploadId:
          type: string
          description: Client-supplied upload correlation id
          example: upload-2026-0001
        s3Key:
          type: string
          description: S3 object key of the stored material
          example: materials/2026/batbern142/ui-design/slides.pdf
        cloudFrontUrl:
          type: string
          description: CloudFront delivery URL for the material (null until CDN-published)
          example: https://cdn.batbern.ch/materials/2026/batbern142/ui-design/slides.pdf
        fileName:
          type: string
          description: Original uploaded file name
          example: slides.pdf
        fileExtension:
          type: string
          description: File extension (without the dot)
          example: pdf
        fileSize:
          type: integer
          format: int64
          description: File size in bytes
          example: 2097152
        mimeType:
          type: string
          description: MIME type of the material
          example: application/pdf
        materialType:
          type: string
          description: Material classification (e.g. slides, document)
          example: slides
        uploadedBy:
          type: string
          description: Username of the uploader (public identifier per ADR-003)
          example: john.doe
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp (UTC)
          example: 2026-06-28T08:28:30.440Z
        updatedAt:
          type: string
          format: date-time
          description: Last-update timestamp (UTC)
          example: 2026-06-28T08:28:30.440Z
        contentExtracted:
          type: boolean
          description: 'Story 5.10 forward-compat: whether text content has been extracted for RAG search'
          example: false
        extractionStatus:
          type: string
          description: 'Story 5.10 forward-compat: content-extraction status'
          example: PENDING
    MaterialUploadItem:
      type: object
      description: 'Story 5.9: one already-uploaded material to associate with a session. Carries
        the upload correlation id from the presigned-URL step plus the file metadata.'
      required:
      - uploadId
      - materialType
      - fileName
      - fileExtension
      - fileSize
      - mimeType
      properties:
        uploadId:
          type: string
          minLength: 1
          description: Upload correlation id from MaterialsUploadService presigned-URL generation
          example: upload-2026-0001
        materialType:
          type: string
          minLength: 1
          description: Material classification (PRESENTATION, DOCUMENT, VIDEO, ARCHIVE, OTHER)
          example: PRESENTATION
        fileName:
          type: string
          minLength: 1
          description: Original uploaded file name
          example: slides.pdf
        fileExtension:
          type: string
          minLength: 1
          description: File extension without the dot
          example: pdf
        fileSize:
          type: integer
          format: int64
          description: File size in bytes
          example: 2097152
        mimeType:
          type: string
          minLength: 1
          description: MIME type of the material
          example: application/pdf
    SessionMaterialAssociationRequest:
      type: object
      description: 'Story 5.9: associate 1-10 already-uploaded materials with a session.'
      required:
      - materials
      properties:
        materials:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/MaterialUploadItem'
    SessionMaterialsResponse:
      type: object
      description: 'Story 5.9: wrapper for the materials associated with a session (returned by
        associate + list).'
      required:
      - materials
      properties:
        materials:
          type: array
          items:
            $ref: '#/components/schemas/SessionMaterialResponse'
    MaterialDownloadUrlResponse:
      type: object
      description: 'Story 5.9: time-limited presigned download URL for a single session material.'
      required:
      - downloadUrl
      properties:
        downloadUrl:
          type: string
          description: Presigned URL to download the material
          example: https://s3.eu-central-1.amazonaws.com/batbern-materials/...&X-Amz-Signature=...
    UploadMaterialFromUrlRequest:
      type: object
      description: 'Batch-import helper: fetch a material from a source URL and associate it with
        a session (organizer-only). Used by historical-data import.'
      required:
      - url
      - filename
      properties:
        url:
          type: string
          minLength: 1
          description: Source URL to fetch the material from
          example: https://cdn.batbern.ch/legacy/BAT142_UI_Design.pdf
        filename:
          type: string
          minLength: 1
          description: Target file name
          example: BAT142_UI_Design.pdf
        materialType:
          type: string
          description: Material classification; defaults to DOCUMENT when omitted
          example: DOCUMENT
    BatchImportSessionRequest:
      type: object
      description: 'Request payload for batch import from legacy sessions.json.

        Designed for historical data migration from BATspa application.

        '
      required:
      - bat
      - title
      properties:
        bat:
          type: integer
          description: Event number (links to BATbern{bat})
          example: 142
        title:
          type: string
          description: Session title
          maxLength: 255
          example: User Interface Design
        abstract:
          type: string
          description: Session abstract/description
          example: Discussion on modern UI patterns
          maxLength: 5000
        pdf:
          type: string
          description: 'Legacy PDF filename for reference (appended to description). Deprecated
            — use materialUrl (Story 5.9).'
          example: BAT142_UI_Design.pdf
        materialUrl:
          type: string
          description: 'CDN URL for a PDF/PPTX material. When provided, the backend fetches it
            and associates it as a session material (Story 5.9).'
          example: https://cdn.batbern.ch/materials/BAT142_UI_Design.pdf
        authoren:
          type: string
          description: Moderator name (for Moderation sessions)
          example: Thomas Goetz
        referenten:
          type: array
          description: List of speakers for this session
          items:
            $ref: '#/components/schemas/LegacySpeaker'
    LegacySpeaker:
      type: object
      description: 'Speaker data from legacy sessions.json.

        speakerId is mapped to username for user lookup.

        '
      properties:
        name:
          type: string
          description: Speaker full name
          example: Thomas Goetz, Die Mobiliar
        bio:
          type: string
          description: Speaker biography
        company:
          type: string
          description: Company identifier
          example: mobiliar
        portrait:
          type: string
          description: Portrait filename
          example: thomas.goetz.jpg
        speakerId:
          type: string
          description: Speaker ID (maps to username in user_profiles)
          example: thomas.goetz
    BatchImportSessionResult:
      type: object
      description: 'Result of batch import operation with success/skip/fail counts.

        '
      required:
      - totalProcessed
      - successfullyCreated
      - updated
      - skipped
      - failed
      - details
      properties:
        totalProcessed:
          type: integer
          description: Total sessions processed
          example: 3
        successfullyCreated:
          type: integer
          description: Successfully created sessions
          example: 2
        updated:
          type: integer
          description: Existing sessions updated (e.g. materials added to a duplicate)
          example: 0
        skipped:
          type: integer
          description: Skipped sessions (duplicates)
          example: 1
        failed:
          type: integer
          description: Failed imports
          example: 0
        details:
          type: array
          description: Detailed results per session
          items:
            $ref: '#/components/schemas/SessionImportDetail'
    SessionImportDetail:
      type: object
      description: 'Detail for a single session import result.

        '
      required:
      - title
      - status
      - message
      properties:
        title:
          type: string
          description: Session title
          example: User Interface Design
        status:
          type: string
          enum:
          - success
          - updated
          - skipped
          - failed
          description: Import status
          example: success
        message:
          type: string
          description: Status message
          example: Session created successfully
        sessionSlug:
          type: string
          description: Generated session slug (null if failed)
          nullable: true
          example: user-interface-design-abc123
    CreateSessionRequest:
      type: object
      description: 'Create a fully-defined session. title, sessionType, startTime and
        endTime are all required (the deployed controller rejects a request missing any
        of them with 400). sessionType is a free string rather than an enum so structural
        types such as `aperitif` can be created without a contract change.'
      required:
      - title
      - sessionType
      - startTime
      - endTime
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        sessionType:
          type: string
          description: 'Session type, e.g. keynote, presentation, workshop, panel_discussion,
            networking, break, lunch, moderation, aperitif.'
        startTime:
          type: string
          format: date-time
          description: Session start time (ISO-8601).
        endTime:
          type: string
          format: date-time
          description: Session end time (ISO-8601).
        room:
          type: string
          maxLength: 100
        capacity:
          type: integer
        language:
          type: string
          maxLength: 10
          default: de
    PatchSessionRequest:
      type: object
      description: 'Partial session update (PATCH). Only the provided fields are changed.

        Slot timing (startTime/endTime/room) is managed via the dedicated `/slot` endpoint.

        '
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        durationMinutes:
          type: integer
          minimum: 1
          description: When provided (>0), recomputes endTime as startTime + durationMinutes.
    AssignSpeakerToSessionRequest:
      type: object
      required:
      - username
      - speakerRole
      properties:
        username:
          type: string
          pattern: ^[a-z]+\.[a-z]+(\.[0-9]+)?$
          example: john.doe
        speakerRole:
          type: string
          enum:
          - PRIMARY_SPEAKER
          - CO_SPEAKER
          - MODERATOR
          - PANELIST
          example: PRIMARY_SPEAKER
        presentationTitle:
          type: string
          maxLength: 255
          example: Security Auditing Tools Deep Dive
    DeclineSpeakerRequest:
      type: object
      properties:
        declineReason:
          type: string
          example: Schedule conflict
    AgendaConfigSource:
      type: string
      description: Whether the resolved config came from the shared template or a per-event override (Story 15.2).
      enum:
      - TEMPLATE
      - EVENT_OVERRIDE
      example: TEMPLATE
    EventAgendaConfigResponse:
      type: object
      description: 'Resolved agenda/slot config for an event (Story 15.2). Same knobs as the event-type

        template plus the apéro knobs, with a `source` flag indicating template vs per-event override.

        '
      required:
      - source
      - minSlots
      - maxSlots
      - slotDuration
      - theoreticalSlotsAM
      - breakSlots
      - lunchSlots
      - defaultCapacity
      - moderationStartDuration
      - moderationEndDuration
      - breakDuration
      - lunchDuration
      - aperitifSlots
      - aperitifDuration
      - aperitifPosition
      properties:
        source:
          $ref: '#/components/schemas/AgendaConfigSource'
        minSlots:
          type: integer
          minimum: 1
          example: 6
        maxSlots:
          type: integer
          minimum: 1
          example: 8
        slotDuration:
          type: integer
          minimum: 15
          example: 45
        theoreticalSlotsAM:
          type: boolean
          example: false
        breakSlots:
          type: integer
          minimum: 0
          example: 2
        lunchSlots:
          type: integer
          minimum: 0
          example: 0
        defaultCapacity:
          type: integer
          minimum: 1
          example: 200
        moderationStartDuration:
          type: integer
          minimum: 1
          example: 5
        moderationEndDuration:
          type: integer
          minimum: 1
          example: 5
        breakDuration:
          type: integer
          minimum: 1
          example: 20
        lunchDuration:
          type: integer
          minimum: 1
          example: 60
        aperitifSlots:
          type: integer
          minimum: 0
          description: Apéro on/off count (0 = off, ≥1 = on)
          example: 1
        aperitifDuration:
          type: integer
          minimum: 1
          description: Apéro duration in minutes
          example: 90
        aperitifPosition:
          type: string
          enum:
          - start
          - end
          description: Apéro placement relative to the moderation segments
          example: end
        typicalStartTime:
          type: string
          format: time
          nullable: true
          example: '13:00'
        typicalEndTime:
          type: string
          format: time
          nullable: true
          example: '19:00'
    UpdateEventAgendaConfigRequest:
      type: object
      description: 'Copy-on-edit payload for the PER-EVENT agenda config (Story 15.2). Writes only the

        per-event `event_agenda_config` row — never the shared template.


        Shares the slot-configuration field vocabulary with `UpdateEventSlotConfigurationRequest`

        but is a DISTINCT contract: this one targets a single event''s agenda row and requires the

        full slot shape (all timing/slot fields mandatory) so the per-event override is complete.

        Use `UpdateEventSlotConfigurationRequest` instead to edit the event-TYPE-level defaults

        (fewer required fields; timing fields optional/nullable).

        '
      required:
      - minSlots
      - maxSlots
      - slotDuration
      - theoreticalSlotsAM
      - breakSlots
      - lunchSlots
      - defaultCapacity
      - moderationStartDuration
      - moderationEndDuration
      - breakDuration
      - lunchDuration
      - aperitifSlots
      - aperitifDuration
      - aperitifPosition
      properties:
        minSlots:
          type: integer
          minimum: 1
          example: 6
        maxSlots:
          type: integer
          minimum: 1
          example: 8
        slotDuration:
          type: integer
          minimum: 15
          example: 45
        theoreticalSlotsAM:
          type: boolean
          example: false
        breakSlots:
          type: integer
          minimum: 0
          example: 2
        lunchSlots:
          type: integer
          minimum: 0
          example: 0
        defaultCapacity:
          type: integer
          minimum: 1
          example: 200
        moderationStartDuration:
          type: integer
          minimum: 1
          example: 5
        moderationEndDuration:
          type: integer
          minimum: 1
          example: 5
        breakDuration:
          type: integer
          minimum: 1
          example: 20
        lunchDuration:
          type: integer
          minimum: 1
          example: 60
        aperitifSlots:
          type: integer
          minimum: 0
          example: 1
        aperitifDuration:
          type: integer
          minimum: 1
          example: 90
        aperitifPosition:
          type: string
          enum:
          - start
          - end
          example: end
        typicalStartTime:
          type: string
          format: time
          nullable: true
          example: '13:00'
        typicalEndTime:
          type: string
          format: time
          nullable: true
          example: '19:00'
    QnaPostRequest:
      type: object
      description: 'Story 7.5: post a Q&A question or answer. `parentPostId` set = an answer to that question;

        omitted = a top-level question. Identity comes from the JWT, never the body.

        `additionalProperties: false`: unexpected fields are rejected with 400.

        '
      additionalProperties: false
      required:
      - body
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
          description: The question or answer text (non-empty).
          example: How did you handle schema migration during the cutover?
        parentPostId:
          type: string
          format: uuid
          nullable: true
          description: The question being answered; omit for a top-level question.
    QnaWindowPatchRequest:
      type: object
      description: 'Story 7.5: organizer adjustment of a Q&A window. Provide a new `closesAt` to extend

        (reopens to that time) OR `close: true` to close early (freeze now). At least one required.

        '
      additionalProperties: false
      properties:
        closesAt:
          type: string
          format: date-time
          nullable: true
          description: New close time (extends/reopens the window).
        close:
          type: boolean
          nullable: true
          description: When true, freeze the window immediately (close early).
    QnaPostResponse:
      type: object
      description: 'Story 7.5: a single Q&A post. A removed post is a tombstone — `removed: true` and

        `body`/`postedByUsername` are null (the archive shows "removed by organizer").

        '
      required:
      - id
      - removed
      - createdAt
      properties:
        id:
          type: string
          format: uuid
        parentPostId:
          type: string
          format: uuid
          nullable: true
          description: Parent question id; null for a top-level question.
        postedByUsername:
          type: string
          nullable: true
          description: Poster username (stable id / takedown target); null if removed.
        postedByFirstName:
          type: string
          nullable: true
          description: Poster first name (enriched from the user profile); null if removed/unknown.
        postedByLastName:
          type: string
          nullable: true
          description: Poster last name (enriched from the user profile); null if removed/unknown.
        postedByCompanyName:
          type: string
          nullable: true
          description: Poster company display name; null if removed, unknown, or hidden by preference.
        postedByCompanyLogoUrl:
          type: string
          nullable: true
          description: Poster company logo CDN URL; null if removed, unknown, or hidden by preference.
        body:
          type: string
          nullable: true
          description: Post text; null if removed.
        removed:
          type: boolean
          description: True if the post was taken down by an organizer.
        createdAt:
          type: string
          format: date-time
    QnaWindowResponse:
      type: object
      description: 'Story 7.5: the Q&A thread for a session. `status` is OPEN or FROZEN. Posts are oldest-first;

        the client nests answers under `parentPostId`.

        '
      required:
      - status
      - posts
      properties:
        status:
          type: string
          enum:
          - OPEN
          - FROZEN
          description: OPEN = accepting posts; FROZEN = read-only.
        opensAt:
          type: string
          format: date-time
        closesAt:
          type: string
          format: date-time
        posts:
          type: array
          items:
            $ref: '#/components/schemas/QnaPostResponse'
  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            validationError:
              value:
                error: VALIDATION_ERROR
                errorCode: BAD_REQUEST
                message: Invalid filter syntax
                timestamp: 2025-01-15 10:30:00+00:00
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            eventNotFound:
              value:
                error: RESOURCE_NOT_FOUND
                errorCode: NOT_FOUND
                message: Event not found with id evt-999
                timestamp: 2025-01-15 10:30:00+00:00
    UnprocessableEntity:
      description: Request cannot be processed due to business logic
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            workflowError:
              value:
                error: WORKFLOW_ERROR
                errorCode: UNPROCESSABLE_ENTITY
                message: Cannot advance workflow for archived event
                timestamp: 2025-01-15 10:30:00+00:00
