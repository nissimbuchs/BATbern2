openapi: 3.1.0
info:
  title: BATbern Companies API
  version: 1.0.0
  description: |
    Consolidated Companies API for BATbern Event Management Platform.

    This API provides comprehensive company management capabilities with:
    - **Resource Expansion**: `?include=logo` for the company logo
    - **Advanced Filtering**: MongoDB-style JSON filter syntax for complex queries
    - **Pagination**: Standard page/limit parameters
    - **Caching**: Caffeine in-memory cache (15min TTL)

    **Story**: 1.14 - Company Management Service Foundation
    **Story 1.16.2**: Eliminate UUIDs from API - Use company name as identifier

    **Performance Targets**:
    - Company list (no includes): <100ms (P95)
    - Company detail (basic): <150ms (P95)
    - Company detail (all includes): <200ms (P95)
    - Cached search response: <50ms (P95)
    - Advanced query with all parameters: <200ms (P95)

  contact:
    name: BATbern Platform Team
    email: platform@batbern.ch
  license:
    name: Proprietary
    identifier: Proprietary

servers:
  - url: https://api.batbern.ch/api/v1
    description: Production
  - url: https://api.batbern.ch/api/v1
    description: Staging
  - url: http://localhost:8080/api/v1
    description: Development

tags:
  - name: Companies
    description: Company CRUD and listing operations
  - name: Company Search
    description: Company search and autocomplete with caching
  - name: Company Verification
    description: Company verification
  - name: Company Merge
    description: Folding a duplicate company into another (#1251)

paths:
  /companies:
    get:
      tags:
        - Companies
      summary: List and search companies with advanced query support
      description: |
        Retrieve a paginated list of companies with optional filtering, sorting and resource expansion.

        **Acceptance Criteria**: AC1, AC14, AC15

        **Filter Syntax Examples**:
        - Single filter: `{"industry":"Technology"}`
        - Multiple fields: `{"industry":"Technology","isVerified":true}`
        - Logical operators: `{"$or":[{"industry":"Technology"},{"industry":"Finance"}]}`
        - Comparison: `{"createdAt":{"$gte":"2025-01-01T00:00:00Z"}}`
        - Contains: `{"name":{"$contains":"Bern"}}`

        **Sort Syntax**:
        - Ascending: `name` or `+name`
        - Descending: `-name`
        - Multiple fields: `industry,-createdAt`

        **Resource Expansion**:
        - Logo: `?include=logo` (url, s3Key, fileId)

        **Performance**:
        - Basic query: <100ms (P95)
        - With all includes: <200ms (P95)

      operationId: listCompanies
      parameters:
        - name: filter
          in: query
          description: MongoDB-style JSON filter criteria
          required: false
          schema:
            type: string
            example: '{"industry":"Technology","isVerified":true}'
        - name: search
          in: query
          description: |
            Free-text search. Every word must occur in the company slug (`name`) or
            the display name, in any order, ignoring case, accents and umlaut spelling (ü = ue = u).
            A company is also found by an old key or display name kept as its alias after a merge or
            rename (#1251); it is listed once, as itself.
            Evaluated before paging, so `pagination.totalItems` counts every match. Combines with
            `filter`. Blank means no search.
          required: false
          schema:
            type: string
            maxLength: 200
            example: 'bundes amt'
        - name: sort
          in: query
          description: Sort fields (comma-separated, prefix with - for descending)
          required: false
          schema:
            type: string
            example: '-createdAt,name'
        - name: page
          in: query
          description: Page number (1-indexed)
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Items per page (max 100)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: include
          in: query
          description: Comma-separated list of resources to include
          required: false
          schema:
            type: string
            example: 'logo'
      responses:
        '200':
          description: Successful response with paginated companies
          headers:
            X-Cache-Status:
              description: Cache hit status (HIT or MISS)
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCompanyResponse'
              examples:
                basicList:
                  summary: Basic company list
                  value:
                    data:
                      - name: swissitsolut
                        displayName: Swiss IT Solutions AG
                        industry: Technology
                        isVerified: true
                        createdAt: 2025-01-15T10:00:00Z
                        updatedAt: 2025-01-15T10:00:00Z
                        createdBy: "john.doe"
                    pagination:
                      page: 1
                      limit: 20
                      totalItems: 1
                      totalPages: 1
                      hasNext: false
                      hasPrev: false
                expandedList:
                  summary: Company list with logo
                  value:
                    data:
                      - name: swissitsolut
                        displayName: Swiss IT Solutions AG
                        industry: Technology
                        isVerified: true
                        createdAt: 2025-01-15T10:00:00Z
                        updatedAt: 2025-01-15T10:00:00Z
                        logo:
                          url: https://cdn.batbern.ch/logos/swiss-it-solutions-ag/logo.png
                          s3Key: logos/swiss-it-solutions-ag/logo.png
                          fileId: file-123
                        createdBy: "john.doe"
                    pagination:
                      page: 1
                      limit: 20
                      totalItems: 1
                      totalPages: 1
                      hasNext: false
                      hasPrev: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Companies
      summary: Create a new company
      description: |
        Create a new company with complete company data.

        **Acceptance Criteria**: AC1, AC3

        **Validation Rules**:
        - Company name must be unique: a display name another company has (ignoring case), or an
          old name kept as an alias after a merge or rename (also ignoring accents and umlaut
          spelling, #1251), answers 409
        - The key is the name's slug, made unique; an alias key is taken too (#1251)
        - Website must be valid URL (if provided)

        **Performance**: <200ms (P95)

      operationId: createCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
            examples:
              basicCompany:
                summary: Basic company creation
                value:
                  name: swissitsolut
                  displayName: Swiss IT Solutions AG
                  industry: Technology
                  website: https://swiss-it.ch
                  description: Leading Swiss IT consulting firm
      responses:
        '201':
          description: Company created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
              examples:
                default:
                  summary: captured from the local anonymized database (same schema as a GET)
                  value:
                    name: 44aiag
                    displayName: 44ai AG
                    website: https://44ai.ch/
                    isVerified: false
                    createdAt: "2026-10-04T07:24:12.697691Z"
                    updatedAt: "2026-10-13T13:05:09.486695Z"
                    createdBy: ben.muster
                    logo:
                      url: https://cdn.batbern.ch/logos/2026/companies/44aiag/logo-d4884d93-e5c1-4ed1-acc0-02e796bb60b5.svg
                      s3Key: logos/2026/companies/44aiag/logo-d4884d93-e5c1-4ed1-acc0-02e796bb60b5.svg
                      fileId: d4884d93-e5c1-4ed1-acc0-02e796bb60b5
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LogoUploadNotFound'
        '409':
          $ref: '#/components/responses/CompanyOrLogoUploadConflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

  /companies/{name}:
    get:
      tags:
        - Companies
      summary: Get company details by name
      description: |
        Retrieve detailed information about a specific company.

        **Acceptance Criteria**: AC2

        **Story 1.16.2**: Uses company name as identifier instead of UUID

        **Performance**: <150ms (P95)

      operationId: getCompany
      parameters:
        - name: name
          in: path
          description: Company name (unique identifier)
          required: true
          schema:
            type: string
            example: swissitsolut
      responses:
        '200':
          description: Company details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
              examples:
                basicCompany:
                  summary: Basic company details
                  value:
                    name: swissitsolut
                    displayName: Swiss IT Solutions AG
                    industry: Technology
                    website: https://swiss-it.ch
                    description: Leading Swiss IT consulting firm
                    isVerified: true
                    createdAt: 2025-01-15T10:00:00Z
                    updatedAt: 2025-01-15T10:00:00Z
                    createdBy: "john.doe"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      # Public (scripts/ci/access-control-public.txt): company name and logo next to a speaker or attendee.
      security: []

    patch:
      tags:
        - Companies
      summary: Partially update company
      description: |
        Update specific fields of an existing company.

        **Acceptance Criteria**: AC4

        **Story 1.16.2**: Uses company name as identifier instead of UUID

        **Validation Rules**:
        - Company name must be unique: a key another company holds, or an old key of another
          company kept as its alias, answers 409; so does a display name that is another company's
          alias (#1251)

        **Rename** (a new `name`, #1251): every reference to the old key moves to the new one before
        the company is renamed. EMS and PCS move theirs through the company-references contract
        (`/internal/company-references/{preview,merge}`, trigger `RENAME`); CUMS moves user profiles,
        logo requests, the logo upload and activity. The old key and the old display name stay
        findable as an alias (search, typeahead, get-or-create). Renaming back to one of the
        company's own old keys takes it back. A service that refuses answers 409 `RENAME_BLOCKED`;
        one that does not complete its part answers 502 `RENAME_INCOMPLETE`, and the company keeps
        its old key: the same rename again finishes the move (see the 502 for the one case it cannot).
        The other fields and the logo are applied before any reference moves, so a bad `logoUploadId`
        fails the edit with nothing moved.

        **Cache Invalidation**: All company caches cleared on update

      operationId: patchCompany
      parameters:
        - name: name
          in: path
          description: Company name (unique identifier)
          required: true
          schema:
            type: string
            example: swissitsolut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyRequest'
      responses:
        '200':
          description: Company updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
              examples:
                default:
                  summary: captured from the local anonymized database (same schema as a GET)
                  value:
                    name: 44aiag
                    displayName: 44ai AG
                    website: https://44ai.ch/
                    isVerified: false
                    createdAt: "2026-10-04T07:24:12.697691Z"
                    updatedAt: "2026-10-13T13:05:09.486695Z"
                    createdBy: ben.muster
                    logo:
                      url: https://cdn.batbern.ch/logos/2026/companies/44aiag/logo-d4884d93-e5c1-4ed1-acc0-02e796bb60b5.svg
                      s3Key: logos/2026/companies/44aiag/logo-d4884d93-e5c1-4ed1-acc0-02e796bb60b5.svg
                      fileId: d4884d93-e5c1-4ed1-acc0-02e796bb60b5
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CompanyOrLogoUploadNotFound'
        '409':
          description: |
            The new key or display name is taken (by a company or another company's alias), the
            `logoUploadId` is not CONFIRMED, or a service refused to move its references to the new
            key (`RENAME_BLOCKED`, #1251). Nothing is changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicateName:
                  value:
                    error: CONFLICT
                    errorCode: CONFLICT
                    message: Company with name 'swissitsolut' already exists
                    timestamp: 2025-01-15T10:30:00Z
                logoUploadNotReady:
                  value:
                    status: 409
                    error: Conflict
                    message: Upload 3f2b8c1e-5d4a-4e6b-9a7c-1b2d3e4f5a6b is PENDING, not CONFIRMED
                    timestamp: 2026-11-12T10:30:00Z
                renameBlocked:
                  value:
                    status: 409
                    error: Conflict
                    errorCode: RENAME_BLOCKED
                    message: 'Company references of swissitsolut cannot move to swissit: [MERGE_BLOCKED_BOTH_PARTNERS]'
                    timestamp: 2026-11-20T10:30:00Z
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: |
            A service did not complete its part of the rename, or the rename here failed after the
            services had moved their references (#1251). The company keeps its old key and its other
            changes are not saved; the same rename again finishes the move. Until then the services
            that moved hold the new key: renaming to another key, or another company taking the new
            key meanwhile (the retry then answers 409), leaves their rows on that key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 502
                error: Bad Gateway
                errorCode: RENAME_INCOMPLETE
                message: >-
                  Not every service could move its references; the company keeps its old name.
                  Rename it again to the same name to finish.
                timestamp: 2026-11-20T10:30:00Z
      security:
        - BearerAuth: []

    delete:
      tags:
        - Companies
      summary: Delete company
      description: |
        Delete a company and all associated data.

        **Acceptance Criteria**: AC4

        **Story 1.16.2**: Uses company name as identifier instead of UUID

        **Cache Invalidation**: All company caches cleared on deletion

      operationId: deleteCompany
      parameters:
        - name: name
          in: path
          description: Company name (unique identifier)
          required: true
          schema:
            type: string
            example: swissitsolut
      responses:
        '204':
          description: Company deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

  /companies/search:
    get:
      tags:
        - Company Search
      summary: Search companies with autocomplete
      description: |
        Search companies by name with autocomplete functionality.

        **Acceptance Criteria**: AC5, AC11

        **Matching**: every word of `query` must occur, in any order, in the slug
        (`name`) or the display name, ignoring case, accents and umlaut spelling (ü = ue = u).
        Ranked in SQL before the limit: exact match, then prefix, then any other match, ties by
        display name and slug. A paged search is `GET /companies?search=`. An old key or display
        name kept as an alias after a merge or rename (#1251) finds its company, which is listed
        once, as itself; an exact or prefix alias match ranks as an exact or prefix match.

        **Caching**:
        - Caffeine in-memory cache with 15-minute TTL
        - Cache key includes query, limit, and include parameters
        - Automatic cache invalidation on company updates

        **Performance**:
        - Cached response: <50ms (P95)
        - Cache miss: <100ms (P95)

        **Default Results**: 20 companies (configurable via limit parameter)

        **Resource Expansion**:
        - Logo: `?include=logo` (logoUrl field included in response)

      operationId: searchCompanies
      parameters:
        - name: query
          in: query
          description: Search query (minimum 1 character)
          required: true
          schema:
            type: string
            minLength: 1
            example: 'Swiss'
        - name: limit
          in: query
          description: Maximum number of results (default 20)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: include
          in: query
          description: Comma-separated list of resources to include (e.g., logo)
          required: false
          schema:
            type: string
            example: 'logo'
      responses:
        '200':
          description: Search results returned successfully
          headers:
            X-Cache-Status:
              description: Cache hit status (HIT or MISS)
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanySearchResponse'
              examples:
                searchResults:
                  summary: Search results for "Swiss"
                  value:
                    - name: swissitsolut
                      displayName: Swiss IT Solutions AG
                      industry: Technology
                      isVerified: true
                    - name: swissbankcor
                      displayName: Swiss Bank
                      industry: Finance
                      isVerified: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      # Public (scripts/ci/access-control-public.txt): company typeahead in the registration wizard.
      security: []

  /companies/{name}/verify:
    post:
      tags:
        - Company Verification
      summary: Verify company
      description: |
        Marks a company as verified by an ORGANIZER.

        **Acceptance Criteria**: AC13

        **Story 1.16.2**: Uses company name as identifier instead of UUID

        **Authorization**: ORGANIZER role required

        **Idempotency**: Safe to call multiple times (no error if already verified)

      operationId: verifyCompany
      parameters:
        - name: name
          in: path
          description: Company name (unique identifier)
          required: true
          schema:
            type: string
            example: swissitsolut
      responses:
        '200':
          description: Company verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
              examples:
                default:
                  summary: captured from the local anonymized database (same schema as a GET)
                  value:
                    name: 44aiag
                    displayName: 44ai AG
                    website: https://44ai.ch/
                    isVerified: false
                    createdAt: "2026-10-04T07:24:12.697691Z"
                    updatedAt: "2026-10-13T13:05:09.486695Z"
                    createdBy: ben.muster
                    logo:
                      url: https://cdn.batbern.ch/logos/2026/companies/44aiag/logo-d4884d93-e5c1-4ed1-acc0-02e796bb60b5.svg
                      s3Key: logos/2026/companies/44aiag/logo-d4884d93-e5c1-4ed1-acc0-02e796bb60b5.svg
                      fileId: d4884d93-e5c1-4ed1-acc0-02e796bb60b5
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

  /companies/{name}/merge-preview:
    get:
      tags:
        - Company Merge
      summary: Preview merging another company into this one (Organizer)
      description: |
        #1251. Shows both companies and what a merge of `source` into `{name}` would do: the rows
        that move per `table.column`, summed over CUMS (user profiles, logo requests, logo uploads,
        activity) and every service that stores company keys (the company-references contract:
        event-management, partner-coordination), the rows that collide (`conflicts`, per table,
        dropped by the merge), the holders' `blockers`, and the fields of `{name}` that are empty and
        would be filled from the source (`fills`). Changes nothing.

        `canMerge` is false, with the reasons in `reasons`, when:
        - `SAME_COMPANY`: source and target are one company;
        - `TARGET_KEY_TOO_LONG`: the target key is not a company key (1 to 12 letters or digits)
          and cannot be held by a user profile; merge in the other direction when `canSwap`;
        - `BOTH_PARTNERS`: both companies are partners (blocker `MERGE_BLOCKED_BOTH_PARTNERS`);
          merge the partners first;
        - `BLOCKED`: another blocker of a holder.

        For `SAME_COMPANY` the holders are not asked and `moves`, `conflicts` and `fills` are empty;
        for `TARGET_KEY_TOO_LONG` the holders are not asked either (`moves` and `conflicts` hold the
        CUMS rows only). A source whose key is not a company key is merged without an alias (its key
        and display name are not kept). The source's partner flag shows as
        `moves["partners.company_name"]`.

        **Authorization**: ORGANIZER role required
      operationId: getCompanyMergePreview
      parameters:
        - name: name
          in: path
          required: true
          description: The company that stays (target)
          schema:
            type: string
            example: unic
        - name: source
          in: query
          required: true
          description: The company that is merged in and then deleted
          schema:
            type: string
            example: unicag
      responses:
        '200':
          description: Merge preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMergePreview'
              examples:
                default:
                  summary: Unic AG into Unic
                  value:
                    target:
                      name: unic
                      displayName: Unic
                      industry: Technology
                      isVerified: true
                      userCount: 12
                    source:
                      name: unicag
                      displayName: Unic AG
                      website: https://www.unic.com
                      isVerified: false
                      userCount: 3
                      logo:
                        url: https://cdn.batbern.ch/logos/2026/companies/unicag/logo-d4884d93-e5c1-4ed1-acc0-02e796bb60b5.svg
                        s3Key: logos/2026/companies/unicag/logo-d4884d93-e5c1-4ed1-acc0-02e796bb60b5.svg
                        fileId: d4884d93-e5c1-4ed1-acc0-02e796bb60b5
                    moves:
                      user_profiles.company_id: 3
                      company_logo_requests.company_name: 0
                      activity_history.entity_id: 1
                      company_user_uploads.target_id: 1
                      registrations.attendee_company_id: 4
                      topic_votes.company_name: 2
                    conflicts:
                      topic_votes: 1
                    blockers: []
                    fills:
                      - website
                      - logo
                    canMerge: true
                    reasons: []
                    canSwap: true
                bothPartners:
                  summary: Both companies are partners
                  value:
                    target:
                      name: unic
                      displayName: Unic
                      isVerified: true
                      userCount: 12
                    source:
                      name: unicag
                      displayName: Unic AG
                      isVerified: false
                      userCount: 3
                    moves:
                      user_profiles.company_id: 3
                      partners.company_name: 1
                    conflicts: {}
                    blockers:
                      - MERGE_BLOCKED_BOTH_PARTNERS
                    fills: []
                    canMerge: false
                    reasons:
                      - BOTH_PARTNERS
                    canSwap: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: A service that stores company keys did not answer the preview (`MERGE_PREVIEW_INCOMPLETE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 502
                error: Bad Gateway
                errorCode: MERGE_PREVIEW_INCOMPLETE
                message: Not every service answered; try the preview again.
                timestamp: 2026-11-20T10:30:00Z
      security:
        - BearerAuth: []

  /companies/{name}/merge:
    post:
      tags:
        - Company Merge
      summary: Merge another company into this one (Organizer)
      description: |
        #1251. Folds `sourceName` into `{name}` and deletes it. In this order, the two companies
        locked: every service that stores company keys previews the move (a blocker refuses before
        any of them moves a row) and moves its rows (company-references contract, trigger `MERGE`);
        CUMS moves user profiles, logo requests, the logo uploads and activity; the fields of
        `{name}` that are empty (website, industry, description, logo) are filled from the source, set
        ones are kept, the display name of `{name}` always stays; the source's aliases lead to
        `{name}`; the source is deleted; its key and display name become aliases of `{name}` (search,
        typeahead, get-or-create find it); one `company_merge_log` row keeps every moved and removed
        row id and a snapshot of the source. An attempt that fails after services moved rows leaves an
        INCOMPLETE log row with their ids. No mail is sent; S3 keys do not change.

        Refused with 400 `MERGE_NOT_ALLOWED` for the same company, 409 `MERGE_NOT_ALLOWED` for a key
        reason of the preview (`details.reasons`, `details.canSwap`), 409
        `MERGE_BLOCKED_BOTH_PARTNERS` when both are partners and 409 `MERGE_BLOCKED` when a service
        refuses the move itself; nothing is moved then. 502 `MERGE_INCOMPLETE` when a service does
        not complete its part: the source company and the CUMS rows stay, and the same merge again
        finishes it. A completed merge repeated answers 404 (the source is gone).

        **Authorization**: ORGANIZER role required
      operationId: mergeCompany
      parameters:
        - name: name
          in: path
          required: true
          description: The company that stays (target)
          schema:
            type: string
            example: unic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyMergeRequest'
            example:
              sourceName: unicag
      responses:
        '200':
          description: Merged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMergeResult'
              examples:
                default:
                  summary: Unic AG into Unic
                  value:
                    targetName: unic
                    sourceName: unicag
                    moved:
                      user_profiles.company_id: 3
                      company_logo_requests.company_name: 0
                      activity_history.entity_id: 1
                      company_user_uploads.target_id: 1
                      registrations.attendee_company_id: 4
                      topic_votes.company_name: 1
                    removed:
                      topic_votes.company_name: 1
                    filled:
                      - website
                      - logo
        '400':
          description: Invalid request, or source and target are the same company (`MERGE_NOT_ALLOWED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                error: Bad Request
                errorCode: MERGE_NOT_ALLOWED
                message: 'Merge not allowed: SAME_COMPANY'
                details:
                  reasons: [SAME_COMPANY]
                  canSwap: false
                timestamp: 2026-11-20T10:30:00Z
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Refused, nothing moved: a key reason (`MERGE_NOT_ALLOWED`, `details.reasons` and
            `details.canSwap`), both companies are partners (`MERGE_BLOCKED_BOTH_PARTNERS`), or a
            service refused the move (`MERGE_BLOCKED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notAllowed:
                  value:
                    status: 409
                    error: Conflict
                    errorCode: MERGE_NOT_ALLOWED
                    message: 'Merge not allowed: TARGET_KEY_TOO_LONG'
                    details:
                      reasons: [TARGET_KEY_TOO_LONG]
                      canSwap: true
                    timestamp: 2026-11-20T10:30:00Z
                bothPartners:
                  value:
                    status: 409
                    error: Conflict
                    errorCode: MERGE_BLOCKED_BOTH_PARTNERS
                    message: 'Company references of unicag cannot move to unic: [MERGE_BLOCKED_BOTH_PARTNERS]'
                    timestamp: 2026-11-20T10:30:00Z
                blocked:
                  value:
                    status: 409
                    error: Conflict
                    errorCode: MERGE_BLOCKED
                    message: A service refused to move the references of unicag
                    timestamp: 2026-11-20T10:30:00Z
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: |
            A service did not complete its part, or the merge here failed after the services had
            moved their references. The source company and the CUMS rows stay; the same merge again
            finishes it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 502
                error: Bad Gateway
                errorCode: MERGE_INCOMPLETE
                message: >-
                  Not every service could move its references; the companies were not merged.
                  Merge them again to finish.
                timestamp: 2026-11-20T10:30:00Z
      security:
        - BearerAuth: []

  /companies/get-or-create:
    post:
      tags:
        - Companies
      summary: Get or create company by display name
      description: |
        Gets an existing company or creates a new one from a display name (ADR-013 §2: 201 when
        created, 200 when an existing company is returned).

        **ADR-003**: Uses slug generation to create meaningful company name (ID) from display name.

        **Idempotency**: Safe to call multiple times - returns the existing company if the
        generated name already exists. Else a company whose display name equals the typed one,
        ignoring case, accents and umlaut spelling as the search does, is returned (the oldest if
        several), whatever its key: "Die Post" finds the
        company `post` instead of creating `diepost` (#1251). Else an alias (an old key or display
        name kept after a merge or rename): its key equal to the generated name, or its display
        name equal to the typed one (folded the same way), returns its company (#1251).

        **Slug Generation**:
        - Converts display name to lowercase alphanumeric slug (max 12 chars)
        - Example: "Test Co" → "testco", "Müller & Partners AG" → "muellerpartn"
        - Handles German characters: ä→ae, ö→oe, ü→ue, ß→ss
        - Names are letters and digits only; a display name whose generated name exists returns
          that company (200), it never gets a suffix

        **Authentication**: any signed-in user (401 without a login). Story 4.10d moved it from the
        retired colon form `POST /companies:get-or-create`.

        **Performance**: <200ms (P95)

      operationId: getOrCreateCompany
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetOrCreateCompanyRequest'
            examples:
              basicCompany:
                summary: Get or create company from display name
                value:
                  displayName: Test Co
              germanCompany:
                summary: Company with German characters
                value:
                  displayName: Müller & Söhne AG
      responses:
        '200':
          description: An existing company with this generated name, display name or alias is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
              examples:
                existingCompany:
                  summary: Existing company returned
                  value:
                    name: testco
                    displayName: Test Co
                    isVerified: false
                    createdAt: 2025-01-01T10:00:00Z
                    updatedAt: 2025-01-01T10:00:00Z
                    createdBy: john.doe
        '201':
          description: A new company was created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
              examples:
                newCompany:
                  summary: New company created
                  value:
                    name: testco
                    displayName: Test Co
                    isVerified: false
                    createdAt: 2025-01-15T10:00:00Z
                    updatedAt: 2025-01-15T10:00:00Z
                    createdBy: "john.doe"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

components:
  schemas:
    CompanyResponse:
      type: object
      description: |
        Company response with meaningful IDs.
        Story 1.16.2: name field is the unique identifier (no separate id field).
      required:
        - name
        - isVerified
        - createdAt
        - updatedAt
        - createdBy
      properties:
        name:
          type: string
          description: |
            The company's key, its unique meaningful ID (Story 1.16.2, ADR-003): 1 to 12 letters or
            digits. POST /companies and get-or-create derive it from the typed name; the name as people
            see it is `displayName`.
          pattern: '^[a-zA-Z0-9]{1,12}$'
          maxLength: 12
          example: swissitsolut
        displayName:
          type: string
          maxLength: 255
          example: Swiss IT Solutions AG
        website:
          # Modelled as a plain string (NOT `format: uri`) so the Spring generator's Bean
          # Validation @Size(max=500) applies cleanly — @Size has no validator for java.net.URI,
          # so `format: uri` + maxLength yields `@Size URI` → UnexpectedTypeException (500) on every
          # @Valid request body carrying a website. Mirrors users-api profilePictureUrl (ADR-013).
          type: string
          maxLength: 500
          example: https://swiss-it.ch
        industry:
          type: string
          maxLength: 100
          example: Technology
        description:
          type: string
          maxLength: 2000
          example: Leading Swiss IT consulting firm specializing in cloud-native architectures
        isVerified:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: 2025-01-15T10:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2025-01-15T10:00:00Z
        createdBy:
          type: string
          description: |
            Who created this company (Story 1.16.2): the creator's username; `anonymous` for a
            company named during an anonymous event registration; the Cognito subject (UUID) when
            the creator's token carried no `custom:username` claim.
          example: john.doe
          pattern: '^([a-z]+\.[a-z]+(\.[0-9]+)?|anonymous|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$'
        logo:
          $ref: '#/components/schemas/CompanyLogo'

    CompanyLogo:
      type: object
      description: Company logo details (included when ?include=logo)
      properties:
        url:
          type: string
          format: uri
          description: CloudFront CDN URL for logo
          example: https://cdn.batbern.ch/logos/swiss-it-solutions-ag/logo.png
        s3Key:
          type: string
          description: S3 object key
          example: logos/swiss-it-solutions-ag/logo.png
        fileId:
          type: string
          description: Internal file identifier
          example: file-123

    CompanySearchResponse:
      type: object
      description: |
        Company search result with meaningful IDs.
        Story 1.16.2: name field is the unique identifier (no separate id field).
      required:
        - name
        - isVerified
      properties:
        name:
          type: string
          description: The company's key, its unique meaningful ID (Story 1.16.2), 1 to 12 letters or digits
          pattern: '^[a-zA-Z0-9]{1,12}$'
          maxLength: 12
          example: swissitsolut
        displayName:
          type: string
          example: Swiss IT Solutions AG
        industry:
          type: string
          example: Technology
        isVerified:
          type: boolean
          example: true
        logo:
          $ref: '#/components/schemas/CompanyLogo'

    CreateCompanyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: |
            The company's name as typed (2-255 characters, spaces allowed). The service derives the
            key from it (`CompanyResponse.name`, 1 to 12 letters or digits) by the rule of get-or-create:
            umlauts spelled out (ä as ae), accents dropped, lower case, letters and digits only, the first
            12 kept; when another company has that key, a digit is appended within 12 characters
            (`testco2`). The typed name becomes the display name unless `displayName` is given.
            409 when a company with the same display name (ignoring case) exists; 400 when the name
            has no letter or digit.
          minLength: 2
          maxLength: 255
          example: Swisscom AG
        displayName:
          type: string
          maxLength: 255
          example: Swiss IT Solutions AG
        website:
          # Modelled as a plain string (NOT `format: uri`) so the Spring generator's Bean
          # Validation @Size(max=500) applies cleanly — @Size has no validator for java.net.URI,
          # so `format: uri` + maxLength yields `@Size URI` → UnexpectedTypeException (500) on every
          # @Valid request body carrying a website. Mirrors users-api profilePictureUrl (ADR-013).
          type: string
          maxLength: 500
          example: https://swiss-it.ch
        industry:
          type: string
          maxLength: 100
          example: Technology
        description:
          type: string
          maxLength: 2000
          example: Leading Swiss IT consulting firm
        logoUploadId:
          type: string
          description: A CONFIRMED `company-logo` upload (uploads-api, `POST /uploads/company-logo`), attached to the new company (optional). Unknown, expired or of another purpose 404, not CONFIRMED 409; the company is not created then
          example: abc123-def456

    UpdateCompanyRequest:
      type: object
      properties:
        name:
          type: string
          description: |
            A new key for the company (1 to 12 letters or digits). Other services hold the key, so it
            keeps the shape POST /companies gives it; 400 otherwise. A new key renames the company and
            moves every reference to it (#1251, see `patchCompany`).
          pattern: '^[a-zA-Z0-9]{1,12}$'
          maxLength: 12
          example: swisscom
        displayName:
          type: string
          maxLength: 255
          example: Swiss IT Solutions AG
        website:
          # Modelled as a plain string (NOT `format: uri`) so the Spring generator's Bean
          # Validation @Size(max=500) applies cleanly — @Size has no validator for java.net.URI,
          # so `format: uri` + maxLength yields `@Size URI` → UnexpectedTypeException (500) on every
          # @Valid request body carrying a website. Mirrors users-api profilePictureUrl (ADR-013).
          type: string
          maxLength: 500
          example: https://swiss-it.ch
        industry:
          type: string
          maxLength: 100
          example: Technology
        description:
          type: string
          maxLength: 2000
          example: Leading Swiss IT consulting firm
        logoUploadId:
          type: string
          description: A CONFIRMED `company-logo` upload (uploads-api) that becomes the logo; an empty string removes the logo, the current logo's id changes nothing. Unknown, expired or of another purpose 404, not CONFIRMED 409; nothing is changed then
          example: abc123-def456

    GetOrCreateCompanyRequest:
      type: object
      description: |
        Request to get or create a company by display name.
        The system will generate a slug from the display name and either return the existing company or create a new one.
      required:
        - displayName
      properties:
        displayName:
          type: string
          description: Full company display name (will be converted to slug for company.name)
          minLength: 1
          maxLength: 255
          example: Test Co

    PaginatedCompanyResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CompanyResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    CompanyMergeSide:
      type: object
      description: One side of a company merge, as the organizer sees it (#1251)
      required: [name, isVerified, userCount]
      properties:
        name:
          type: string
          description: The company key
          example: unicag
        displayName:
          type: string
          example: Unic AG
        website:
          type: string
          example: https://www.unic.com
        industry:
          type: string
          example: Technology
        description:
          type: string
        isVerified:
          type: boolean
        userCount:
          type: integer
          description: User profiles of this company
          example: 3
        logo:
          $ref: '#/components/schemas/CompanyLogo'

    CompanyMergePreview:
      type: object
      required: [target, source, moves, conflicts, blockers, fills, canMerge, reasons, canSwap]
      properties:
        target:
          $ref: '#/components/schemas/CompanyMergeSide'
        source:
          $ref: '#/components/schemas/CompanyMergeSide'
        moves:
          type: object
          description: Rows that move to the target, per `table.column` (CUMS and every holder)
          additionalProperties:
            type: integer
        conflicts:
          type: object
          description: |
            Rows per table that collide with one of the target: dropped by the merge, or for
            `company_logo_requests` (an open request of one person at both) closed as DECLINED
          additionalProperties:
            type: integer
        blockers:
          type: array
          description: Why a holder refuses the move, e.g. `MERGE_BLOCKED_BOTH_PARTNERS`
          items:
            type: string
        fills:
          type: array
          description: Empty fields of the target the merge fills from the source (`website`, `industry`, `description`, `logo`)
          items:
            type: string
        canMerge:
          type: boolean
        reasons:
          type: array
          description: |
            Why `canMerge` is false: `SAME_COMPANY`, `TARGET_KEY_TOO_LONG`, `BOTH_PARTNERS`, `BLOCKED`
          items:
            type: string
        canSwap:
          type: boolean
          description: |
            The merge in the other direction (this source as the target) passes the key checks: the
            source key is a company key (1 to 12 letters or digits) and the two are different companies

    CompanyMergeRequest:
      type: object
      required: [sourceName]
      additionalProperties: false
      properties:
        sourceName:
          type: string
          description: The key of the company that is merged in and then deleted
          minLength: 1
          maxLength: 255
          example: unicag

    CompanyMergeResult:
      type: object
      required: [targetName, sourceName, moved, removed, filled]
      properties:
        targetName:
          type: string
          example: unic
        sourceName:
          type: string
          example: unicag
        moved:
          type: object
          description: Rows moved to the target, per `table.column`
          additionalProperties:
            type: integer
        removed:
          type: object
          description: |
            Rows of the source dropped because the target held the same one, per `table.column`. An open
            logo request closed because the person has one at the target too is not in it (it moved;
            the merge log lists it)
          additionalProperties:
            type: integer
        filled:
          type: array
          description: Fields of the target filled from the source
          items:
            type: string

    PaginationMetadata:
      $ref: './_shared.openapi.yml#/components/schemas/PaginationMetadata'
    ErrorResponse:
      $ref: './_shared.openapi.yml#/components/schemas/ErrorResponse'
  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationError:
              value:
                error: VALIDATION_ERROR
                errorCode: BAD_REQUEST
                message: Invalid filter syntax
                timestamp: 2025-01-15T10:30:00Z

    Unauthorized:
      description: Unauthorized - missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingToken:
              value:
                error: UNAUTHORIZED
                errorCode: UNAUTHORIZED
                message: Missing or invalid authentication token
                timestamp: 2025-01-15T10:30:00Z

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            insufficientPermissions:
              value:
                error: FORBIDDEN
                errorCode: FORBIDDEN
                message: Insufficient permissions. Requires ORGANIZER role.
                timestamp: 2025-01-15T10:30:00Z

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            companyNotFound:
              value:
                error: RESOURCE_NOT_FOUND
                errorCode: NOT_FOUND
                message: Company not found with name 'swissitsolut'
                timestamp: 2025-01-15T10:30:00Z

    Conflict:
      description: Conflict - resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            duplicateName:
              value:
                error: CONFLICT
                errorCode: CONFLICT
                message: Company with name 'swissitsolut' already exists
                timestamp: 2025-01-15T10:30:00Z

    LogoUploadNotFound:
      description: |
        The `logoUploadId` is no `company-logo` upload: unknown, expired or of another purpose
        (Story 17.11). Nothing is stored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            logoUploadNotFound:
              value:
                status: 404
                error: Not Found
                message: Upload 3f2b8c1e-5d4a-4e6b-9a7c-1b2d3e4f5a6b not found
                timestamp: 2026-11-12T10:30:00Z

    CompanyOrLogoUploadNotFound:
      description: |
        The company does not exist, or the `logoUploadId` is no `company-logo` upload (unknown,
        expired or of another purpose, Story 17.11).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            companyNotFound:
              value:
                error: RESOURCE_NOT_FOUND
                errorCode: NOT_FOUND
                message: Company not found with name 'swissitsolut'
                timestamp: 2025-01-15T10:30:00Z
            logoUploadNotFound:
              value:
                status: 404
                error: Not Found
                message: Upload 3f2b8c1e-5d4a-4e6b-9a7c-1b2d3e4f5a6b not found
                timestamp: 2026-11-12T10:30:00Z

    CompanyOrLogoUploadConflict:
      description: |
        A company with this name exists, or the `logoUploadId` is not CONFIRMED (still PENDING or
        already attached, Story 17.11). Nothing is stored.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            duplicateName:
              value:
                error: CONFLICT
                errorCode: CONFLICT
                message: Company with name 'swissitsolut' already exists
                timestamp: 2025-01-15T10:30:00Z
            logoUploadNotReady:
              value:
                status: 409
                error: Conflict
                message: Upload 3f2b8c1e-5d4a-4e6b-9a7c-1b2d3e4f5a6b is PENDING, not CONFIRMED
                timestamp: 2026-11-12T10:30:00Z

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              value:
                error: INTERNAL_SERVER_ERROR
                errorCode: INTERNAL_ERROR
                message: An unexpected error occurred
                timestamp: 2025-01-15T10:30:00Z

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AWS Cognito JWT token

security:
  - BearerAuth: []
