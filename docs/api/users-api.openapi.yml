                  summary: captured from the local anonymized database
                  value:
                    id: ben.beispiel
                    hasCognitoAccount: true
                    email: ben.beispiel@example.com
                    firstName: Ben
                    lastName: Beispiel
                    companyId: swisscom
                    roles:
                      - SPEAKER
                    profilePictureUrl: https://cdn.batbern.ch/profile-pictures/2025/ben.beispiel/profile-6d1506ec-681f-4307-a1d0-62a366e8b055.png
                    active: true
                    createdAt: "2025-11-30T21:49:37.171342Z"
                    updatedAt: "2026-02-25T17:06:54.373809Z"
                    termsAcceptedAt: null
                    additionalEmails: []
                    bio: null
                    company: null
                    lastLoginAt: null
                    settings: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

    patch:
      tags:
        - User Management
      summary: Partially update a user's profile
      description: |
        Partial update of a user's profile; only the fields present change (ADR-013 §1).
        One endpoint for self-service and for organizers (Story 4.10, replaces
        `PATCH /users/me` and `PUT /users/{username}`).

        **Authorization**: the user themself (`username` is the caller's own), or ORGANIZER /
        ADMIN for any user; anyone else gets 403.

        **Consent**: `termsAccepted` is the user's own consent (Story 12.11, write-once). It is
        accepted only on the caller's own profile; sending it for another user is 403.

        **Audit**: the `UserUpdatedEvent` records the caller's username as the actor.
      operationId: patchUser
      parameters:
        - name: username
          in: path
          description: Username (unique identifier)
          required: true
          schema:
            type: string
            pattern: '^[a-z]+\.[a-z]+(\.[0-9]+)?$'
            example: john.doe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
              examples:
                default:
                  summary: captured from the local anonymized database (same schema as a GET)
                  value:
                    id: hugo.muster
                    hasCognitoAccount: true
                    email: hugo.muster@example.com
                    firstName: Hugo
                    lastName: Muster
                    bio: Software architect with a focus on APIs.
                    roles:
                      - ORGANIZER
                    active: true
                    createdAt: "2026-02-22T12:54:23.442285Z"
                    updatedAt: "2026-11-08T14:43:13.089114Z"
                    termsAcceptedAt: "2026-02-22T12:54:23.442285Z"
                    additionalEmails: []
                    company: null
                    companyId: null
                    lastLoginAt: null
                    profilePictureUrl: null
                    settings: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `EMAIL_DUPLICATE`: the new `email` is already another user's address
            (case-insensitive, one address per profile). Nothing is changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emailDuplicate:
                  value:
                    timestamp: "2026-11-11T08:15:00Z"
                    path: /api/v1/users/hugo.muster
                    status: 409
                    error: Conflict
                    errorCode: EMAIL_DUPLICATE
                    message: Email is already registered for another user
                    correlationId: 3f2b9c1e-6a4d-4e8f-9b7a-2c5d1e0f4a6b
                    severity: LOW
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

    delete:
      tags:
        - GDPR Compliance
      summary: Delete user and all associated data
      description: |
        Delete a user and cascade deletion across all domain services.

        **Acceptance Criteria**: AC11

        **Story 1.16.2**: Uses username as identifier instead of UUID

        **Authorization**: ADMIN role or self-deletion

        **Business Rules**:
        - Cannot delete last ORGANIZER user
        - Cascade deletion across Event, Speaker, Partner, Attendee services

        **Events Published**: UserDeletedEvent (in-process domain event)

        **Audit Logging**: GDPR compliance logging

      operationId: deleteUser
      parameters:
        - name: username
          in: path
          description: Username (unique identifier)
          required: true
          schema:
            type: string
            pattern: '^[a-z]+\.[a-z]+(\.[0-9]+)?$'
            example: john.doe
      responses:
        '204':
          description: User deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

  /users/search:
    get:
      tags:
        - User Search
      summary: Search users with autocomplete
      description: |
        Search users by name, username or email with autocomplete functionality.

        **Acceptance Criteria**: AC4, AC11

        **Authorization**: ADMIN or ORGANIZER role required; any other role gets 403.

        **Matched fields**: every word of `query` must occur, in any order, in
        `username`, `firstName`, `lastName`, the primary `email`, an additional e-mail (verified
        or not) or `companyId`, ignoring case, accents and umlaut spelling (ü = ue = u). So
        "Matthias Stürmer", "stuermer matthias" and "Stürmer" all resolve the same user, and
        `%` or `_` match literally.

        **Ranking** (applied in SQL, before the limit): exact full name (either order), then an
        exact single field, then a name prefix, then any other match; ties broken by
        `lastName, firstName, username` so the order is stable across identical requests.

        **Filtering**: `role` is applied in the database BEFORE the limit, so a role-filtered
        search returns the best matching users holding that role rather than the subset of an
        arbitrary page.

        **Caching**:
        - Caffeine in-memory cache with 10-minute TTL
        - Cache key includes query, role filter, and limit
        - Automatic cache invalidation on user updates

        **Performance**:
        - Cached response: <50ms (P95)
        - Cache miss: <100ms (P95)

        **Default Results**: 20 users (configurable via limit parameter, maximum 100)

      operationId: searchUsers
      parameters:
        - name: query
          in: query
          description: Search query (minimum 1 character)
          required: true
          schema:
            type: string
            minLength: 1
            example: 'John'
        - name: role
          in: query
          description: Filter by specific role
          required: false
          schema:
            type: string
            enum: [ORGANIZER, SPEAKER, PARTNER, ATTENDEE]
        - name: limit
          in: query
          description: Maximum number of results (default 20)
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Search results returned successfully
          headers:
            X-Cache-Status:
              description: Cache hit status (HIT or MISS)
              schema:
                type: string
                enum: [HIT, MISS]
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSearchResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    []
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

