  /users/me/additional-emails:
    post:
      tags:
        - User Account
      summary: Add an additional email address to the current user
      description: |
        Story 10.32 — register a new additional email on the caller's profile.
        Additional emails receive forwarded copies of mail addressed to this user
        (ok@/partner@/batbern{N}@ role fan-out, registration confirmations) and are
        accepted as authorised senders by the Story 10.26 alias forwarding (EMS).

        Cap: 5 per user (configurable via `batbern.user.additional-emails.max`).
        Uniqueness: global, case-insensitive, across BOTH primary emails on
        `user_profiles` AND additional emails on any user.
      operationId: addAdditionalEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddAdditionalEmailRequest'
      responses:
        '201':
          description: Additional email created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalEmail'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    email: ines.vorlage@example.com
                    label: Hostpoint shared
                    createdAt: "2026-05-22T10:00:00Z"
                    verifiedAt: "2026-05-14T16:00:00Z"
                    receiveEventMail: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            The email is already registered as a primary email on `user_profiles`
            or as an additional email on any user. Error code: `ADDITIONAL_EMAIL_DUPLICATE`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            Per-user cap reached. Error code: `ADDITIONAL_EMAIL_LIMIT_REACHED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

  /users/me/additional-emails/{emailId}:
    patch:
      tags:
        - User Account
      summary: Change the settings of one of the caller's additional email addresses
      description: |
        #1244 — switch the copy of event mails for one additional address on or off. Only a
        confirmed address can receive copies (409 `NOT_VERIFIED` otherwise).
      operationId: updateAdditionalEmail
      parameters:
        - name: emailId
          in: path
          required: true
          description: |
            The `id` of one of the caller's additional addresses (`AdditionalEmail.id` in
            `GET /users/me`). Another user's or an unknown id answers 404. The address itself
            never goes in the path (ADR-003 amendment 2026-11).
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdditionalEmailRequest'
      responses:
        '200':
          description: The updated additional email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalEmail'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                    email: ines.vorlage@example.com
                    label: Hostpoint shared
                    createdAt: "2026-05-22T10:00:00Z"
                    verifiedAt: "2026-05-14T16:00:00Z"
                    receiveEventMail: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No additional email with this id on the caller's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The address is not confirmed yet (`NOT_VERIFIED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []
    delete:
      tags:
        - User Account
      summary: Remove an additional email address from the current user
      description: |
        Story 10.32 — remove an additional email previously registered on the
        caller's profile. The primary email on `user_profiles` is NEVER affected
        by this endpoint.
      operationId: deleteAdditionalEmail
      parameters:
        - name: emailId
          in: path
          required: true
          description: |
            The `id` of one of the caller's additional addresses (`AdditionalEmail.id` in
            `GET /users/me`). Another user's or an unknown id answers 404. The address itself
            never goes in the path (ADR-003 amendment 2026-11).
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Additional email removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No additional email with this id on the caller's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

  /users/me/additional-emails/{emailId}/make-primary:
    post:
      tags:
        - User Account
      summary: Make a confirmed additional address the primary (login) address
      description: |
        #1244 — the login moves to this address (Cognito, marked verified) and the old primary
        address stays as a confirmed additional address. Upcoming registrations made under the old
        address follow. Linked Google sign-ins stay.
      operationId: makeAdditionalEmailPrimary
      parameters:
        - name: emailId
          in: path
          required: true
          description: |
            The `id` of one of the caller's additional addresses (`AdditionalEmail.id` in
            `GET /users/me`). Another user's or an unknown id answers 404. The address itself
            never goes in the path (ADR-003 amendment 2026-11).
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: The address is now the primary address
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No additional email with this id on the caller's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            `NOT_VERIFIED` (the address is not confirmed) or `EMAIL_HAS_OTHER_LOGIN` (another
            account logs in with it; merge that account first).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /users/me/additional-emails/{emailId}/resend-verification:
    post:
      tags:
        - User Account
      summary: Resend the verification email for an additional email address
      description: |
        Additional-email verification v2 — re-dispatch the signed verification
        link to one of the caller's own (still unverified) additional emails.
        Idempotent in effect: a 204 means a fresh email was queued. The token is
        regenerated on each call (stateless HMAC JWT, 48h TTL).
      operationId: resendAdditionalEmailVerification
      parameters:
        - name: emailId
          in: path
          required: true
          description: |
            The `id` of one of the caller's additional addresses (`AdditionalEmail.id` in
            `GET /users/me`). Another user's or an unknown id answers 404. The address itself
            never goes in the path (ADR-003 amendment 2026-11).
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: A fresh verification email was dispatched.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No additional email with this id on the caller's profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            The email is already verified. Error code: `ALREADY_VERIFIED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            The address is on a reserved domain (RFC 2606/6761, e.g. `.invalid`) that never receives
            mail, for example one stored before addresses were validated. `details.code` is
            `RESERVED_DOMAIN`, `details.domain` names the domain; the address itself is not echoed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

  /users/additional-emails/verify:
    get:
      tags:
        - User Account
      summary: Check an additional-email verification token (no mutation)
      description: |
        Additional-email verification v2 — public, token-credentialed pre-flight
        check used by the `/verify-email` landing page. Validates the token's
        signature + expiry and returns the (masked) email and its current
        verification status WITHOUT mutating any state. Mail-scanner prefetches
        of the link land here (GET) and never confirm; the actual confirm is a
        separate POST. No JWT — the token IS the credential.
      operationId: checkAdditionalEmailVerification
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: The signed verification token from the email link.
          schema:
            type: string
      responses:
        '200':
          description: Token is valid; returns masked email + status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalEmailVerificationCheckResponse'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    email: jonas.vorlage@example.com
                    verified: false
        '400':
          description: |
            Token is invalid (`TOKEN_INVALID`) or expired (`TOKEN_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - User Account
      summary: Confirm an additional-email verification token (mutates)
      description: |
        Additional-email verification v2 — public, token-credentialed confirm.
        POST-only so mail-scanner prefetches (GET) cannot accidentally verify.
        On success sets `verified_at` and returns the masked email. Idempotent:
        a token for an already-verified row returns 200 with
        `alreadyVerified: true`. If the underlying row was deleted (or re-added
        with a new id) since the token was issued, returns 404. No JWT — the
        token IS the credential.
      operationId: confirmAdditionalEmailVerification
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAdditionalEmailVerificationRequest'
      responses:
        '200':
          description: Email verified (or already verified).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdditionalEmailVerificationConfirmResponse'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    email: jonas.vorlage@example.com
                    verified: true
                    alreadyVerified: false
        '400':
          description: |
            Token is invalid (`TOKEN_INVALID`) or expired (`TOKEN_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            The additional-email row referenced by the token no longer exists
            (deleted or re-added with a new id since issuance).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /users/{username}/roles:
    get:
      tags:
        - Role Management
      summary: Get user roles
      description: |
        Retrieve roles for a specific user.

        **Acceptance Criteria**: AC8

        **Story 1.16.2**: Uses username as identifier instead of UUID

        **Authorization**: ADMIN or ORGANIZER role required

      operationId: getUserRoles
      parameters:
        - name: username
          in: path
          description: Username (unique identifier)
          required: true
          schema:
            type: string
            pattern: '^[a-z]+\.[a-z]+(\.[0-9]+)?$'
            example: john.doe
      responses:
        '200':
          description: Roles retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRolesResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    username: ben.beispiel
                    roles:
                      - SPEAKER
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

    put:
      tags:
        - Role Management
      summary: Update user roles
      description: |
        Update roles for a specific user.

        **Acceptance Criteria**: AC8

        **Story 1.16.2**: Uses username as identifier instead of UUID

        **Authorization**: ADMIN or ORGANIZER role required

        **Business Rules**:
        - System must maintain at least 2 active ORGANIZER role users
        - Removing ORGANIZER role requires approval if only 2 remain

        **Events Published**: UserRoleChangedEvent (in-process domain event)

        **Cache Invalidation**: All user caches cleared on role update

      operationId: updateUserRoles
      parameters:
        - name: username
          in: path
          description: Username (unique identifier)
          required: true
          schema:
            type: string
            pattern: '^[a-z]+\.[a-z]+(\.[0-9]+)?$'
            example: john.doe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRolesRequest'
      responses:
        '200':
          description: Roles updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRolesResponse'
              examples:
                default:
                  summary: captured from the local anonymized database (same schema as a GET)
                  value:
                    username: ben.beispiel
                    roles:
                      - SPEAKER
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

  /users/{username}/picture:
    delete:
      tags:
        - Profile Picture
      summary: Remove a profile picture
      description: |
        Remove a user's profile picture (Story 4.10, replaces `DELETE /users/me/picture`).

        **Authorization**: the user themself, or ORGANIZER for any user; anyone else gets 403.

        Clears profile picture URL and S3 key from user entity.

      operationId: removeProfilePictureForUser
      parameters:
        - name: username
          in: path
          description: Username (unique identifier)
          required: true
          schema:
            type: string
            pattern: '^[a-z]+\.[a-z]+(\.[0-9]+)?$'
            example: john.doe
      responses:
        '204':
          description: Profile picture removed successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

  /watch/pair:
    post:
      operationId: pairWatch
      tags:
        - Watch Authentication
      summary: Exchange pairing code for pairing token (W2.2 AC2/AC3)
      description: |
        Exchanges a 6-digit pairing code (generated via POST /users/{username}/watch-pairing)
        for a long-lived pairing token. The code is single-use and cleared after exchange.

        **Unauthenticated** — the pairing code is the credential.

        Returns 400 if code is invalid, not found, or expired.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchPairingRequest'
            example:
              pairingCode: "482715"
      responses:
        '200':
          description: Pairing successful — returns pairing token and organizer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchPairingResponse'
              example:
                pairingToken: "a1b2c3d4-1234567890-98765"
                organizerUsername: "marco.organizer"
                organizerFirstName: "Marco"
        '400':
          description: Code invalid, expired, or wrong format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []

  /watch/authenticate:
    post:
      operationId: authenticateWatch
      tags:
        - Watch Authentication
      summary: Exchange pairing token for short-lived JWT (W2.2 AC4/NFR16)
      description: |
        Exchanges a pairing token for a short-lived JWT (1-hour lifespan per NFR16).
        Called on app launch and auto-refreshed 10 minutes before expiry.

        **Unauthenticated** — the pairing token is the credential.

        Returns 401 if pairing token is invalid or pairing is incomplete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WatchAuthRequest'
            example:
              pairingToken: "a1b2c3d4-1234567890-98765"
      responses:
        '200':
          description: Authentication successful — returns JWT and expiry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatchAuthResponse'
              example:
                jwt: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                expiresAt: "2026-02-17T16:30:00"
        '401':
          description: Pairing token invalid or pairing incomplete
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security: []

components:
  schemas:
    UserReconciliationReport:
      type: object
      description: Result of a manual Cognito→DB user reconciliation (Story 1.2.5)
      properties:
        orphanedUsersDeactivated:
          type: integer
          description: Users present in the DB but absent in Cognito, deactivated by this run
        missingUsersCreated:
          type: integer
          description: Users present in Cognito but absent in the DB, created by this run
        durationMs:
          type: integer
          format: int64
          description: Reconciliation duration in milliseconds
        errors:
          type: array
          items:
            type: string
        success:
          type: boolean
        message:
          type: string
    PublicOrganizerResponse:
      type: object
      description: >-
        Public organizer projection for the About page (no sensitive fields; no email address,
        GHSA-qhqv: the page contacts info@batbern.ch)
      required:
        - id
        - firstName
        - lastName
        - bio
        - profilePictureUrl
        - companyId
      properties:
        id:
          type: string
          description: Username (public identifier)
        firstName:
          type: string
        lastName:
          type: string
        bio:
          nullable: true
          type: string
        profilePictureUrl:
          nullable: true
          type: string
        companyId:
          nullable: true
          type: string
    UserSyncStatus:
      type: object
      description: Cognito↔DB sync status snapshot (Story 1.2.5)
      properties:
        cognitoUserCount:
          type: integer
        databaseUserCount:
          type: integer
        missingInDatabase:
          type: integer
        orphanedInDatabase:
          type: integer
        missingCognitoIds:
          type: array
          items:
            type: string
        inSync:
          type: boolean
        message:
          type: string
    # Story 11.C.1: Public user projection (anonymous lookup)
    PublicUserResponse:
      type: object
      description: |
        Narrow public projection of a user — exactly the fields the public
        archive page needs for portrait display. No email, no role list,
        no other PII. Mirrors PublicOrganizerResponse's projection.
      required:
        - username
        - firstName
        - lastName
        - profilePictureUrl
      properties:
        username:
          type: string
          description: Public identifier (ADR-003)
          example: john.doe
        firstName:
          type: string
          nullable: true
          example: John
        lastName:
          type: string
          nullable: true
          example: Doe
        profilePictureUrl:
          type: string
          nullable: true
          format: uri
          description: CloudFront URL of the user's portrait, when set.
          example: https://cdn.batbern.ch/users/john.doe/profile.jpg

    # W2.2: Watch Authentication Schemas
    WatchPairingRequest:
      type: object
      required:
        - pairingCode
      properties:
        pairingCode:
          type: string
          pattern: '^\d{6}$'
          description: 6-digit numeric pairing code generated by the web frontend
          example: "482715"

    WatchPairingResponse:
      type: object
      required:
        - pairingToken
        - organizerUsername
        - organizerFirstName
      properties:
        pairingToken:
          type: string
          description: Long-lived token stored in Watch Keychain (NFR15)
        organizerUsername:
          type: string
          description: Organizer's username
        organizerFirstName:
          type: string
          description: Organizer's first name for display

    WatchAuthRequest:
      type: object
      required:
        - pairingToken
      properties:
        pairingToken:
          type: string
          description: Pairing token obtained from /watch/pair

    WatchAuthResponse:
      type: object
      required:
        - jwt
        - expiresAt
      properties:
        jwt:
          type: string
          description: Short-lived JWT for authenticated Watch API calls (1 hour, NFR16)
        expiresAt:
          type: string
          format: date-time
          description: JWT expiry timestamp (ISO 8601)

    UserResponse:
      type: object
      description: |
        User response with meaningful IDs.
        Story 1.16.2: id field contains username, not UUID.
      required:
        - id
        - email
        - firstName
        - lastName
        - roles
        - createdAt
        - updatedAt
        - hasCognitoAccount
        - bio
        - companyId
        - profilePictureUrl
        - active
        - lastLoginAt
        - termsAcceptedAt
        - company
        - settings
        - additionalEmails
      properties:
        id:
          type: string
          description: Username (unique identifier) - Story 1.16.2
          pattern: '^[a-z]+\.[a-z]+(\.[0-9]+)?$'
          example: john.doe
        hasCognitoAccount:
          type: boolean
          description: True if this user has a linked Cognito account (UUID not exposed per ADR-003)
          example: true
        email:
          type: string
          format: idn-email
          example: john.doe@example.com
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Doe
        bio:
          nullable: true
          type: string
          example: Software engineer passionate about cloud architecture
        companyId:
          nullable: true
          type: string
          description: Company name (unique identifier) - Story 1.16.2
          example: Swiss IT Solutions AG
        roles:
          type: array
          items:
            type: string
            enum: [ORGANIZER, SPEAKER, PARTNER, ATTENDEE]
        profilePictureUrl:
          nullable: true
          type: string
          format: uri
          example: https://cdn.batbern.ch/profile-pictures/550e8400.jpg
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: 2025-01-15T10:00:00Z
        updatedAt:
          type: string
          format: date-time
          example: 2025-01-15T10:00:00Z
        lastLoginAt:
          nullable: true
          type: string
          format: date-time
          example: 2025-01-20T14:30:00Z
        termsAcceptedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Story 12.11: moment the user accepted the Terms of Service + Privacy Policy.
            null = consent not on record — the frontend onboarding gate blocks the user on
            /profile?onboarding=1 until accepted. Returned unconditionally (no ?include=
            needed) because the gate check must always be present. Set server-side only
            (write-once via UpdateUserRequest.termsAccepted).
          example: 2026-06-04T16:00:00Z
        company:
          oneOf:
            - $ref: '#/components/schemas/Company'
            - type: 'null'
        settings:
          description: The user's settings, only with `?include=settings`.
          oneOf:
            - $ref: '#/components/schemas/UserSettings'
            - type: 'null'
        additionalEmails:
          type: array
          description: |
            Story 10.32: additional email addresses registered on this profile.
            Receive forwarded copies of mail addressed to the user (ok@/partner@/batbern{N}@
            role fan-out, registration confirmations) and are accepted as authorised
            senders by the Story 10.26 alias forwarding (EMS). Always present; may be empty.
          items:
            $ref: '#/components/schemas/AdditionalEmail'

    UserMergeProfileSummary:
      type: object
      description: One side of a merge, as the organizer sees it
      required: [username, firstName, lastName, email, hasLogin, roles, additionalEmails, companyId]
      properties:
        username:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        companyId:
          type: string
          nullable: true
        hasLogin:
          type: boolean
          description: The profile has a Cognito user, i.e. the person can log in with it
        roles:
          type: array
          items:
            type: string
        additionalEmails:
          type: array
          items:
            type: string
    UserMergePreview:
      type: object
      required: [target, source, moves, conflicts, blockers, canMerge, reasons]
      properties:
        target:
          $ref: '#/components/schemas/UserMergeProfileSummary'
        source:
          $ref: '#/components/schemas/UserMergeProfileSummary'
        moves:
          type: object
          description: Rows that move to the target, per `table.column`
          additionalProperties:
            type: integer
        conflicts:
          type: object
          description: Rows per table where both hold one for the same event or session
          additionalProperties:
            type: integer
        blockers:
          type: array
          description: Events where both lead a different talk; the merge is refused until resolved
          items:
            type: string
        canMerge:
          type: boolean
        reasons:
          type: array
          description: |
            Why `canMerge` is false: `SOURCE_HAS_LOGIN`, `BOTH_HAVE_LOGIN`, `SAME_PROFILE`, `BLOCKED`
          items:
            type: string
    UserMergeRequest:
      type: object
      required: [sourceUsername]
      additionalProperties: false
      properties:
        sourceUsername:
          type: string
          minLength: 1
          maxLength: 100
    UserMergeResult:
      type: object
      required: [targetUsername, sourceUsername, moved, removed]
      properties:
        targetUsername:
          type: string
        sourceUsername:
          type: string
        moved:
          type: object
          additionalProperties:
            type: integer
        removed:
          type: object
          additionalProperties:
            type: integer
    ProfileClaimCandidate:
      type: object
      required: [candidateId, maskedEmail, companyName, requestPending, placeholderAddress]
      properties:
        candidateId:
          type: string
          format: uuid
        maskedEmail:
          type: string
          example: h***@example.ch
        companyName:
          type: string
          nullable: true
        requestPending:
          type: boolean
          description: '#1237: a merge request for this profile is with the organizers'
        placeholderAddress:
          type: boolean
          description: |
            #1244: the earlier profile carries a placeholder address from the historical import
            (`vorname.nachname@batbern.ch`) that reaches nobody. Only the request to the organizers
            (#1237) is offered; a claim link is refused (409 `PLACEHOLDER_ADDRESS`).
    CompanyLogoRequestCreate:
      type: object
      required: [logoUploadId]
      additionalProperties: false
      properties:
        logoUploadId:
          type: string
          minLength: 1
          maxLength: 100
          description: Upload id of a CONFIRMED `company-logo` upload (uploads-api)
        note:
          type: string
          maxLength: 500
          nullable: true
          example: Neues Logo seit dem Rebranding im Juni.
    CompanyLogoRequestDecline:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional; mailed to the requester when given
    CompanyLogoRequestView:
      type: object
      required: [requestId, status, requesterUsername, companyName, newLogoUrl, createdAt, requesterName, companyDisplayName, oldLogoUrl, note, decidedBy, decidedAt, reason]
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [OPEN, APPROVED, DECLINED]
        requesterUsername:
          type: string
        requesterName:
          type: string
          nullable: true
        companyName:
          type: string
          description: Company identifier (ADR-003 slug)
        companyDisplayName:
          type: string
          nullable: true
        oldLogoUrl:
          type: string
          nullable: true
          description: The company's logo when the request was made; absent when it had none
        newLogoUrl:
          type: string
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        decidedBy:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true
    ProfileMergeRequestCreate:
      type: object
      required: [candidateId]
      additionalProperties: false
      properties:
        candidateId:
          type: string
          format: uuid
        note:
          type: string
          maxLength: 500
          nullable: true
          example: Ich war bis 2024 bei Firma X.
    ProfileMergeRequestCreated:
      type: object
      required: [requestId]
      properties:
        requestId:
          type: string
          format: uuid
    ProfileMergeRequestDecline:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    ProfileMergeRequestView:
      type: object
      required: [requestId, status, requesterUsername, sourceUsername, createdAt, note, decidedBy, decidedAt, reason, preview]
      properties:
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [OPEN, APPROVED, DECLINED]
        requesterUsername:
          type: string
          description: The login profile (merge target)
        sourceUsername:
          type: string
          description: The profile without login (merge source)
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        decidedBy:
          type: string
          nullable: true
        decidedAt:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true
        preview:
          description: Both profiles and what would move; absent once the request is decided
          nullable: true
          allOf:
            - $ref: '#/components/schemas/UserMergePreview'
    DuplicateCandidate:
      type: object
      required: [rule, confidence, organizerCanMerge, target, source]
      properties:
        rule:
          type: string
          enum: [SAME_NAME, SWAPPED_NAME, SAME_ADDRESS_NAME]
        confidence:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        organizerCanMerge:
          type: boolean
          description: False when both profiles have a login
        target:
          $ref: '#/components/schemas/DuplicateCandidateProfile'
        source:
          $ref: '#/components/schemas/DuplicateCandidateProfile'
    DuplicateCandidateProfile:
      type: object
      required: [username, email, hasLogin, placeholderAddress, firstName, lastName, companyId, createdAt]
      properties:
        username:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        email:
          type: string
        companyId:
          type: string
          nullable: true
        hasLogin:
          type: boolean
        placeholderAddress:
          type: boolean
          description: The address is an import placeholder (`vorname.nachname@batbern.ch`)
        createdAt:
          type: string
          format: date-time
          nullable: true
    DuplicateDismissal:
      type: object
      required: [usernameA, usernameB]
      additionalProperties: false
      properties:
        usernameA:
          type: string
          minLength: 1
          maxLength: 100
        usernameB:
          type: string
          minLength: 1
          maxLength: 100
    AccountMergeRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: idn-email
          # One email rule everywhere (#1102): ASCII local part (SES has no SMTPUTF8), any domain.
          # Source of truth: shared-kernel EmailAddresses.OPENAPI_PATTERN.
          pattern: '^[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+(\.[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+)*@[^\s@.]+(\.[^\s@.]+)+$'
          maxLength: 255
          description: Primary address of the other account
    ProfileClaimRequest:
      type: object
      required: [candidateId]
      additionalProperties: false
      properties:
        candidateId:
          type: string
          format: uuid
    ConfirmProfileClaimRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
    ProfileClaimConfirmResponse:
      type: object
      required: [merged, alreadyMerged]
      properties:
        merged:
          type: boolean
        alreadyMerged:
          type: boolean
    AdditionalEmail:
      type: object
      description: Story 10.32 — one additional email address registered on a user profile.
      required:
        - id
        - email
        - createdAt
        - label
        - verifiedAt
        - receiveEventMail
      properties:
        id:
          type: string
          format: uuid
          description: |
            Story 4.10d — the key of this address in the `…/additional-emails/{emailId}` operations.
            Making an address primary replaces the rows, so the ids change; read them again.
          example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        email:
          type: string
          format: idn-email
          example: info@batbern.ch
        label:
          type: string
          nullable: true
          description: Optional free-text user hint (e.g. "Hostpoint shared mailbox").
          example: Hostpoint shared
        createdAt:
          type: string
          format: date-time
          example: 2026-05-22T10:00:00Z
        verifiedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Reserved for the v2 verification flow (Story 10.32 Resolved Decision #1).
            v1 always returns null.
        receiveEventMail:
          type: boolean
          default: false
          description: |
            #1244 — this address gets a copy of event mails (registration, waitlist,
            invitations, reminders). Event mails go to the primary address; a copy only to
            confirmed additional addresses that opted in. Off by default.

    UpdateAdditionalEmailRequest:
      type: object
      description: "#1244 — settings of one of the caller's additional addresses."
      required:
        - receiveEventMail
      properties:
        receiveEventMail:
          type: boolean
          description: Copy of event mails to this address. Only for a confirmed address.

    AddAdditionalEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: idn-email
          # One email rule everywhere (#1102): ASCII local part (SES has no SMTPUTF8), any domain.
          # Source of truth: shared-kernel EmailAddresses.OPENAPI_PATTERN.
          pattern: '^[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+(\.[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+)*@[^\s@.]+(\.[^\s@.]+)+$'
          # RFC 5321 §4.5.3.1.3 — practical maximum for a valid mailbox path
          # is 254 characters. Without this cap, a 256+ char value passes
          # bean validation and crashes at INSERT into VARCHAR(255) → 500.
          # Review 2026-05-22 finding P1-3.
          maxLength: 254
          example: info@batbern.ch
        label:
          type: string
          nullable: true
          maxLength: 100
          example: Hostpoint shared

    AdditionalEmailVerificationCheckResponse:
      type: object
      description: |
        Additional-email verification v2 — GET-check response. Returns the masked
        email and current verification status without mutating state.
      required:
        - email
        - verified
      properties:
        email:
          type: string
          description: |
            Masked form of the additional email (e.g. `in***@example.com`). The
            full address is never returned on the public verify path.
          example: in***@batbern.ch
        verified:
          type: boolean
          description: True if the row's verified_at is already set.
          example: false

    ConfirmAdditionalEmailVerificationRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          description: The signed verification token from the email link.

    AdditionalEmailVerificationConfirmResponse:
      type: object
      description: |
        Additional-email verification v2 — POST-confirm response.
      required:
        - email
        - verified
        - alreadyVerified
      properties:
        email:
          type: string
          description: Masked form of the additional email.
          example: in***@batbern.ch
        verified:
          type: boolean
          description: Always true after a successful confirm.
          example: true
        alreadyVerified:
          type: boolean
          description: |
            True when the row was already verified before this call (idempotent
            re-confirm); false when this call set verified_at.
          example: false

    UserSettings:
      type: object
      description: |
        The user's settings, one object (Story 4.9 merged the former UserPreferences into it).
        Display: theme, language, timezone. Notifications: channels, frequency, Q&A digest, quiet
        hours. Privacy: visibility and contact options.
      required:
        - theme
        - language
        - timezone
        - emailNotifications
        - inAppNotifications
        - pushNotifications
        - notificationFrequency
        - qnaNotificationFrequency
        - quietHoursStart
        - quietHoursEnd
        - profileVisibility
        - showEmail
        - showCompany
        - showActivityHistory
        - allowMessaging
        - allowCalendarSync
        - twoFactorEnabled
      properties:
        theme:
          type: string
          enum: [light, dark, auto]
          default: auto
        language:
          type: string
          enum: [de, en, fr, it, rm, es, fi, nl, ja]
          default: de
        timezone:
          nullable: true
          type: string
          description: IANA zone id
          default: Europe/Zurich
          example: Europe/Zurich
        emailNotifications:
          type: boolean
          default: true
        inAppNotifications:
          type: boolean
          default: true
        pushNotifications:
          type: boolean
          default: false
        notificationFrequency:
          type: string
          enum: [immediate, daily_digest, weekly_digest]
          default: immediate
        qnaNotificationFrequency:
          type: string
          description: |
            How often this user is emailed about new questions in the Q&A of sessions
            where they are speaker / co-speaker / moderator (Story 15.7).
            `live` = bundled digest during the session (~15 min window),
            `daily` = at most once per 24h, `off` = never. Defaults to `live`.
          enum: ["live", "daily", "off"]
          default: "live"
        quietHoursStart:
          nullable: true
          type: string
          pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: '22:00'
        quietHoursEnd:
          nullable: true
          type: string
          pattern: '^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$'
          example: '07:00'
        profileVisibility:
          type: string
          enum: [public, members_only, private]
          default: public
        showEmail:
          type: boolean
          default: false
        showCompany:
          type: boolean
          default: true
        showActivityHistory:
          type: boolean
          default: true
        allowMessaging:
          type: boolean
          default: true
        allowCalendarSync:
          type: boolean
          default: false
        twoFactorEnabled:
          type: boolean
          default: false
        whatsNewSeenAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the user last closed the "What's new" card on the attendee dashboard. Features
            released after this time are shown again; absent (never closed) shows the most
            important ones.
          example: '2026-11-13T09:30:00Z'

    UpdateUserSettingsRequest:
      type: object
      description: |
        Partial update of the caller's settings: every field is optional and only the fields
        present change. No defaults on purpose, so an absent field never overwrites a stored value.
        null keeps a value; an empty string clears the quiet hours (as an empty assignee unassigns
        a task).
      properties:
        theme:
          type: string
          enum: [light, dark, auto]
        language:
          type: string
          enum: [de, en, fr, it, rm, es, fi, nl, ja]
        timezone:
          type: string
          description: IANA zone id, e.g. Europe/Zurich
          minLength: 1
          maxLength: 64
        emailNotifications:
          type: boolean
        inAppNotifications:
          type: boolean
        pushNotifications:
          type: boolean
        notificationFrequency:
          type: string
          enum: [immediate, daily_digest, weekly_digest]
        qnaNotificationFrequency:
          type: string
          enum: ["live", "daily", "off"]
        quietHoursStart:
          type: string
          description: HH:mm; an empty string clears it (no quiet hours)
          pattern: '^(([0-1]?[0-9]|2[0-3]):[0-5][0-9])?$'
        quietHoursEnd:
          type: string
          description: HH:mm; an empty string clears it (no quiet hours)
          pattern: '^(([0-1]?[0-9]|2[0-3]):[0-5][0-9])?$'
        profileVisibility:
          type: string
          enum: [public, members_only, private]
        showEmail:
          type: boolean
        showCompany:
          type: boolean
        showActivityHistory:
          type: boolean
        allowMessaging:
          type: boolean
        allowCalendarSync:
          type: boolean
        twoFactorEnabled:
          type: boolean
        whatsNewSeenAt:
          type: string
          format: date-time
          description: |
            The time the user closed the "What's new" card (the client sends "now"). A time
            ahead of the server clock is stored as the server's now.
          example: '2026-11-13T09:30:00Z'

    UpdateUserRequest:
      type: object
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: idn-email
          # One email rule everywhere (#1102): ASCII local part (SES has no SMTPUTF8), any domain.
          # Source of truth: shared-kernel EmailAddresses.OPENAPI_PATTERN.
          pattern: '^[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+(\.[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+)*@[^\s@.]+(\.[^\s@.]+)+$'
          maxLength: 254
        bio:
          type: string
          maxLength: 5000
          description: A blank value clears the bio (stored and returned as null).
        companyId:
          type: string
          description: Company name (unique identifier, alphanumeric only)
          pattern: '^[a-zA-Z0-9]{1,12}$'
          maxLength: 12
          example: PostFinance
        termsAccepted:
          type: boolean
          description: |
            Story 12.11: accept the Terms of Service + Privacy Policy. WRITE-ONCE
            semantics — when true and no consent is on record, the server stamps
            terms_accepted_at with ITS OWN clock (the client never supplies the
            timestamp). When consent is already recorded, true is a no-op (the
            original timestamp is preserved). false or absent never changes or
            revokes recorded consent.
          example: true

    UserSearchResponse:
      type: object
      description: |
        User search result with meaningful IDs.
        Story 1.16.2: id field contains username, not UUID.
      required:
        - id
        - email
        - firstName
        - lastName
        - companyId
        - roles
        - profilePictureUrl
      properties:
        id:
          type: string
          description: Username (unique identifier) - Story 1.16.2
          pattern: '^[a-z]+\.[a-z]+(\.[0-9]+)?$'
          example: john.doe
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        companyId:
          nullable: true
          type: string
          description: Company name (unique identifier) - Story 1.16.2
          example: Swiss IT Solutions AG
        roles:
          type: array
          items:
            type: string
        profilePictureUrl:
          nullable: true
          type: string
          format: uri

    CreateUserRequest:
      type: object
      description: Request body for creating a new user (Story 2.5.2 AC4)
      required:
        - email
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: idn-email
          # One email rule everywhere (#1102): ASCII local part (SES has no SMTPUTF8), any domain.
          # Source of truth: shared-kernel EmailAddresses.OPENAPI_PATTERN.
          pattern: '^[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+(\.[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+)*@[^\s@.]+(\.[^\s@.]+)+$'
          maxLength: 254
          description: User email address (must be unique)
          example: anna.mueller@example.com
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          description: User first name
          example: Anna
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          description: User last name
          example: Müller
        companyId:
          type: string
          description: Company name (unique identifier) - Story 1.16.2
          example: Swiss IT Solutions AG
        initialRoles:
          type: array
          description: Initial roles for the user (defaults to [ATTENDEE] if not specified)
          items:
            type: string
            enum: [ORGANIZER, SPEAKER, PARTNER, ATTENDEE]
          example: [ATTENDEE]
        bio:
          type: string
          maxLength: 5000
          description: User biography/description
          example: Software engineer passionate about cloud architecture

    ProvisionUserRequest:
      type: object
      description: |
        Request to provision a User with a role (Story 11.C.2 — AR13).
        Used by SpeakerWorkflowService.transition() at CONTACTED → READY, through the internal
        `POST /internal/users/provision` (docs/api/internal/cums-internal.openapi.yml; no public
        operation uses this schema since Epic 17 entry 6).
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: idn-email
          # One email rule everywhere (#1102): ASCII local part (SES has no SMTPUTF8), any domain.
          # Source of truth: shared-kernel EmailAddresses.OPENAPI_PATTERN.
          pattern: '^[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+(\.[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+)*@[^\s@.]+(\.[^\s@.]+)+$'
          maxLength: 254
          description: Required. Lookup key for the existing-user path (case-insensitive).
          example: jane.smith@example.com
        firstName:
          nullable: true
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Optional. If absent, defaults are derived from the email local-part
            (e.g., `jane.smith@x.com` → firstName=`Jane`, lastName=`Smith`).
          example: Jane
        lastName:
          nullable: true
          type: string
          minLength: 1
          maxLength: 100
          description: |
            Optional. If absent, defaults are derived from the email local-part.
            See `firstName`.
          example: Smith
        role:
          type: string
          description: |
            Role to grant. `POST /internal/users/provision` grants SPEAKER only and answers 400
            for any other value, whoever calls.
          enum: [ORGANIZER, SPEAKER, PARTNER, ATTENDEE]
          example: SPEAKER

    ProvisionUserResponse:
      type: object
      description: |
        Response from the user-provisioning endpoint. Story 11.E.2 (Resolved Q#1 Variant B)
        removed the `temporaryPassword` field — credential issuance is owned by the sibling
        `/internal/users/{username}/issue-invitation-credentials` endpoint, which is called at
        READY → INVITED rather than at CONTACTED → READY.
      required:
        - username
        - created
      properties:
        username:
          type: string
          description: |
            Canonical username (existing or newly generated). No regex `pattern` constraint
            on the response — the server may emit legacy usernames that predate the current
            `firstname.lastname[.NN]` convention (e.g., hyphenated or apostrophed names).
            Pattern is enforced on `ProvisionUserRequest.username` only.
          example: jane.smith
        created:
          type: boolean
          description: True if a new User row was created; false if the user already existed.
          example: true

    InvitationCredentialsResponse:
      type: object
      description: |
        Response from `/internal/users/{username}/issue-invitation-credentials` (Story 11.E.2 — AR15/FR9).
        Determines whether the invitation email renders the "temporary password" block or the
        "use your existing password" block.
      required:
        - action
        - temporaryPassword
      properties:
        temporaryPassword:
          type: string
          nullable: true
          description: |
            Fresh temporary password for the speaker's first login. Non-null when
            `action = "FRESH_TEMP_PASSWORD"`; null when `action = "USE_EXISTING_PASSWORD"`.
            Never persisted at rest in CUMS or EMS; the caller embeds it once in the
            invitation email and discards it from memory.
          example: "example-temp-password"
        action:
          type: string
          enum: ["FRESH_TEMP_PASSWORD", "USE_EXISTING_PASSWORD"]
          description: |
            Discriminator for the calling email service. Determines whether the
            invitation-email template renders the temp-password block or the
            "use your existing password" block.
          example: FRESH_TEMP_PASSWORD

    PatchUserProfileRequest:
      type: object
      description: |
        Patch the narrow profile fields owned by the consolidated ContentSubmissionService
        (Story 11.C.2 — AR14). At least one of `bio` or `profilePictureUrl` must be present.
        Null fields are left unchanged.
      additionalProperties: false
      properties:
        bio:
          nullable: true
          type: string
          maxLength: 5000
          description: Updated user biography. Overwrites the global value per ADR-009 §6.7.
          example: "Experienced security architect with 15 years in the industry."
        profilePictureUrl:
          nullable: true
          type: string
          maxLength: 2048
          description: |
            Updated profile picture URL (typically a CloudFront URL produced by an earlier
            presigned-upload flow). Modelled as a plain string (not `format: uri`) so the
            Bean Validation {@code @Size(max=2048)} constraint generated by the Spring
            OpenAPI generator applies cleanly.
          example: "https://cdn.batbern.ch/users/jane.smith.jpg"

    GetOrCreateUserRequest:
      type: object
      description: Request to get an existing user or create a new one. Supports both authenticated (Cognito) and anonymous users (ADR-005).
      required:
        - email
        - firstName
        - lastName
      properties:
        email:
          type: string
          format: idn-email
          # One email rule everywhere (#1102): ASCII local part (SES has no SMTPUTF8), any domain.
          # Source of truth: shared-kernel EmailAddresses.OPENAPI_PATTERN.
          pattern: '^[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+(\.[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+)*@[^\s@.]+(\.[^\s@.]+)+$'
          maxLength: 254
          description: User email address. Used as unique identifier for anonymous users and for account linking.
          example: john.doe@example.com
        firstName:
          type: string
          maxLength: 100
          description: User first name
          example: John
        lastName:
          type: string
          maxLength: 100
          description: User last name
          example: Doe
        companyId:
          type: string
          nullable: true
          description: |
            Company name (unique identifier) - Story 1.16.2. Optional for anonymous event registration;
            missing or `null` means no company (EMS sends `null` when a speaker is invited without one).
          example: Swiss IT Solutions AG
        createIfMissing:
          type: boolean
          description: If true, creates a new user if not found. If false, returns error if user doesn't exist.
          default: true
        cognitoSync:
          type: boolean
          description: |
            Has no effect; kept for compatibility. This operation never creates a Cognito login: the
            profile is created with cognito_id=NULL either way. A login comes from the sign-up page
            (linked on first sign-in by the PreTokenGeneration trigger) or from issue-credentials.
          default: true
          example: false

    GetOrCreateUserResponse:
      type: object
      required:
        - username
        - created
        - user
        - companyUpdated
        - cognitoUserId
      properties:
        username:
          type: string
          description: Username (unique identifier) - Story 1.16.2
          pattern: '^[a-z]+\.[a-z]+(\.[0-9]+)?$'
          example: john.doe
        created:
          type: boolean
          description: True if user was created, false if existing
        companyUpdated:
          type: boolean
          description: >-
            True if the caller supplied a companyId that differed from the
            existing user's stored company and the profile was updated as a
            result. Always false for newly-created users. Lets a registration
            flow tell the attendee their company on file was refreshed.
        cognitoUserId:
          nullable: true
          type: string
          description: Cognito user ID (only if created)
        user:
          $ref: '#/components/schemas/UserResponse'

    Company:
      type: object
      description: |
        Company details with meaningful IDs.
        Story 1.16.2: id field contains company name, not UUID.
      required:
        - id
        - name
        - displayName
        - industry
        - website
      properties:
        id:
          type: string
          description: Company name (unique identifier) - Story 1.16.2
          example: Swiss IT Solutions AG
        name:
          type: string
          description: Company name (same as id)
          example: Swiss IT Solutions AG
        displayName:
          nullable: true
          type: string
        industry:
          nullable: true
          type: string
        website:
          nullable: true
          # A plain string, as CompanyResponse.website in companies-api: the same stored value,
          # which that API never checked as a URI.
          type: string
          maxLength: 500

    PaginatedUserResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        pagination:
          $ref: '#/components/schemas/PaginationMetadata'

    UserRolesResponse:
      type: object
      description: User roles response
      required:
        - username
        - roles
      properties:
        username:
          type: string
          description: Username (unique identifier) - Story 1.16.2
          pattern: '^[a-z]+\.[a-z]+(\.[0-9]+)?$'
          example: john.doe
        roles:
          type: array
          items:
            type: string
            enum: [ORGANIZER, SPEAKER, PARTNER, ATTENDEE]

    UpdateUserRolesRequest:
      type: object
      description: Request to update user roles
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            type: string
            enum: [ORGANIZER, SPEAKER, PARTNER, ATTENDEE]
          minItems: 1

    PaginationMetadata:
      $ref: './_shared.openapi.yml#/components/schemas/PaginationMetadata'
    ErrorResponse:
      $ref: './_shared.openapi.yml#/components/schemas/ErrorResponse'
    PairingCodeResponse:
      type: object
      required:
        - pairingCode
        - expiresAt
        - hoursUntilExpiry
      properties:
        pairingCode:
          type: string
          pattern: '^\d{6}$'
          example: '482910'
        expiresAt:
          type: string
          format: date-time
        hoursUntilExpiry:
          type: integer
          example: 24

    PairingStatusResponse:
      type: object
      required:
        - pairedWatches
        - pendingCode
      properties:
        pairedWatches:
          type: array
          items:
            $ref: '#/components/schemas/PairedWatch'
        pendingCode:
          oneOf:
            - $ref: '#/components/schemas/PendingPairingCode'
            - type: 'null'

    PairedWatch:
      type: object
      required:
        - id
        - pairedAt
        - deviceName
      properties:
        id:
          type: string
          format: uuid
          description: Stable UUID identifier used for unpair. Never null.
        deviceName:
          type: string
          nullable: true
          description: Device name, nullable (not set during pairing flow).
        pairedAt:
          type: string
          format: date-time

    PendingPairingCode:
      type: object
      required:
        - code
        - expiresAt
      properties:
        code:
          type: string
          pattern: '^\d{6}$'
        expiresAt:
          type: string
          format: date-time

  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            validationError:
              value:
                error: VALIDATION_ERROR
                errorCode: BAD_REQUEST
                message: Invalid request data
                timestamp: 2025-01-15T10:30:00Z

    Unauthorized:
      description: Unauthorized - missing or invalid JWT token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingToken:
              value:
                error: UNAUTHORIZED
                errorCode: UNAUTHORIZED
                message: Missing or invalid authentication token
                timestamp: 2025-01-15T10:30:00Z

    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            insufficientPermissions:
              value:
                error: FORBIDDEN
                errorCode: FORBIDDEN
                message: Insufficient permissions. Requires ADMIN or ORGANIZER role.
                timestamp: 2025-01-15T10:30:00Z

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            userNotFound:
              value:
                error: RESOURCE_NOT_FOUND
                errorCode: NOT_FOUND
                message: User not found with username 'john.doe'
                timestamp: 2025-01-15T10:30:00Z

    Conflict:
      description: Conflict - resource already exists or business rule violation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            duplicateEmail:
              value:
                error: CONFLICT
                errorCode: CONFLICT
                message: User with email 'john.doe@example.com' already exists
                timestamp: 2025-01-15T10:30:00Z
            minimumOrganizers:
              value:
                error: BUSINESS_RULE_VIOLATION
                errorCode: CONFLICT
                message: Cannot remove ORGANIZER role - minimum 2 organizers required
                timestamp: 2025-01-15T10:30:00Z

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            serverError:
              value:
                error: INTERNAL_SERVER_ERROR
                errorCode: INTERNAL_ERROR
                message: An unexpected error occurred
                timestamp: 2025-01-15T10:30:00Z

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AWS Cognito JWT token

security:
  - BearerAuth: []
