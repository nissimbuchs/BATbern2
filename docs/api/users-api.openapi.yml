  /users/me/account-merges:
    post:
      tags:
        - Profile Merge
      summary: Ask to merge a second account of the caller that has its own login
      description: |
        #1244 step 3 (owner decision 2026-11-07). For a person with two accounts that both have a
        login (first the company address, later a private one). `email` must be the primary
        address of another account with a login, else 404 (the caller's own address, an unknown
        address, an account without login). A link goes to that address; confirming it under the
        caller's login (`POST /users/me/profile-claims/confirm`) proves both mailboxes and merges
        the other account into the caller's. Organizers cannot do this for others.
      operationId: requestAccountMerge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountMergeRequest'
      responses:
        '202':
          description: The link was sent to the other address
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

  /users/me/profile-claims/confirm:
    post:
      tags:
        - Profile Merge
      summary: Confirm a profile claim with the link from the mail
      description: |
        #1183 D. Merges the earlier profile into the caller's, like an organizer merge. The token
        is bound to the caller: a link opened under another login is refused with 403
        `CLAIM_OTHER_ACCOUNT`. A link for a profile that is already merged returns
        `alreadyMerged: true`.

        #1244 step 3: when the link came from `POST /users/me/account-merges` (the other profile has
        its own login), that login is disabled first, the profile is merged with its addresses as
        confirmed addresses of the caller, and the login is deleted. If the merge fails the login is
        enabled again (502 `MERGE_EVENT_SERVICE_FAILED` when a holder of the user-reference contract
        did not answer); if it cannot be disabled nothing is merged.
      operationId: confirmProfileClaim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmProfileClaimRequest'
      responses:
        '200':
          description: Merged (or already merged)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileClaimConfirmResponse'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    merged: true
                    alreadyMerged: true
        '400':
          description: Token is invalid (`TOKEN_INVALID`) or expired (`TOKEN_EXPIRED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          description: A holder of the user-reference contract did not complete its part; the earlier profile stays
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - BearerAuth: []

  /users/me/profile-claims/merge-requests:
    post:
      tags:
        - Profile Merge
      summary: Ask the organizers to merge an earlier profile (no access to its address)
      description: |
        #1237. For someone who can no longer read the earlier profile's mailbox (a former
        employer's address). Opens a request that any organizer approves or declines in the Mail
        Center. The candidate must be one of `GET /users/me/profile-claims` (else 404). At most one
        open request per profile pair (409 `MERGE_REQUEST_OPEN`); a declined pair can be asked again
        after 30 days (409 `MERGE_REQUEST_DECLINED`). The old address is not added to the profile.
