  /users/duplicate-candidates:
    get:
      tags:
        - Profile Merge
      summary: Profile pairs that are probably one person (organizers)
      description: |
        Active profiles compared on the live data, for the organizer merge (#1183 C). Rules:
        `SAME_NAME` (first and last name equal ignoring case, umlauts as ae/oe/ue, accents, hyphens
        and underscores), `SWAPPED_NAME` (first and last name swapped), `SAME_ADDRESS_NAME` (the
        same `x.y` before the @ at another domain, different name). Confidence: `HIGH` for a
        swapped name, or a same name with an imported placeholder address
        (`vorname.nachname@batbern.ch`), the same company or the same part before the @; `MEDIUM`
        for another same name; `LOW` for `SAME_ADDRESS_NAME`. `target` is the suggested profile to
        keep (the one with a login, else the one without a placeholder, else the older one).
        `organizerCanMerge` is false when both have a login: only the person can merge those
        (`POST /users/me/account-merges`). Pairs marked "not a duplicate" are left out. Sorted by
        confidence, then name.
      operationId: listDuplicateCandidates
      responses:
        '200':
          description: The pairs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DuplicateCandidate'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    - rule: SAME_NAME
                      confidence: HIGH
                      organizerCanMerge: false
                      target:
                        username: ben.beispiel
                        firstName: Ben
                        lastName: Beispiel
                        email: ben.beispiel@example.com
                        companyId: swisscom
                        hasLogin: true
                        placeholderAddress: false
                        createdAt: "2025-11-30T21:49:37.171342Z"
                      source:
                        username: carla.beispiel
                        firstName: Carla
                        lastName: Beispiel
                        email: carla.beispiel@example.com
                        companyId: swisscom
                        hasLogin: true
                        placeholderAddress: false
                        createdAt: "2025-12-27T13:41:08.424726Z"
                    - rule: SAME_NAME
                      confidence: HIGH
                      organizerCanMerge: false
                      target:
                        username: david.beispiel
                        firstName: David
                        lastName: Beispiel
                        email: david.beispiel@example.com
                        companyId: postfinance
                        hasLogin: true
                        placeholderAddress: false
                        createdAt: "2025-12-27T13:40:01.659675Z"
                      source:
                        username: elena.beispiel
                        firstName: Elena
                        lastName: Beispiel
                        email: elena.beispiel@example.com
                        companyId: postfinance
                        hasLogin: true
                        placeholderAddress: false
                        createdAt: "2025-12-27T13:41:29.829025Z"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
      security:
        - BearerAuth: []

