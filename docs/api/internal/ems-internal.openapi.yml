openapi: 3.1.0
info:
  title: BATbern event-management internal API
  version: 1.0.0
  description: |
    Service-to-service operations of event-management under `/internal/**` (Story 17.0b2).
    Callers: company-user-management (`HttpEventManagementUserMergeClient`) and
    partner-coordination (`HttpOutboundMailRecorder`,
    `EventManagementClientImpl.getEventSummary` and `.getAttendanceSummary`).

    Not a public API: the API gateway does not route `/internal/**` and denies it explicitly; the
    services reach it inside the VPC through Service Connect. The JWT is optional (ADR-016 decision
    3): a caller forwards the user's JWT when there is one (shared-kernel `S2sHeaders`) and never
    has to; no operation here looks at the user's role. Public API tooling does
    not read `docs/api/internal/`. The specs describe the endpoints as they are; Story 17.6
    redesigns them (the verb segments stay until then). Paths are full paths (server `/`).
servers:
  - url: /
security: []

paths:
  /internal/users/merge-preview:
    get:
      operationId: previewUserMerge
      summary: What a profile merge would move (#1183)
      description: Counts per table and the rows that would collide; changes nothing.
      parameters:
        - name: source
          in: query
          required: true
          description: Username of the profile that disappears.
          schema:
            type: string
          example: anna.meier.2
        - name: target
          in: query
          required: true
          description: Username of the profile that stays.
          schema:
            type: string
          example: anna.meier
      responses:
        '200':
          description: The preview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergePreview'
              examples:
                clean:
                  value:
                    moves: {registrations.attendee_username: 2, session_users.username: 1}
                    conflicts: {}
                    blockers: []
                blocked:
                  value:
                    moves: {registrations.attendee_username: 1, session_users.username: 1}
                    conflicts: {registrations: 1}
                    blockers: [BATbern58]
        '400':
          description: |
            Source and target are the same username (`MergeError`, controller handler), or `source` /
            `target` missing (the shared `ErrorResponse` of the global handler)
          content:
            application/json:
              schema:
                # anyOf, not oneOf: a MergeError body ({error, message}) is also a valid
                # ErrorResponse (no required fields), so oneOf would reject every MergeError.
                anyOf:
                  - $ref: '#/components/schemas/MergeError'
                  - $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                error: INVALID_MERGE
                message: Source and target must be two different usernames

  /internal/users/merge:
    post:
      operationId: mergeUsers
      summary: Move every event-management row of one profile to another (#1183)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeRequest'
            example:
              sourceUsername: anna.meier.2
              targetUsername: anna.meier
              performedBy: organizer.alice
              trigger: ORGANIZER
              sourceProfile: {email: anna.private@example.com, firstName: Anna, lastName: Meier}
      responses:
        '200':
          description: What was moved and removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeResult'
              examples:
                merged:
                  value:
                    moved: {registrations.attendee_username: 2, session_users.username: 1}
                    removed: {registrations.attendee_username: 1}
        '400':
          description: Invalid request (validation, or source equals target)
          content:
            application/json:
              schema:
                # anyOf, not oneOf: a MergeError body ({error, message}) is also a valid
                # ErrorResponse (no required fields), so oneOf would reject every MergeError.
                anyOf:
                  - $ref: '#/components/schemas/MergeError'
                  - $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
        '409':
          description: Both profiles lead a different talk at the same event; nothing was moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeError'
              example:
                error: MERGE_BLOCKED
                message: 'Both profiles lead a different talk at BATbern58'

  /internal/users/primary-email:
    post:
      operationId: primaryEmailChanged
      summary: Upcoming registrations follow a new primary address (#1244)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrimaryEmailChange'
            example:
              username: anna.meier
              oldEmail: anna.old@example.com
              newEmail: anna.meier@example.com
      responses:
        '200':
          description: Number of registrations moved to the new address
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
                    minimum: 0
                additionalProperties: false
              examples:
                twoUpdated:
                  value: {updated: 2}
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

  /internal/events/{eventCode}/schedule:
    get:
      operationId: getEventSchedule
      summary: Date, venue and times of an event, for the partner meeting invite (ICS)
      description: |
        partner-coordination (`EventManagementClientImpl.getEventSummary`) builds the BATbern event
        entry of a partner meeting invite from it. `startTime` and `endTime` are the times EMS gives
        the event everywhere else (`EventTimeResolver`: registration mails, event pages): the
        earliest session start and latest session end once the agenda is published, before that the
        agenda config (per-event override, else the event type), else the type's conventional start
        plus 3 hours. The answer does not depend on a caller: it is called without a JWT
        (schedulers, partner callers). The public `GET /api/v1/events/{eventCode}` shows sessions
        to organizers only (17.0 deferred work, 2026-11-09).
      parameters:
        - name: eventCode
          in: path
          required: true
          schema:
            type: string
            maxLength: 50
          example: BATbern142
      responses:
        '200':
          description: The schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSchedule'
              examples:
                agendaPublished:
                  value:
                    eventCode: BATbern142
                    title: BATbern 142 - Cloud Native
                    date: '2026-06-11T16:00:00Z'
                    venueName: Kursaal Bern
                    venueAddress: Kornhausstrasse 3, 3013 Bern
                    eventType: EVENING
                    startTime: '2026-06-11T15:30:00Z'
                    endTime: '2026-06-11T19:45:00Z'
                beforeAgenda:
                  value:
                    eventCode: BATbern143
                    title: BATbern 143 - Data
                    date: '2026-11-05T15:00:00Z'
                    venueName: Kursaal Bern
                    venueAddress: Kornhausstrasse 3, 3013 Bern
                    eventType: EVENING
                    startTime: '2026-11-05T15:00:00Z'
                    endTime: '2026-11-05T18:00:00Z'
        '404':
          description: No event with this code
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

  /internal/events/attendance-summary:
    get:
      operationId: getAttendanceSummary
      summary: Attendees per event, in total and of one company (partner attendance dashboard)
      description: |
        partner-coordination (`EventManagementClientImpl.getAttendanceSummary`, Story 8.1) builds the
        partner attendance dashboard and its XLSX export from it. One row per event since 1 January
        of `fromYear` (UTC), newest first; only confirmed registrations count. Authorized by
        operation, not by the caller's role: the role and ownership check (PARTNER of the company or
        ORGANIZER) stays on the partner-coordination endpoint the user entered through (ADR-016
        decision 3). A forwarded JWT is optional and does not change the answer. Until 6b (Epic 17)
        the public `GET /api/v1/events/attendance-summary` of event-analytics-api.
      parameters:
        - name: companyName
          in: query
          required: true
          description: Company identifier (ADR-003 meaningful ID).
          schema:
            type: string
          example: GoogleZH
        - name: fromYear
          in: query
          required: false
          description: 'Earliest year to include (default: current year minus 5).'
          schema:
            type: integer
          example: 2021
      responses:
        '200':
          description: Per-event attendance, newest event first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceSummary'
              examples:
                twoEvents:
                  summary: Two events, newest first
                  value:
                    - eventCode: BATbern142
                      eventTitle: BATbern 142 - Cloud Native
                      eventDate: '2026-06-11T16:00:00Z'
                      totalAttendees: 180
                      companyAttendees: 6
                    - eventCode: BATbern141
                      eventTitle: BATbern 141 - Security
                      eventDate: '2025-11-13T16:00:00Z'
                      totalAttendees: 160
                      companyAttendees: 4
        '400':
          description: '`companyName` missing or `fromYear` not an integer'
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

  /internal/mails:
    post:
      operationId: recordInternalMail
      summary: Record a mail another service sent in the event's "What went out" (Story 16.9)
      description: |
        partner-coordination posts its meeting invites and cancellations. Only audience `PARTNERS`
        is accepted; at most 500 addresses (To and Cc) per mail. Subject and body arrive already
        redacted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalMailRequest'
            example:
              sendGroupId: 9f0c7c55-0d37-4d0e-9b5f-3b0f3f3c1e21
              eventCode: BATbern58
              audience: PARTNERS
              templateKey: partner-meeting-invite
              contentSource: TEMPLATE
              senderUsername: organizer.alice
              test: false
              reference: 'meeting:4b1f5a2e-6d3c-4f8a-9a51-0c8e7d2b1f00'
              to: anna.meier@example.com
              cc: []
              subject: 'Partner meeting BATbern58'
              htmlBody: '<p>Invitation</p>'
              sesMessageId: 0100018f-ses-message-id
      responses:
        '202':
          description: Recorded
        '400':
          description: Invalid request (validation, audience other than PARTNERS, too many addresses)
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

components:
  schemas:
    AttendanceSummary:
      type: object
      required: [eventCode, eventTitle, eventDate, totalAttendees, companyAttendees]
      description: >-
        Hand-written record `InternalAttendanceSummaryController.AttendanceSummary`: one event's
        confirmed attendees, in total and of the queried company (Story 8.1).
      properties:
        eventCode:
          type: string
        eventTitle:
          type: string
          description: Event title (the partner attendance XLSX export shows it).
        eventDate:
          type: string
          format: date-time
          description: Start of the event (instant).
        totalAttendees:
          type: integer
          format: int64
          minimum: 0
          description: Confirmed attendees of the event.
        companyAttendees:
          type: integer
          format: int64
          minimum: 0
          description: Confirmed attendees from the queried company.
      additionalProperties: false

    EventSchedule:
      type: object
      required: [eventCode, title, date, startTime, endTime, venueName, venueAddress, eventType]
      description: >-
        Hand-written record `InternalEventScheduleController.EventSchedule`. Optional properties are
        `null` when unknown.
      properties:
        eventCode:
          type: string
        title:
          type: string
        date:
          type: string
          format: date-time
          description: Start of the event (instant).
        venueName:
          type: string
        venueAddress:
          type: string
        eventType:
          type: string
          enum: [FULL_DAY, AFTERNOON, EVENING]
        startTime:
          type: string
          format: date-time
          description: Start of the event as EMS resolves it (`EventTimeResolver`).
        endTime:
          type: string
          format: date-time
          description: End of the event as EMS resolves it (`EventTimeResolver`).
      additionalProperties: false

    Counts:
      type: object
      description: Row count per table (`moves`, `moved` and `removed` keyed `table.column`, `conflicts` by table).
      additionalProperties:
        type: integer
        minimum: 0

    MergePreview:
      type: object
      description: Hand-written record `UserMergeService.Preview`.
      required: [moves, conflicts, blockers]
      properties:
        moves:
          $ref: '#/components/schemas/Counts'
        conflicts:
          $ref: '#/components/schemas/Counts'
        blockers:
          type: array
          description: Event codes at which both profiles lead a different talk; a merge is refused.
          items:
            type: string
      additionalProperties: false

    MergeResult:
      type: object
      description: Hand-written record `UserMergeService.Result`.
      required: [moved, removed]
      properties:
        moved:
          $ref: '#/components/schemas/Counts'
        removed:
          $ref: '#/components/schemas/Counts'
      additionalProperties: false

    MergeError:
      type: object
      description: Error body of the merge endpoints (controller-local handler, not the shared ErrorResponse).
      required: [error, message]
      properties:
        error:
          type: string
          enum: [MERGE_BLOCKED, INVALID_MERGE]
        message:
          type: string
      additionalProperties: false

    MergeRequest:
      type: object
      required: [sourceUsername, targetUsername, performedBy, trigger]
      properties:
        sourceUsername:
          type: string
          minLength: 1
          maxLength: 100
        targetUsername:
          type: string
          minLength: 1
          maxLength: 100
        performedBy:
          type: string
          minLength: 1
          maxLength: 100
        trigger:
          type: string
          enum: [ORGANIZER, SELF_CLAIM]
        sourceProfile:
          nullable: true
          type: object
          description: Snapshot of the source profile, kept in the merge log.
          additionalProperties: true

    PrimaryEmailChange:
      type: object
      required: [username, oldEmail, newEmail]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        oldEmail:
          type: string
          minLength: 1
          maxLength: 255
        newEmail:
          type: string
          minLength: 1
          maxLength: 255

    InternalMailRequest:
      type: object
      description: Flat mirror of `MailContext` + `OutboundMail` (record `InternalMailRequest`).
      required: [sendGroupId, audience, to]
      properties:
        sendGroupId:
          type: string
          minLength: 1
          maxLength: 256
        eventCode:
          nullable: true
          type: string
          maxLength: 50
        audience:
          type: string
          description: Only `PARTNERS` is accepted (400 otherwise).
          minLength: 1
        templateKey:
          nullable: true
          type: string
          maxLength: 100
        contentSource:
          nullable: true
          type: string
          description: A `MailContext.ContentSource`; absent means `TEMPLATE`.
          enum: [TEMPLATE, OWN_TEXT]
        senderUsername:
          nullable: true
          type: string
          maxLength: 100
        test:
          nullable: true
          type: boolean
        reference:
          nullable: true
          type: string
          maxLength: 100
        to:
          type: string
          description: The To line, comma-separated addresses.
          maxLength: 64000
        cc:
          nullable: true
          type: array
          maxItems: 500
          items:
            type: string
            maxLength: 320
        subject:
          nullable: true
          type: string
          maxLength: 1000
        htmlBody:
          nullable: true
          type: string
          maxLength: 2097152
        sesMessageId:
          nullable: true
          type: string
          maxLength: 255
        failureReason:
          nullable: true
          type: string
          maxLength: 500
