openapi: 3.1.0
info:
  title: BATbern event-management internal API
  version: 1.0.0
  description: |
    Service-to-service operations of event-management under `/internal/**` (Story 17.0b2).
    Caller: partner-coordination (`HttpOutboundMailRecorder`,
    `EventManagementClientImpl.getEventSummary` and `.getAttendanceSummary`), except for the
    operations tagged `contract` (below).

    event-management also implements contracts CUMS owns (ADR-016 decisions 4 and 5); those
    operations are specified in `cums-internal.openapi.yml`, not here: the Mail Center request
    contract (`/internal/mail-center-requests`) and the user-reference contract
    (`/internal/user-references/*`, formerly `/internal/users/merge-preview|merge|primary-email`).

    Contracts owned by event-management (ADR-016 decision 4): an operation tagged `contract` is not
    served by event-management. event-management calls it, and every service listed in its
    configuration under `batbern.contracts.<name>.implementers` serves it (shared-kernel
    `ContractCalls`); event-management names no implementing service in code. Epic 17 entry 8b:
    the calendar reply contract (`/internal/calendar-replies`, `calendar-replies`), implemented by
    partner-coordination.

    Not a public API: the API gateway does not route `/internal/**` and denies it explicitly; the
    services reach it inside the VPC through Service Connect. The JWT is optional (ADR-016 decision
    3): a caller forwards the user's JWT when there is one (shared-kernel `S2sHeaders`) and never
    has to; no operation here looks at the user's role. Public API tooling does
    not read `docs/api/internal/`. The specs describe the endpoints as they are; Story 17.6
    redesigns them (the verb segments stay until then). Paths are full paths (server `/`).
servers:
  - url: /
security: []

paths:
  /internal/events/{eventCode}/schedule:
    get:
      operationId: getEventSchedule
      summary: Date, venue and times of an event, for the partner meeting invite (ICS)
      description: |
        partner-coordination (`EventManagementClientImpl.getEventSummary`) builds the BATbern event
        entry of a partner meeting invite from it. `startTime` and `endTime` are the times EMS gives
        the event everywhere else (`EventTimeResolver`: registration mails, event pages): the
        earliest session start and latest session end once the agenda is published, before that the
        agenda config (per-event override, else the event type), else the type's conventional start
        plus 3 hours. The answer does not depend on a caller: it is called without a JWT
        (schedulers, partner callers). The public `GET /api/v1/events/{eventCode}` shows sessions
        to organizers only (17.0 deferred work, 2026-11-09).
      parameters:
        - name: eventCode
          in: path
          required: true
          schema:
            type: string
            maxLength: 50
          example: BATbern142
      responses:
        '200':
          description: The schedule
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSchedule'
              examples:
                agendaPublished:
                  value:
                    eventCode: BATbern142
                    title: BATbern 142 - Cloud Native
                    date: '2026-06-11T16:00:00Z'
                    venueName: Kursaal Bern
                    venueAddress: Kornhausstrasse 3, 3013 Bern
                    eventType: EVENING
                    startTime: '2026-06-11T15:30:00Z'
                    endTime: '2026-06-11T19:45:00Z'
                beforeAgenda:
                  value:
                    eventCode: BATbern143
                    title: BATbern 143 - Data
                    date: '2026-11-05T15:00:00Z'
                    venueName: Kursaal Bern
                    venueAddress: Kornhausstrasse 3, 3013 Bern
                    eventType: EVENING
                    startTime: '2026-11-05T15:00:00Z'
                    endTime: '2026-11-05T18:00:00Z'
        '404':
          description: No event with this code
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

  /internal/events/attendance-summary:
    get:
      operationId: getAttendanceSummary
      summary: Attendees per event, in total and of one company (partner attendance dashboard)
      description: |
        partner-coordination (`EventManagementClientImpl.getAttendanceSummary`, Story 8.1) builds the
        partner attendance dashboard and its XLSX export from it. One row per event since 1 January
        of `fromYear` (UTC), newest first; only confirmed registrations count. Authorized by
        operation, not by the caller's role: the role and ownership check (PARTNER of the company or
        ORGANIZER) stays on the partner-coordination endpoint the user entered through (ADR-016
        decision 3). A forwarded JWT is optional and does not change the answer. Until 6b (Epic 17)
        the public `GET /api/v1/events/attendance-summary` of event-analytics-api.
      parameters:
        - name: companyName
          in: query
          required: true
          description: Company identifier (ADR-003 meaningful ID).
          schema:
            type: string
          example: GoogleZH
        - name: fromYear
          in: query
          required: false
          description: 'Earliest year to include (default: current year minus 5).'
          schema:
            type: integer
          example: 2021
      responses:
        '200':
          description: Per-event attendance, newest event first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceSummary'
              examples:
                twoEvents:
                  summary: Two events, newest first
                  value:
                    - eventCode: BATbern142
                      eventTitle: BATbern 142 - Cloud Native
                      eventDate: '2026-06-11T16:00:00Z'
                      totalAttendees: 180
                      companyAttendees: 6
                    - eventCode: BATbern141
                      eventTitle: BATbern 141 - Security
                      eventDate: '2025-11-13T16:00:00Z'
                      totalAttendees: 160
                      companyAttendees: 4
        '400':
          description: '`companyName` missing or `fromYear` not an integer'
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

  /internal/mails:
    post:
      operationId: recordInternalMail
      summary: Record a mail another service sent in the event's "What went out" (Story 16.9)
      description: |
        partner-coordination posts its meeting invites and cancellations. Only audience `PARTNERS`
        is accepted; at most 500 addresses (To and Cc) per mail. Subject and body arrive already
        redacted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalMailRequest'
            example:
              sendGroupId: 9f0c7c55-0d37-4d0e-9b5f-3b0f3f3c1e21
              eventCode: BATbern58
              audience: PARTNERS
              templateKey: partner-meeting-invite
              contentSource: TEMPLATE
              senderUsername: organizer.alice
              test: false
              reference: 'meeting:4b1f5a2e-6d3c-4f8a-9a51-0c8e7d2b1f00'
              to: anna.meier@example.com
              cc: []
              subject: 'Partner meeting BATbern58'
              htmlBody: '<p>Invitation</p>'
              sesMessageId: 0100018f-ses-message-id
      responses:
        '202':
          description: Recorded
        '400':
          description: Invalid request (validation, audience other than PARTNERS, too many addresses)
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

  /internal/calendar-replies:
    post:
      tags: [contract]
      operationId: recordCalendarReply
      summary: 'Contract: an attendee answered a calendar invite (iMIP REPLY)'
      description: |
        Calendar reply contract (Epic 17 entry 8b, ADR-016 decision 4), owned by event-management
        and served by each implementer in `batbern.contracts.calendar-replies.implementers` (today
        partner-coordination). event-management calls it from the inbound mail processor when an
        iMIP REPLY arrives whose UID is `<meetingId>@batbern.ch` (Story 10.27): the implementer
        records the attendee's answer to that meeting at once, one answer per meeting and address
        (the address compared case-insensitively; a later answer replaces the earlier one).

        A meeting the implementer does not know answers 404, a `partStat` other than ACCEPTED,
        DECLINED or TENTATIVE answers 400; event-management logs either as a WARN. Any other
        failure (no answer, 5xx) is logged as an ERROR and counted
        (`forwarding.calendar_reply_contract.failures`). Inbound processing never fails because of
        this call. The call carries no JWT (the SQS listener has no user) and needs none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalendarReply'
            example:
              meetingId: 4b1f5a2e-6d3c-4f8a-9a51-0c8e7d2b1f00
              attendeeEmail: anna.meier@example.com
              partStat: ACCEPTED
      responses:
        '204':
          description: The answer is recorded
        '400':
          description: Invalid request body, or a `partStat` the implementer does not record
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-11T10:00:00Z'
                path: /internal/calendar-replies
                status: 400
                error: Bad Request
                message: 'Unknown partStat: NEEDS-ACTION'
        '404':
          description: The implementer has no meeting with this id
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-11T10:00:00Z'
                path: /internal/calendar-replies
                status: 404
                error: Not Found
                message: 'Partner meeting not found: 4b1f5a2e-6d3c-4f8a-9a51-0c8e7d2b1f00'

components:
  schemas:
    CalendarReply:
      type: object
      description: >-
        One attendee's answer to a calendar invite, from an iMIP REPLY (RFC 5546). Implemented by
        the hand-written DTO `ch.batbern.partners.dto.RecordRsvpRequest` in partner-coordination.
      required: [meetingId, attendeeEmail, partStat]
      properties:
        meetingId:
          type: string
          format: uuid
          description: The invite's UID without `@batbern.ch`.
        attendeeEmail:
          type: string
          format: idn-email
          minLength: 1
          maxLength: 255
          description: The ATTENDEE address of the reply.
          # One email rule everywhere (#1102): ASCII local part (SES has no SMTPUTF8), any domain.
          # Source of truth: shared-kernel EmailAddresses.OPENAPI_PATTERN.
          pattern: '^[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+(\.[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+)*@[^\s@.]+(\.[^\s@.]+)+$'
        partStat:
          type: string
          minLength: 1
          description: |
            iCal PARTSTAT as the reply carries it (event-management sends it upper-case). Recorded:
            ACCEPTED, DECLINED, TENTATIVE (matched case-insensitively); any other value answers 400.

    AttendanceSummary:
      type: object
      required: [eventCode, eventTitle, eventDate, totalAttendees, companyAttendees]
      description: >-
        Hand-written record `InternalAttendanceSummaryController.AttendanceSummary`: one event's
        confirmed attendees, in total and of the queried company (Story 8.1).
      properties:
        eventCode:
          type: string
        eventTitle:
          type: string
          description: Event title (the partner attendance XLSX export shows it).
        eventDate:
          type: string
          format: date-time
          description: Start of the event (instant).
        totalAttendees:
          type: integer
          format: int64
          minimum: 0
          description: Confirmed attendees of the event.
        companyAttendees:
          type: integer
          format: int64
          minimum: 0
          description: Confirmed attendees from the queried company.
      additionalProperties: false

    EventSchedule:
      type: object
      required: [eventCode, title, date, startTime, endTime, venueName, venueAddress, eventType]
      description: >-
        Hand-written record `InternalEventScheduleController.EventSchedule`. Optional properties are
        `null` when unknown.
      properties:
        eventCode:
          type: string
        title:
          type: string
        date:
          type: string
          format: date-time
          description: Start of the event (instant).
        venueName:
          type: string
        venueAddress:
          type: string
        eventType:
          type: string
          enum: [FULL_DAY, AFTERNOON, EVENING]
        startTime:
          type: string
          format: date-time
          description: Start of the event as EMS resolves it (`EventTimeResolver`).
        endTime:
          type: string
          format: date-time
          description: End of the event as EMS resolves it (`EventTimeResolver`).
      additionalProperties: false

    InternalMailRequest:
      type: object
      description: Flat mirror of `MailContext` + `OutboundMail` (record `InternalMailRequest`).
      required: [sendGroupId, audience, to]
      properties:
        sendGroupId:
          type: string
          minLength: 1
          maxLength: 256
        eventCode:
          nullable: true
          type: string
          maxLength: 50
        audience:
          type: string
          description: Only `PARTNERS` is accepted (400 otherwise).
          minLength: 1
        templateKey:
          nullable: true
          type: string
          maxLength: 100
        contentSource:
          nullable: true
          type: string
          description: A `MailContext.ContentSource`; absent means `TEMPLATE`.
          enum: [TEMPLATE, OWN_TEXT]
        senderUsername:
          nullable: true
          type: string
          maxLength: 100
        test:
          nullable: true
          type: boolean
        reference:
          nullable: true
          type: string
          maxLength: 100
        to:
          type: string
          description: The To line, comma-separated addresses.
          maxLength: 64000
        cc:
          nullable: true
          type: array
          maxItems: 500
          items:
            type: string
            maxLength: 320
        subject:
          nullable: true
          type: string
          maxLength: 1000
        htmlBody:
          nullable: true
          type: string
          maxLength: 2097152
        sesMessageId:
          nullable: true
          type: string
          maxLength: 255
        failureReason:
          nullable: true
          type: string
          maxLength: 500
