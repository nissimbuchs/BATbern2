openapi: 3.1.0
info:
  title: BATbern company-user-management internal API
  version: 1.0.0
  description: |
    Service-to-service operations of company-user-management under `/internal/**` (Story 17.0b2).
    Callers: event-management (`UserApiClientImpl`), partner-coordination (`UserServiceClientImpl`,
    `CompanyServiceClientImpl`) and the API gateway (`GatewayUserStatusClient`).

    Not a public API: the API gateway does not route `/internal/**` and denies it explicitly; the
    services reach it inside the VPC through Service Connect. The JWT is optional (ADR-016 decision
    3): a caller forwards the user's JWT when there is one (shared-kernel `S2sHeaders`) and never
    has to. No operation here looks at the user's role; each authorizes by what it does, and a write
    records who acted: the forwarded user's `custom:username`, else `system:<job>` with the job its
    description names. The public tooling
    (frontend path check, type generation, API similarity, ZAP coverage, access-control probe,
    `lint:api`) does not read `docs/api/internal/`; `npm run lint:api-internal` lints it with the
    reduced ruleset `docs/api/internal/.spectral.yaml`.

    Contracts owned by CUMS (ADR-016 decision 4): an operation tagged `contract` is not served by
    CUMS. CUMS calls it, and every service listed in CUMS configuration under
    `batbern.contracts.<name>.implementers` serves it (shared-kernel `ContractCalls`). CUMS names
    no implementing service in code. Epic 17 entry 7: the Mail Center request contract
    (`/internal/mail-center-requests`, `mail-center-requests`), implemented by event-management.
    Epic 17 entry 7b: the user-reference contract (`/internal/user-references/*`,
    `user-references`), implemented by every service that stores usernames (event-management,
    partner-coordination).

    Epic 17 entry 6 (17.6 part A) moved the three machine-only writes of users-api here (provision,
    profile patch, invitation credentials) and added the single company read. Paths are full paths
    (server `/`), so a path here is the path on the wire.
servers:
  - url: /
security: []

paths:
  /internal/users/{username}:
    get:
      operationId: getInternalUser
      summary: One user by username
      description: |
        Same `UserResponse` as the public users-api. `include` adds the related objects
        (`company`, `roles`, `settings`, comma-separated; Story 4.9 merged the former `preferences` into `settings`). The username is a path segment and
        must be percent-encoded by the caller. Consumers: EMS, the API gateway, and PCS (the partner
        ownership check, and `GET /api/v1/partners/me`, which reads the caller's company here by the
        JWT's `custom:username` since 6b instead of the public `GET /api/v1/users/me`).
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: anna.meier
        - name: include
          in: query
          required: false
          description: Comma-separated related objects, e.g. `settings` or `company,roles,settings`.
          schema:
            type: string
          example: settings
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '../users-api.openapi.yml#/components/schemas/UserResponse'
              examples:
                user:
                  value:
                    id: anna.meier
                    hasCognitoAccount: true
                    email: anna.meier@example.com
                    firstName: Anna
                    lastName: Meier
                    bio: Software architect
                    companyId: Swiss IT Solutions AG
                    roles: [SPEAKER]
                    active: true
                    createdAt: '2025-01-15T10:00:00Z'
                    updatedAt: '2025-01-15T10:00:00Z'
                    additionalEmails: []
                    company: null
                    lastLoginAt: null
                    profilePictureUrl: null
                    settings: null
                    termsAcceptedAt: null
                withSettings:
                  value:
                    id: anna.meier
                    email: anna.meier@example.com
                    firstName: Anna
                    lastName: Meier
                    roles: [SPEAKER]
                    active: true
                    createdAt: '2025-01-15T10:00:00Z'
                    updatedAt: '2025-01-15T10:00:00Z'
                    additionalEmails: []
                    settings:
                      theme: auto
                      language: en
                      emailNotifications: true
                      inAppNotifications: true
                      pushNotifications: false
                      notificationFrequency: immediate
                      qnaNotificationFrequency: daily
                      quietHoursStart: null
                      quietHoursEnd: null
                      profileVisibility: members_only
                      showEmail: false
                      showCompany: true
                      showActivityHistory: false
                      allowMessaging: true
                      allowCalendarSync: false
                      timezone: Europe/Zurich
                      twoFactorEnabled: false
                    bio: null
                    company: null
                    companyId: null
                    hasCognitoAccount: true
                    lastLoginAt: null
                    profilePictureUrl: null
                    termsAcceptedAt: null
        '404':
          description: No user with this username
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-08T10:00:00Z'
                path: /internal/users/ghost.user
                status: 404
                error: Not Found
                message: 'User not found: ghost.user'
                severity: LOW

  /internal/users:
    get:
      operationId: listInternalUsers
      summary: Users by role and/or company, 1-based paging
      description: |
        A page of users. Callers read every page: they follow `pagination.hasNext` until it is
        false. Without a filter all users are listed.
      parameters:
        - name: role
          in: query
          required: false
          description: Role filter. CUMS also accepts lower case; the callers send upper case.
          schema:
            type: string
            enum: [ORGANIZER, SPEAKER, PARTNER, ATTENDEE]
          example: PARTNER
        - name: company
          in: query
          required: false
          description: Company name (the company's identifier).
          schema:
            type: string
          example: Swiss IT Solutions AG
        - name: page
          in: query
          required: false
          description: 1-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            default: 100
          example: 100
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '../users-api.openapi.yml#/components/schemas/PaginatedUserResponse'
              examples:
                onePage:
                  value:
                    data:
                      - id: anna.meier
                        email: anna.meier@example.com
                        firstName: Anna
                        lastName: Meier
                        companyId: Swiss IT Solutions AG
                        roles: [PARTNER]
                        active: true
                        createdAt: '2025-01-15T10:00:00Z'
                        updatedAt: '2025-01-15T10:00:00Z'
                        additionalEmails: []
                        bio: null
                        company: null
                        hasCognitoAccount: true
                        lastLoginAt: null
                        profilePictureUrl: null
                        settings: null
                        termsAcceptedAt: null
                    pagination:
                      page: 1
                      limit: 100
                      totalItems: 1
                      totalPages: 1
                      hasNext: false
                      hasPrev: false
        '400':
          description: Unknown role
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

  /internal/email-owners:
    get:
      operationId: getEmailOwners
      summary: Usernames owning an address
      description: |
        #1183: the usernames whose primary address, or verified additional address, is `email`;
        an empty list when none. It reveals whether an address is known, so it is internal only.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
          example: anna.meier@example.com
      responses:
        '200':
          description: The owning usernames, possibly none
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                oneOwner:
                  value: [anna.meier]
                none:
                  value: []

  /internal/mail-center-requests:
    post:
      tags: [contract]
      operationId: openMailCenterRequest
      summary: 'Contract: a merge or logo request was filed, open its conversation'
      description: |
        Mail Center request contract (Epic 17 entry 7, ADR-016 decision 4), owned by CUMS and served
        by each implementer in `batbern.contracts.mail-center-requests.implementers` (today
        event-management). CUMS calls it while it files a profile merge request (#1237) or a company
        logo request (#1246), inside the filing transaction: when an implementer does not answer,
        the filing fails (502 to the user) and nothing is stored. The implementer opens the
        conversation in which organizers decide the request (status OPEN, no event, the requester
        as counterpart). Idempotent: a second call for the same request changes nothing. The JWT of
        the requester is forwarded when there is one, never required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailCenterRequestOpened'
            examples:
              merge:
                value:
                  kind: MERGE
                  requestId: 2f6d8c1a-5b7e-4c3d-9a0f-1e2d3c4b5a69
                  requesterName: Anna Meier
                  requesterEmail: anna.meier@example.com
                  subject: 'Profil zusammenführen: Anna Meier'
                  note: Ich war bis 2024 bei Firma X.
              logo:
                value:
                  kind: LOGO
                  requestId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                  requesterName: Anna Meier
                  requesterEmail: anna.meier@example.com
                  subject: 'Neues Logo für Swiss IT Solutions AG: Anna Meier'
                  note: null
      responses:
        '204':
          description: The conversation is open (or already was)
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-11T10:00:00Z'
                path: /internal/mail-center-requests
                status: 400
                error: Bad Request
                errorCode: VALIDATION_ERROR
                message: requesterEmail must not be blank

  /internal/mail-center-requests/{requestId}/decision:
    post:
      tags: [contract]
      operationId: decideMailCenterRequest
      summary: 'Contract: a merge or logo request was decided, close its conversation'
      description: |
        Mail Center request contract (Epic 17 entry 7). CUMS calls it after the decision is
        committed, from wherever the organizer decided (the Mail Center or elsewhere). A failure is
        logged as an ERROR and counted (`mailcenter.request_contract.failures`); it does not undo
        the decision. The implementer marks the conversation DONE with `decidedBy` as the last
        editor, unless the requester wrote after `decidedAt` (the conversation then stays OPEN for
        that answer). A request without a conversation is ignored. Idempotent.
      parameters:
        - name: requestId
          in: path
          required: true
          description: Id of the merge or logo request in company-user-management.
          schema:
            type: string
            format: uuid
          example: 2f6d8c1a-5b7e-4c3d-9a0f-1e2d3c4b5a69
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailCenterRequestDecided'
            example:
              kind: MERGE
              status: APPROVED
              decidedBy: organizer.alice
              decidedAt: '2026-11-11T10:00:05.654321Z'
      responses:
        '204':
          description: The conversation is closed, or stays open for an answer after the decision
        '400':
          description: Invalid request body or request id
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-11T10:00:00Z'
                path: /internal/mail-center-requests/2f6d8c1a-5b7e-4c3d-9a0f-1e2d3c4b5a69/decision
                status: 400
                error: Bad Request
                errorCode: VALIDATION_ERROR
                message: decidedBy must not be blank

  /internal/user-references/preview:
    get:
      tags: [contract]
      operationId: previewUserReferenceMerge
      summary: 'Contract: what a profile merge would move at this holder (#1183)'
      description: |
        User-reference contract (Epic 17 entry 7b, ADR-016 decision 5), owned by CUMS and served by
        each holder in `batbern.contracts.user-references.implementers` (today event-management and
        partner-coordination). A holder is a service that stores usernames. CUMS sums the answers of
        all holders into the public merge preview (`users-api` `UserMergePreview`): `moves` and
        `conflicts` keyed `table.column` and by table, `blockers` from any holder. Changes nothing.
        Before a merge CUMS asks every holder; a blocker at any holder refuses the merge before any
        holder moves a row.
      parameters:
        - name: source
          in: query
          required: true
          description: Username of the profile that disappears.
          schema:
            type: string
          example: anna.meier.2
        - name: target
          in: query
          required: true
          description: Username of the profile that stays.
          schema:
            type: string
          example: anna.meier
      responses:
        '200':
          description: What this holder would move
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserReferencePreview'
              examples:
                clean:
                  value:
                    moves: {registrations.attendee_username: 2, session_users.username: 1}
                    conflicts: {}
                    blockers: []
                blocked:
                  value:
                    moves: {registrations.attendee_username: 1, session_users.username: 1}
                    conflicts: {registrations: 1}
                    blockers: [BATbern58]
                nothingHeld:
                  value:
                    moves: {}
                    conflicts: {}
                    blockers: []
        '400':
          description: |
            Source and target are the same username (`UserReferenceError`), or `source` / `target`
            missing (the shared `ErrorResponse`)
          content:
            application/json:
              schema:
                # anyOf, not oneOf: a UserReferenceError body ({error, message}) is also a valid
                # ErrorResponse (no required fields), so oneOf would reject every UserReferenceError.
                anyOf:
                  - $ref: '#/components/schemas/UserReferenceError'
                  - $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                error: INVALID_MERGE
                message: Source and target must be two different usernames

  /internal/user-references/merge:
    post:
      tags: [contract]
      operationId: mergeUserReferences
      summary: 'Contract: move every row of one username to another at this holder (#1183)'
      description: |
        User-reference contract (Epic 17 entry 7b). CUMS calls every holder in configured order,
        after every holder's preview came back without a blocker, and deletes the source profile
        only when all holders answered. Each holder rewrites the source username to the target in
        one transaction of its own. Idempotent: a second call finds nothing left to move, so a merge
        that failed at a later holder is completed by running it again. event-management keeps the
        merge log (`user_merge_log`, with `sourceProfile` for an undo); other holders keep none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserReferenceMerge'
            example:
              sourceUsername: anna.meier.2
              targetUsername: anna.meier
              performedBy: organizer.alice
              trigger: ORGANIZER
              sourceProfile: {email: anna.private@example.com, firstName: Anna, lastName: Meier}
      responses:
        '200':
          description: What this holder moved and removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserReferenceMergeResult'
              examples:
                merged:
                  value:
                    moved: {registrations.attendee_username: 2, session_users.username: 1}
                    removed: {registrations.attendee_username: 1}
                nothingHeld:
                  value:
                    moved: {}
                    removed: {}
        '400':
          description: Invalid request (validation, or source equals target)
          content:
            application/json:
              schema:
                # anyOf, not oneOf: see the preview's 400.
                anyOf:
                  - $ref: '#/components/schemas/UserReferenceError'
                  - $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
        '409':
          description: The holder refuses the merge (both profiles lead a different talk at one event); nothing was moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserReferenceError'
              example:
                error: MERGE_BLOCKED
                message: 'Both profiles lead a different talk at BATbern58'

  /internal/user-references/primary-email:
    post:
      tags: [contract]
      operationId: userPrimaryEmailChanged
      summary: "Contract: a person's primary address changed (#1244)"
      description: |
        User-reference contract (Epic 17 entry 7b). CUMS calls every holder after the new primary
        address is stored (best effort: a failure is logged as a WARN and does not undo the change).
        A holder moves what it keeps under the old address and should follow it (event-management:
        upcoming registrations). A holder that keeps nothing by address answers `updated: 0`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPrimaryEmailChange'
            example:
              username: anna.meier
              oldEmail: anna.old@example.com
              newEmail: anna.meier@example.com
      responses:
        '200':
          description: Number of rows this holder moved to the new address
          content:
            application/json:
              schema:
                type: object
                required: [updated]
                properties:
                  updated:
                    type: integer
                    minimum: 0
                additionalProperties: false
              examples:
                twoUpdated:
                  value: {updated: 2}
                nothingHeld:
                  value: {updated: 0}
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

  /internal/companies:
    get:
      operationId: findCompanyNames
      summary: Company slugs matching a search
      description: |
        Story 17.17: the slugs of all companies whose slug or display name matches `search` (every
        word, ignoring case, accents and umlaut spelling, any order), sorted by slug; every slug for
        a blank or missing search. PCS uses it for the partner search, because `partners.company_name`
        holds only the slug while organizers type the display name.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          example: Die Mobiliar
      responses:
        '200':
          description: The matching company slugs, possibly none
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                matches:
                  value: [diemobiliar, mobiliarag]
                none:
                  value: []

  /internal/users/get-or-create:
    post:
      operationId: getOrCreateInternalUser
      summary: Get or create a user by email (ADR-005)
      description: |
        Used by event-management for anonymous event registration and speaker provisioning. A
        verified additional email resolves to its owner; an unverified one answers 409
        `EMAIL_LINKED_TO_ACCOUNT`.

        Actor of a new user (`createdBy` of the `UserCreatedEvent`): the forwarded user's
        `custom:username`, else `system:ems-get-or-create` (anonymous registration has no user).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../users-api.openapi.yml#/components/schemas/GetOrCreateUserRequest'
            example:
              email: anna.meier@example.com
              firstName: Anna
              lastName: Meier
              companyId: Swiss IT Solutions AG
              cognitoSync: false
      responses:
        '200':
          description: The existing or new user
          content:
            application/json:
              schema:
                $ref: '../users-api.openapi.yml#/components/schemas/GetOrCreateUserResponse'
              examples:
                created:
                  value:
                    username: anna.meier
                    created: true
                    companyUpdated: false
                    user:
                      id: anna.meier
                      email: anna.meier@example.com
                      firstName: Anna
                      lastName: Meier
                      companyId: Swiss IT Solutions AG
                      roles: [ATTENDEE]
                      active: true
                      createdAt: '2025-01-15T10:00:00Z'
                      updatedAt: '2025-01-15T10:00:00Z'
                      additionalEmails: []
                      bio: null
                      company: null
                      hasCognitoAccount: true
                      lastLoginAt: null
                      profilePictureUrl: null
                      settings: null
                      termsAcceptedAt: null
                    cognitoUserId: null
                existing:
                  value:
                    username: anna.meier
                    created: false
                    companyUpdated: false
                    user:
                      id: anna.meier
                      email: anna.meier@example.com
                      firstName: Anna
                      lastName: Meier
                      roles: [SPEAKER]
                      active: true
                      createdAt: '2025-01-15T10:00:00Z'
                      updatedAt: '2025-01-15T10:00:00Z'
                      additionalEmails: []
                      bio: null
                      company: null
                      companyId: null
                      hasCognitoAccount: true
                      lastLoginAt: null
                      profilePictureUrl: null
                      settings: null
                      termsAcceptedAt: null
                    cognitoUserId: null
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
        '409':
          description: The email is another user's unverified additional email
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-08T10:00:00Z'
                path: /internal/users/get-or-create
                status: 409
                error: Conflict
                errorCode: EMAIL_LINKED_TO_ACCOUNT
                message: This email is linked to an existing account, please sign in
                severity: LOW

  /internal/users/provision:
    post:
      operationId: provisionInternalUser
      summary: Provision a speaker (Story 11.C.2)
      description: |
        EMS speaker workflow, CONTACTED to READY. Finds the user by e-mail (case-insensitive) or
        creates one, grants SPEAKER, and creates the Cognito login silently (`AdminCreateUser` with
        `MessageAction=SUPPRESS`, status `FORCE_CHANGE_PASSWORD`); the throwaway password is never
        returned. Idempotent: a second call answers the same username with `created: false`.

        Grants SPEAKER only: any other `role` answers 400, whoever calls. Without names, first and
        last name are derived from the e-mail's local part. Unknown properties answer 400.

        Actor: the forwarded user, else `system:ems-speaker-workflow` (`createdBy` of a new user).
        Moved from the public `POST /api/v1/users/provision` (Epic 17 entry 6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../users-api.openapi.yml#/components/schemas/ProvisionUserRequest'
            examples:
              speaker:
                value:
                  email: anna.meier@example.com
                  firstName: Anna
                  lastName: Meier
                  role: SPEAKER
              emailOnly:
                value:
                  email: anna.meier@example.com
                  role: SPEAKER
      responses:
        '200':
          description: The provisioned user, created now or already there
          content:
            application/json:
              schema:
                $ref: '../users-api.openapi.yml#/components/schemas/ProvisionUserResponse'
              examples:
                created:
                  value:
                    username: anna.meier
                    created: true
                alreadyExisted:
                  value:
                    username: anna.meier
                    created: false
        '400':
          description: Invalid body, an unknown property, or a role other than SPEAKER
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-10T10:00:00Z'
                path: /internal/users/provision
                status: 400
                error: Bad Request
                message: '/internal/users/provision grants the SPEAKER role only (got ORGANIZER)'
                severity: LOW
        '502':
          description: Cognito failed; nothing was stored. The caller may retry (idempotent).
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

  /internal/users/{username}/profile:
    patch:
      operationId: patchInternalUserProfile
      summary: Patch a user's bio and profile picture (Story 11.C.2)
      description: |
        EMS content submission: a speaker's CV text or portrait becomes the user's `bio` or
        `profilePictureUrl` (one value per user, ADR-009). At least one of the two must be non-blank;
        a missing or `null` field stays as it is. Unknown properties answer 400.

        EMS checks before the call that a speaker submits only for themselves (the role check stays
        on the EMS endpoint where the user entered); this operation does not look at the caller.

        Actor: the forwarded user, else `system:ems-content-submission` (`updatedBy` of the
        `UserUpdatedEvent`). Moved from the public `PATCH /api/v1/users/{username}/profile` (Epic 17
        entry 6).
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: anna.meier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../users-api.openapi.yml#/components/schemas/PatchUserProfileRequest'
            examples:
              bioOnly:
                value:
                  bio: Software architect
              bioAndPicture:
                value:
                  bio: Software architect
                  profilePictureUrl: https://cdn.batbern.ch/profile-pictures/2025/anna.meier/profile-1.jpg
      responses:
        '200':
          description: The user after the patch
          content:
            application/json:
              schema:
                $ref: '../users-api.openapi.yml#/components/schemas/UserResponse'
              examples:
                patched:
                  value:
                    id: anna.meier
                    hasCognitoAccount: true
                    email: anna.meier@example.com
                    firstName: Anna
                    lastName: Meier
                    bio: Software architect
                    companyId: null
                    roles: [SPEAKER]
                    active: true
                    createdAt: '2025-01-15T10:00:00Z'
                    updatedAt: '2025-01-20T14:30:00Z'
                    additionalEmails: []
                    company: null
                    lastLoginAt: null
                    profilePictureUrl: null
                    settings: null
                    termsAcceptedAt: null
        '400':
          description: Both fields missing or blank, or an unknown property
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
        '404':
          description: No user with this username
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-10T10:00:00Z'
                path: /internal/users/ghost.user/profile
                status: 404
                error: Not Found
                message: 'User not found: ghost.user'
                severity: LOW

  /internal/users/{username}/issue-invitation-credentials:
    post:
      operationId: issueInternalInvitationCredentials
      summary: Issue or skip the temporary password at invitation (Story 11.E.2)
      description: |
        EMS speaker workflow, READY to INVITED. A login in `FORCE_CHANGE_PASSWORD`,
        `RESET_REQUIRED` or `UNCONFIRMED` gets a fresh temporary password (`FRESH_TEMP_PASSWORD`);
        a `CONFIRMED` login keeps its password (`USE_EXISTING_PASSWORD`, `temporaryPassword: null`).
        A missing login is created first. The password is in this answer only, never stored.
        Idempotent: each fresh password replaces the previous one.

        Actor: the forwarded user, else `system:ems-speaker-workflow` (logged). Moved from the
        public `POST /api/v1/users/{username}/issue-invitation-credentials` (Epic 17 entry 6).
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: anna.meier
      responses:
        '200':
          description: Credentials issued, or the existing password stays
          content:
            application/json:
              schema:
                $ref: '../users-api.openapi.yml#/components/schemas/InvitationCredentialsResponse'
              examples:
                freshTempPassword:
                  value:
                    temporaryPassword: 'example-temp-password'
                    action: FRESH_TEMP_PASSWORD
                useExistingPassword:
                  value:
                    temporaryPassword: null
                    action: USE_EXISTING_PASSWORD
        '404':
          description: No user with this username
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-10T10:00:00Z'
                path: /internal/users/ghost.user/issue-invitation-credentials
                status: 404
                error: Not Found
                message: 'User not found: ghost.user'
                severity: LOW
        '422':
          description: The login is ARCHIVED, COMPROMISED or in an unknown state; an operator must act
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
        '502':
          description: Cognito failed; the caller aborts the transition and may retry
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

  /internal/companies/{name}:
    get:
      operationId: getInternalCompany
      summary: One company by name
      description: |
        The same `CompanyResponse` as the public `GET /api/v1/companies/{name}`, which stays public
        for users (ADR-016 decision 2: services do not call the public API). Consumers: EMS
        (speaker company display name, Epic 17 entry 6) and PCS (partner companies, 6b). The name is
        a path segment and must be percent-encoded by the caller.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: swissitsolut
      responses:
        '200':
          description: The company
          content:
            application/json:
              schema:
                $ref: '../companies-api.openapi.yml#/components/schemas/CompanyResponse'
              examples:
                company:
                  value:
                    name: swissitsolut
                    displayName: Swiss IT Solutions AG
                    industry: Technology
                    website: https://swiss-it.ch
                    description: Leading Swiss IT consulting firm
                    isVerified: true
                    createdAt: '2025-01-15T10:00:00Z'
                    updatedAt: '2025-01-15T10:00:00Z'
                    createdBy: john.doe
        '404':
          description: No company with this name
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-10T10:00:00Z'
                path: /internal/companies/ghost
                status: 404
                error: Not Found
                message: 'Company not found: ghost'
                severity: LOW

components:
  schemas:
    UserReferenceCounts:
      type: object
      description: Row count per table (`moves`, `moved` and `removed` keyed `table.column`, `conflicts` by table).
      additionalProperties:
        type: integer
        minimum: 0

    UserReferencePreview:
      type: object
      required: [moves, conflicts, blockers]
      properties:
        moves:
          $ref: '#/components/schemas/UserReferenceCounts'
        conflicts:
          $ref: '#/components/schemas/UserReferenceCounts'
        blockers:
          type: array
          description: Why this holder refuses the merge (event-management - event codes at which both lead a different talk).
          items:
            type: string
      additionalProperties: false

    UserReferenceMergeResult:
      type: object
      required: [moved, removed]
      properties:
        moved:
          $ref: '#/components/schemas/UserReferenceCounts'
        removed:
          $ref: '#/components/schemas/UserReferenceCounts'
      additionalProperties: false

    UserReferenceError:
      type: object
      description: Error body of the merge operations (holder-local handler, not the shared ErrorResponse).
      required: [error, message]
      properties:
        error:
          type: string
          enum: [MERGE_BLOCKED, INVALID_MERGE]
        message:
          type: string
      additionalProperties: false

    UserReferenceMerge:
      type: object
      required: [sourceUsername, targetUsername, performedBy, trigger]
      properties:
        sourceUsername:
          type: string
          minLength: 1
          maxLength: 100
        targetUsername:
          type: string
          minLength: 1
          maxLength: 100
        performedBy:
          type: string
          minLength: 1
          maxLength: 100
        trigger:
          type: string
          enum: [ORGANIZER, SELF_CLAIM]
        sourceProfile:
          nullable: true
          type: object
          description: Snapshot of the source profile, for a holder that logs the merge (event-management).
          additionalProperties: true

    UserPrimaryEmailChange:
      type: object
      required: [username, oldEmail, newEmail]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        oldEmail:
          type: string
          minLength: 1
          maxLength: 255
        newEmail:
          type: string
          minLength: 1
          maxLength: 255

    MailCenterRequestOpened:
      type: object
      required: [kind, requestId, requesterEmail, subject]
      properties:
        kind:
          type: string
          enum: [MERGE, LOGO]
          description: MERGE a profile merge request (#1237), LOGO a company logo request (#1246).
        requestId:
          type: string
          format: uuid
        requesterName:
          nullable: true
          type: string
          maxLength: 255
          description: First and last name of the requester (empty when both are empty).
        requesterEmail:
          type: string
          format: idn-email
          minLength: 1
          maxLength: 320
          description: The requester's primary address, where answers in the conversation go.
          # One email rule everywhere (#1102): ASCII local part (SES has no SMTPUTF8), any domain.
          # Source of truth: shared-kernel EmailAddresses.OPENAPI_PATTERN.
          pattern: '^[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+(\.[A-Za-z0-9!#$%&''*+/=?^_`{|}~-]+)*@[^\s@.]+(\.[^\s@.]+)+$'
        subject:
          type: string
          minLength: 1
          maxLength: 500
          description: The conversation subject, in German as the organizers see it.
        note:
          nullable: true
          type: string
          maxLength: 500
          description: The requester's note.
      additionalProperties: false

    MailCenterRequestDecided:
      type: object
      required: [kind, status, decidedBy, decidedAt]
      properties:
        kind:
          type: string
          enum: [MERGE, LOGO]
        status:
          type: string
          enum: [APPROVED, DECLINED]
        decidedBy:
          type: string
          minLength: 1
          maxLength: 100
          description: Username of the organizer who decided.
        decidedAt:
          type: string
          format: date-time
          description: When the decision was made; an inbound mail after it keeps the conversation open.
      additionalProperties: false
