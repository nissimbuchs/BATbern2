openapi: 3.1.0
info:
  title: BATbern company-user-management internal API
  version: 1.0.0
  description: |
    Service-to-service operations of company-user-management under `/internal/**` (Story 17.0b2).
    Callers: event-management (`UserApiClientImpl`, `MailCenterRequestFeedClient`),
    partner-coordination (`UserServiceClientImpl`, `CompanyServiceClientImpl`) and the API gateway
    (`GatewayUserStatusClient`).

    Not a public API: the API gateway does not route `/internal/**` and denies it explicitly; the
    services reach it inside the VPC through Service Connect. The JWT is optional (ADR-016 decision
    3): a caller forwards the user's JWT when there is one (shared-kernel `S2sHeaders`) and never
    has to. No operation here looks at the user's role; each authorizes by what it does, and a write
    records who acted: the forwarded user's `custom:username`, else `system:<job>` with the job its
    description names. The public tooling
    (frontend path check, type generation, API similarity, ZAP coverage, access-control probe,
    `lint:api`) does not read `docs/api/internal/`; `npm run lint:api-internal` lints it with the
    reduced ruleset `docs/api/internal/.spectral.yaml`.

    Epic 17 entry 7 added the Mail Center request feed (`/internal/mail-center-requests`), which
    event-management pulls instead of CUMS pushing the requests to it (ADR-016 decision 4).

    Epic 17 entry 6 (17.6 part A) moved the three machine-only writes of users-api here (provision,
    profile patch, invitation credentials) and added the single company read. Paths are full paths
    (server `/`), so a path here is the path on the wire.
servers:
  - url: /
security: []

paths:
  /internal/users/{username}:
    get:
      operationId: getInternalUser
      summary: One user by username
      description: |
        Same `UserResponse` as the public users-api. `include` adds the related objects
        (`company`, `roles`, `settings`, comma-separated; Story 4.9 merged the former `preferences` into `settings`). The username is a path segment and
        must be percent-encoded by the caller. Consumers: EMS, the API gateway, and PCS (the partner
        ownership check, and `GET /api/v1/partners/me`, which reads the caller's company here by the
        JWT's `custom:username` since 6b instead of the public `GET /api/v1/users/me`).
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: anna.meier
        - name: include
          in: query
          required: false
          description: Comma-separated related objects, e.g. `settings` or `company,roles,settings`.
          schema:
            type: string
          example: settings
      responses:
        '200':
          description: The user
          content:
            application/json:
              schema:
                $ref: '../users-api.openapi.yml#/components/schemas/UserResponse'
              examples:
                user:
                  value:
                    id: anna.meier
                    hasCognitoAccount: true
                    email: anna.meier@example.com
                    firstName: Anna
                    lastName: Meier
                    bio: Software architect
                    companyId: Swiss IT Solutions AG
                    roles: [SPEAKER]
                    active: true
                    createdAt: '2025-01-15T10:00:00Z'
                    updatedAt: '2025-01-15T10:00:00Z'
                    additionalEmails: []
                    company: null
                    lastLoginAt: null
                    profilePictureUrl: null
                    settings: null
                    termsAcceptedAt: null
                withSettings:
                  value:
                    id: anna.meier
                    email: anna.meier@example.com
                    firstName: Anna
                    lastName: Meier
                    roles: [SPEAKER]
                    active: true
                    createdAt: '2025-01-15T10:00:00Z'
                    updatedAt: '2025-01-15T10:00:00Z'
                    additionalEmails: []
                    settings:
                      theme: auto
                      language: en
                      emailNotifications: true
                      inAppNotifications: true
                      pushNotifications: false
                      notificationFrequency: immediate
                      qnaNotificationFrequency: daily
                      quietHoursStart: null
                      quietHoursEnd: null
                      profileVisibility: members_only
                      showEmail: false
                      showCompany: true
                      showActivityHistory: false
                      allowMessaging: true
                      allowCalendarSync: false
                      timezone: Europe/Zurich
                      twoFactorEnabled: false
                    bio: null
                    company: null
                    companyId: null
                    hasCognitoAccount: true
                    lastLoginAt: null
                    profilePictureUrl: null
                    termsAcceptedAt: null
        '404':
          description: No user with this username
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-08T10:00:00Z'
                path: /internal/users/ghost.user
                status: 404
                error: Not Found
                message: 'User not found: ghost.user'
                severity: LOW

  /internal/users:
    get:
      operationId: listInternalUsers
      summary: Users by role and/or company, 1-based paging
      description: |
        A page of users. Callers read every page: they follow `pagination.hasNext` until it is
        false. Without a filter all users are listed.
      parameters:
        - name: role
          in: query
          required: false
          description: Role filter. CUMS also accepts lower case; the callers send upper case.
          schema:
            type: string
            enum: [ORGANIZER, SPEAKER, PARTNER, ATTENDEE]
          example: PARTNER
        - name: company
          in: query
          required: false
          description: Company name (the company's identifier).
          schema:
            type: string
          example: Swiss IT Solutions AG
        - name: page
          in: query
          required: false
          description: 1-based page number.
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: limit
          in: query
          required: false
          description: Page size.
          schema:
            type: integer
            minimum: 1
            default: 100
          example: 100
      responses:
        '200':
          description: One page of users
          content:
            application/json:
              schema:
                $ref: '../users-api.openapi.yml#/components/schemas/PaginatedUserResponse'
              examples:
                onePage:
                  value:
                    data:
                      - id: anna.meier
                        email: anna.meier@example.com
                        firstName: Anna
                        lastName: Meier
                        companyId: Swiss IT Solutions AG
                        roles: [PARTNER]
                        active: true
                        createdAt: '2025-01-15T10:00:00Z'
                        updatedAt: '2025-01-15T10:00:00Z'
                        additionalEmails: []
                        bio: null
                        company: null
                        hasCognitoAccount: true
                        lastLoginAt: null
                        profilePictureUrl: null
                        settings: null
                        termsAcceptedAt: null
                    pagination:
                      page: 1
                      limit: 100
                      totalItems: 1
                      totalPages: 1
                      hasNext: false
                      hasPrev: false
        '400':
          description: Unknown role
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

  /internal/email-owners:
    get:
      operationId: getEmailOwners
      summary: Usernames owning an address
      description: |
        #1183: the usernames whose primary address, or verified additional address, is `email`;
        an empty list when none. It reveals whether an address is known, so it is internal only.
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
          example: anna.meier@example.com
      responses:
        '200':
          description: The owning usernames, possibly none
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                oneOwner:
                  value: [anna.meier]
                none:
                  value: []

  /internal/mail-center-requests:
    get:
      operationId: getMailCenterRequests
      summary: Change feed of merge and logo requests
      description: |
        Epic 17 entry 7 (ADR-016 decision 4): profile merge requests (#1237) and company logo
        requests (#1246) in the order they were created or decided, `(changedAt, requestId)`.
        Event-management's Mail Center pulls it every minute (`MailCenterRequestFeedClient`, ShedLock
        job `MailCenterRequestFeedJob`, no JWT) and opens the conversation of an OPEN request, or
        closes the one of a decided request. CUMS no longer calls event-management for them.

        `since` is the `nextCursor` of the previous page, sent back unchanged; the caller stores
        it and never reads it. Without `since` the feed starts just before the oldest OPEN request
        (or now when none is open): decided history is not delivered. A row is held back until it
        is 30 s old, so a transaction that commits late cannot land behind a cursor already handed
        out. A page with fewer than `limit` items is the end for now; its `nextCursor` is where
        the next poll starts. Requester name and address are the profile's at the time of the
        read; a request whose requester profile is gone is not delivered. A read; it records
        nobody.
      parameters:
        - name: since
          in: query
          required: false
          description: The `nextCursor` of the previous page; omitted on the first poll.
          schema:
            type: string
            maxLength: 200
          example: MjAyNi0xMS0xMVQwOTo1OTozMC4xMjM0NTZafDJmNmQ4YzFhLTViN2UtNGMzZC05YTBmLTFlMmQzYzRiNWE2OQ
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
          example: 100
      responses:
        '200':
          description: The next items, possibly none, and the cursor to continue from
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailCenterRequestPage'
              examples:
                openAndDecided:
                  value:
                    items:
                      - kind: MERGE
                        requestId: 2f6d8c1a-5b7e-4c3d-9a0f-1e2d3c4b5a69
                        status: OPEN
                        requesterName: Anna Meier
                        requesterEmail: anna.meier@example.com
                        subject: 'Profil zusammenführen: Anna Meier'
                        note: Ich war bis 2024 bei Firma X.
                        decidedBy: null
                        changedAt: '2026-11-11T09:59:30.123456Z'
                      - kind: LOGO
                        requestId: 7a1b2c3d-4e5f-4a6b-8c7d-9e0f1a2b3c4d
                        status: APPROVED
                        requesterName: Anna Meier
                        requesterEmail: anna.meier@example.com
                        subject: 'Neues Logo für Swiss IT Solutions AG: Anna Meier'
                        note: null
                        decidedBy: organizer.alice
                        changedAt: '2026-11-11T10:00:05.654321Z'
                    nextCursor: MjAyNi0xMS0xMVQxMDowMDowNS42NTQzMjFafDdhMWIyYzNkLTRlNWYtNGE2Yi04YzdkLTllMGYxYTJiM2M0ZA
                empty:
                  value:
                    items: []
                    nextCursor: MjAyNi0xMS0xMVQxMDowMDowNS42NTQzMjFafDdhMWIyYzNkLTRlNWYtNGE2Yi04YzdkLTllMGYxYTJiM2M0ZA
        '400':
          description: Unreadable cursor, or a limit outside 1 to 200
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-11T10:00:00Z'
                path: /internal/mail-center-requests
                status: 400
                error: Bad Request
                errorCode: VALIDATION_ERROR
                message: Unknown cursor

  /internal/companies:
    get:
      operationId: findCompanyNames
      summary: Company slugs matching a search
      description: |
        Story 17.17: the slugs of all companies whose slug or display name matches `search` (every
        word, ignoring case, accents and umlaut spelling, any order), sorted by slug; every slug for
        a blank or missing search. PCS uses it for the partner search, because `partners.company_name`
        holds only the slug while organizers type the display name.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          example: Die Mobiliar
      responses:
        '200':
          description: The matching company slugs, possibly none
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
              examples:
                matches:
                  value: [diemobiliar, mobiliarag]
                none:
                  value: []

  /internal/users/get-or-create:
    post:
      operationId: getOrCreateInternalUser
      summary: Get or create a user by email (ADR-005)
      description: |
        Used by event-management for anonymous event registration and speaker provisioning. A
        verified additional email resolves to its owner; an unverified one answers 409
        `EMAIL_LINKED_TO_ACCOUNT`.

        Actor of a new user (`createdBy` of the `UserCreatedEvent`): the forwarded user's
        `custom:username`, else `system:ems-get-or-create` (anonymous registration has no user).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../users-api.openapi.yml#/components/schemas/GetOrCreateUserRequest'
            example:
              email: anna.meier@example.com
              firstName: Anna
              lastName: Meier
              companyId: Swiss IT Solutions AG
              cognitoSync: false
      responses:
        '200':
          description: The existing or new user
          content:
            application/json:
              schema:
                $ref: '../users-api.openapi.yml#/components/schemas/GetOrCreateUserResponse'
              examples:
                created:
                  value:
                    username: anna.meier
                    created: true
                    companyUpdated: false
                    user:
                      id: anna.meier
                      email: anna.meier@example.com
                      firstName: Anna
                      lastName: Meier
                      companyId: Swiss IT Solutions AG
                      roles: [ATTENDEE]
                      active: true
                      createdAt: '2025-01-15T10:00:00Z'
                      updatedAt: '2025-01-15T10:00:00Z'
                      additionalEmails: []
                      bio: null
                      company: null
                      hasCognitoAccount: true
                      lastLoginAt: null
                      profilePictureUrl: null
                      settings: null
                      termsAcceptedAt: null
                    cognitoUserId: null
                existing:
                  value:
                    username: anna.meier
                    created: false
                    companyUpdated: false
                    user:
                      id: anna.meier
                      email: anna.meier@example.com
                      firstName: Anna
                      lastName: Meier
                      roles: [SPEAKER]
                      active: true
                      createdAt: '2025-01-15T10:00:00Z'
                      updatedAt: '2025-01-15T10:00:00Z'
                      additionalEmails: []
                      bio: null
                      company: null
                      companyId: null
                      hasCognitoAccount: true
                      lastLoginAt: null
                      profilePictureUrl: null
                      settings: null
                      termsAcceptedAt: null
                    cognitoUserId: null
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
        '409':
          description: The email is another user's unverified additional email
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-08T10:00:00Z'
                path: /internal/users/get-or-create
                status: 409
                error: Conflict
                errorCode: EMAIL_LINKED_TO_ACCOUNT
                message: This email is linked to an existing account, please sign in
                severity: LOW

  /internal/users/provision:
    post:
      operationId: provisionInternalUser
      summary: Provision a speaker (Story 11.C.2)
      description: |
        EMS speaker workflow, CONTACTED to READY. Finds the user by e-mail (case-insensitive) or
        creates one, grants SPEAKER, and creates the Cognito login silently (`AdminCreateUser` with
        `MessageAction=SUPPRESS`, status `FORCE_CHANGE_PASSWORD`); the throwaway password is never
        returned. Idempotent: a second call answers the same username with `created: false`.

        Grants SPEAKER only: any other `role` answers 400, whoever calls. Without names, first and
        last name are derived from the e-mail's local part. Unknown properties answer 400.

        Actor: the forwarded user, else `system:ems-speaker-workflow` (`createdBy` of a new user).
        Moved from the public `POST /api/v1/users/provision` (Epic 17 entry 6).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../users-api.openapi.yml#/components/schemas/ProvisionUserRequest'
            examples:
              speaker:
                value:
                  email: anna.meier@example.com
                  firstName: Anna
                  lastName: Meier
                  role: SPEAKER
              emailOnly:
                value:
                  email: anna.meier@example.com
                  role: SPEAKER
      responses:
        '200':
          description: The provisioned user, created now or already there
          content:
            application/json:
              schema:
                $ref: '../users-api.openapi.yml#/components/schemas/ProvisionUserResponse'
              examples:
                created:
                  value:
                    username: anna.meier
                    created: true
                alreadyExisted:
                  value:
                    username: anna.meier
                    created: false
        '400':
          description: Invalid body, an unknown property, or a role other than SPEAKER
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-10T10:00:00Z'
                path: /internal/users/provision
                status: 400
                error: Bad Request
                message: '/internal/users/provision grants the SPEAKER role only (got ORGANIZER)'
                severity: LOW
        '502':
          description: Cognito failed; nothing was stored. The caller may retry (idempotent).
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

  /internal/users/{username}/profile:
    patch:
      operationId: patchInternalUserProfile
      summary: Patch a user's bio and profile picture (Story 11.C.2)
      description: |
        EMS content submission: a speaker's CV text or portrait becomes the user's `bio` or
        `profilePictureUrl` (one value per user, ADR-009). At least one of the two must be non-blank;
        a missing or `null` field stays as it is. Unknown properties answer 400.

        EMS checks before the call that a speaker submits only for themselves (the role check stays
        on the EMS endpoint where the user entered); this operation does not look at the caller.

        Actor: the forwarded user, else `system:ems-content-submission` (`updatedBy` of the
        `UserUpdatedEvent`). Moved from the public `PATCH /api/v1/users/{username}/profile` (Epic 17
        entry 6).
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: anna.meier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../users-api.openapi.yml#/components/schemas/PatchUserProfileRequest'
            examples:
              bioOnly:
                value:
                  bio: Software architect
              bioAndPicture:
                value:
                  bio: Software architect
                  profilePictureUrl: https://cdn.batbern.ch/profile-pictures/2025/anna.meier/profile-1.jpg
      responses:
        '200':
          description: The user after the patch
          content:
            application/json:
              schema:
                $ref: '../users-api.openapi.yml#/components/schemas/UserResponse'
              examples:
                patched:
                  value:
                    id: anna.meier
                    hasCognitoAccount: true
                    email: anna.meier@example.com
                    firstName: Anna
                    lastName: Meier
                    bio: Software architect
                    companyId: null
                    roles: [SPEAKER]
                    active: true
                    createdAt: '2025-01-15T10:00:00Z'
                    updatedAt: '2025-01-20T14:30:00Z'
                    additionalEmails: []
                    company: null
                    lastLoginAt: null
                    profilePictureUrl: null
                    settings: null
                    termsAcceptedAt: null
        '400':
          description: Both fields missing or blank, or an unknown property
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
        '404':
          description: No user with this username
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-10T10:00:00Z'
                path: /internal/users/ghost.user/profile
                status: 404
                error: Not Found
                message: 'User not found: ghost.user'
                severity: LOW

  /internal/users/{username}/issue-invitation-credentials:
    post:
      operationId: issueInternalInvitationCredentials
      summary: Issue or skip the temporary password at invitation (Story 11.E.2)
      description: |
        EMS speaker workflow, READY to INVITED. A login in `FORCE_CHANGE_PASSWORD`,
        `RESET_REQUIRED` or `UNCONFIRMED` gets a fresh temporary password (`FRESH_TEMP_PASSWORD`);
        a `CONFIRMED` login keeps its password (`USE_EXISTING_PASSWORD`, `temporaryPassword: null`).
        A missing login is created first. The password is in this answer only, never stored.
        Idempotent: each fresh password replaces the previous one.

        Actor: the forwarded user, else `system:ems-speaker-workflow` (logged). Moved from the
        public `POST /api/v1/users/{username}/issue-invitation-credentials` (Epic 17 entry 6).
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
          example: anna.meier
      responses:
        '200':
          description: Credentials issued, or the existing password stays
          content:
            application/json:
              schema:
                $ref: '../users-api.openapi.yml#/components/schemas/InvitationCredentialsResponse'
              examples:
                freshTempPassword:
                  value:
                    temporaryPassword: 'example-temp-password'
                    action: FRESH_TEMP_PASSWORD
                useExistingPassword:
                  value:
                    temporaryPassword: null
                    action: USE_EXISTING_PASSWORD
        '404':
          description: No user with this username
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-10T10:00:00Z'
                path: /internal/users/ghost.user/issue-invitation-credentials
                status: 404
                error: Not Found
                message: 'User not found: ghost.user'
                severity: LOW
        '422':
          description: The login is ARCHIVED, COMPROMISED or in an unknown state; an operator must act
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
        '502':
          description: Cognito failed; the caller aborts the transition and may retry
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'

  /internal/companies/{name}:
    get:
      operationId: getInternalCompany
      summary: One company by name
      description: |
        The same `CompanyResponse` as the public `GET /api/v1/companies/{name}`, which stays public
        for users (ADR-016 decision 2: services do not call the public API). Consumers: EMS
        (speaker company display name, Epic 17 entry 6) and PCS (partner companies, 6b). The name is
        a path segment and must be percent-encoded by the caller.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          example: swissitsolut
      responses:
        '200':
          description: The company
          content:
            application/json:
              schema:
                $ref: '../companies-api.openapi.yml#/components/schemas/CompanyResponse'
              examples:
                company:
                  value:
                    name: swissitsolut
                    displayName: Swiss IT Solutions AG
                    industry: Technology
                    website: https://swiss-it.ch
                    description: Leading Swiss IT consulting firm
                    isVerified: true
                    createdAt: '2025-01-15T10:00:00Z'
                    updatedAt: '2025-01-15T10:00:00Z'
                    createdBy: john.doe
        '404':
          description: No company with this name
          content:
            application/json:
              schema:
                $ref: '../_shared.openapi.yml#/components/schemas/ErrorResponse'
              example:
                timestamp: '2026-11-10T10:00:00Z'
                path: /internal/companies/ghost
                status: 404
                error: Not Found
                message: 'Company not found: ghost'
                severity: LOW

components:
  schemas:
    MailCenterRequestPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/MailCenterRequest'
        nextCursor:
          type: string
          minLength: 1
          maxLength: 200
          description: Opaque; send it back as `since`.
      additionalProperties: false

    MailCenterRequest:
      type: object
      required: [kind, requestId, status, requesterName, requesterEmail, subject, note, decidedBy, changedAt]
      properties:
        kind:
          type: string
          enum: [MERGE, LOGO]
          description: MERGE a profile merge request (#1237), LOGO a company logo request (#1246).
        requestId:
          type: string
          format: uuid
        status:
          type: string
          enum: [OPEN, APPROVED, DECLINED]
        requesterName:
          type: string
          maxLength: 255
          description: First and last name of the requester's profile; empty when both are empty.
        requesterEmail:
          type: string
          format: idn-email
          minLength: 1
          maxLength: 320
          description: The requester's primary address, where answers in the conversation go.
        subject:
          type: string
          minLength: 1
          maxLength: 500
          description: The conversation subject, in German as the organizers see it.
        note:
          nullable: true
          type: string
          maxLength: 500
          description: The requester's note.
        decidedBy:
          nullable: true
          type: string
          maxLength: 100
          description: Username of the organizer who decided; null while OPEN.
        changedAt:
          type: string
          format: date-time
          description: When the request was created or decided.
