openapi: 3.0.3
info:
  title: BATbern partner-coordination internal API
  version: 1.0.0
  description: |
    Service-to-service operations of partner-coordination under `/internal/**` (Story 17.0b2).

    partner-coordination serves no internal operation of its own: no service calls it by name
    (ADR-016 decision 1: CUMS and event-management are upstream of it). It implements contracts
    its upstreams own (ADR-016 decisions 4 and 5), specified in the owner's spec, not here:

    - the user-reference contract (`/internal/user-references/*`), owned by CUMS,
      `cums-internal.openapi.yml` (Epic 17 entry 7b);
    - the calendar reply contract (`/internal/calendar-replies`), owned by event-management,
      `ems-internal.openapi.yml` (Epic 17 entry 8b). It replaced
      `POST /internal/partner-meetings/rsvps`.

    The file stays so that a future partner-coordination operation has its place. Not a public
    API: the API gateway does not route `/internal/**` and denies it explicitly. Public API tooling
    does not read `docs/api/internal/`.
servers:
  - url: /
security: []

paths: {}
