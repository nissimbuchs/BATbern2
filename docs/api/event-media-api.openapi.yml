openapi: 3.0.3
info:
  title: BATbern Event Media API
  version: 1.0.0
  description: 'Event photo gallery: listing and deletion. Photos are uploaded through the upload
    contract (`uploads-api`, purpose `event-photo`, Story 17.11b); its confirm with the target
    `eventCode` creates the photo.


    Carved from the consolidated events-api spec (API consolidation Phase 6). Paths preserved verbatim.'
  contact:
    name: BATbern Platform Team
    email: platform@batbern.ch
  license:
    name: Proprietary
servers:
- url: https://api.batbern.ch/api/v1
  description: Production
- url: https://api.batbern.ch/api/v1
  description: Staging
- url: http://localhost:8080/api/v1
  description: Development
security:
- BearerAuth: []
tags:
- name: Event Photos
  description: Event photo gallery — listing and deletion (upload through `uploads-api`, purpose `event-photo`)
paths:
  /public/event-photos:
    get:
      tags:
      - Event Photos
      summary: Recent photos from last N events (homepage use)
      description: 'Anonymous read for the homepage photo strip: a random sample of the photos of
        the last N events (Story 4.10b moved it from `/events/recent-photos`, a literal that shared
        the namespace of `{eventCode}`; ADR-013 §4 anonymous read variant).'
      operationId: getRecentEventPhotos
      security: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
      - name: lastNEvents
        in: query
        schema:
          type: integer
          default: 5
      responses:
        '200':
          description: Random sample of recent photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventPhotoResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    - id: 51ae2297-44ab-4364-9fd7-36c4dd95daa8
                      eventCode: BATbern58
                      displayUrl: https://cdn.batbern.ch/events/BATbern58/photos/51ae2297-44ab-4364-9fd7-36c4dd95daa8.jpg
                      filename: 51ae2297-44ab-4364-9fd7-36c4dd95daa8.jpg
                      uploadedBy: b3d43852-e071-707b-c4e7-1ca6257dba68
                      uploadedAt: "2026-06-12T09:01:58.796642Z"
                      sortOrder: 0
                    - id: 4669269d-04b8-43c8-a104-00836f4e8aef
                      eventCode: BATbern56
                      displayUrl: https://cdn.batbern.ch/events/BATbern56/photos/4669269d-04b8-43c8-a104-00836f4e8aef.jpg
                      filename: 4669269d-04b8-43c8-a104-00836f4e8aef.jpg
                      uploadedBy: c334a852-10c1-70d2-f403-136e0a60acf7
                      uploadedAt: "2026-03-04T19:59:15.790226Z"
                      sortOrder: 0
  /events/{eventCode}/photos:
    get:
      tags:
      - Event Photos
      summary: List photos for an event
      operationId: listEventPhotos
      security: []
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: List of event photos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventPhotoResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    []
  /events/{eventCode}/photos/{photoId}:
    delete:
      tags:
      - Event Photos
      summary: Delete a photo (DB record + S3 object)
      operationId: deleteEventPhoto
      security:
      - BearerAuth: []
      parameters:
      - name: eventCode
        in: path
        required: true
        schema:
          type: string
      - name: photoId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Photo deleted
        '404':
          description: Photo not found
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  schemas:
    EventPhotoResponse:
      type: object
      required:
      - id
      - eventCode
      - displayUrl
      - uploadedAt
      - filename
      - uploadedBy
      - sortOrder
      properties:
        id:
          type: string
          format: uuid
        eventCode:
          type: string
        displayUrl:
          type: string
        filename:
          nullable: true
          type: string
        uploadedBy:
          nullable: true
          type: string
        uploadedAt:
          type: string
          format: date-time
        sortOrder:
          type: integer
  responses:
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            validationError:
              value:
                error: VALIDATION_ERROR
                errorCode: BAD_REQUEST
                message: Invalid filter syntax
                timestamp: 2025-01-15 10:30:00+00:00
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            eventNotFound:
              value:
                error: RESOURCE_NOT_FOUND
                errorCode: NOT_FOUND
                message: Event not found with id evt-999
                timestamp: 2025-01-15 10:30:00+00:00
    UnprocessableEntity:
      description: Request cannot be processed due to business logic
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            workflowError:
              value:
                error: WORKFLOW_ERROR
                errorCode: UNPROCESSABLE_ENTITY
                message: Cannot advance workflow for archived event
                timestamp: 2025-01-15 10:30:00+00:00
            validationError:
              value:
                error: VALIDATION_ERROR
                errorCode: UNPROCESSABLE_ENTITY
                message: Event must have a date before publishing
                timestamp: 2025-01-15 10:30:00+00:00
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            serverError:
              value:
                error: INTERNAL_SERVER_ERROR
                errorCode: INTERNAL_ERROR
                message: An unexpected error occurred
                timestamp: 2025-01-15 10:30:00+00:00
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            forbiddenError:
              value:
                error: FORBIDDEN
                errorCode: FORBIDDEN
                message: Insufficient permissions to perform this action
                timestamp: '2025-01-15T10:30:00Z'
    Unauthorized:
      description: Unauthorized - missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            missingToken:
              value:
                error: UNAUTHORIZED
                errorCode: UNAUTHORIZED
                message: Authentication token is missing or invalid
                timestamp: '2025-01-15T10:30:00Z'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AWS Cognito JWT token
