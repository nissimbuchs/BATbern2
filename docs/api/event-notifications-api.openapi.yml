openapi: 3.0.3
info:
  title: BATbern Event Notifications API
  version: 1.0.0
  description: 'In-app notification management of the caller''s own inbox — listing, read-state,
    deletion, and unread counts (Story BAT-7; scoped to the caller since Story 4.10b).


    Authored during the API consolidation adversarial-review follow-up (2026-06-30) to bring the
    previously hand-rolled NotificationController under the contract-first standard (ADR-013). Paths
    and wire shapes preserved verbatim.'
  contact:
    name: BATbern Platform Team
    email: platform@batbern.ch
  license:
    name: Proprietary
servers:
- url: https://api.batbern.ch/api/v1
  description: Production
- url: https://api.batbern.ch/api/v1
  description: Staging
- url: http://localhost:8080/api/v1
  description: Development
security:
- BearerAuth: []
tags:
- name: Notifications
  description: In-app notification inbox of the caller — list, read-state, deletion, counts (Story BAT-7)
paths:
  /notifications:
    get:
      description: |
        The caller's own notifications (the recipient is the signed-in organizer; there is no
        parameter to read another user's inbox, Story 4.10b).

        **Security**: ORGANIZER role required; any other role gets 403.
      tags:
      - Notifications
      operationId: listNotifications
      summary: List the caller's notifications (paginated, 1-based)
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: Optional status filter (e.g. UNREAD, READ). Case-insensitive.
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: 1-based page number (default 1)
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Page size (default per PaginationUtils)
      responses:
        '403':
          description: Forbidden (ORGANIZER role required)
        '200':
          description: Paginated notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationsResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    data: []
                    pagination:
                      page: 1
                      limit: 2
                      totalItems: 0
                      totalPages: 0
    patch:
      description: |
        Changes the status of several of the caller's notifications at once. Ids that are not
        the caller's (or do not exist) are ignored and left unchanged; `markedCount` counts the
        caller's notifications that were changed (Story 4.10b, replaces `PUT /notifications/batch-read`).

        **Security**: ORGANIZER role required; any other role gets 403.
      tags:
      - Notifications
      operationId: updateNotifications
      summary: Mark several of the caller's notifications read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationsRequest'
            examples:
              default:
                summary: mark two notifications read
                value:
                  notificationIds:
                  - 3f2a9c1e-7b4d-4e8a-9c0f-1a2b3c4d5e6f
                  - 8d1e2f3a-4b5c-4d6e-8f70-112233445566
                  status: READ
      responses:
        '400':
          description: Invalid body (missing ids or status)
        '403':
          description: Forbidden (ORGANIZER role required)
        '200':
          description: Notifications marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAsReadResponse'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    success: true
                    markedCount: 2
                    updatedAt: "2026-05-14T16:00:00Z"
  /notifications/count:
    get:
      description: |
        Counts the caller's own notifications by status.

        **Security**: ORGANIZER role required; any other role gets 403.
      tags:
      - Notifications
      operationId: getUnreadCount
      summary: Count the caller's notifications by status (defaults to UNREAD)
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          default: UNREAD
      responses:
        '403':
          description: Forbidden (ORGANIZER role required)
        '200':
          description: Notification count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationCountResponse'
              examples:
                default:
                  summary: captured from the local anonymized database
                  value:
                    count: 0
  /notifications/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      description: |
        Changes the status of one of the caller's notifications (Story 4.10b, replaces
        `PUT /notifications/{id}/read`). Another user's notification answers 404 and stays unchanged.

        **Security**: ORGANIZER role required; any other role gets 403.
      tags:
      - Notifications
      operationId: updateNotification
      summary: Mark one of the caller's notifications read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationRequest'
            examples:
              default:
                summary: mark read
                value:
                  status: READ
      responses:
        '400':
          description: Invalid body (missing or unsupported status)
        '403':
          description: Forbidden (ORGANIZER role required)
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAsReadResponse'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    success: true
                    markedCount: 1
                    updatedAt: "2026-05-14T16:00:00Z"
        '404':
          description: No notification of the caller with this id
    delete:
      description: |
        Deletes one of the caller's notifications. Another user's notification answers 404 and is kept.

        **Security**: ORGANIZER role required; any other role gets 403.
      tags:
      - Notifications
      operationId: deleteNotification
      summary: Delete one of the caller's notifications
      responses:
        '403':
          description: Forbidden (ORGANIZER role required)
        '200':
          description: Notification deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteNotificationResponse'
              examples:
                default:
                  summary: generated from the schema and captured sub-values
                  value:
                    success: true
        '404':
          description: No notification of the caller with this id
components:
  schemas:
    NotificationResponse:
      type: object
      description: A single in-app notification. Null fields are serialized (not omitted).
      required:
        - id
        - recipientUsername
        - eventCode
        - notificationType
        - channel
        - priority
        - subject
        - body
        - status
        - sentAt
        - readAt
        - failedAt
        - failureReason
        - metadata
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        recipientUsername:
          type: string
        eventCode:
          type: string
          nullable: true
        notificationType:
          type: string
        channel:
          type: string
        priority:
          type: string
        subject:
          type: string
          nullable: true
        body:
          type: string
          nullable: true
        status:
          type: string
        sentAt:
          type: string
          format: date-time
          nullable: true
        readAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
        failureReason:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          nullable: true
        updatedAt:
          type: string
          format: date-time
          nullable: true
    NotificationsResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationResponse'
        pagination:
          $ref: '#/components/schemas/NotificationPagination'
    NotificationPagination:
      type: object
      description: 1-based pagination metadata (notification inbox wire — page/limit/totalItems/totalPages only).
      required:
        - page
        - limit
        - totalItems
        - totalPages
      properties:
        page:
          type: integer
        limit:
          type: integer
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
    NotificationCountResponse:
      type: object
      required:
        - count
      properties:
        count:
          type: integer
          format: int64
    MarkAsReadResponse:
      type: object
      required:
        - success
        - markedCount
        - updatedAt
      properties:
        success:
          type: boolean
        markedCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
    DeleteNotificationResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
    NotificationStatusChange:
      type: string
      description: The status a notification can be set to by its recipient. Only READ today.
      enum:
      - READ
    UpdateNotificationRequest:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/NotificationStatusChange'
    UpdateNotificationsRequest:
      type: object
      required:
      - notificationIds
      - status
      properties:
        notificationIds:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            format: uuid
        status:
          $ref: '#/components/schemas/NotificationStatusChange'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AWS Cognito JWT token
