    SpeakerPoolResponse:
      type: object
      description: 'Response representing a speaker pool entry.

        Story 5.2 - AC9-13: Speaker Pool Management

        '
      required:
      - id
      - eventId
      - speakerName
      - status
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the speaker pool entry
          example: 123e4567-e89b-12d3-a456-426614174000
        eventId:
          type: string
          format: uuid
          description: UUID of the event this speaker is associated with
          example: 789e4567-e89b-12d3-a456-426614174111
        speakerName:
          type: string
          description: Name of the potential speaker
          example: Jane Smith
        company:
          type: string
          nullable: true
          description: Company identifier/slug of the speaker (from User.companyId). Stable key — NOT for display.
          example: TechCorpAG
        companyDisplayName:
          type: string
          nullable: true
          description: 'Human-readable company name (companies.display_name, falling back to

            companies.name, then the slug). Prefer this over `company` for display.

            '
          example: Tech Corp AG
        expertise:
          type: string
          nullable: true
          description: Areas of expertise
          example: Cloud Architecture, Kubernetes, DevOps
        assignedOrganizerId:
          type: string
          nullable: true
          description: Username of organizer assigned for outreach
          example: alice.mueller
        status:
          type: string
          enum:
          - IDENTIFIED
          - CONTACTED
          - READY
          - INVITED
          - ACCEPTED
          - CONTENT_SUBMITTED
          - QUALITY_REVIEWED
          - DECLINED
          description: 'Current status of the speaker in the pool workflow — the 8 ADR-009 §0.1
            states, serialized as the UPPER_CASE SpeakerWorkflowState enum name (legacy
            SLOT_ASSIGNED/CONFIRMED/WITHDREW/OVERFLOW were removed per ADR-009 §0.7; slot
            assignment is now the derived isSlotAssigned flag).

            Story 5.2 - AC13: Initial status = ''IDENTIFIED''

            '
          example: IDENTIFIED
        notes:
          type: string
          nullable: true
          description: Free-text notes about the speaker
          example: Met at KubeCon 2024. Very enthusiastic about BATbern.
        source:
          type: string
          enum:
          - organizer_added
          - self_nomination
          description: 'Story 7.2 — provenance of the pool row. `organizer_added` for organizer-sourced

            candidates (the default), `self_nomination` for attendee "I Could Speak on That"

            entries. Lets the organizer pool/brainstorming UI flag self-nominations.

            '
          example: self_nomination
        proposedByUsername:
          type: string
          nullable: true
          description: Story 7.2 — username of the self-nominating attendee (null for organizer-added rows).
          example: jane.attendee
        proposedSessionTitle:
          type: string
          nullable: true
          description: Story 7.2 — the talk title the attendee proposed (null for organizer-added rows).
          example: Event-driven architecture in practice
        proposedAbstract:
          type: string
          nullable: true
          description: Story 7.2 — the talk abstract the attendee proposed, stored raw (null for organizer-added rows).
          example: A field report on migrating a monolith to an event-driven core.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when speaker was added to pool
          example: 2025-12-13 10:00:00+00:00
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of last update
          example: 2025-12-13 10:15:00+00:00
        sessionId:
          type: string
          format: uuid
          nullable: true
          description: Session UUID — set once a session is assigned to the speaker (Story 5.5).
          example: 456e4567-e89b-12d3-a456-426614174222
        sessionSlug:
          type: string
          nullable: true
          description: 'Addressable session slug, surfaced alongside sessionId so the organizer
            drawer''s content tab can PATCH /events/{code}/sessions/{slug} directly (2026-05-20).'
          example: event-driven-architecture
        username:
          type: string
          nullable: true
          description: 'Canonical primary-speaker username, resolved from session_users →
            CUMS at read time (Story 11.E.9). Null for pre-READY pool rows (no User yet).'
          example: jane.smith
        email:
          type: string
          nullable: true
          description: 'Primary-speaker email, resolved live from CUMS (Story 6.1c / 11.E.9).
            Null for pre-READY rows or when CUMS is degraded.'
          example: jane.smith@example.com
        invitedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp the invitation was sent (Story 6.1b).
          example: 2025-12-14 09:00:00+00:00
        responseDeadline:
          type: string
          format: date
          nullable: true
          description: Date by which the speaker must respond to the invitation (Story 6.1b).
          example: 2025-12-21
        contentDeadline:
          type: string
          format: date
          nullable: true
          description: Date by which the speaker must submit content (Story 6.1b).
          example: 2026-01-15
        acceptedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp the speaker accepted the invitation (Story 6.2a).
          example: 2025-12-16 11:30:00+00:00
        declinedAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp the speaker declined (Story 6.2a).
          example: 2025-12-16 11:30:00+00:00
        declineReason:
          type: string
          nullable: true
          description: Free-text reason given when the speaker declined (Story 6.2a).
          example: Scheduling conflict with another conference.
        preferredTimeSlot:
          type: string
          nullable: true
          description: Speaker-stated time-slot preference (Story 6.2a).
          example: Morning
        travelRequirements:
          type: string
          nullable: true
          description: Speaker-stated travel requirements (Story 6.2a).
          example: Needs hotel booking for the night before.
        technicalRequirements:
          type: string
          nullable: true
          description: Speaker-stated technical/AV requirements (Story 6.2a).
          example: HDMI adapter for MacBook; clicker.
        initialPresentationTitle:
          type: string
          nullable: true
          description: 'Initial working title captured at response time (Story 6.2a).
            sessions.title is canonical post-content; this stays null after Story 11.E.8.'
          example: Scaling event-driven systems
        preferenceComments:
          type: string
          nullable: true
          description: Free-text comments accompanying the speaker''s preferences (Story 6.2a).
          example: Happy to do a workshop instead of a talk if useful.
        contentSubmittedAt:
          type: string
          format: date-time
          nullable: true
          description: 'Timestamp of the latest content submission, derived from
            session_content_history at read time (Story 6.3 / 11.E.8).'
          example: 2026-01-10 14:00:00+00:00
        submittedTitle:
          type: string
          nullable: true
          description: 'Current presentation title (mirrors sessions.title, the canonical
            source per Story 11.E.8 §2.9).'
          example: Event-driven architecture in practice
        submittedAbstract:
          type: string
          nullable: true
          description: 'Current presentation abstract (mirrors sessions.description, canonical
            per Story 11.E.8 §2.9).'
          example: A field report on migrating a monolith to an event-driven core.
        isSlotAssigned:
          type: boolean
          nullable: true
          description: 'Derived flag (ADR-009 §0.1, computed at read time — NOT persisted):
            true when the speaker''s session has a start_time set.'
          example: true
