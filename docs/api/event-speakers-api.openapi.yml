          items:
            $ref: '#/components/schemas/DashboardUpcomingEventDto'
        pastEvents:
          type: array
          items:
            $ref: '#/components/schemas/DashboardPastEventDto'
    DashboardUpcomingEventDto:
      type: object
      description: An upcoming event the speaker is involved in
      properties:
        eventCode:
          type: string
        eventTitle:
          type: string
        eventDate:
          type: string
        eventLocation:
          type: string
        sessionTitle:
          type: string
        workflowState:
          type: string
        workflowStateLabel:
          type: string
        hasTitle:
          type: boolean
        hasAbstract:
          type: boolean
        hasMaterial:
          type: boolean
        materialFileName:
          type: string
        responseDeadline:
          type: string
        contentDeadline:
          type: string
        reviewerFeedback:
          type: string
        organizerName:
          type: string
        organizerEmail:
          type: string
        respondUrl:
          type: string
        contentUrl:
          type: string
    DashboardPastEventDto:
      type: object
      description: A past event the speaker presented at
      properties:
        eventCode:
          type: string
        eventTitle:
          type: string
        eventDate:
          type: string
        sessionTitle:
          type: string
        hasMaterial:
          type: boolean
        materialFileName:
          type: string
    SpeakerResponseType:
      type: string
      description: Speaker's response to an invitation
      enum:
        - ACCEPT
        - DECLINE
    SpeakerResponsePreferences:
      type: object
      description: Optional logistics preferences captured on ACCEPT (Story 6.2a)
      properties:
        timeSlot:
          type: string
          description: 'Preferred presentation time slot: morning, afternoon, no_preference'
        travelRequirements:
          type: string
          description: 'Travel requirements: local, accommodation, virtual'
        technicalRequirements:
          type: array
          items:
            type: string
          description: 'Technical requirements: mac_adapter, remote_option, special_av'
        initialTitle:
          type: string
          description: Preliminary presentation title
        comments:
          type: string
          description: Additional comments for the organizer
    SpeakerResponseRequest:
      type: object
      description: A speaker's accept/decline response to an invitation (Story 6.2a)
      required:
        - response
      properties:
        response:
          $ref: '#/components/schemas/SpeakerResponseType'
        reason:
          type: string
          description: Reason for decline (required for DECLINE)
        constraints:
          type: string
          description: Optional constraints or notes (e.g. travel, schedule)
        preferences:
          $ref: '#/components/schemas/SpeakerResponsePreferences'
    SpeakerResponseResult:
      type: object
      description: Outcome of processing a speaker's invitation response (Story 6.2a)
      properties:
        success:
          type: boolean
        speakerName:
          type: string
        eventName:
          type: string
        eventDate:
          type: string
          description: Formatted event date (e.g. "20. November 2025")
        sessionTitle:
          type: string
        nextSteps:
          type: array
          items:
            type: string
          description: Next steps for the speaker after responding
        contentDeadline:
          type: string
          format: date
          description: Content submission deadline (if accepted)
        dashboardUrl:
          type: string
        errorMessage:
          type: string
    SpeakerContentInfo:
      type: object
      description: The speaker portal's content-submission state for one event (Story 6.3)
      properties:
        speakerName:
          type: string
        eventCode:
          type: string
        eventTitle:
          type: string
        hasSessionAssigned:
          type: boolean
        sessionTitle:
          type: string
        canSubmitContent:
          type: boolean
        hasDraft:
          type: boolean
        draftTitle:
          type: string
        draftAbstract:
          type: string
        draftVersion:
          type: integer
        lastSavedAt:
          type: string
          format: date-time
        needsRevision:
          type: boolean
        reviewerFeedback:
          type: string
        reviewedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
        hasMaterial:
          type: boolean
        materialUrl:
          type: string
        materialFileName:
          type: string
    ContentSubmitRequest:
      type: object
      description: Speaker content submission (title/abstract/bio + optional presentation upload)
      x-class-extra-annotation: '@com.fasterxml.jackson.annotation.JsonIgnoreProperties(ignoreUnknown = false)'
      required:
        - title
        - contentAbstract
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        contentAbstract:
          type: string
          minLength: 1
          maxLength: 1000
        bio:
          type: string
          maxLength: 5000
        profilePictureUrl:
          type: string
          maxLength: 2048
        presentationUploadId:
          type: string
          maxLength: 200
    SpeakerMaterialUploadRequest:
      type: object
      description: Request a presigned URL for a material upload
      required:
        - fileName
        - fileSize
        - mimeType
      properties:
        fileName:
          type: string
        fileSize:
          type: integer
          format: int64
        mimeType:
          type: string
    SpeakerMaterialUploadResponse:
      type: object
      description: Presigned upload URL + metadata
      properties:
        uploadUrl:
          type: string
        uploadId:
          type: string
        s3Key:
          type: string
        fileExtension:
          type: string
        expiresInMinutes:
          type: integer
        requiredHeaders:
          type: object
          additionalProperties:
            type: string
          description: Headers the client must send on the presigned PUT
    SpeakerMaterialConfirmRequest:
      type: object
      description: Confirm a completed material upload
      required:
        - uploadId
        - fileName
        - fileExtension
        - fileSize
        - mimeType
      properties:
        uploadId:
          type: string
        fileName:
          type: string
        fileExtension:
          type: string
        fileSize:
          type: integer
          format: int64
        mimeType:
          type: string
        materialType:
          type: string
          description: Defaults to PRESENTATION when omitted
    SpeakerMaterialConfirmResponse:
      type: object
      description: Result of confirming a material upload
      properties:
        materialId:
          type: string
          format: uuid
        uploadId:
          type: string
        fileName:
          type: string
        cloudFrontUrl:
          type: string
        materialType:
          type: string
        uploadedAt:
          type: string
          format: date-time
  responses:
    Conflict:
      description: Conflict - the speaker has already responded
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
    BadRequest:
      description: Bad request - validation error
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            validationError:
              value:
                error: VALIDATION_ERROR
                errorCode: BAD_REQUEST
                message: Invalid filter syntax
                timestamp: 2025-01-15 10:30:00+00:00
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            eventNotFound:
              value:
                error: RESOURCE_NOT_FOUND
                errorCode: NOT_FOUND
                message: Event not found with id evt-999
                timestamp: 2025-01-15 10:30:00+00:00
    UnprocessableEntity:
      description: Request cannot be processed due to business logic
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            workflowError:
              value:
                error: WORKFLOW_ERROR
                errorCode: UNPROCESSABLE_ENTITY
                message: Cannot advance workflow for archived event
                timestamp: 2025-01-15 10:30:00+00:00
            validationError:
              value:
                error: VALIDATION_ERROR
                errorCode: UNPROCESSABLE_ENTITY
                message: Event must have a date before publishing
                timestamp: 2025-01-15 10:30:00+00:00
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            serverError:
              value:
                error: INTERNAL_SERVER_ERROR
                errorCode: INTERNAL_ERROR
                message: An unexpected error occurred
                timestamp: 2025-01-15 10:30:00+00:00
    Forbidden:
      description: Forbidden - insufficient permissions
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            forbiddenError:
              value:
                error: FORBIDDEN
                errorCode: FORBIDDEN
                message: Insufficient permissions to perform this action
                timestamp: '2025-01-15T10:30:00Z'
    Unauthorized:
      description: Unauthorized - missing or invalid authentication token
      content:
        application/json:
          schema:
            $ref: ./_shared.openapi.yml#/components/schemas/ErrorResponse
          examples:
            missingToken:
              value:
                error: UNAUTHORIZED
                errorCode: UNAUTHORIZED
                message: Authentication token is missing or invalid
                timestamp: '2025-01-15T10:30:00Z'
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AWS Cognito JWT token
