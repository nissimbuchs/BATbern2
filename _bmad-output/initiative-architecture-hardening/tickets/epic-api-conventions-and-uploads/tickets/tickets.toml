# Epic 4 stories in build order. Ids keep the Epic 17 story number; a lettered id is a follow-up of that number
# (10b after 17.10, 11a-11d after 17.11). The epic is not refined yet: 9, 10 and 11 are thin entries taken from
# the PRD so that the follow-ups can name them in `after`; refining the epic revises them in place.
# Baseline lines are cited as `<rule> <spec> <METHOD> <path>` from web-frontend/scripts/api-lint-baseline.txt
# (no line numbers: the file is sorted and regenerated).

[[entry]]
id = 9
type = "story"
title = "API conventions I (breaking)"
description = "17.9: one PATCH /tasks/{id} replaces the complete, reassign and status operations; one app-settings resource (AdminSettingsService) and one user settings resource merging users/me/settings and /preferences; analyze-abstract nested under the event and loaded scoped to it. Spec, generated types, frontend, Bruno and Playwright in the same PR."
verify = "The old operations answer 404 in production and their Spectral baseline lines are gone (before and after recorded); npm run lint:api and the 17.3 contract check pass; a speaker id from another event returns 404 on the nested AI operation; integration tests per new operation, Bruno, and Playwright for task completion and settings pass."
covers = ["R14"]
after = ["1.3", "1.4", "2.0c1", "2.0d"]
hitl = false
risk = "high"
references = ["docs/prd/epic-17-architecture-hardening.md#story-179--api-conventions-i-breaking"]

[[entry]]
id = "9b"
type = "story"
title = "One transition idiom for the event lifecycle (breaking)"
description = "Owner 2026-11-08: ADR-013 section 1 (one transition idiom per service, its problem 3) is still violated in EMS: publishing and advancing an event has POST /events/{eventCode}/publish, /publish/{phase}, /unpublish/{phase}, /publish/schedule (configures the auto-publish schedule) and /workflow/transition. The story picks one action-sub-resource idiom per ADR-013 row 4 for the event lifecycle, folds the others into it (the schedule becomes configuration of its resource, not a verb), and records the choice with the nearest existing operation in its architecture note. Touches EventController and PublishingEngineController, PublishingService and the PublishingScheduledService path to the CDN. Breaking: spec, generated types, frontend callers in web-frontend/src/services/, Bruno and Playwright in the same PR. Baseline lines touched (17.4 file): no-verb-segment events-core-api POST /events/{eventCode}/publish, POST /events/{eventCode}/publish/schedule, POST /events/{eventCode}/publish/{phase}, POST /events/{eventCode}/unpublish/{phase}, POST /events/{eventCode}/workflow/transition."
verify = "The event lifecycle in events-core-api.openapi.yml has one transition idiom (the architecture note names it); the folded operations answer 404 in production; the Spectral baseline loses the folded operations' lines (before and after recorded) and npm run lint:api passes; the 17.3 contract check passes; on local dev an organizer publishes and unpublishes a phase (topic, speakers, agenda), advances the workflow state and sets the auto-publish schedule, and the public event page shows the phase; integration tests per new operation, Bruno and Playwright for publishing pass."
covers = ["R24"]
after = [9]
hitl = false
risk = "medium"
references = ["docs/architecture/ADR-013-rest-api-crud-conventions.md"]
notes = ["Owner 2026-11-08: risk medium because it touches production publishing and the CDN."]

[[entry]]
id = 10
type = "story"
title = "API conventions II (breaking)"
description = "17.10 part a and b: one endpoint set with an ownership rule replaces the me/{username} twins for pictures and profile (GET /users/me stays as the ADR-013 section 4 self read); one speaker path key {speakerId} (speaker-pool id) under /events/{eventCode}/speakers, chosen per the ADR-003 amendment and held by a Spectral rule (session assignments /sessions/{sessionSlug}/speakers/{username} stay outside it); speakers/pool and speaker-pool folded into /speakers, POST /speakers/invite removed, self-nominate becomes speaker-nominations; every speaker operation loads the pool entry scoped to the event (findByIdAndEventId). Baseline groups owned: G08 (to exception X1), G09, G11. Participants and newsletter moved to 10c."
verify = "No /users/me/* and /users/{username}/* twin remains for pictures and profile (integration test: own allowed, other 403, organizer allowed where it was); a Spectral rule holds the one speaker path key; an integration test per speaker operation shows another event's speaker id answers 404; the removed operations answer 404/405 in production (the old /users/me/* self paths 403/400, decided 2026-11-10); the Spectral baseline loses G09 and G11 (3 lines) and G08 moves to X1, nothing UNOWNED or STALE; npm run lint:api and the 17.3 contract check pass; profile, pictures and the speaker pool pass Bruno and Playwright on local dev."
covers = ["R15"]
after = ["9b", "1.3b", "3.6"]
hitl = false
risk = "high"
references = ["docs/prd/epic-17-architecture-hardening.md#story-1710--api-conventions-ii-breaking"]
notes = ["3.6 is the /internal move of PATCH /users/{u}/profile (epic 3 entry 6, part A of 17.6); repointed from epic-one-service-direction 2026-11-10 when epic 3 was planned.", "Split 2026-11-10 (two sessions): participants and newsletter self-service moved to 10c; decided by agent under owner's blanket go."]

[[entry]]
id = "10c"
type = "story"
title = "API conventions II b: participants and newsletter self-service (breaking)"
description = "17.10 part c and d, split from 10. Participants: POST /events/batch_registrations and POST /events/{eventCode}/enroll-stakeholders fold into POST /events/{eventCode}/participants (exactly one of username with force and notify, people[] for the historical import, stakeholders: true); both methods move out of EventController into ParticipantsController (registrations, L3). The Epic 3 historical participant import (ParticipantBatchImportModal, useParticipantBatchImport) keeps working, regrouped per event. Newsletter: GET/PATCH /newsletter/my-subscription folds into /newsletter/my-subscriptions (PUT becomes PATCH, partial update per address); POST /newsletter/subscribe becomes POST /newsletter/subscribers, gateway and EMS together (Turnstile protected paths, rate limit policy, permitAll in both security chains, scripts/ci/access-control-public.txt). Mail (notify on add, double opt-in on subscribe) is asserted through the SesRecorder; Bruno for paths that send mail or write registrations or subscriptions runs only in dev_only collections. Breaking: spec, generated types, frontend services, Bruno and Playwright in the same change. Baseline groups owned: G06 (no-literal-under-events and path-kebab-case POST /events/batch_registrations), G10 (no-verb-segment POST /newsletter/subscribe)."
verify = "batch_registrations, enroll-stakeholders, my-subscription and newsletter/subscribe answer 404/405 in production; the Spectral baseline loses G06 and G10 (3 lines), nothing UNOWNED or STALE; npm run lint:api and the 17.3 contract check pass; integration tests per mode of POST participants (mail only for notify, positive control for absence) and for the newsletter operations pass; on local dev an organizer adds a participant, enrols stakeholders and imports a CSV, a user toggles the newsletter per address and an anonymous visitor subscribes, with only the expected mails in /dev/mails; registration, enrolment and newsletter self-service pass Bruno (dev-only) and Playwright."
covers = ["R15"]
after = [10]
hitl = false
risk = "high"
references = ["docs/prd/epic-17-architecture-hardening.md#story-1710--api-conventions-ii-breaking"]
notes = ["Split from 4.10 on 2026-11-10 (two sessions), decided by agent under owner's blanket go."]

[[entry]]
id = "10b"
type = "story"
title = "API conventions III (breaking)"
description = "Owns 13 Spectral baseline lines (owner 2026-11-08). Notifications: batch-read, batch-delete and {id}/read become PATCH operations (ADR-013 section 1). ai-prompts: reset becomes DELETE /ai-prompts/{promptKey}/override (delete the override, the default applies). Sessions: batch-import becomes a bulk create on the sessions collection. Additional e-mails: make-primary, resend-verification and DELETE /users/me/additional-emails/{email} move to a key without the e-mail address (ADR-003 amendment: natural key is personal data, UUID required; real violation: personal data in a path and its access logs); the DELETE has no baseline line but is in scope. Event types: /events/types, GET and PUT /events/types/{type} become /event-types. /events/recent-photos and GET /events/registrations move out of the literal-under-/events namespace. /companies:get-or-create becomes /companies/get-or-create (ADR-013 section 2). Breaking: spec, generated types, frontend callers in web-frontend/src/services/, Bruno and Playwright in the same PR; the story's architecture note names each new path with its nearest existing operation. Baseline lines owned: no-literal-under-events event-media-api GET /events/recent-photos; no-literal-under-events event-registrations-api GET /events/registrations; no-literal-under-events events-core-api GET /events/types, GET /events/types/{type}, PUT /events/types/{type}; no-verb-segment event-ai-api POST /ai-prompts/{promptKey}/reset; no-verb-segment event-notifications-api DELETE /notifications/batch-delete, PUT /notifications/batch-read, PUT /notifications/{id}/read; no-verb-segment event-sessions-api POST /events/{eventCode}/sessions/batch-import; no-verb-segment users-api POST /users/me/additional-emails/{email}/make-primary, POST /users/me/additional-emails/{email}/resend-verification; path-kebab-case companies-api POST /companies:get-or-create."
verify = "The 13 cited baseline lines are gone, and so is uuid-path-param event-notifications-api PUT /notifications/{id}/read, which leaves with its operation; npm run lint:api passes with the smaller baseline, and any line added is a replacement operation under an owner-accepted exception (own notifications: unnamed top-level aggregate; additional-e-mail id: personal-data key), named in the PR, with before and after counts recorded; no path in users-api.openapi.yml carries an e-mail address; the old operations answer 404 in production; the 17.3 contract check passes; integration tests per new operation, and Bruno and Playwright for notifications read and delete, AI prompt reset, session batch import, additional e-mail make-primary, resend and delete (local dev, /dev/mails), event-type edit and company get-or-create pass."
covers = ["R23"]
after = [10, "10c"]
hitl = false
risk = "high"
references = ["docs/architecture/ADR-013-rest-api-crud-conventions.md", "docs/architecture/ADR-003-meaningful-identifiers-public-apis.md#amendment-2026-11-uuids-in-paths"]
notes = ["2026-11-11: split, decided by agent under owner's blanket go: 10b keeps the EMS items (notifications incl. per-caller scoping, ai-prompts reset, session import, event types, recent photos, registrations list); the additional-email key and companies get-or-create (CUMS) are entry 10d.", "2026-11-10: also after 10c, which moves participant operations out of EventController and changes event-registrations-api, where 10b moves GET /events/registrations.", "Owner 2026-11-08: additional-emails {email} in a path is a real ADR-003 violation (personal data in a path); DELETE /users/me/additional-emails/{email} has the same problem and is in scope.", "Owner 2026-11-08 (17.4 follow-up): the new Spectral rule no-personal-data-path-param reports 4 lines on /users/me/additional-emails/{email} (DELETE, PATCH, POST make-primary, POST resend-verification), all owned by 10b; the story ends when that rule reports none."]

[[entry]]
id = "10d"
type = "story"
title = "API conventions III b: additional-email key and get-or-create (breaking)"
description = "Split from 10b on 2026-11-11. Additional e-mails: PATCH, DELETE, make-primary and resend-verification move from /users/me/additional-emails/{email} to {emailId} (the existing user_additional_emails.id UUID, V16; no migration; AdditionalEmail gains id). The verification link is unaffected (/verify-email?token=). /companies:get-or-create becomes POST /companies/get-or-create, 200 existing / 201 created (ADR-013 section 2). Owns N8 (4 lines) and the path-kebab-case companies line; 4 uuid-path-param lines go to exception X3 (natural key is personal data). Make-primary moves a real Cognito login on local dev (production pool): its happy path is tested only in the integration test with Cognito at the boundary; Bruno and Playwright cover only non-mutating cases (unverified 409, unknown or foreign id 404)."
verify = "no path in users-api.openapi.yml carries an e-mail address and no-personal-data-path-param reports none; the Spectral baseline loses N8 and the companies line (88 to 87 entries, the 4 {emailId} lines under X3); get-or-create answers 201 when it creates and 200 when it finds; the old operations answer 404 in production; integration tests per new operation; Bruno users-api and companies-api and Playwright user-settings-additional-emails pass on local dev."
covers = ["R23"]
after = ["10b"]
hitl = false
risk = "high"
references = ["docs/architecture/ADR-013-rest-api-crud-conventions.md", "docs/architecture/ADR-003-meaningful-identifiers-public-apis.md#amendment-2026-11-uuids-in-paths"]
notes = ["Split from 10b on 2026-11-11, decided by agent under owner's blanket go (scope above one session)."]

