[[entry]]
id = "3b"
type = "story"
title = "Frontend HTTP calls moved into the service layer"
description = "Follow-up of 17.3 (owner 2026-11-08): the 13 files in web-frontend/scripts/api-layer-baseline.txt (hooks, components, AuthContext) get their HTTP calls from a function in web-frontend/src/services/, reusing the existing service of the resource where one exists (e.g. userService, partnerService, companyApi, eventApiClient); the presigned S3 PUT of useEventTeaserImages moves beside the one in eventApiClient; useFileUpload takes a service upload function per purpose instead of an endpoint string, which also removes its 2 allow-list entries. Callers keep their behaviour and React Query keys; tests of the moved calls move to the service tests, and the touched hook and component tests stub HTTP at the boundary (axios or MSW), not the new service functions, so the 17.0a ratchet count does not rise."
verify = "npm run check:api-paths passes with an empty layer baseline (header only) and an allow-list no larger than at the start, each remaining line with its reason; the start and end sizes of both files are recorded in the plan; type-check, lint and the frontend tests of the touched hooks and components pass."
covers = ["R3"]
after = [3]
hitl = false
risk = "medium"
notes = ["Owner 2026-11-08: move these calls into the service layer and shrink the baseline to zero where possible; built right after 17.5."]

[[entry]]
id = "3c"
type = "story"
title = "Frontend gate against hand-written copies of generated API types"
description = "17.3c (owner 2026-11-08): a check beside check:api-paths (a new script name such as check:api-type-copies; check:api-types already exists for the freshness of the generated files), in the same required build-frontend job, fails any NEW `export interface`, or `export type` with an object literal, under web-frontend/src whose name equals a schema name in src/types/generated/ (ADR-006; project-context already forbids the copies, and 17.3b still moved some into the service layer). Aliases such as `export type X = components['schemas']['X']` pass. A committed baseline may only shrink: NEW and STALE both fail, as in scripts/test-ratchet.ts and scripts/api-lint.ts; every baseline line names its owning story or a reason, through an owner file like api-lint-owners.txt. Leave it cleaner (C15): the true copies that an alias replaces without changing callers are replaced in this story; name matches that are not copies (a different shape for the same name) are renamed or listed with the reason; the rest stay frozen with their owning story named (e.g. 16.8c for the newsletter types it deletes, 17.10 for the user and speaker paths). Unit tests for the script cover new, stale, alias and object-literal cases, like check-api-paths.test.ts."
verify = "A fixture `export interface` named after a generated schema fails the build-frontend check, an alias of the same name passes, and removing a type still on the baseline fails as STALE; develop passes with the committed baseline, every line owned; the start count (measured 2026-11-08 by name match: 75 interfaces in 20 files; the deferred-work count was 71) and the end count are recorded in the plan, the end count lower; type-check, lint and the tests of the touched files pass."
covers = ["R7"]
after = ["3b"]
hitl = false
risk = "low"
notes = ["Owner 2026-11-08: built before 17.6 (epic 3 waits on it in the initiative breakdown), so the S2S moves and the breaking API stories run under the gate.", "Not name matches today, so neither baseline nor allow-list needs them: FileUploadPresignedUrl (src/types/fileUpload.types.ts, the upload hook's cross-purpose contract) and CompanySession / CompanySessionSpeaker (sessionApiClient.ts; GET /sessions has no response schema in the spec). If the gate is widened beyond name matches, they go on the allow-list with these reasons.", "Source: deferred-work.md, last item (v7 quality review 2026-11-08)."]

