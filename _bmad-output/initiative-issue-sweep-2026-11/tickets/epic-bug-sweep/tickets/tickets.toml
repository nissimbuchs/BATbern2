# Stories of epic-bug-sweep, in build order. One PR for the whole epic (initiative C2); each story is one commit or a few.

[[entry]]
id = 1
type = "story"
title = "EMS may store inbound attachments; EventBridge grant and ZAP 110009 gone"
description = "Wires the mail-attachments put/delete grant to the EMS task role (bin/batbern-infrastructure.ts:313, inbound-email-stack.ts:449), deletes the dead emsTaskRole block or feeds it, removes the events:* grant in event-management-stack.ts:291, and ignores ZAP rule 110009 in .zap/rules.tsv."
verify = "A CDK test shows s3:PutObject and s3:DeleteObject on batbern-inbound-emails-*/mail-attachments/* in the EMS task role policy and no events:* action; after deploy, an inbound mail with an attachment to replies@ arrives in the Mail Center with its attachment."
covers = ["R1", "R10"]
after = []
hitl = true # the post-deploy test mail is sent by a person
risk = "medium"
notes = ["Owner 2026-11-15: first commit of the PR."]

